name: A54 RMA-154 Visual Servo

on:
  push:
    branches:
      - ralph/a54-rma154-visual-servo-20260925
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a54-rma154-visual-servo
  cancel-in-progress: true

jobs:
  physical:
    name: RMA-154 visual servo on A54
    runs-on: [self-hosted, linux, x64, weachy-mini-android-device]
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate visual-servo harness contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_rma154_visual_servo_gaze.py
          bash -n scripts/run_rma154_visual_servo_acceptance_android.sh
          bash -n scripts/android_device_acceptance_foreground.sh

      - name: Resolve local Unity and Android installations
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          unity_editor="${UNITY_EDITOR:-}"
          if [[ -z "${unity_editor}" ]]; then
            for candidate in \
              "${HOME}/Unity/Hub/Editor/${project_version}/Editor/Unity" \
              "${HOME}/UnityHub/Editors/${project_version}/Editor/Unity" \
              "${HOME}/.local/share/UnityHub/Editors/${project_version}/Editor/Unity" \
              "/opt/Unity/Hub/Editor/${project_version}/Editor/Unity" \
              "/opt/unity/editors/${project_version}/Editor/Unity"; do
              [[ -x "${candidate}" ]] && unity_editor="${candidate}" && break
            done
          fi
          [[ -n "${unity_editor}" && -x "${unity_editor}" ]] || { echo "Pinned Unity ${project_version} was not found." >&2; exit 1; }
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-${HOME}/Android/Sdk}}"
          [[ -x "${android_sdk_root}/platform-tools/adb" ]] || { echo "adb missing under ${android_sdk_root}" >&2; exit 1; }
          {
            printf 'UNITY_EDITOR=%s\n' "${unity_editor}"
            printf 'ANDROID_SDK_ROOT=%s\n' "${android_sdk_root}"
            printf 'ANDROID_HOME=%s\n' "${android_sdk_root}"
            printf 'ADB_BIN=%s\n' "${android_sdk_root}/platform-tools/adb"
          } >> "${GITHUB_ENV}"
          printf '%s\n' "${android_sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          "${unity_editor}" -version -batchmode -quit 2>&1 | tee unity-version.txt
          grep -F "${project_version}" unity-version.txt
          "${android_sdk_root}/platform-tools/adb" version

      - name: Prepare generated Reachy Unity presentation
        shell: bash
        env:
          REACHY_UNITY_WORK_ROOT: ${{ runner.temp }}/reachy-unity-presentation
        run: bash scripts/prepare_reachy_unity_presentation.sh

      - name: Stage production MuJoCo runtime for Unity Android
        shell: bash
        env:
          REACHY_UNITY_WORK_ROOT: ${{ runner.temp }}/reachy-unity-presentation
        run: bash scripts/stage_reachy_unity_android_runtime.sh

      - name: Build ARM64 API-26 device APK
        shell: bash
        run: bash scripts/build_unity_android.sh device-feasibility

      - name: Verify ARM64 API-26 device APK
        shell: bash
        run: test -s Builds/Android/weachy-mini-device-arm64-api26.apk

      - name: Pin one physical Android device
        shell: bash
        env:
          REACHY_PHYSICAL_DEVICE_SERIAL: ${{ vars.REACHY_PHYSICAL_DEVICE_SERIAL }}
        run: |
          set -euo pipefail
          mapfile -t serials < <(adb devices | awk 'NR > 1 && $2 == "device" && $1 !~ /^emulator-/ {print $1}')
          accepted=()
          for serial in "${serials[@]}"; do
            state="$(adb -s "${serial}" get-state | tr -d '\r')"
            abi="$(adb -s "${serial}" shell getprop ro.product.cpu.abi | tr -d '\r')"
            sdk="$(adb -s "${serial}" shell getprop ro.build.version.sdk | tr -d '\r')"
            qemu="$(adb -s "${serial}" shell getprop ro.kernel.qemu | tr -d '\r')"
            model="$(adb -s "${serial}" shell getprop ro.product.model | tr -d '\r')"
            printf 'physical_device=%s state=%s model=%s abi=%s sdk=%s qemu=%s\n' "${serial}" "${state}" "${model}" "${abi}" "${sdk}" "${qemu}"
            [[ "${state}" == device && "${abi}" == arm64-v8a && "${sdk}" =~ ^[0-9]+$ && "${qemu}" != 1 ]] && (( sdk >= 26 )) && accepted+=("${serial}")
          done
          serial="${REACHY_PHYSICAL_DEVICE_SERIAL:-}"
          if [[ -n "${serial}" ]]; then
            printf '%s\n' "${accepted[@]}" | grep -Fx "${serial}" >/dev/null || { adb devices -l >&2; exit 1; }
          elif (( ${#accepted[@]} == 1 )); then
            serial="${accepted[0]}"
          else
            echo "Expected exactly one physical arm64 API-26+ device; found ${#accepted[@]}." >&2
            adb devices -l >&2
            exit 1
          fi
          adb -s "${serial}" wait-for-device
          printf 'REACHY_ANDROID_SERIAL=%s\n' "${serial}" >> "${GITHUB_ENV}"
          printf 'pinned_android_serial=%s\n' "${serial}"

      - name: Run RMA-154 visual-servo acceptance
        shell: bash
        env:
          RMA154_VISUAL_SERVO_TIMEOUT_SECONDS: '180'
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/rma154-visual-servo-android"
          RMA154_VISUAL_SERVO_REPORT_DIR="${report_dir}" \
            bash scripts/run_rma154_visual_servo_acceptance_android.sh
          printf '\n### RMA-154 visual-servo report files\n'
          find "${report_dir}" -maxdepth 1 -type f ! -name 'logcat.txt' -print -exec sh -c 'printf "\n--- %s ---\n" "$1"; cat "$1" || true' sh {} \;

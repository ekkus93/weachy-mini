name: A54 RMA-180 Performance

on:
  push:
    branches:
      - ralph/a54-rma180-performance-20260925
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a54-rma180-performance
  cancel-in-progress: true

jobs:
  physical:
    name: RMA-180 performance on A54
    runs-on:
      - self-hosted
      - linux
      - x64
      - weachy-mini-android-device
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate performance harness contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_rma180_performance_harness.py
          bash -n scripts/run_rma180_performance_acceptance_android.sh
          python3 scripts/check_docs_links.py

      - name: Resolve local Unity and Android installations
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          if [[ -z "${project_version}" ]]; then
            printf '%s\n' 'Could not read the pinned Unity version.' >&2
            exit 1
          fi
          unity_editor="${UNITY_EDITOR:-}"
          if [[ -n "${unity_editor}" && ! -x "${unity_editor}" ]]; then
            printf 'Configured UNITY_EDITOR is not executable: %s\n' "${unity_editor}" >&2
            exit 1
          fi
          if [[ -z "${unity_editor}" ]]; then
            for candidate in \
              "${HOME}/Unity/Hub/Editor/${project_version}/Editor/Unity" \
              "${HOME}/UnityHub/Editors/${project_version}/Editor/Unity" \
              "${HOME}/.local/share/UnityHub/Editors/${project_version}/Editor/Unity" \
              "/opt/Unity/Hub/Editor/${project_version}/Editor/Unity" \
              "/opt/unity/editors/${project_version}/Editor/Unity"; do
              if [[ -x "${candidate}" ]]; then
                unity_editor="${candidate}"
                break
              fi
            done
          fi
          if [[ -z "${unity_editor}" ]]; then
            printf 'Pinned Unity %s was not found.\n' "${project_version}" >&2
            exit 1
          fi
          android_player_dir="$(dirname "${unity_editor}")/Data/PlaybackEngines/AndroidPlayer"
          if [[ ! -d "${android_player_dir}" ]]; then
            printf 'Unity Android Build Support is missing: %s\n' "${android_player_dir}" >&2
            exit 1
          fi
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-${HOME}/Android/Sdk}}"
          if [[ ! -x "${android_sdk_root}/platform-tools/adb" ]]; then
            printf 'Android SDK platform-tools were not found under %s.\n' "${android_sdk_root}" >&2
            exit 1
          fi
          {
            printf 'UNITY_EDITOR=%s\n' "${unity_editor}"
            printf 'ANDROID_SDK_ROOT=%s\n' "${android_sdk_root}"
            printf 'ANDROID_HOME=%s\n' "${android_sdk_root}"
          } >> "${GITHUB_ENV}"
          printf '%s\n' "${android_sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          unity_version_output="$("${unity_editor}" -version -batchmode -quit 2>&1)"
          printf '%s\n' "${unity_version_output}"
          if [[ "${unity_version_output}" != *"${project_version}"* ]]; then
            printf 'Unity executable does not match pinned version %s.\n' "${project_version}" >&2
            exit 1
          fi
          "${android_sdk_root}/platform-tools/adb" version

      - name: Prepare generated Reachy Unity presentation
        shell: bash
        env:
          REACHY_UNITY_WORK_ROOT: ${{ runner.temp }}/reachy-unity-presentation
        run: bash scripts/prepare_reachy_unity_presentation.sh

      - name: Stage production MuJoCo runtime for Unity Android
        shell: bash
        env:
          REACHY_UNITY_WORK_ROOT: ${{ runner.temp }}/reachy-unity-presentation
        run: bash scripts/stage_reachy_unity_android_runtime.sh

      - name: Build ARM64 API-26 device APK
        shell: bash
        run: bash scripts/build_unity_android.sh device-feasibility

      - name: Verify ARM64 API-26 device APK
        shell: bash
        run: test -s Builds/Android/weachy-mini-device-arm64-api26.apk

      - name: Pin one physical Android device
        shell: bash
        env:
          REACHY_PHYSICAL_DEVICE_SERIAL: ${{ vars.REACHY_PHYSICAL_DEVICE_SERIAL }}
        run: |
          set -euo pipefail
          mapfile -t physical_serials < <(
            adb devices | awk 'NR > 1 && $2 == "device" && $1 !~ /^emulator-/ {print $1}'
          )
          accepted=()
          for serial in "${physical_serials[@]}"; do
            state="$(adb -s "${serial}" get-state | tr -d '\r')"
            model="$(adb -s "${serial}" shell getprop ro.product.model | tr -d '\r')"
            abi="$(adb -s "${serial}" shell getprop ro.product.cpu.abi | tr -d '\r')"
            sdk="$(adb -s "${serial}" shell getprop ro.build.version.sdk | tr -d '\r')"
            qemu="$(adb -s "${serial}" shell getprop ro.kernel.qemu | tr -d '\r')"
            printf 'physical_device=%s state=%s model=%s abi=%s sdk=%s qemu=%s\n' \
              "${serial}" "${state}" "${model}" "${abi}" "${sdk}" "${qemu}"
            if [[ "${state}" == "device" && "${abi}" == "arm64-v8a" && "${sdk}" =~ ^[0-9]+$ && "${qemu}" != "1" ]] && (( sdk >= 26 )); then
              accepted+=("${serial}")
            fi
          done
          serial_override="${REACHY_PHYSICAL_DEVICE_SERIAL:-}"
          if [[ -n "${serial_override}" ]]; then
            override_ok=0
            for candidate in "${accepted[@]}"; do
              if [[ "${candidate}" == "${serial_override}" ]]; then
                override_ok=1
                break
              fi
            done
            if (( override_ok != 1 )); then
              printf 'Pinned REACHY_PHYSICAL_DEVICE_SERIAL=%s is not an approved connected device.\n' "${serial_override}" >&2
              adb devices -l >&2
              exit 1
            fi
            serial="${serial_override}"
          elif (( ${#accepted[@]} != 1 )); then
            printf 'Expected exactly one physical arm64-v8a API-26+ device; found %s.\n' "${#accepted[@]}" >&2
            adb devices -l >&2
            exit 1
          else
            serial="${accepted[0]}"
          fi
          adb -s "${serial}" wait-for-device
          printf 'REACHY_ANDROID_SERIAL=%s\n' "${serial}" >> "${GITHUB_ENV}"
          printf 'pinned_android_serial=%s\n' "${serial}"

      - name: Run RMA-180 performance acceptance
        shell: bash
        env:
          RMA180_PROFILE_SECONDS: '300'
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/rma180-performance-android"
          bash scripts/run_rma180_performance_acceptance_android.sh \
            Builds/Android/weachy-mini-device-arm64-api26.apk \
            "${report_dir}"
          printf '\n### RMA-180 performance report files\n'
          find "${report_dir}" -maxdepth 1 -type f -print -exec sh -c 'printf "\n--- %s ---\n" "$1"; cat "$1"' sh {} \;

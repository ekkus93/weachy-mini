name: CI

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  rma040-managed-test-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Make synthetic reader ownership explicit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("managed/ReachyMini.Core.Tests/Program.cs")
          text = path.read_text(encoding="utf-8")
          old_open = (
              "            SyntheticAuthoritativeStateReader reader =\n"
              "                new SyntheticAuthoritativeStateReader();\n\n"
              "            using (ReachySimulationWorker worker =\n"
          )
          new_open = (
              "            using (SyntheticAuthoritativeStateReader reader =\n"
              "                new SyntheticAuthoritativeStateReader())\n"
              "            {\n"
              "            using (ReachySimulationWorker worker =\n"
          )
          old_close = (
              "            AssertEqual(true, reader.IsDisposed, \"worker owns authoritative reader\");\n"
              "        }\n\n"
              "        private static void TestAuthoritativeSimulationWorkerSnapshots()\n"
          )
          new_close = (
              "            AssertEqual(true, reader.IsDisposed, \"worker owns authoritative reader\");\n"
              "            }\n"
              "        }\n\n"
              "        private static void TestAuthoritativeSimulationWorkerSnapshots()\n"
          )
          if text.count(old_open) == 1 and text.count(old_close) == 1:
              text = text.replace(old_open, new_open, 1).replace(old_close, new_close, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
          elif text.count(new_open) == 1 and text.count(new_close) == 1:
              raise SystemExit(0)
          else:
              raise SystemExit("Managed ownership test guard did not match exactly")
          PY
          if git diff --quiet -- managed/ReachyMini.Core.Tests/Program.cs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add managed/ReachyMini.Core.Tests/Program.cs
          git commit -m "RMA-040: make reader ownership explicit in test"
          git push origin HEAD:master

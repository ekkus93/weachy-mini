name: CI

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  rma040-publication-repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded worker publication repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          {
            python3 .github/rma040_prepare_publication_patch.py
            python3 .github/rma040_publication_fix.py
          } > .github/rma040_patch_result.md 2>&1
          patch_status=$?
          set -e

          if (( patch_status != 0 )); then
            git add -f .github/rma040_patch_result.md
            git commit -m "RMA-040: record publication patch guard failure"
            git push origin HEAD:master
            exit 0
          fi

          rm .github/rma040_patch_result.md
          git add \
            Assets/ReachyMini/Runtime/Simulation/IReachyPublishedAuthoritativeStateSource.cs \
            Assets/ReachyMini/Runtime/Simulation/ReachySimulationWorker.cs \
            Assets/ReachyMini/Runtime/Rendering/ReachySimAuthoritativePoseSource.cs \
            Assets/ReachyMini/Runtime/Rendering/ReachyProductionAuthoritativeRuntime.cs \
            Assets/ReachyMini/Runtime/Rendering/ReachyAuthoritativePhysicalAcceptance.cs \
            Assets/ReachyMini/Tests/Editor/ReachySimAuthoritativeStateTestSupport.cs \
            Assets/ReachyMini/Tests/Editor/ReachySimAuthoritativeStateTests.cs \
            managed/ReachyMini.Core.Tests/Program.cs
          git commit -m "RMA-040: publish rendering state through worker"
          git push origin HEAD:master

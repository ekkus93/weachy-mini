name: Local Unity Android Device Validation No Artifacts

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-unity-android-device-no-artifacts
  cancel-in-progress: true

jobs:
  validate-device:
    name: Validate Unity Android device path on A54
    runs-on:
      - self-hosted
      - linux
      - x64
      - weachy-mini-android-device
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run RMA-191 security-review contract
        shell: bash
        run: python3 scripts/tests/test_rma191_security_review.py

      - name: Run RMA-192 license-review contract
        shell: bash
        run: python3 scripts/tests/test_rma192_license_reconciliation.py

      - name: Run RMA-193 documentation contract
        shell: bash
        run: python3 scripts/tests/test_rma193_documentation_contract.py

      - name: Run RMA-194 shipping-source and fidelity release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_rma194_release_acceptance.py
          python3 scripts/tests/test_rma194_deferred_feature_and_fidelity_gate.py

      - name: Run RMA-184 representative-device matrix source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_rma184_representative_device_matrix.py

      - name: Run RMA-125 A54 speech revalidation contract
        shell: bash
        run: python3 scripts/tests/test_rma125_a54_speech_revalidation.py

      - name: Resolve local Unity and Android installations
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          if [[ -z "${project_version}" ]]; then
            printf '%s\n' 'Could not read the pinned Unity version.' >&2
            exit 1
          fi

          unity_editor="${UNITY_EDITOR:-}"
          if [[ -n "${unity_editor}" && ! -x "${unity_editor}" ]]; then
            printf 'Configured UNITY_EDITOR is not executable: %s\n' \
              "${unity_editor}" >&2
            exit 1
          fi

          if [[ -z "${unity_editor}" ]]; then
            for candidate in \
              "${HOME}/Unity/Hub/Editor/${project_version}/Editor/Unity" \
              "${HOME}/UnityHub/Editors/${project_version}/Editor/Unity" \
              "${HOME}/.local/share/UnityHub/Editors/${project_version}/Editor/Unity" \
              "/opt/Unity/Hub/Editor/${project_version}/Editor/Unity" \
              "/opt/unity/editors/${project_version}/Editor/Unity"; do
              if [[ -x "${candidate}" ]]; then
                unity_editor="${candidate}"
                break
              fi
            done
          fi
          if [[ -z "${unity_editor}" ]]; then
            printf 'Pinned Unity %s was not found.\n' "${project_version}" >&2
            exit 1
          fi

          android_player_dir="$(dirname "${unity_editor}")/Data/PlaybackEngines/AndroidPlayer"
          if [[ ! -d "${android_player_dir}" ]]; then
            printf 'Unity Android Build Support is missing: %s\n' \
              "${android_player_dir}" >&2
            exit 1
          fi

          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-${HOME}/Android/Sdk}}"
          if [[ ! -x "${android_sdk_root}/platform-tools/adb" ]]; then
            printf 'Android SDK platform-tools were not found under %s.\n' \
              "${android_sdk_root}" >&2
            exit 1
          fi

          {
            printf 'UNITY_EDITOR=%s\n' "${unity_editor}"
            printf 'ANDROID_SDK_ROOT=%s\n' "${android_sdk_root}"
            printf 'ANDROID_HOME=%s\n' "${android_sdk_root}"
          } >> "${GITHUB_ENV}"
          printf '%s\n' "${android_sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          "${unity_editor}" -version -batchmode -quit
          "${android_sdk_root}/platform-tools/adb" version

      - name: Prepare generated Reachy Unity presentation
        shell: bash
        env:
          REACHY_UNITY_WORK_ROOT: ${{ runner.temp }}/reachy-unity-presentation
        run: bash scripts/prepare_reachy_unity_presentation.sh

      - name: Stage production MuJoCo runtime for Unity Android
        shell: bash
        env:
          REACHY_UNITY_WORK_ROOT: ${{ runner.temp }}/reachy-unity-presentation
        run: bash scripts/stage_reachy_unity_android_runtime.sh

      - name: Run Unity tests
        shell: bash
        env:
          UNITY_TEST_RESULTS_DIR: ${{ runner.temp }}/unity-test-results
        run: bash scripts/run_unity_tests.sh

      - name: Pin one physical Android device
        shell: bash
        env:
          REACHY_PHYSICAL_DEVICE_SERIAL: ${{ vars.REACHY_PHYSICAL_DEVICE_SERIAL }}
        run: |
          set -euo pipefail
          mapfile -t physical_serials < <(
            adb devices | awk 'NR > 1 && $2 == "device" && $1 !~ /^emulator-/ {print $1}'
          )
          accepted=()
          for serial in "${physical_serials[@]}"; do
            state="$(adb -s "${serial}" get-state | tr -d '\r')"
            abi="$(adb -s "${serial}" shell getprop ro.product.cpu.abi | tr -d '\r')"
            sdk="$(adb -s "${serial}" shell getprop ro.build.version.sdk | tr -d '\r')"
            printf 'physical_device=%s state=%s abi=%s sdk=%s\n' \
              "${serial}" "${state}" "${abi}" "${sdk}"
            if [[ "${state}" == "device" && \
                  "${abi}" == "arm64-v8a" && \
                  "${sdk}" =~ ^[0-9]+$ ]] && (( sdk >= 26 )); then
              accepted+=("${serial}")
            fi
          done
          serial_override="${REACHY_PHYSICAL_DEVICE_SERIAL:-}"
          if [[ -n "${serial_override}" ]]; then
            override_ok=0
            for candidate in "${accepted[@]}"; do
              if [[ "${candidate}" == "${serial_override}" ]]; then
                override_ok=1
                break
              fi
            done
            if (( override_ok != 1 )); then
              printf 'Pinned REACHY_PHYSICAL_DEVICE_SERIAL=%s is not an approved connected device.\n' \
                "${serial_override}" >&2
              adb devices -l >&2
              exit 1
            fi
            serial="${serial_override}"
          elif (( ${#accepted[@]} != 1 )); then
            printf 'Expected exactly one physical arm64-v8a API-26+ device; found %s.\n' \
              "${#accepted[@]}" >&2
            adb devices -l >&2
            exit 1
          else
            serial="${accepted[0]}"
          fi
          adb -s "${serial}" wait-for-device
          printf 'REACHY_ANDROID_SERIAL=%s\n' "${serial}" >> "${GITHUB_ENV}"
          printf 'pinned_android_serial=%s\n' "${serial}"

      - name: Build ARM64 API-26 device APK
        shell: bash
        run: bash scripts/build_unity_android.sh device-feasibility

      - name: Verify ARM64 API-26 device APK
        shell: bash
        run: |
          set -euo pipefail
          test -s Builds/Android/weachy-mini-device-arm64-api26.apk

      - name: Install and run RMA-190 core end-to-end acceptance
        shell: bash
        env:
          RMA190_CORE_REPORT_DIR: ${{ runner.temp }}/rma190-core-end-to-end-report
        run: bash scripts/run_rma190_core_end_to_end_android.sh

      - name: Install and run RMA-090 camera discovery acceptance
        shell: bash
        env:
          RMA090_CAMERA_REPORT_DIR: ${{ runner.temp }}/rma090-camera-device-report
        run: bash scripts/run_rma090_camera_discovery_acceptance_android.sh

      - name: Install and run RMA-091 camera acquisition acceptance
        shell: bash
        env:
          RMA091_CAMERA_REPORT_DIR: ${{ runner.temp }}/rma091-camera-device-report
        run: bash scripts/run_rma091_camera_acquisition_acceptance_android.sh

      - name: Install and run RMA-092 camera texture acceptance
        shell: bash
        env:
          RMA092_CAMERA_REPORT_DIR: ${{ runner.temp }}/rma092-camera-texture-report
        run: bash scripts/run_rma092_camera_texture_acceptance_android.sh

      - name: Install and run RMA-111 lightweight tracking acceptance
        shell: bash
        env:
          RMA111_TRACKING_REPORT_DIR: ${{ runner.temp }}/rma111-lightweight-tracking-report
        run: bash scripts/run_rma111_lightweight_tracking_acceptance_android.sh

      - name: Install and run RMA-154 visual-servo acceptance
        shell: bash
        env:
          RMA154_VISUAL_SERVO_REPORT_DIR: ${{ runner.temp }}/rma154-visual-servo-report
        run: bash scripts/run_rma154_visual_servo_acceptance_android.sh

      - name: Install and run RMA-022 lifecycle acceptance
        shell: bash
        env:
          UNITY_LIFECYCLE_REPORT_DIR: ${{ runner.temp }}/unity-lifecycle-device-report
        run: bash scripts/run_unity_native_lifecycle_acceptance_android.sh

      - name: Install and run RMA-195 application-composition acceptance
        shell: bash
        env:
          RMA195_COMPOSITION_REPORT_DIR: ${{ runner.temp }}/rma195-application-composition-report
        run: bash scripts/run_rma195_application_composition_acceptance_android.sh

      - name: Install and run authoritative rendering acceptance
        shell: bash
        env:
          UNITY_AUTHORITATIVE_REPORT_DIR: ${{ runner.temp }}/unity-authoritative-device-report
        run: bash scripts/run_unity_authoritative_rendering_acceptance_android.sh

name: Local Unity Android Validation

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_unity_tests:
        description: Run Unity edit-mode and play-mode tests
        required: true
        default: true
        type: boolean
      build_device_apk:
        description: Build the ARM64 API-26 physical-device feasibility APK
        required: true
        default: true
        type: boolean
      install_physical_device:
        description: Install and launch the APK on the sole connected physical ARM64 device
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: local-unity-android-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Unity and Android on kawa
    runs-on:
      - self-hosted
      - linux
      - x64
      - weachy-mini-android-device
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Report selected self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_name=%s\n' "${RUNNER_NAME}"
          printf 'runner_os=%s\n' "${RUNNER_OS}"
          printf 'runner_arch=%s\n' "${RUNNER_ARCH}"
          printf 'user=%s\n' "$(id -un)"
          printf 'host=%s\n' "$(hostname)"
          printf 'workspace=%s\n' "${GITHUB_WORKSPACE}"

      - name: Resolve local Unity and Android installations
        shell: bash
        run: |
          set -euo pipefail

          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          if [[ -z "${project_version}" ]]; then
            printf '%s\n' 'Could not read the pinned Unity version.' >&2
            exit 1
          fi

          unity_editor="${UNITY_EDITOR:-}"
          if [[ -n "${unity_editor}" && ! -x "${unity_editor}" ]]; then
            printf 'Configured UNITY_EDITOR is not executable: %s\n' \
              "${unity_editor}" >&2
            exit 1
          fi

          if [[ -z "${unity_editor}" ]]; then
            for candidate in \
              "${HOME}/Unity/Hub/Editor/${project_version}/Editor/Unity" \
              "${HOME}/UnityHub/Editors/${project_version}/Editor/Unity" \
              "${HOME}/.local/share/UnityHub/Editors/${project_version}/Editor/Unity" \
              "/opt/Unity/Hub/Editor/${project_version}/Editor/Unity" \
              "/opt/unity/editors/${project_version}/Editor/Unity"; do
              if [[ -x "${candidate}" ]]; then
                unity_editor="${candidate}"
                break
              fi
            done
          fi

          if [[ -z "${unity_editor}" ]]; then
            printf 'Pinned Unity %s was not found.\n' "${project_version}" >&2
            printf '%s\n' 'Executable Unity editors visible to the runner:' >&2
            editor_found=false
            for editor_root in \
              "${HOME}/Unity/Hub/Editor" \
              "${HOME}/UnityHub/Editors" \
              "${HOME}/.local/share/UnityHub/Editors" \
              "/opt/Unity/Hub/Editor" \
              "/opt/unity/editors"; do
              if [[ ! -d "${editor_root}" ]]; then
                continue
              fi
              while IFS= read -r candidate; do
                printf '  %s\n' "${candidate}" >&2
                editor_found=true
              done < <(
                find "${editor_root}" \
                  -mindepth 3 \
                  -maxdepth 3 \
                  -type f \
                  -path '*/Editor/Unity' \
                  -perm -u+x \
                  -print \
                  | sort
              )
            done
            if [[ "${editor_found}" != true ]]; then
              printf '%s\n' '  none found in the supported Unity Hub locations' >&2
            fi
            exit 1
          fi

          android_player_dir="$(dirname "${unity_editor}")/Data/PlaybackEngines/AndroidPlayer"
          if [[ ! -d "${android_player_dir}" ]]; then
            printf 'Unity Android Build Support is missing: %s\n' \
              "${android_player_dir}" >&2
            printf 'Install Android Build Support for Unity %s through Unity Hub.\n' \
              "${project_version}" >&2
            exit 1
          fi

          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-${HOME}/Android/Sdk}}"
          if [[ ! -x "${android_sdk_root}/platform-tools/adb" ]]; then
            printf 'Android SDK platform-tools were not found under %s.\n' \
              "${android_sdk_root}" >&2
            exit 1
          fi

          {
            printf 'UNITY_EDITOR=%s\n' "${unity_editor}"
            printf 'ANDROID_SDK_ROOT=%s\n' "${android_sdk_root}"
            printf 'ANDROID_HOME=%s\n' "${android_sdk_root}"
          } >> "${GITHUB_ENV}"
          printf '%s\n' "${android_sdk_root}/platform-tools" >> "${GITHUB_PATH}"

          printf 'resolved_unity_editor=%s\n' "${unity_editor}"
          printf 'resolved_unity_android_player=%s\n' "${android_player_dir}"
          printf 'resolved_android_sdk=%s\n' "${android_sdk_root}"
          unity_version_output="$("${unity_editor}" -version -batchmode -quit 2>&1)"
          printf '%s\n' "${unity_version_output}"
          if [[ "${unity_version_output}" != *"${project_version}"* ]]; then
            printf 'Unity executable does not match pinned version %s.\n' \
              "${project_version}" >&2
            exit 1
          fi
          "${android_sdk_root}/platform-tools/adb" version

      - name: Prepare generated Reachy Unity presentation
        shell: bash
        env:
          REACHY_UNITY_WORK_ROOT: ${{ runner.temp }}/reachy-unity-presentation
        run: bash scripts/prepare_reachy_unity_presentation.sh

      - name: Run Unity tests
        id: unity_tests
        if: ${{ github.event_name == 'push' || inputs.run_unity_tests }}
        shell: bash
        env:
          UNITY_TEST_RESULTS_DIR: ${{ runner.temp }}/unity-test-results
        run: bash scripts/run_unity_tests.sh

      - name: Upload Unity test results
        if: ${{ always() && steps.unity_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: local-unity-test-results-${{ github.sha }}
          path: ${{ runner.temp }}/unity-test-results
          if-no-files-found: error
          retention-days: 14

      - name: Build ARM64 API-26 device APK
        if: ${{ github.event_name == 'push' || inputs.build_device_apk || inputs.install_physical_device }}
        shell: bash
        run: bash scripts/build_unity_android.sh device-feasibility

      - name: Verify ARM64 API-26 device APK
        if: ${{ github.event_name == 'push' || inputs.build_device_apk || inputs.install_physical_device }}
        shell: bash
        run: |
          set -euo pipefail
          test -s Builds/Android/weachy-mini-device-arm64-api26.apk

      - name: Select physical ARM64 Android device
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_physical_device }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t physical_serials < <(
            adb devices | awk 'NR > 1 && $2 == "device" && $1 !~ /^emulator-/ {print $1}'
          )
          arm64_serials=()
          for serial in "${physical_serials[@]}"; do
            abi="$(adb -s "${serial}" shell getprop ro.product.cpu.abi | tr -d '\r')"
            sdk="$(adb -s "${serial}" shell getprop ro.build.version.sdk | tr -d '\r')"
            printf 'physical_device=%s abi=%s sdk=%s\n' "${serial}" "${abi}" "${sdk}"
            if [[ "${abi}" == "arm64-v8a" && "${sdk}" =~ ^[0-9]+$ ]] && \
               (( sdk >= 26 )); then
              arm64_serials+=("${serial}")
            fi
          done
          if [[ "${#arm64_serials[@]}" -ne 1 ]]; then
            printf 'Exactly one physical arm64-v8a device at API 26 or newer is required; found %s.\n' \
              "${#arm64_serials[@]}" >&2
            adb devices -l >&2
            exit 1
          fi
          printf 'DEVICE_SERIAL=%s\n' "${arm64_serials[0]}" >> "${GITHUB_ENV}"

      - name: Install and launch physical-device APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_physical_device }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path='Builds/Android/weachy-mini-device-arm64-api26.apk'
          package_name='com.ekkus.weachymini'
          adb -s "${DEVICE_SERIAL}" install -r "${apk_path}"
          adb -s "${DEVICE_SERIAL}" shell pm path "${package_name}"
          adb -s "${DEVICE_SERIAL}" shell monkey \
            -p "${package_name}" \
            -c android.intent.category.LAUNCHER \
            1
          sleep 5
          adb -s "${DEVICE_SERIAL}" shell pidof "${package_name}"

      - name: Capture physical-device diagnostics after failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_physical_device && failure() }}
        shell: bash
        run: |
          set +e
          if [[ -n "${DEVICE_SERIAL:-}" ]]; then
            adb -s "${DEVICE_SERIAL}" logcat -d \
              > "${RUNNER_TEMP}/android-device-logcat.txt"
          fi

      - name: Upload physical-device diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_physical_device && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-android-device-failure-${{ github.sha }}
          path: ${{ runner.temp }}/android-device-logcat.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ARM64 API-26 device APK
        if: ${{ success() && (github.event_name == 'push' || inputs.build_device_apk || inputs.install_physical_device) }}
        uses: actions/upload-artifact@v4
        with:
          name: local-unity-device-apk-${{ github.sha }}
          path: Builds/Android/weachy-mini-device-arm64-api26.apk
          if-no-files-found: error
          retention-days: 14

name: Local Unity Android Validation

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_unity_tests:
        description: Run Unity edit-mode and play-mode tests
        required: true
        default: true
        type: boolean
      build_device_apk:
        description: Build the ARM64 API-26 physical-device feasibility APK
        required: true
        default: true
        type: boolean
      install_physical_device:
        description: Install and run lifecycle and authoritative-rendering acceptance
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: local-unity-android-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.head_commit.message != 'RMA-052: invoke direct documentation closure'
    name: Validate Unity and Android on kawa
    runs-on:
      - self-hosted
      - linux
      - x64
      - weachy-mini-android-device
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Report selected self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_name=%s\n' "${RUNNER_NAME}"
          printf 'runner_os=%s\n' "${RUNNER_OS}"
          printf 'runner_arch=%s\n' "${RUNNER_ARCH}"
          printf 'user=%s\n' "$(id -un)"
          printf 'host=%s\n' "$(hostname)"
          printf 'workspace=%s\n' "${GITHUB_WORKSPACE}"

      - name: Resolve local Unity and Android installations
        shell: bash
        run: |
          set -euo pipefail

          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          if [[ -z "${project_version}" ]]; then
            printf '%s\n' 'Could not read the pinned Unity version.' >&2
            exit 1
          fi

          unity_editor="${UNITY_EDITOR:-}"
          if [[ -n "${unity_editor}" && ! -x "${unity_editor}" ]]; then
            printf 'Configured UNITY_EDITOR is not executable: %s\n' \
              "${unity_editor}" >&2
            exit 1
          fi

          if [[ -z "${unity_editor}" ]]; then
            for candidate in \
              "${HOME}/Unity/Hub/Editor/${project_version}/Editor/Unity" \
              "${HOME}/UnityHub/Editors/${project_version}/Editor/Unity" \
              "${HOME}/.local/share/UnityHub/Editors/${project_version}/Editor/Unity" \
              "/opt/Unity/Hub/Editor/${project_version}/Editor/Unity" \
              "/opt/unity/editors/${project_version}/Editor/Unity"; do
              if [[ -x "${candidate}" ]]; then
                unity_editor="${candidate}"
                break
              fi
            done
          fi

          if [[ -z "${unity_editor}" ]]; then
            printf 'Pinned Unity %s was not found.\n' "${project_version}" >&2
            printf '%s\n' 'Executable Unity editors visible to the runner:' >&2
            editor_found=false
            for editor_root in \
              "${HOME}/Unity/Hub/Editor" \
              "${HOME}/UnityHub/Editors" \
              "${HOME}/.local/share/UnityHub/Editors" \
              "/opt/Unity/Hub/Editor" \
              "/opt/unity/editors"; do
              if [[ ! -d "${editor_root}" ]]; then
                continue
              fi
              while IFS= read -r candidate; do
                printf '  %s\n' "${candidate}" >&2
                editor_found=true
              done < <(
                find "${editor_root}" \
                  -mindepth 3 \
                  -maxdepth 3 \
                  -type f \
                  -path '*/Editor/Unity' \
                  -perm -u+x \
                  -print \
                  | sort
              )
            done
            if [[ "${editor_found}" != true ]]; then
              printf '%s\n' '  none found in the supported Unity Hub locations' >&2
            fi
            exit 1
          fi

          android_player_dir="$(dirname "${unity_editor}")/Data/PlaybackEngines/AndroidPlayer"
          if [[ ! -d "${android_player_dir}" ]]; then
            printf 'Unity Android Build Support is missing: %s\n' \
              "${android_player_dir}" >&2
            printf 'Install Android Build Support for Unity %s through Unity Hub.\n' \
              "${project_version}" >&2
            exit 1
          fi

          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-${HOME}/Android/Sdk}}"
          if [[ ! -x "${android_sdk_root}/platform-tools/adb" ]]; then
            printf 'Android SDK platform-tools were not found under %s.\n' \
              "${android_sdk_root}" >&2
            exit 1
          fi

          {
            printf 'UNITY_EDITOR=%s\n' "${unity_editor}"
            printf 'ANDROID_SDK_ROOT=%s\n' "${android_sdk_root}"
            printf 'ANDROID_HOME=%s\n' "${android_sdk_root}"
          } >> "${GITHUB_ENV}"
          printf '%s\n' "${android_sdk_root}/platform-tools" >> "${GITHUB_PATH}"

          printf 'resolved_unity_editor=%s\n' "${unity_editor}"
          printf 'resolved_unity_android_player=%s\n' "${android_player_dir}"
          printf 'resolved_android_sdk=%s\n' "${android_sdk_root}"
          unity_version_output="$("${unity_editor}" -version -batchmode -quit 2>&1)"
          printf '%s\n' "${unity_version_output}"
          if [[ "${unity_version_output}" != *"${project_version}"* ]]; then
            printf 'Unity executable does not match pinned version %s.\n' \
              "${project_version}" >&2
            exit 1
          fi
          "${android_sdk_root}/platform-tools/adb" version

      - name: Prepare generated Reachy Unity presentation
        shell: bash
        env:
          REACHY_UNITY_WORK_ROOT: ${{ runner.temp }}/reachy-unity-presentation
        run: bash scripts/prepare_reachy_unity_presentation.sh

      - name: Stage production MuJoCo runtime for Unity Android
        shell: bash
        env:
          REACHY_UNITY_WORK_ROOT: ${{ runner.temp }}/reachy-unity-presentation
        run: bash scripts/stage_reachy_unity_android_runtime.sh

      - name: Run Unity tests
        id: unity_tests
        if: ${{ github.event_name == 'push' || inputs.run_unity_tests }}
        shell: bash
        env:
          UNITY_TEST_RESULTS_DIR: ${{ runner.temp }}/unity-test-results
        run: bash scripts/run_unity_tests.sh

      - name: Upload Unity test results
        if: ${{ always() && steps.unity_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: local-unity-test-results-${{ github.sha }}
          path: ${{ runner.temp }}/unity-test-results
          if-no-files-found: error
          retention-days: 14

      - name: Build ARM64 API-26 device APK
        if: ${{ github.event_name == 'push' || inputs.build_device_apk || inputs.install_physical_device }}
        shell: bash
        run: bash scripts/build_unity_android.sh device-feasibility

      - name: Verify ARM64 API-26 device APK
        if: ${{ github.event_name == 'push' || inputs.build_device_apk || inputs.install_physical_device }}
        shell: bash
        run: |
          set -euo pipefail
          test -s Builds/Android/weachy-mini-device-arm64-api26.apk

      - name: Install and run RMA-022 lifecycle acceptance
        id: lifecycle_acceptance
        if: ${{ github.event_name == 'push' || inputs.install_physical_device }}
        shell: bash
        env:
          UNITY_LIFECYCLE_REPORT_DIR: ${{ runner.temp }}/unity-lifecycle-device-report
        run: bash scripts/run_unity_native_lifecycle_acceptance_android.sh

      - name: Upload RMA-022 lifecycle evidence
        if: ${{ always() && steps.lifecycle_acceptance.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-lifecycle-device-report-${{ github.sha }}
          path: ${{ runner.temp }}/unity-lifecycle-device-report
          if-no-files-found: warn
          retention-days: 30

      - name: Install and run authoritative rendering acceptance
        id: physical_acceptance
        if: ${{ github.event_name == 'push' || inputs.install_physical_device }}
        shell: bash
        env:
          UNITY_AUTHORITATIVE_REPORT_DIR: ${{ runner.temp }}/unity-authoritative-device-report
        run: bash scripts/run_unity_authoritative_rendering_acceptance_android.sh

      - name: Upload authoritative rendering evidence
        if: ${{ always() && steps.physical_acceptance.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-authoritative-device-report-${{ github.sha }}
          path: ${{ runner.temp }}/unity-authoritative-device-report
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ARM64 API-26 device APK
        if: ${{ success() && (github.event_name == 'push' || inputs.build_device_apk || inputs.install_physical_device) }}
        uses: actions/upload-artifact@v4
        with:
          name: local-unity-device-apk-${{ github.sha }}
          path: Builds/Android/weachy-mini-device-arm64-api26.apk
          if-no-files-found: error
          retention-days: 14

  # BEGIN RMA-052 DIRECT CLOSURE
  close-rma-052:
    if: github.event_name == 'push' && github.event.head_commit.message == 'RMA-052: invoke direct documentation closure'
    name: Close validated RMA-052 documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated closure and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/rma052_close_docs.py
          python3 scripts/rma052_close_docs.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/local-unity-android-validation.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "    if: github.event.head_commit.message != 'RMA-052: invoke direct documentation closure'\n",
              '',
              1,
          )
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          marker = '\n  # BEGIN RMA-052 DIRECT CLOSURE\n'
          if text.count(marker) != 1:
              raise SystemExit('RMA-052 direct-closure marker was not unique.')
          text = text.split(marker, 1)[0].rstrip() + '\n'
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -Fq -- '- [x] Add development-build assertions' \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          grep -Fq 'RMA-052 is complete.' docs/IMPLEMENTATION_STATUS.md
          test -s docs/validation/RMA_052_AUTHORITATIVE_RENDERING_INVARIANTS_2026-07-30.md
          test ! -e docs/validation/RMA_052_VALIDATION_PENDING_2026-07-30.md

      - name: Commit permanent closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/local-unity-android-validation.yml \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md \
            docs/IMPLEMENTATION_STATUS.md \
            docs/architecture/AUTHORITATIVE_UNITY_RENDERING.md \
            docs/validation/RMA_052_AUTHORITATIVE_RENDERING_INVARIANTS_2026-07-30.md
          git rm -f \
            docs/validation/RMA_052_VALIDATION_PENDING_2026-07-30.md \
            docs/validation/RMA_052_CLOSE_TRIGGER \
            scripts/rma052_close_docs.py \
            .github/workflows/rma052-docs-close-once.yml
          git diff --cached --check
          git commit -m 'RMA-052: close authoritative rendering invariants [skip ci]'
          git push origin HEAD:master
  # END RMA-052 DIRECT CLOSURE

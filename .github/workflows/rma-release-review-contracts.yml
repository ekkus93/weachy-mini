name: RMA Release Review Contracts

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rma-release-review-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-review-contracts:
    name: Run RMA-191/192/193/194 contracts without Android device
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard RMA-184 physical-device preflight ordering
        run: python3 scripts/tests/test_rma184_device_preflight.py

      - name: Guard RMA-002 two-clean-environment evidence boundary
        run: python3 scripts/tests/test_rma002_two_environment_build_blocker.py

      - name: Run RMA-012 in-app license contract
        run: python3 scripts/tests/test_rma012_licenses.py

      - name: Run RMA-161 credential lifecycle contract
        run: python3 scripts/tests/test_rma161_credential_lifecycle.py

      - name: Run RMA-162 private-media retention contract
        run: python3 scripts/tests/test_rma162_private_media_retention.py

      - name: Run RMA-170 structured-logging contract
        run: python3 scripts/tests/test_rma170_structured_logging.py

      - name: Run RMA-172 diagnostic-bundle contract
        run: python3 scripts/tests/test_rma172_diagnostic_bundle_export.py

      - name: Run RMA-195 fail-closed composition contract
        run: python3 scripts/tests/test_rma195_application_composition.py

      - name: Enforce RMA-190 physical VLM artifact privacy
        run: python3 scripts/tests/test_rma190_vlm_artifact_privacy.py

      - name: Run canonical RMA-191 security/privacy contract
        run: python3 scripts/tests/test_rma191_security_privacy_review.py

      - name: Guard RMA-180 physical performance artifact privacy
        run: python3 scripts/tests/test_rma180_artifact_privacy.py

      - name: Guard RMA-134/135 physical status and source-hash inventory
        run: python3 scripts/tests/test_rma134_rma135_physical_status.py

      - name: Guard local-LLM physical evidence privacy
        run: python3 scripts/tests/test_rma134_rma135_artifact_privacy.py

      - name: Run RMA-191 compatibility guard
        run: python3 scripts/tests/test_rma191_security_review.py

      - name: Run RMA-192 license-review contract
        run: python3 scripts/tests/test_rma192_license_reconciliation.py

      - name: Run RMA-193 documentation contract
        run: python3 scripts/tests/test_rma193_documentation_contract.py

      - name: Run RMA-194 release-status contract
        run: python3 scripts/tests/test_rma194_release_acceptance.py

      - name: Guard RMA-194 deferred features and fidelity labeling
        run: python3 scripts/tests/test_rma194_deferred_feature_and_fidelity_gate.py

      - name: Verify release status tracks authoritative RMA-190 scenarios
        run: python3 scripts/tests/test_rma194_status_reconciliation.py

name: RMA-032 Authoritative Worker Closure

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma032-close.yml

permissions:
  contents: write

jobs:
  close-rma032:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact master commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark only verified RMA-032 checklist items complete
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > "${RUNNER_TEMP}/rma032-checklist.py"
          python "${RUNNER_TEMP}/rma032-checklist.py"

      - name: Remove temporary RMA-032 workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rma032-hardening.yml
          rm .github/workflows/rma032-fault-retention.yml
          rm .github/workflows/rma032-close.yml

      - name: Commit authoritative checklist closure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md \
            .github/workflows/rma032-hardening.yml \
            .github/workflows/rma032-fault-retention.yml \
            .github/workflows/rma032-close.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RMA-032: close authoritative worker checklist"
          git push origin HEAD:master

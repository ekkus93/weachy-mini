name: RMA-033 Physical Acceptance Startup Hardening

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma033-acceptance-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden cold-start acceptance timing and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/rma033_acceptance.py
          python3 /tmp/rma033_acceptance.py
          git rm .github/workflows/rma033-acceptance-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/ReachyMini/Runtime/Rendering/ReachyAuthoritativePhysicalAcceptance.cs
          git add scripts/run_unity_authoritative_rendering_acceptance_android_impl.sh
          git commit -m "RMA-033: harden physical acceptance startup"
          git push origin HEAD:master

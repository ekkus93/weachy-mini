name: RMA-033 Snapshot Closure

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma033-close.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact master commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close verified RMA-033 records
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/rma033_close.py
          python3 /tmp/rma033_close.py
          git rm .github/workflows/rma033-close.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          git add docs/SIMULATION_ABI.md
          git add docs/IMPLEMENTATION_STATUS.md
          git add docs/validation/RMA_033_SNAPSHOT_RESET_VALIDATION_2026-07-30.md
          git commit -m "RMA-033: close deterministic snapshot task"
          git push origin HEAD:master

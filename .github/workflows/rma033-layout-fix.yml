name: RMA-033 Checklist Layout Fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma033-layout-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move completion evidence into RMA-033
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/rma033_layout.py
          python3 /tmp/rma033_layout.py
          git rm .github/workflows/rma033-layout-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          git commit -m "RMA-033: place completion evidence correctly"
          git push origin HEAD:master

name: RMA-033 Worker Snapshot Integration

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma033-worker-snapshots.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact master commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and apply the staged source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = ".github/workflows/rma033-worker-snapshots.yml"
          previous = subprocess.check_output(
              ["git", "show", f"HEAD^:{path}"],
              text=True,
          )
          start_marker = "          from pathlib import Path\n"
          end_marker = "\n          PY\n"
          start = previous.index(start_marker)
          end = previous.index(end_marker, start)
          source_lines = previous[start:end].splitlines()
          recovered = []
          inside_triple = False
          for source_line in source_lines:
              if inside_triple:
                  line = source_line
              else:
                  line = (
                      source_line[10:]
                      if source_line.startswith("          ")
                      else source_line
                  )
              recovered.append(line)
              if line.count("'''") % 2 == 1:
                  inside_triple = not inside_triple
          if inside_triple:
              raise SystemExit("Recovered patch script has an unclosed string")
          Path("/tmp/rma033_patch.py").write_text(
              "\n".join(recovered) + "\n",
              encoding="utf-8",
          )
          PY
          python3 /tmp/rma033_patch.py
          git rm .github/workflows/rma033-worker-snapshots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/ReachyMini/Runtime/Simulation/ReachySimulationWorker.cs
          git add managed/ReachyMini.Core.Tests/Program.cs
          git commit -m "RMA-033: integrate snapshots with worker"
          git push origin HEAD:master

name: RMA-040 verified closure

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma040-close.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close only verified RMA-040 work
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rma040_close.py
          python3 - <<'PY'
          from pathlib import Path
          todo = Path("docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md").read_text(encoding="utf-8")
          rma040 = todo[todo.index("## RMA-040"):todo.index("## RMA-041")]
          rma041 = todo[todo.index("## RMA-041"):todo.index("## RMA-042")]
          assert rma040.count("- [x]") == 8
          assert rma040.count("- [ ]") == 0
          assert rma041.count("- [ ]") == 7
          assert rma041.count("- [x]") == 0
          print("RMA-040 closure verified; RMA-041 remains untouched.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rma040-close.yml .github/rma040_close.py
          git add \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md \
            docs/IMPLEMENTATION_STATUS.md \
            docs/validation/RMA_040_MODEL_IMPORT_VALIDATION_2026-07-30.md
          git commit -m "RMA-040: close official model import"
          git push origin HEAD:master

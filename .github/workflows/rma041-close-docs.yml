name: RMA-041 Publish Closure Documentation

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma041-close-docs.yml'

permissions:
  contents: write
  issues: write

jobs:
  publish-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate guarded closure documents
        run: python3 scripts/rma041_close_docs.py
      - name: Validate permanent RMA-041 contract
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.12.0
          ruff check \
            scripts/validate_model_parameter_audit.py \
            scripts/tests/test_model_parameter_audit.py
          ruff format --check \
            scripts/validate_model_parameter_audit.py \
            scripts/tests/test_model_parameter_audit.py
          python3 scripts/tests/test_model_parameter_audit.py
          python3 scripts/validate_model_parameter_audit.py \
            --audit models/reachy-mini/model-parameter-audit.json \
            --lock third_party/reachy-mini-source.lock.json \
            --baseline models/reachy-mini/model-baseline.json
      - name: Validate and commit exact closure
        run: |
          set -euo pipefail
          git diff --check
          test -s docs/validation/RMA_041_MODEL_PARAMETER_AUDIT_VALIDATION_2026-07-30.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/rma041_close_docs.py .github/workflows/rma041-close-docs.yml
          git add \
            docs/IMPLEMENTATION_STATUS.md \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md \
            docs/validation/RMA_041_MODEL_PARAMETER_AUDIT_VALIDATION_2026-07-30.md
          git diff --cached --check
          git commit -m 'RMA-041: close mechanical parameter audit'
          git push origin HEAD:master
      - name: Publish closure commit identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          body="RMA-041 closure documentation was validated and committed.\n\n- Workflow run: ${GITHUB_RUN_ID}\n- Closure commit: ${commit}\n- Result: success\n"
          gh issue edit 7 --repo "${GITHUB_REPOSITORY}" --body "${body}"

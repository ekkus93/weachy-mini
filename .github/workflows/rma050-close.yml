name: RMA-050 Guarded Documentation Closure

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/rma050_close.py'
      - '.github/workflows/rma050-close.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded RMA-050 documentation closure
        run: |
          set -euo pipefail
          python3 scripts/rma050_close.py
          python3 scripts/check_docs_links.py
          git diff --check
      - name: Commit verified closure
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/IMPLEMENTATION_STATUS.md \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md \
            docs/architecture/AUTHORITATIVE_UNITY_RENDERING.md
          git rm scripts/rma050_close.py
          git diff --cached --check
          git commit -m 'RMA-050: close generated Unity prefab task'
          git push origin HEAD:master

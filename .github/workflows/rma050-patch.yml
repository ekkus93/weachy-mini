name: RMA-050 Guarded Prefab Hardening

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/rma050_patch.py'
      - 'scripts/rma050_post_patch.py'
      - '.github/workflows/rma050-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded source transformation
        run: |
          set -euo pipefail
          python3 scripts/rma050_patch.py
          python3 scripts/rma050_post_patch.py
      - name: Format and validate Python changes
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.12.0
          ruff format \
            scripts/prepare_reachy_unity_assets.py \
            scripts/tests/test_prepare_reachy_unity_assets.py
          ruff check \
            scripts/prepare_reachy_unity_assets.py \
            scripts/tests/test_prepare_reachy_unity_assets.py
          ruff format --check \
            scripts/prepare_reachy_unity_assets.py \
            scripts/tests/test_prepare_reachy_unity_assets.py
          python3 -m unittest scripts.tests.test_prepare_reachy_unity_assets -v
      - name: Verify patch scope
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- \
            scripts/rma050_patch.py \
            scripts/rma050_post_patch.py \
            .github/workflows/rma050-patch.yml
          expected="Assets/ReachyMini/Editor/ReachyPresentationBuilder.cs
          Assets/ReachyMini/Tests/Editor/ReachyPresentationAssetTests.cs
          Assets/ReachyMini/Tests/PlayMode/BootstrapScenePlayModeTests.cs
          scripts/prepare_reachy_unity_assets.py
          scripts/tests/test_prepare_reachy_unity_assets.py"
          actual="$(git diff --name-only | sort)"
          if [[ "${actual}" != "$(printf '%s\n' "${expected}" | sed 's/^ *//' | sort)" ]]; then
            printf 'Unexpected RMA-050 patch scope:\n%s\n' "${actual}" >&2
            exit 1
          fi
      - name: Commit validated source changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Assets/ReachyMini/Editor/ReachyPresentationBuilder.cs \
            Assets/ReachyMini/Tests/Editor/ReachyPresentationAssetTests.cs \
            Assets/ReachyMini/Tests/PlayMode/BootstrapScenePlayModeTests.cs \
            scripts/prepare_reachy_unity_assets.py \
            scripts/tests/test_prepare_reachy_unity_assets.py
          git diff --cached --check
          git commit -m 'RMA-050: harden generated prefab contract'
          git push origin HEAD:master

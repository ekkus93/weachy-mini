name: RMA-050 Guarded Prefab Hardening

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/rma050_patch.py'
      - '.github/workflows/rma050-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded source transformation
        run: |
          set -euo pipefail
          python3 scripts/rma050_patch.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Assets/ReachyMini/Tests/Editor/ReachyPresentationAssetTests.cs')
          text = path.read_text(encoding='utf-8')
          old = 'using UnityEngine;\nusing UnityEngine.SceneManagement;\n'
          new = 'using UnityEngine;\nusing UnityEngine.Rendering;\nusing UnityEngine.SceneManagement;\n'
          if text.count(old) != 1:
              raise SystemExit('Could not add UnityEngine.Rendering import exactly once')
          text = text.replace(old, new)
          old = '''                Assert.That(
                    roots.SelectMany(root => root.GetComponentsInChildren<AudioListener>(true)),
                    Has.Exactly(1).Items);
'''
          new = '''                Assert.That(
                    roots.SelectMany(root => root.GetComponentsInChildren<AudioListener>(true))
                        .ToArray(),
                    Has.Length.EqualTo(1));
'''
          if text.count(old) != 1:
              raise SystemExit('Could not harden AudioListener assertion exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
      - name: Format and validate Python changes
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.12.0
          ruff format \
            scripts/prepare_reachy_unity_assets.py \
            scripts/tests/test_prepare_reachy_unity_assets.py
          ruff check \
            scripts/prepare_reachy_unity_assets.py \
            scripts/tests/test_prepare_reachy_unity_assets.py
          ruff format --check \
            scripts/prepare_reachy_unity_assets.py \
            scripts/tests/test_prepare_reachy_unity_assets.py
          python3 -m unittest scripts.tests.test_prepare_reachy_unity_assets -v
      - name: Verify patch scope
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- scripts/rma050_patch.py .github/workflows/rma050-patch.yml
          expected="Assets/ReachyMini/Editor/ReachyPresentationBuilder.cs
          Assets/ReachyMini/Tests/Editor/ReachyPresentationAssetTests.cs
          Assets/ReachyMini/Tests/PlayMode/BootstrapScenePlayModeTests.cs
          scripts/prepare_reachy_unity_assets.py
          scripts/tests/test_prepare_reachy_unity_assets.py"
          actual="$(git diff --name-only | sort)"
          if [[ "${actual}" != "$(printf '%s\n' "${expected}" | sed 's/^ *//' | sort)" ]]; then
            printf 'Unexpected RMA-050 patch scope:\n%s\n' "${actual}" >&2
            exit 1
          fi
      - name: Commit validated source changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Assets/ReachyMini/Editor/ReachyPresentationBuilder.cs \
            Assets/ReachyMini/Tests/Editor/ReachyPresentationAssetTests.cs \
            Assets/ReachyMini/Tests/PlayMode/BootstrapScenePlayModeTests.cs \
            scripts/prepare_reachy_unity_assets.py \
            scripts/tests/test_prepare_reachy_unity_assets.py
          git diff --cached --check
          git commit -m 'RMA-050: harden generated prefab contract'
          git push origin HEAD:master

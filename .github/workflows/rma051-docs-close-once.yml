name: RMA-051 Documentation Closure

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  close-rma-051:
    if: github.event.issue.title == '[automation] Close RMA-051 documentation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded documentation patch
        run: |
          set -euo pipefail
          python3 scripts/rma051_close_docs.py
          git diff --check
          grep -Fq -- '- [x] Eliminate per-frame allocations.' \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          grep -Fq 'RMA-052 formal authoritative-rendering invariant closure' \
            docs/IMPLEMENTATION_STATUS.md

      - name: Commit closure and clean trigger files
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md \
            docs/IMPLEMENTATION_STATUS.md
          git rm \
            scripts/rma051_close_docs.py \
            .github/workflows/rma051-docs-close-once.yml
          git diff --cached --check
          git commit -m 'RMA-051: close state-to-render mapping [skip ci]'
          git push origin HEAD:master
          closure_sha="$(git rev-parse HEAD)"
          gh issue close "${ISSUE_NUMBER}" \
            --comment "RMA-051 documentation closed by ${closure_sha}."

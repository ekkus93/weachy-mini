# One-shot closure workflow; removed by its successful run.
name: RMA-052 Documentation Closure

on:
  push:
    branches:
      - master
    paths:
      - 'docs/validation/RMA_052_CLOSE_TRIGGER'

permissions:
  contents: write

jobs:
  close-rma-052:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated documentation closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/rma052_close_docs.py
          python3 scripts/rma052_close_docs.py
          git diff --check
          grep -Fq -- '- [x] Add development-build assertions' \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          grep -Fq 'RMA-052 is complete.' docs/IMPLEMENTATION_STATUS.md
          test -s docs/validation/RMA_052_AUTHORITATIVE_RENDERING_INVARIANTS_2026-07-30.md
          test ! -e docs/validation/RMA_052_VALIDATION_PENDING_2026-07-30.md

      - name: Commit closure and remove trigger files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md \
            docs/IMPLEMENTATION_STATUS.md \
            docs/architecture/AUTHORITATIVE_UNITY_RENDERING.md \
            docs/validation/RMA_052_AUTHORITATIVE_RENDERING_INVARIANTS_2026-07-30.md
          git rm \
            docs/validation/RMA_052_VALIDATION_PENDING_2026-07-30.md \
            docs/validation/RMA_052_CLOSE_TRIGGER \
            scripts/rma052_close_docs.py \
            .github/workflows/rma052-docs-close-once.yml
          git diff --cached --check
          git commit -m 'RMA-052: close authoritative rendering invariants [skip ci]'
          git push origin HEAD:master

name: RMA-052 Authoritative Invariant Patch

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[automation] Apply RMA-052 invariant patch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded invariant patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/rma052_patch_invariants.py
          python3 scripts/rma052_patch_invariants.py
          git diff --check
          grep -Fq 'Application.onBeforeRender += ValidateBeforeRender;' \
            Assets/ReachyMini/Runtime/Rendering/ReachyAuthoritativeRenderer.cs
          grep -Fq 'public bool AssertRenderedPoseInvariant()' \
            Assets/ReachyMini/Runtime/Rendering/ReachyAuthoritativeRenderer.cs
          grep -Fq 'DevelopmentAssertionReportsExpectedActualAndTolerance' \
            Assets/ReachyMini/Tests/Editor/ReachyAuthoritativeInvariantTests.cs

      - name: Commit implementation and remove trigger files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Assets/ReachyMini/Runtime/Rendering/ReachyAuthoritativeRenderer.cs \
            Assets/ReachyMini/Runtime/Rendering/ReachyAuthoritativeInvariantReport.cs \
            Assets/ReachyMini/Tests/Editor/ReachyAuthoritativeInvariantTests.cs
          git rm \
            scripts/rma052_patch_invariants.py \
            .github/workflows/rma052-invariant-patch-once.yml
          git diff --cached --check
          git commit -m 'RMA-052: harden authoritative rendering invariants [skip ci]'
          git push origin HEAD:master
          implementation_sha="$(git rev-parse HEAD)"
          gh issue close "${ISSUE_NUMBER}" \
            --comment "RMA-052 invariant patch applied by ${implementation_sha}."

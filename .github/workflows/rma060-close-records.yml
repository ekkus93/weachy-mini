name: Close RMA-060 Records

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma060-close-records.yml'

permissions:
  contents: write

jobs:
  close-records:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close RMA-060 tracking records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          todo_path = Path("docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md")
          status_path = Path("docs/IMPLEMENTATION_STATUS.md")

          todo = todo_path.read_text(encoding="utf-8")
          old_todo = """## RMA-060 — Establish stable baseline dynamics

          - [ ] Run the official generic actuator model at 500 Hz as a named `upstream_baseline` mode.
          - [ ] Add finite-state, constraint residual, energy, joint-limit, and contact monitoring.
          - [ ] Test neutral, sleep, maximum valid head rotations, body yaw limits, and antennas.
          - [ ] Run long-duration stability tests on representative Android hardware.

          **Acceptance criteria**

          - [ ] No unexplained divergence during the stability suite.
          - [ ] Any required deviation from 500 Hz is backed by measurements and recorded as a gate decision.
          """
          new_todo = """## RMA-060 — Establish stable baseline dynamics

          **Status:** Complete (2026-07-30)

          - [x] Run the official generic actuator model at 500 Hz as a named `upstream_baseline` mode.
          - [x] Add finite-state, constraint residual, energy, joint-limit, and contact monitoring.
          - [x] Test neutral, sleep, maximum valid head rotations, body yaw limits, and antennas.
          - [x] Run long-duration stability tests on representative Android hardware.

          **Acceptance criteria**

          - [x] No unexplained divergence during the stability suite.
          - [x] Any required deviation from 500 Hz is backed by measurements and recorded as a gate decision.

          **Completion evidence**

          - `models/reachy-mini/upstream-baseline-stability.json` defines the named
            `upstream_baseline` contract at an exact `0.002`-second / 500 Hz timestep.
            Its generated native header binds the exact profile bytes, pinned Reachy
            model SHA-256, MuJoCo 3.9.0, dimensions, actuator order, monitoring bounds,
            command schedule, and intentional sleep-command range exceptions.
          - The 20-phase cycle covers neutral, the upstream sleep request, both body-yaw
            limits, positive and negative boundaries for all six Stewart actuators,
            both antenna extremes, and final neutral. Boundary probes use a declared
            `1e-9` radian inward inset to avoid platform-dependent one-ulp control-range
            classification while remaining effectively at the audited limits.
          - Every solver step checks finite qpos/qvel/qacc, commands and actuator forces,
            body poses, equality residuals, scalar joint-limit excursions, contacts and
            penetration, total energy, and MuJoCo warning counters. The runner also
            retains mean/median/p95/maximum step timing and visible 2 ms deadline misses.
          - Successful workflow run `30599288952` passed all focused profile tests,
            exact pinned-model import, the full 900,000-step desktop reference schedule,
            Android ARM64 cross-build and AArch64 verification, and the same 900,000-step
            schedule on physical LG-H872 API-26 hardware at commit
            `85dd886c398088946a2cc2ae61890aa94ad0294a`.
          - The Android run completed `1,799.9999999712595` simulated seconds in
            `257.879618182` wall seconds for a solver real-time factor of
            `6.980001027847417`. Maximum equality residual was
            `0.00010839801784859326`, maximum penetration was
            `0.004506368083200441` m, maximum absolute energy was
            `1.2885171070884491` J, scalar joint-limit violation was zero, and MuJoCo
            warnings were zero. No timestep deviation was required.
          - The physical harness also proved a structured invalid-cycle failure and
            retained the runtime/model/profile desktop artifact plus the device report,
            device identity, failure-path report, and attempted thermal captures.
          - Detailed contracts and evidence are in
            `docs/architecture/UPSTREAM_BASELINE_DYNAMICS.md` and
            `docs/validation/RMA_060_UPSTREAM_BASELINE_STABILITY_VALIDATION_2026-07-30.md`.
          """
          old_todo = old_todo.replace("          ", "")
          new_todo = new_todo.replace("          ", "")
          if todo.count(old_todo) != 1:
              raise SystemExit("RMA-060 TODO source block was not found exactly once")
          todo_path.write_text(todo.replace(old_todo, new_todo), encoding="utf-8", newline="\n")

          status = status_path.read_text(encoding="utf-8")
          old_series = """**Current implementation series:** RMA-052 pre-render authoritative
          invariant assertions, exact drift diagnostics, prohibited-writer rejection,
          and physical Android acceptance after RMA-051 state-to-render closure
          """.replace("          ", "")
          new_series = """**Current implementation series:** RMA-060 named upstream-baseline dynamics,
          generated native contract, full-step monitoring, desktop reference validation,
          and physical Android long-duration acceptance
          """.replace("          ", "")
          if status.count(old_series) != 1:
              raise SystemExit("Implementation-series source text was not found exactly once")
          status = status.replace(old_series, new_series)

          insertion_marker = "## Current validation evidence\n"
          rma060_section = """### RMA-060 — stable upstream baseline dynamics

          RMA-060 is complete. The exact pinned generic actuator model now has a named
          `upstream_baseline` contract at a fixed 500 Hz timestep. A validated JSON
          profile generates the production-native C schedule and binds model/runtime
          identity, dimensions, actuator order, representative phases, monitoring
          thresholds, long-duration requirements, and the no-deviation gate decision.

          The desktop and Android runners execute the same 45-cycle, 20-phase schedule:
          900,000 solver steps and 1,800 simulated seconds spanning neutral, upstream
          sleep, body-yaw boundaries, both boundaries for every Stewart actuator,
          antenna extremes, and neutral return. Every step checks finite authoritative
          state, equality residuals, scalar joint limits, contacts and penetration,
          total energy, and MuJoCo warnings. Timing evidence is retained without
          changing the simulation clock or skipping solver work.

          Workflow run `30599288952` passed the hosted desktop schedule, pinned Android
          ARM64 build, AArch64 verification, and physical LG-H872 API-26 run on exact
          commit `85dd886c398088946a2cc2ae61890aa94ad0294a`. The phone completed all
          900,000 steps with zero warnings and zero scalar joint-limit violation.
          Maximum equality residual was `0.00010839801784859326`, maximum contact
          penetration was `0.004506368083200441` m, and maximum absolute total energy
          was `1.2885171070884491` J. It simulated 30 minutes in `257.879618182` wall
          seconds for a `6.980001027847417` solver real-time factor; no timestep
          deviation was required.

          The initial full run exposed one decimal-to-binary boundary-classification
          artifact rather than divergence. The permanent profile records a `1e-9`
          radian inward inset for yaw/Stewart boundary probes, while preserving the
          exact upstream sleep request and its explicit intentional overrange mask.
          Detailed evidence is in
          [the RMA-060 validation record](validation/RMA_060_UPSTREAM_BASELINE_STABILITY_VALIDATION_2026-07-30.md).

          """.replace("          ", "")
          if status.count(insertion_marker) != 1:
              raise SystemExit("Current-validation insertion marker was not found exactly once")
          status = status.replace(insertion_marker, rma060_section + insertion_marker)

          validation_marker = "## Current validation evidence\n\n"
          validation_bullets = """- RMA-060 run `30599288952`: generated-profile tests, pinned source/model
            import, the complete 900,000-step desktop schedule, Android ARM64 build and
            AArch64 verification, physical LG-H872 API-26 900,000-step execution,
            structured failure-path validation, evidence upload, and final commit status
            all passed on `85dd886c398088946a2cc2ae61890aa94ad0294a`.
          - Physical RMA-060 metrics: zero MuJoCo warnings and scalar joint-limit
            violation, maximum equality residual `0.00010839801784859326`, maximum
            penetration `0.004506368083200441` m, maximum absolute energy
            `1.2885171070884491` J, and solver real-time factor
            `6.980001027847417` at the unchanged 500 Hz timestep.
          """.replace("          ", "")
          if status.count(validation_marker) != 1:
              raise SystemExit("Current-validation heading was not found exactly once")
          status = status.replace(validation_marker, validation_marker + validation_bullets)

          open_gate = "- RMA-060 long-duration official-model baseline dynamics and monitoring;\n"
          if status.count(open_gate) != 1:
              raise SystemExit("RMA-060 open-gate line was not found exactly once")
          status = status.replace(open_gate, "")
          status_path.write_text(status, encoding="utf-8", newline="\n")
          PY

          git rm .github/workflows/rma060-close-records.yml
          git diff --check
          grep -F '**Status:** Complete (2026-07-30)' \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          grep -F 'RMA-060 is complete.' docs/IMPLEMENTATION_STATUS.md
          if grep -F 'RMA-060 long-duration official-model baseline dynamics' \
            docs/IMPLEMENTATION_STATUS.md; then
            printf '%s\n' 'RMA-060 remained in the open hard gates.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md \
            docs/IMPLEMENTATION_STATUS.md
          git commit -m 'RMA-060: close validated baseline dynamics [skip ci]'
          git push origin HEAD:master

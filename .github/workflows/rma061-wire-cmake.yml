name: Wire RMA-061 Native Target

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma061-wire-cmake.yml'

permissions:
  contents: write

jobs:
  wire-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire target, validate, and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/reachy_sim/CMakeLists.txt")
          text = path.read_text(encoding="utf-8")
          library_marker = "reachy_configure_sim_library(reachy_sim STATIC)\n"
          library_block = """

          add_library(reachy_servo_model STATIC)
          target_sources(
              reachy_servo_model
              PRIVATE
                  src/reachy_servo_model.cpp
                  src/reachy_servo_parameters.generated.hpp
              PUBLIC
                  FILE_SET public_headers
                  TYPE HEADERS
                  BASE_DIRS include
                  FILES
                      include/reachy_servo_model.hpp
          )
          target_include_directories(
              reachy_servo_model
              PRIVATE
                  src
          )
          target_compile_features(reachy_servo_model PUBLIC cxx_std_17)
          set_target_properties(reachy_servo_model PROPERTIES CXX_EXTENSIONS OFF)
          reachy_enable_strict_warnings(reachy_servo_model)
          reachy_enable_sanitizers(reachy_servo_model)
          """.replace("          ", "")
          if text.count(library_marker) != 1:
              raise SystemExit("servo library insertion marker was not found exactly once")
          text = text.replace(library_marker, library_marker + library_block, 1)

          testing_marker = "if(BUILD_TESTING)\n"
          test_block = """    add_executable(
                  reachy_servo_model_test
                  tests/reachy_servo_model_test.cpp
              )
              target_link_libraries(
                  reachy_servo_model_test
                  PRIVATE
                      reachy_servo_model
              )
              target_compile_features(
                  reachy_servo_model_test
                  PRIVATE
                      cxx_std_17
              )
              set_target_properties(
                  reachy_servo_model_test
                  PROPERTIES
                      CXX_EXTENSIONS OFF
              )
              reachy_enable_strict_warnings(reachy_servo_model_test)
              reachy_enable_sanitizers(reachy_servo_model_test)
              add_test(
                  NAME reachy_servo_model_test
                  COMMAND reachy_servo_model_test
              )

          """.replace("          ", "")
          if text.count(testing_marker) != 1:
              raise SystemExit("servo test insertion marker was not found exactly once")
          text = text.replace(testing_marker, testing_marker + test_block, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          python3 scripts/generate_reachy_servo_parameters.py --check
          python3 -m unittest discover \
            -s scripts/tests \
            -p 'test_*servo*.py' \
            -v
          cmake \
            -S . \
            -B build/rma061 \
            -DBUILD_TESTING=ON \
            -DREACHY_ENABLE_SANITIZERS=ON \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/rma061 --target reachy_servo_model_test --parallel 2
          ctest \
            --test-dir build/rma061 \
            --output-on-failure \
            -R '^reachy_servo_model_test$'
          git diff --check

          git rm .github/workflows/rma061-wire-cmake.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/reachy_sim/CMakeLists.txt
          git commit -m 'RMA-061: integrate native servo contract [skip ci]'
          git push origin HEAD:master

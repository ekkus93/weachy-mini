# retry: checksum-verified chunked payload transport
name: Integrate RMA-063 Mechanical Effects

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma063-integrate.yml'

permissions:
  contents: write
  statuses: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publish pending integration status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-063 Integration',
              description: 'Payload extraction, strict build, and mechanical behavior tests are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Check out exact integration head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract, validate, and commit RMA-063
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f .github/rma063-payload.part00
          cat .github/rma063-payload.part* | base64 --decode > /tmp/rma063-payload.tar.gz
          printf '%s  %s\n' \
            '5a6915e1bf2522e49538bdf009334964a615a8d9aeddd939cd482ca19d3ff9eb' \
            '/tmp/rma063-payload.tar.gz' > /tmp/rma063-payload.sha256
          sha256sum --check /tmp/rma063-payload.sha256
          tar -tzf /tmp/rma063-payload.tar.gz > /tmp/rma063-members.txt
          if grep -E '(^|/)\.\.(/|$)|^/' /tmp/rma063-members.txt; then
            printf '%s\n' 'RMA-063 payload contains an unsafe path.' >&2
            exit 1
          fi
          test "$(wc -l < /tmp/rma063-members.txt)" -eq 9
          tar -xzf /tmp/rma063-payload.tar.gz -C .

          cmake_file='native/reachy_sim/CMakeLists.txt'
          include_line='include("${CMAKE_CURRENT_LIST_DIR}/mechanical_servo_model.cmake")'
          if grep -Fqx "$include_line" "$cmake_file"; then
            printf '%s\n' 'RMA-063 CMake include unexpectedly already exists.' >&2
            exit 1
          fi
          printf '\n%s\n' "$include_line" >> "$cmake_file"

          python3 scripts/generate_reachy_mechanical_baseline.py --check
          python3 -m unittest discover \
            -s scripts/tests \
            -p 'test_*mechanical*.py' \
            -v

          if grep -En 'UnityEngine|MonoBehaviour|GameObject|Transform|Unity::' \
            native/reachy_sim/include/reachy_mechanical_servo_model.hpp \
            native/reachy_sim/src/reachy_mechanical_servo_model.cpp; then
            printf '%s\n' 'Native mechanical servo model contains a Unity dependency.' >&2
            exit 1
          fi
          if grep -En 'MechanicalEvidenceClass::Calibrated|"calibrated"' \
            native/reachy_sim/src/reachy_mechanical_baseline.generated.hpp \
            models/reachy-mini/mechanical-effects-baseline.json; then
            printf '%s\n' 'RMA-063 baseline contains a calibrated claim.' >&2
            exit 1
          fi

          cmake \
            -S . \
            -B build/rma063-integration \
            -DBUILD_TESTING=ON \
            -DREACHY_ENABLE_SANITIZERS=ON \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/rma063-integration \
            --target reachy_mechanical_servo_model_test \
            --parallel 2
          ctest \
            --test-dir build/rma063-integration \
            --output-on-failure \
            -R '^reachy_mechanical_servo_model_test$'

          git rm \
            .github/rma063-payload.part* \
            .github/workflows/rma063-integrate.yml
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/architecture/MECHANICAL_EFFECTS_BASELINE.md \
            models/reachy-mini/mechanical-effects-baseline.json \
            native/reachy_sim/CMakeLists.txt \
            native/reachy_sim/mechanical_servo_model.cmake \
            native/reachy_sim/include/reachy_mechanical_servo_model.hpp \
            native/reachy_sim/src/reachy_mechanical_baseline.generated.hpp \
            native/reachy_sim/src/reachy_mechanical_servo_model.cpp \
            native/reachy_sim/tests/reachy_mechanical_servo_model_test.cpp \
            scripts/generate_reachy_mechanical_baseline.py \
            scripts/tests/test_generate_reachy_mechanical_baseline.py
          git commit -m 'RMA-063: integrate mechanical effects baseline [skip ci]'
          git push origin HEAD:master

      - name: Publish final integration status
        if: always()
        uses: actions/github-script@v7
        env:
          INTEGRATION_RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.INTEGRATION_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-063 Integration',
              description: passed
                ? 'Payload, strict build, reversal, disablement, and identification tests passed'
                : 'RMA-063 integration failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

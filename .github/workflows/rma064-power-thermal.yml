name: RMA-064 Power Thermal Baseline

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma064-power-thermal.yml'
      - 'models/reachy-mini/power-thermal-baseline.json'
      - 'models/reachy-mini/electrical-controller-baseline.json'
      - 'native/reachy_sim/CMakeLists.txt'
      - 'native/reachy_sim/power_thermal_model.cmake'
      - 'native/reachy_sim/include/reachy_power_thermal_model.hpp'
      - 'native/reachy_sim/src/reachy_power_thermal_model.cpp'
      - 'native/reachy_sim/src/reachy_power_thermal_baseline.generated.hpp'
      - 'native/reachy_sim/tests/reachy_power_thermal_model_test.cpp'
      - 'scripts/generate_reachy_power_thermal_baseline.py'
      - 'scripts/tests/test_generate_reachy_power_thermal_baseline.py'
      - 'docs/architecture/POWER_THERMAL_BASELINE.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rma064-power-thermal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate shared power and thermal baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Publish pending commit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-064 Power Thermal Baseline',
              description: 'Shared source, thermal contract, strict build, and behavior tests are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify generated baseline and failure paths
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_reachy_power_thermal_baseline.py --check
          python3 -m unittest discover \
            -s scripts/tests \
            -p 'test_*power_thermal*.py' \
            -v

      - name: Reject Unity ownership and calibrated claims
        shell: bash
        run: |
          set -euo pipefail
          if grep -En 'UnityEngine|MonoBehaviour|GameObject|Transform|Unity::' \
            native/reachy_sim/include/reachy_power_thermal_model.hpp \
            native/reachy_sim/src/reachy_power_thermal_model.cpp; then
            printf '%s\n' 'Native power/thermal model contains a Unity dependency.' >&2
            exit 1
          fi
          if grep -En 'PowerThermalEvidenceClass::Calibrated|"calibrated"' \
            native/reachy_sim/src/reachy_power_thermal_baseline.generated.hpp \
            models/reachy-mini/power-thermal-baseline.json; then
            printf '%s\n' 'RMA-064 baseline contains a calibrated claim.' >&2
            exit 1
          fi

      - name: Configure strict native build
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build/rma064 \
            -DBUILD_TESTING=ON \
            -DREACHY_ENABLE_SANITIZERS=ON \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build and run shared power thermal tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/rma064 --target reachy_power_thermal_model_test --parallel 2
          ctest \
            --test-dir build/rma064 \
            --output-on-failure \
            -R '^reachy_power_thermal_model_test$'

      - name: Publish final commit status
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.VALIDATION_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-064 Power Thermal Baseline',
              description: passed
                ? 'Shared current/sag, thermal derating/latch/clear, strict build and schema tests passed'
                : 'RMA-064 power thermal validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

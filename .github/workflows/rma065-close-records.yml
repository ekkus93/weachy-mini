name: RMA-065 Close Completion Records

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-close-records.yml'

permissions:
  contents: write

jobs:
  close-records:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close tracking sections and remove payload transport
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/close_rma065_records.py
          find .github -maxdepth 1 -type f -name 'rma065-*' -print -delete
          git rm scripts/close_rma065_records.py
          git diff --check
          git status --short

      - name: Commit completion records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RMA-065: close accepted collision baseline records [skip ci]'
          git push origin HEAD:master

name: RMA-065 Collision Audit

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-collision-audit.yml'
      - 'scripts/audit_reachy_collision_model.py'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publish pending audit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Collision Audit',
              description: 'Pinned model collision geometry and neutral contacts are being audited',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check out pinned Reachy model
        uses: actions/checkout@v4
        with:
          repository: pollen-robotics/reachy_mini
          ref: a739a6e461eb6d722901f1cfc225265ffc85c28d
          path: upstream/reachy-mini
          fetch-depth: 1
          lfs: true
          persist-credentials: false
          sparse-checkout: |
            src/reachy_mini/descriptions/reachy_mini/mjcf
            LICENSE
          sparse-checkout-cone-mode: false

      - name: Import and audit compiled collision model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check mujoco==3.9.0
          python3 scripts/import_reachy_assets.py \
            --source upstream/reachy-mini \
            --output-root "${RUNNER_TEMP}/reachy-import"
          output_subdirectory="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('third_party/reachy-mini-source.lock.json').read_text())['output_subdirectory'])
          PY
          )"
          model="${RUNNER_TEMP}/reachy-import/${output_subdirectory}/reachy_mini.xml"
          report="${RUNNER_TEMP}/rma065-audit/collision-audit.json"
          python3 scripts/audit_reachy_collision_model.py \
            --model "${model}" \
            --output "${report}" \
            --expected-sha256 efd7e49d4288e5ef53945771a1f116584aa2c8b89721b725d5d77da9f0fcbf46 \
            --steps 5000 \
            --contract rma065_pinned_collision_audit_v1
          python3 - "${report}" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          neutral = report['neutral_audit']
          if neutral['warning_count'] != 0:
              raise SystemExit(f"neutral audit produced warnings: {neutral}")
          if not neutral['finite_qpos'] or not neutral['finite_qvel']:
              raise SystemExit(f"neutral audit produced non-finite state: {neutral}")
          counts = report['compiled_inventory']['counts']
          expected = {'nbody': 19, 'njnt': 16, 'nu': 9, 'neq': 5, 'nq': 37, 'nv': 30}
          for key, value in expected.items():
              if counts.get(key) != value:
                  raise SystemExit(f"compiled count mismatch for {key}: {counts}")
          PY

      - name: Upload collision audit
        uses: actions/upload-artifact@v4
        with:
          name: rma065-collision-audit-${{ github.sha }}
          path: ${{ runner.temp }}/rma065-audit/collision-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish final audit status
        if: always()
        uses: actions/github-script@v7
        env:
          AUDIT_RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.AUDIT_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Collision Audit',
              description: passed
                ? 'Pinned collision inventory and 5000-step neutral contact audit passed'
                : 'RMA-065 pinned collision audit failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

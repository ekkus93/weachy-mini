name: RMA-065 Collision Audit

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-collision-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publish pending audit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Collision Audit',
              description: 'Pinned model collision geometry and neutral contacts are being audited',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check out pinned Reachy model
        uses: actions/checkout@v4
        with:
          repository: pollen-robotics/reachy_mini
          ref: a739a6e461eb6d722901f1cfc225265ffc85c28d
          path: upstream/reachy-mini
          fetch-depth: 1
          lfs: true
          persist-credentials: false
          sparse-checkout: |
            src/reachy_mini/descriptions/reachy_mini/mjcf
            LICENSE
          sparse-checkout-cone-mode: false

      - name: Import and audit compiled collision model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check mujoco==3.9.0
          python3 scripts/import_reachy_assets.py \
            --source upstream/reachy-mini \
            --output-root "${RUNNER_TEMP}/reachy-import"
          model="${RUNNER_TEMP}/reachy-import/reachy-mini-official/reachy_mini.xml"
          test -f "${model}"
          mkdir -p "${RUNNER_TEMP}/rma065-audit"
          python3 - "${model}" "${RUNNER_TEMP}/rma065-audit/collision-audit.json" <<'PY'
          import hashlib
          import json
          import sys
          from collections import Counter, defaultdict
          from pathlib import Path
          import xml.etree.ElementTree as ET

          import mujoco
          import numpy as np

          model_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          model_sha256 = hashlib.sha256(model_path.read_bytes()).hexdigest()
          expected_sha256 = 'efd7e49d4288e5ef53945771a1f116584aa2c8b89721b725d5d77da9f0fcbf46'
          if model_sha256 != expected_sha256:
              raise SystemExit(
                  f'pinned model hash mismatch: expected {expected_sha256}, found {model_sha256}'
              )

          root = ET.parse(model_path).getroot()
          source_bodies = []
          for body in root.findall('.//body'):
              source_bodies.append({
                  'name': body.get('name'),
                  'direct_geoms': len(body.findall('./geom')),
                  'direct_joints': [j.get('name') for j in body.findall('./joint')],
              })
          source_collision_geoms = []
          for geom in root.findall('.//geom'):
              if geom.get('class') == 'collision' or geom.get('contype') not in (None, '0'):
                  source_collision_geoms.append(dict(sorted(geom.attrib.items())))

          model = mujoco.MjModel.from_xml_path(str(model_path))
          data = mujoco.MjData(model)
          mujoco.mj_forward(model, data)
          collision_by_body = defaultdict(list)
          geom_records = []
          for geom_id in range(model.ngeom):
              name = (
                  mujoco.mj_id2name(model, mujoco.mjtObj.mjOBJ_GEOM, geom_id)
                  or f'geom_{geom_id}'
              )
              body_id = int(model.geom_bodyid[geom_id])
              body_name = (
                  mujoco.mj_id2name(model, mujoco.mjtObj.mjOBJ_BODY, body_id)
                  or f'body_{body_id}'
              )
              record = {
                  'id': geom_id,
                  'name': name,
                  'body': body_name,
                  'type': int(model.geom_type[geom_id]),
                  'contype': int(model.geom_contype[geom_id]),
                  'conaffinity': int(model.geom_conaffinity[geom_id]),
                  'group': int(model.geom_group[geom_id]),
                  'size': [float(value) for value in model.geom_size[geom_id]],
              }
              geom_records.append(record)
              if record['contype'] or record['conaffinity']:
                  collision_by_body[body_name].append(record)

          contacts = Counter()
          max_penetration = 0.0
          max_contacts = 0
          warning_count = 0
          for _ in range(5000):
              mujoco.mj_step(model, data)
              max_contacts = max(max_contacts, int(data.ncon))
              warning_count = max(
                  warning_count,
                  sum(int(item.number) for item in data.warning),
              )
              for index in range(data.ncon):
                  contact = data.contact[index]
                  geom1 = (
                      mujoco.mj_id2name(
                          model, mujoco.mjtObj.mjOBJ_GEOM, int(contact.geom1)
                      )
                      or str(int(contact.geom1))
                  )
                  geom2 = (
                      mujoco.mj_id2name(
                          model, mujoco.mjtObj.mjOBJ_GEOM, int(contact.geom2)
                      )
                      or str(int(contact.geom2))
                  )
                  contacts[tuple(sorted((geom1, geom2)))] += 1
                  max_penetration = max(
                      max_penetration,
                      max(0.0, -float(contact.dist)),
                  )

          audit = {
              'contract': 'rma065_pinned_collision_audit_v1',
              'model_sha256': model_sha256,
              'compiled_counts': {
                  'nbody': model.nbody,
                  'njnt': model.njnt,
                  'ngeom': model.ngeom,
                  'nconmax': model.nconmax,
                  'nq': model.nq,
                  'nv': model.nv,
              },
              'source_body_count': len(source_bodies),
              'source_bodies': source_bodies,
              'source_collision_geom_count': len(source_collision_geoms),
              'source_collision_geoms': source_collision_geoms,
              'compiled_geom_count': len(geom_records),
              'compiled_collision_body_count': len(collision_by_body),
              'compiled_collision_by_body': dict(sorted(collision_by_body.items())),
              'neutral_5000_steps': {
                  'max_contacts': max_contacts,
                  'max_penetration_metres': max_penetration,
                  'warning_count': warning_count,
                  'pairs': [
                      {'pair': list(pair), 'steps': count}
                      for pair, count in contacts.most_common()
                  ],
                  'finite_qpos': bool(np.isfinite(data.qpos).all()),
                  'finite_qvel': bool(np.isfinite(data.qvel).all()),
              },
          }
          output_path.write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY

      - name: Upload collision audit
        uses: actions/upload-artifact@v4
        with:
          name: rma065-collision-audit-${{ github.sha }}
          path: ${{ runner.temp }}/rma065-audit/collision-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish final audit status
        if: always()
        uses: actions/github-script@v7
        env:
          AUDIT_RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.AUDIT_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Collision Audit',
              description: passed
                ? 'Pinned collision inventory and 5000-step neutral contact audit passed'
                : 'RMA-065 pinned collision audit failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

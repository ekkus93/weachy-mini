name: RMA-065 Collision and Hard Stops

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma065-collision-hard-stop.yml'
      - 'CMakeLists.txt'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - 'docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md'
      - 'docs/validation/RMA_065_COLLISION_HARD_STOP_VALIDATION_2026-07-31.md'
      - 'models/reachy-mini/collision-hard-stop-baseline.json'
      - 'native/cmake/**'
      - 'native/reachy_sim/**'
      - 'scripts/audit_reachy_collision_model.py'
      - 'scripts/build_mujoco_android.sh'
      - 'scripts/build_rma065_android.sh'
      - 'scripts/generate_reachy_collision_model.py'
      - 'scripts/import_reachy_assets.py'
      - 'scripts/run_reachy_collision_hard_stop_validation.py'
      - 'scripts/run_rma065_android.sh'
      - 'scripts/run_rma065_hosted_gate.sh'
      - 'scripts/source_checkout.py'
      - 'scripts/verify_rma065_reports.py'
      - 'scripts/verify_source_checkout.py'
      - 'scripts/tests/test_generate_reachy_collision_model.py'
      - 'scripts/tests/test_rma065_report_verifier.py'
      - 'third_party/mujoco-source.lock.json'
      - 'third_party/reachy-mini-source.lock.json'
      - 'toolchain.lock.json'
  workflow_dispatch:
    inputs:
      run_device_benchmark:
        description: Run the required benchmark on the physical Android runner
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  statuses: write

concurrency:
  group: rma065-collision-hard-stop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-desktop:
    name: Validate desktop, native state, and Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Publish pending commit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Collision Hard Stops',
              description: 'Desktop, native state, Android build, and device gates are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run fail-closed hosted gate
        shell: bash
        env:
          RMA065_ARTIFACT_DIR: ${{ runner.temp }}/weachy-rma065-android-arm64
          RMA065_HOSTED_WORK_DIR: ${{ runner.temp }}/rma065-hosted
        run: |
          set -euo pipefail
          bash scripts/run_rma065_hosted_gate.sh

      - name: Upload hosted failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weachy-rma065-hosted-failure-${{ github.sha }}
          path: ${{ runner.temp }}/rma065-hosted/desktop-report
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Android benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: weachy-rma065-android-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/weachy-rma065-android-arm64
          if-no-files-found: error
          retention-days: 30

  device-benchmark:
    name: Benchmark collision model on physical Android
    if: ${{ github.event_name == 'push' || inputs.run_device_benchmark }}
    needs: build-and-desktop
    runs-on:
      - self-hosted
      - linux
      - x64
      - weachy-mini-android-device
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Android benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: weachy-rma065-android-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/weachy-rma065-android-arm64

      - name: Run physical Android collision benchmark
        shell: bash
        env:
          MUJOCO_ANDROID_OUTPUT_DIR: ${{ runner.temp }}/weachy-rma065-android-arm64
          RMA065_ANDROID_REPORT_DIR: ${{ runner.temp }}/rma065-device-report
        run: |
          set -euo pipefail
          bash scripts/run_rma065_android.sh

      - name: Upload physical-device benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weachy-rma065-device-report-${{ github.sha }}
          path: ${{ runner.temp }}/rma065-device-report
          if-no-files-found: error
          retention-days: 30

  publish-result:
    name: Publish RMA-065 commit status
    if: always()
    needs:
      - build-and-desktop
      - device-benchmark
    runs-on: ubuntu-24.04

    steps:
      - name: Publish final commit status
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build-and-desktop.result }}
          DEVICE_RESULT: ${{ needs.device-benchmark.result }}
        with:
          script: |
            const buildResult = process.env.BUILD_RESULT;
            const deviceResult = process.env.DEVICE_RESULT;
            const passed = buildResult === 'success' && deviceResult === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Collision Hard Stops',
              description: passed
                ? 'Desktop, native state, Android build, and physical benchmark passed'
                : `build=${buildResult}, device=${deviceResult}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
name: RMA-065 Export Permanent Patch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-export-permanent-patch.yml'

permissions:
  statuses: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Permanent Patch Export',
              description: 'Generating verified permanent-workflow patch',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v4

      - name: Patch and export exact workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/rma065-collision-hard-stop.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          if validation.get('status') != 'ok':
              raise SystemExit(f'desktop collision validation failed: {validation}')
'''
          new = '''          expected_contract = 'rma065_collision_hard_stop_validation_v1'
          if validation.get('contract') != expected_contract:
              raise SystemExit(
                  'desktop collision validation contract mismatch: '
                  f"{validation.get('contract')!r} != {expected_contract!r}"
              )
          acceptance = validation.get('acceptance')
          expected_acceptance = {
              'representative_internal_contact_stable',
              'representative_external_contact_stable',
              'hard_stops_contain_outward_motion',
              'contact_force_and_impulse_exposed',
              'hosted_complexity_within_budget',
          }
          if not isinstance(acceptance, dict):
              raise SystemExit(
                  f'desktop collision validation has no acceptance map: {validation}'
              )
          missing = sorted(
              key for key in expected_acceptance if acceptance.get(key) is not True
          )
          if missing:
              raise SystemExit(
                  f'desktop collision validation acceptance failed: {missing}'
              )
          for label in ('source_neutral', 'enhanced_neutral'):
              run = validation.get(label)
              if not isinstance(run, dict) or run.get('warning_count') != 0:
                  raise SystemExit(
                      f'desktop collision validation warnings in {label}: {run}'
                  )
          fixtures = (
              'internal_contact_fixture',
              'external_contact_fixture',
          )
          for label in fixtures:
              fixture = validation.get(label)
              if not isinstance(fixture, dict):
                  raise SystemExit(f'missing desktop fixture report: {label}')
              if fixture.get('warning_count') != 0:
                  raise SystemExit(f'desktop fixture warnings in {label}: {fixture}')
              if fixture.get('observed_contact') is not True:
                  raise SystemExit(f'desktop fixture has no contact: {label}')
              if fixture.get('maximum_normal_force_newtons', 0.0) <= 0.0:
                  raise SystemExit(f'desktop fixture has no force: {label}')
              if fixture.get('maximum_impulse_newton_seconds', 0.0) <= 0.0:
                  raise SystemExit(f'desktop fixture has no impulse: {label}')
          hard_stops = validation.get('hard_stop_trials')
          if not isinstance(hard_stops, list) or len(hard_stops) != 2:
              raise SystemExit(
                  f'desktop collision validation hard-stop report is invalid: {hard_stops}'
              )
          for trial in hard_stops:
              if trial.get('observed_limit_constraint') is not True:
                  raise SystemExit(f'hard-stop constraint missing: {trial}')
              if trial.get('warning_count') != 0:
                  raise SystemExit(f'hard-stop warnings detected: {trial}')
'''
          if text.count(old) != 1:
              raise SystemExit(f'permanent verifier marker count={text.count(old)}')
          patched = text.replace(old, new, 1)
          yaml.safe_load(patched)
          path.write_text(patched, encoding='utf-8', newline='\n')
          PY
          printf 'PATCHED_WORKFLOW_SHA256=%s\n' \
            "$(sha256sum .github/workflows/rma065-collision-hard-stop.yml | awk '{print $1}')"
          printf 'PATCHED_WORKFLOW_BASE64_BEGIN\n'
          base64 -w0 .github/workflows/rma065-collision-hard-stop.yml
          printf '\nPATCHED_WORKFLOW_BASE64_END\n'

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Permanent Patch Export',
              description: passed
                ? 'Patched workflow YAML validated and exported'
                : 'Permanent workflow patch export failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

# Registered before this triggering update.
name: RMA-065 Full Payload Export

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-full-payload-export.yml'

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Full Source Export',
              description: 'Exporting verified payload and exact master tree',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified payload and archive source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/rma065-payload.part* | base64 --decode > rma065-payload.tar.gz
          printf '%s  %s\n' \
            '133b4959d137607b1640c24cd12b6ef99b00f8c3e851d2a406d6495364deda0c' \
            rma065-payload.tar.gz | sha256sum --check --strict
          tar --exclude=.git --exclude=rma065-payload.tar.gz \
            -czf "${RUNNER_TEMP}/rma065-master-tree.tar.gz" .
          cp "${RUNNER_TEMP}/rma065-master-tree.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: rma065-full-source
          path: |
            rma065-payload.tar.gz
            rma065-master-tree.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Full Source Export',
              description: passed ? 'Payload and master tree exported' : 'Full source export failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

name: RMA-065 Integration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-integrate.yml'

permissions:
  contents: write
  statuses: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Integration',
              description: 'Collision and hard-stop integration is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/checkout@v4
        with:
          repository: pollen-robotics/reachy_mini
          ref: a739a6e461eb6d722901f1cfc225265ffc85c28d
          path: upstream/reachy-mini
          fetch-depth: 1
          lfs: true
          persist-credentials: false
          sparse-checkout: |
            src/reachy_mini/descriptions/reachy_mini/mjcf
            LICENSE
          sparse-checkout-cone-mode: false

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          original="${RUNNER_TEMP}/rma065-original.tar.gz"
          original_dir="${RUNNER_TEMP}/rma065-original"
          fixed="${RUNNER_TEMP}/rma065-fixed.tar.gz"

          cat .github/rma065-payload.part* | base64 --decode > "${original}"
          printf '%s  %s\n' \
            '133b4959d137607b1640c24cd12b6ef99b00f8c3e851d2a406d6495364deda0c' \
            "${original}" | sha256sum --check --strict
          mkdir -p "${original_dir}"
          tar -xzf "${original}" -C "${original_dir}"

          base64 --decode .github/rma065-fixed-bundle.b64 > "${fixed}"
          printf '%s  %s\n' \
            '7aaaab376547a99a0a82dcc504cf777f54dfde3605da3ada8349009387ebd847' \
            "${fixed}" | sha256sum --check --strict

          rsync -a --exclude scripts/apply_rma065_source_edits.py "${original_dir}/" ./
          cp "${original_dir}/scripts/apply_rma065_source_edits.py" scripts/.rma065-apply.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/.rma065-apply.py')
          text = path.read_text(encoding='utf-8')
          old = '    runner_marker = """if(REACHY_BUILD_MUJOCO_PROBE)\n    add_subdirectory(feasibility)\nendif()\n"""'
          new = '    runner_marker = """add_subdirectory(feasibility)\n"""'
          if text.count(old) != 1:
              raise SystemExit(f'CMake marker count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          python3 scripts/.rma065-apply.py
          rm scripts/.rma065-apply.py
          tar -xzf "${fixed}" -C .

          python3 - <<'PY'
          from pathlib import Path
          path = Path('native/reachy_sim/src/reachy_sim_backend_mujoco/state_payload/dynamics_v2.inc')
          text = path.read_text(encoding='utf-8')
          declaration = 'static double rma065_custom_numeric(\n'
          marker = '\nstatic uint32_t rma065_hard_stop_count('
          if text.count(declaration) != 1 or text.count(marker) != 1:
              raise SystemExit('native diagnostic guard markers changed')
          text = text.replace(declaration, '#ifndef REACHY_FAKE_MUJOCO\n' + declaration, 1)
          text = text.replace(marker, '\n#endif\n' + marker, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          python3 - <<'PY'
          from pathlib import Path
          changes = {
              'scripts/audit_reachy_collision_model.py': (
                  'contact_force = [0.0] * 6',
                  'contact_force = np.zeros(6, dtype=np.float64)',
              ),
              'scripts/run_reachy_collision_hard_stop_validation.py': (
                  'force = [0.0] * 6',
                  'force = np.zeros(6, dtype=np.float64)',
              ),
          }
          for relative, (old, new) in changes.items():
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{relative}: contact buffer marker count={text.count(old)}')
              if 'import numpy as np\n' not in text:
                  marker = 'import argparse\n'
                  if text.count(marker) != 1:
                      raise SystemExit(f'{relative}: import marker count={text.count(marker)}')
                  text = text.replace(marker, marker + 'import numpy as np\n', 1)
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Validate schema, ABI, contacts, and hard stops
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_*collision_model*.py' -v
          python3 -m py_compile \
            scripts/audit_reachy_collision_model.py \
            scripts/generate_reachy_collision_model.py \
            scripts/run_reachy_collision_hard_stop_validation.py
          bash -n scripts/build_rma065_android.sh scripts/run_rma065_android.sh

          cmake -S . -B build/rma065-fake \
            -DBUILD_TESTING=ON \
            -DREACHY_ENABLE_SANITIZERS=ON \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/rma065-fake --target reachy_sim_mujoco_backend_test --parallel 2
          ctest --test-dir build/rma065-fake --output-on-failure \
            -R '^reachy_sim_mujoco_backend_test$'

          python3 -m pip install --disable-pip-version-check mujoco==3.9.0
          import_root="${RUNNER_TEMP}/reachy-import"
          enhanced="${RUNNER_TEMP}/rma065-enhanced"
          reports="${RUNNER_TEMP}/rma065-reports"
          python3 scripts/import_reachy_assets.py \
            --source upstream/reachy-mini \
            --output-root "${import_root}"
          source_dir="${import_root}/$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('third_party/reachy-mini-source.lock.json').read_text())['output_subdirectory'])
          PY
          )"
          mkdir -p "${reports}"
          python3 scripts/generate_reachy_collision_model.py \
            --profile models/reachy-mini/collision-hard-stop-baseline.json \
            --source-model "${source_dir}/reachy_mini.xml" \
            --output-model "${enhanced}/reachy_mini.xml" \
            --metadata "${enhanced}/RMA065_COLLISION_METADATA.json" \
            --copy-package
          python3 scripts/generate_reachy_collision_model.py \
            --profile models/reachy-mini/collision-hard-stop-baseline.json \
            --source-model "${source_dir}/reachy_mini.xml" \
            --output-model "${enhanced}/reachy_mini.xml" \
            --metadata "${enhanced}/RMA065_COLLISION_METADATA.json" \
            --check
          python3 scripts/audit_reachy_collision_model.py \
            --model "${enhanced}/reachy_mini.xml" \
            --output "${reports}/enhanced-audit.json" \
            --steps 5000 \
            --contract rma065_enhanced_collision_audit_v1
          python3 scripts/run_reachy_collision_hard_stop_validation.py \
            --source-model "${source_dir}/reachy_mini.xml" \
            --enhanced-model "${enhanced}/reachy_mini.xml" \
            --profile models/reachy-mini/collision-hard-stop-baseline.json \
            --output "${reports}/collision-hard-stop-validation.json" \
            --neutral-steps 5000

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rma065-integration-evidence
          path: |
            ${{ runner.temp }}/rma065-reports
            ${{ runner.temp }}/rma065-enhanced/RMA065_COLLISION_METADATA.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream build
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git rm .github/rma065-payload.part*
          git rm .github/rma065-fixed-bundle.b64
          git rm .github/rma065-debug-trigger
          git rm .github/rma065-wire-fixed-trigger
          git rm .github/workflows/rma065-debug-source.yml
          git rm .github/workflows/rma065-full-payload-export.yml
          git rm .github/workflows/rma065-integrate.yml
          git rm .github/workflows/rma065-patch-integration.yml
          git rm .github/workflows/rma065-update-fixed-checksum.yml
          git rm .github/workflows/rma065-wire-fixed-bundle.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RMA-065: integrate collision and hard-stop baseline [skip ci]'
          git push origin HEAD:master

      - if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Integration',
              description: passed
                ? 'Schema, ABI, contacts, and hard stops passed'
                : 'RMA-065 integration validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

name: RMA-065 Integration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-integrate.yml'

permissions:
  contents: write
  statuses: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Publish pending integration status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Integration',
              description: 'Verified collision and hard-stop integration is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Check out exact integration head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check out pinned Reachy model
        uses: actions/checkout@v4
        with:
          repository: pollen-robotics/reachy_mini
          ref: a739a6e461eb6d722901f1cfc225265ffc85c28d
          path: upstream/reachy-mini
          fetch-depth: 1
          lfs: true
          persist-credentials: false
          sparse-checkout: |
            src/reachy_mini/descriptions/reachy_mini/mjcf
            LICENSE
          sparse-checkout-cone-mode: false

      - name: Reconstruct and apply verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/rma065-payload.tar.gz"
          payload="${RUNNER_TEMP}/rma065-payload"
          cat .github/rma065-payload.part* | base64 --decode > "${archive}"
          printf '%s  %s\n' \
            '133b4959d137607b1640c24cd12b6ef99b00f8c3e851d2a406d6495364deda0c' \
            "${archive}" | sha256sum --check --strict
          mkdir -p "${payload}"
          tar -xzf "${archive}" -C "${payload}"
          rsync -a \
            --exclude 'scripts/apply_rma065_source_edits.py' \
            "${payload}/" ./
          cp "${payload}/scripts/apply_rma065_source_edits.py" \
            scripts/.rma065-apply-source-edits.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/.rma065-apply-source-edits.py')
          text = path.read_text(encoding='utf-8')
          old = '    runner_marker = """if(REACHY_BUILD_MUJOCO_PROBE)\n    add_subdirectory(feasibility)\nendif()\n"""'
          new = '    runner_marker = """add_subdirectory(feasibility)\n"""'
          if text.count(old) != 1:
              raise SystemExit(f'transport helper CMake marker count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          python3 scripts/.rma065-apply-source-edits.py
          python3 - <<'PYDYNAMICS'
          from pathlib import Path
          path = Path('native/reachy_sim/src/reachy_sim_backend_mujoco/state_payload/dynamics_v2.inc')
          text = path.read_text(encoding='utf-8')
          old = 'static double rma065_custom_numeric(\n'
          if text.count(old) != 1:
              raise SystemExit(f'rma065_custom_numeric declaration count={text.count(old)}')
          text = text.replace(old, '#ifndef REACHY_FAKE_MUJOCO\n' + old, 1)
          marker = '\nstatic uint32_t rma065_hard_stop_count('
          if text.count(marker) != 1:
              raise SystemExit(f'rma065 custom numeric end marker count={text.count(marker)}')
          text = text.replace(marker, '\n#endif\n' + marker, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PYDYNAMICS
          python3 - <<'PYGENERATOR'
          from pathlib import Path
          path = Path('scripts/generate_reachy_collision_model.py')
          text = path.read_text(encoding='utf-8')
          removed = [
              '    root.set("rma065_contract", profile["contract"])\n',
              '    root.set("rma065_calibrated", "false")\n',
          ]
          for line in removed:
              if text.count(line) != 1:
                  raise SystemExit(f'unsupported root attribute line count={text.count(line)}: {line!r}')
              text = text.replace(line, '', 1)
          actuator_marker = '        actuator.set("ctrllimited", "true")\n'
          actuator_replacement = '        actuator.attrib.pop("inheritrange", None)\n' + actuator_marker
          if text.count(actuator_marker) != 1:
              raise SystemExit(f'actuator control marker count={text.count(actuator_marker)}')
          text = text.replace(actuator_marker, actuator_replacement, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PYGENERATOR
          python3 - <<'PYBUFFERS'
          from pathlib import Path

          replacements_by_file = {
              'scripts/audit_reachy_collision_model.py': (
                  'contact_force = [0.0] * 6',
                  'contact_force = np.zeros(6, dtype=np.float64)',
              ),
              'scripts/run_reachy_collision_hard_stop_validation.py': (
                  'force = [0.0] * 6',
                  'force = np.zeros(6, dtype=np.float64)',
              ),
          }
          replacements = 0
          for relative, (old, new) in replacements_by_file.items():
              script = Path(relative)
              source = script.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{relative}: contact buffer marker count={count}')
              if 'import numpy as np\n' not in source:
                  import_marker = 'import argparse\n'
                  if source.count(import_marker) != 1:
                      raise SystemExit(f'{relative}: argparse import marker count={source.count(import_marker)}')
                  source = source.replace(
                      import_marker,
                      import_marker + 'import numpy as np\n',
                      1,
                  )
              source = source.replace(old, new, 1)
              replacements += 1
              script.write_text(source, encoding='utf-8', newline='\n')
          if replacements != len(replacements_by_file):
              raise SystemExit(f'contact buffer replacement count={replacements}')
          PYBUFFERS
          python3 - <<'PYTEST'
          from pathlib import Path

          path = Path('scripts/tests/test_generate_reachy_collision_model.py')
          text = path.read_text(encoding='utf-8')
          marker = 'if __name__ == "__main__":\n    unittest.main()\n'
          if text.count(marker) != 1:
              raise SystemExit(f'unit-test main marker count={text.count(marker)}')
          regression = '''class CollisionRuntimeRegressionTests(unittest.TestCase):
              def test_contact_force_uses_writable_numpy_float64_buffers(self):
                  from pathlib import Path

                  for relative in (
                      "scripts/audit_reachy_collision_model.py",
                      "scripts/run_reachy_collision_hard_stop_validation.py",
                  ):
                      source = Path(relative).read_text(encoding="utf-8")
                      if "mj_contactForce" not in source:
                          continue
                      self.assertIn("import numpy as np", source)
                      self.assertIn("np.zeros(6, dtype=np.float64)", source)
                      self.assertNotIn("[0.0] * 6", source)

              def test_explicit_soft_ranges_replace_inherited_ranges(self):
                  from pathlib import Path

                  source = Path("scripts/generate_reachy_collision_model.py").read_text(
                      encoding="utf-8"
                  )
                  self.assertIn(
                      'actuator.attrib.pop("inheritrange", None)',
                      source,
                  )


          '''
          path.write_text(text.replace(marker, regression + marker, 1), encoding='utf-8', newline='\n')
          PYTEST
          rm scripts/.rma065-apply-source-edits.py
          test -f native/reachy_sim/src/reachy_sim_backend_mujoco/state_payload/dynamics_v2.inc
          test -f models/reachy-mini/collision-hard-stop-baseline.json
          git diff --check

      - name: Run schema and fake-backend gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s scripts/tests \
            -p 'test_*collision_model*.py' \
            -v
          python3 -m py_compile \
            scripts/audit_reachy_collision_model.py \
            scripts/generate_reachy_collision_model.py \
            scripts/run_reachy_collision_hard_stop_validation.py
          bash -n scripts/build_rma065_android.sh scripts/run_rma065_android.sh
          cmake \
            -S . \
            -B build/rma065-fake \
            -DBUILD_TESTING=ON \
            -DREACHY_ENABLE_SANITIZERS=ON \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/rma065-fake \
            --target reachy_sim_mujoco_backend_test \
            --parallel 2
          ctest \
            --test-dir build/rma065-fake \
            --output-on-failure \
            -R '^reachy_sim_mujoco_backend_test$'

      - name: Validate generated model and contact behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check mujoco==3.9.0
          import_root="${RUNNER_TEMP}/reachy-import"
          enhanced="${RUNNER_TEMP}/rma065-enhanced"
          reports="${RUNNER_TEMP}/rma065-reports"
          python3 scripts/import_reachy_assets.py \
            --source upstream/reachy-mini \
            --output-root "${import_root}"
          source_dir="${import_root}/$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('third_party/reachy-mini-source.lock.json').read_text())['output_subdirectory'])
          PY
          )"
          mkdir -p "${reports}"
          python3 scripts/generate_reachy_collision_model.py \
            --profile models/reachy-mini/collision-hard-stop-baseline.json \
            --source-model "${source_dir}/reachy_mini.xml" \
            --output-model "${enhanced}/reachy_mini.xml" \
            --metadata "${enhanced}/RMA065_COLLISION_METADATA.json" \
            --copy-package
          python3 scripts/generate_reachy_collision_model.py \
            --profile models/reachy-mini/collision-hard-stop-baseline.json \
            --source-model "${source_dir}/reachy_mini.xml" \
            --output-model "${enhanced}/reachy_mini.xml" \
            --metadata "${enhanced}/RMA065_COLLISION_METADATA.json" \
            --check
          python3 scripts/audit_reachy_collision_model.py \
            --model "${enhanced}/reachy_mini.xml" \
            --output "${reports}/enhanced-audit.json" \
            --steps 5000 \
            --contract rma065_enhanced_collision_audit_v1
          python3 scripts/run_reachy_collision_hard_stop_validation.py \
            --source-model "${source_dir}/reachy_mini.xml" \
            --enhanced-model "${enhanced}/reachy_mini.xml" \
            --profile models/reachy-mini/collision-hard-stop-baseline.json \
            --output "${reports}/collision-hard-stop-validation.json" \
            --neutral-steps 5000

      - name: Commit validated implementation and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/rma065-payload.part*
          git rm .github/workflows/rma065-integrate.yml
          if [[ -e .github/workflows/rma065-patch-integration.yml ]]; then
            git rm .github/workflows/rma065-patch-integration.yml
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            CMakeLists.txt \
            docs/architecture/COLLISION_HARD_STOP_BASELINE.md \
            models/reachy-mini/collision-hard-stop-baseline.json \
            native/reachy_sim \
            scripts/build_rma065_android.sh \
            scripts/generate_reachy_collision_model.py \
            scripts/run_reachy_collision_hard_stop_validation.py \
            scripts/run_rma065_android.sh \
            scripts/tests/test_generate_reachy_collision_model.py
          git commit -m 'RMA-065: integrate collision and hard-stop baseline [skip ci]'
          git push origin HEAD:master

      - name: Publish final integration status
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Integration',
              description: passed
                ? 'Schema, fake backend, generated model, contact, and hard-stop gates passed'
                : 'RMA-065 integration validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

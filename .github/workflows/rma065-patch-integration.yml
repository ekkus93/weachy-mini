name: Patch RMA-065 Integration Helper

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-patch-integration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current CMake marker handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rma065-integrate.yml')
          text = path.read_text(encoding='utf-8')
          needle = 'python3 scripts/.rma065-apply-source-edits.py'
          patch = 'python3 -c \'from pathlib import Path; p=Path("scripts/.rma065-apply-source-edits.py"); t=p.read_text(encoding="utf-8"); old="    runner_marker = \\\"\\\"\\\"if(REACHY_BUILD_MUJOCO_PROBE)\\n    add_subdirectory(feasibility)\\nendif()\\n\\\"\\\"\\\""; new="    runner_marker = \\\"\\\"\\\"add_subdirectory(feasibility)\\n\\\"\\\"\\\""; count=t.count(old); count == 1 or (_ for _ in ()).throw(SystemExit(f"transport helper CMake marker count={count}")); p.write_text(t.replace(old,new),encoding="utf-8",newline="\\n")\'\n          python3 scripts/.rma065-apply-source-edits.py'
          if text.count(needle) != 1:
              raise SystemExit(f'integration helper invocation count={text.count(needle)}')
          path.write_text(text.replace(needle, patch), encoding='utf-8', newline='\n')
          PY

          git rm .github/workflows/rma065-patch-integration.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rma065-integrate.yml
          git commit -m 'RMA-065: align integration CMake marker [skip ci]'
          git push origin HEAD:master

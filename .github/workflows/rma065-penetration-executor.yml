name: RMA-065 Penetration Executor

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-penetration-executor.yml'

permissions:
  contents: write
  statuses: write

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Penetration Executor',
              description: 'Derived contact, ABI, and hard-stop gates are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check out pinned Reachy model
        uses: actions/checkout@v4
        with:
          repository: pollen-robotics/reachy_mini
          ref: a739a6e461eb6d722901f1cfc225265ffc85c28d
          path: upstream/reachy-mini
          fetch-depth: 1
          lfs: true
          persist-credentials: false
          sparse-checkout: |
            src/reachy_mini/descriptions/reachy_mini/mjcf
            LICENSE
          sparse-checkout-cone-mode: false

      - name: Extract exact verified stages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          specifications = [
              (
                  '.github/workflows/rma065-clean-integration.yml',
                  'integrate',
                  {
                      'Reconstruct only verified implementation members': 'reconstruct.sh',
                      'Validate schema and native ABI': 'validate-abi.sh',
                      'Validate real MuJoCo contacts and hard stops': 'validate-mujoco.sh',
                  },
              ),
              (
                  '.github/workflows/rma065-validation-runner.yml',
                  'validate',
                  {
                      'Make internal mask contact independent of topology exclusions': 'fixture.sh',
                  },
              ),
              (
                  '.github/workflows/rma065-penetration-validation-runner.yml',
                  'validate',
                  {
                      'Derive safe fixture penetration from model contract': 'derive.sh',
                      'Commit validated implementation': 'commit.sh',
                  },
              ),
          ]
          written = []
          for relative, job_name, wanted in specifications:
              workflow = yaml.safe_load(Path(relative).read_text(encoding='utf-8'))
              steps = workflow['jobs'][job_name]['steps']
              found = set()
              for step in steps:
                  name = step.get('name')
                  if name not in wanted:
                      continue
                  run = step.get('run')
                  if not isinstance(run, str) or not run.strip():
                      raise SystemExit(f'{relative}: step has no shell body: {name}')
                  target = Path(os.environ['RUNNER_TEMP']) / wanted[name]
                  if target.exists():
                      raise SystemExit(f'duplicate extracted target: {target}')
                  target.write_text(run, encoding='utf-8', newline='\n')
                  target.chmod(0o755)
                  found.add(name)
                  written.append((name, target))
              missing = sorted(set(wanted) - found)
              if missing:
                  raise SystemExit(f'{relative}: missing steps: {missing}')
          for name, target in sorted(written):
              print(f'extracted {name}: {target}')
          PY

      - name: Reconstruct and apply fixture contract
        shell: bash
        run: |
          set -euo pipefail
          bash "${RUNNER_TEMP}/reconstruct.sh"
          bash "${RUNNER_TEMP}/fixture.sh"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'derive.sh'
          text = path.read_text(encoding='utf-8')
          old = r'''r'\.set\("size",\s*"([0-9.eE+\-]+)"\)' '''.strip()
          new = r'''r'(?:"size"\s*:\s*|\.set\("size",\s*)"([0-9.eE+\-]+)"' '''.strip()
          if text.count(old) != 1:
              raise SystemExit(
                  f'derived-radius regex literal count={text.count(old)}'
              )
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          bash "${RUNNER_TEMP}/derive.sh"
          python3 - <<'PYSTRICT'
          from pathlib import Path

          validator = Path('scripts/run_reachy_collision_hard_stop_validation.py')
          source = validator.read_text(encoding='utf-8')
          old = '    maximum_penetration = parse_vector(penetration_data, 1)[0]\n'
          new = (
              '    penetration_parts = penetration_data.split()\n'
              '    if len(penetration_parts) != 1:\n'
              '        raise CollisionValidationError(\n'
              '            "generated model penetration limit must contain one value"\n'
              '        )\n'
              '    try:\n'
              '        maximum_penetration = float(penetration_parts[0])\n'
              '    except ValueError as exc:\n'
              '        raise CollisionValidationError(\n'
              '            "generated model penetration limit is not numeric"\n'
              '        ) from exc\n'
              '    if not (0.0 < maximum_penetration < float("inf")):\n'
              '        raise CollisionValidationError(\n'
              '            "generated model penetration limit must be finite and positive"\n'
              '        )\n'
          )
          if source.count(old) != 1:
              raise SystemExit(
                  f'penetration parse helper marker count={source.count(old)}'
              )
          validator.write_text(source.replace(old, new, 1), encoding='utf-8', newline='\n')

          tests = Path('scripts/tests/test_generate_reachy_collision_model.py')
          test_source = tests.read_text(encoding='utf-8')
          class_name = 'class CollisionPenetrationParsingRegressionTests'
          if class_name in test_source:
              raise SystemExit('penetration parsing regression already exists unexpectedly')
          regression = r'''

          class CollisionPenetrationParsingRegressionTests(unittest.TestCase):
              def test_penetration_limit_is_parsed_locally_and_strictly(self):
                  source = Path(
                      "scripts/run_reachy_collision_hard_stop_validation.py"
                  ).read_text(encoding="utf-8")
                  self.assertIn(
                      "penetration_parts = penetration_data.split()",
                      source,
                  )
                  self.assertIn(
                      '0.0 < maximum_penetration < float("inf")',
                      source,
                  )
                  self.assertNotIn(
                      "parse_vector(penetration_data",
                      source,
                  )
          '''
          tests.write_text(test_source + regression, encoding='utf-8', newline='\n')
          PYSTRICT
          git diff --check
          python3 -m py_compile scripts/run_reachy_collision_hard_stop_validation.py

      - name: Validate schema and native ABI
        shell: bash
        run: bash "${RUNNER_TEMP}/validate-abi.sh"

      - name: Validate real MuJoCo contacts and hard stops
        shell: bash
        run: bash "${RUNNER_TEMP}/validate-mujoco.sh"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rma065-penetration-executor-evidence
          path: |
            ${{ runner.temp }}/rma065-reports
            ${{ runner.temp }}/rma065-enhanced/RMA065_COLLISION_METADATA.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated implementation
        shell: bash
        run: bash "${RUNNER_TEMP}/commit.sh"

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Penetration Executor',
              description: passed
                ? 'Schema, ABI, contacts, hard stops, and source commit passed'
                : 'RMA-065 penetration executor failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

name: RMA-065 Penetration Validation Runner

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-penetration-validation-runner.yml'

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Penetration Runner',
              description: 'Derived-penetration contact and hard-stop gates are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check out pinned Reachy model
        uses: actions/checkout@v4
        with:
          repository: pollen-robotics/reachy_mini
          ref: a739a6e461eb6d722901f1cfc225265ffc85c28d
          path: upstream/reachy-mini
          fetch-depth: 1
          lfs: true
          persist-credentials: false
          sparse-checkout: |
            src/reachy_mini/descriptions/reachy_mini/mjcf
            LICENSE
          sparse-checkout-cone-mode: false

      - name: Extract verified runner stages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/rma065-validation-runner.yml').read_text(
                  encoding='utf-8'
              )
          )
          steps = workflow['jobs']['validate']['steps']
          wanted = {
              'Reconstruct verified implementation': 'reconstruct.sh',
              'Make internal mask contact independent of topology exclusions': 'fixture.sh',
              'Validate schema and native ABI': 'validate-abi.sh',
              'Validate real MuJoCo contacts and hard stops': 'validate-mujoco.sh',
          }
          found = {}
          for step in steps:
              name = step.get('name')
              if name in wanted:
                  run = step.get('run')
                  if not isinstance(run, str) or not run.strip():
                      raise SystemExit(f'workflow step has no shell body: {name}')
                  target = Path(os.environ['RUNNER_TEMP']) / wanted[name]
                  target.write_text(run, encoding='utf-8', newline='\n')
                  target.chmod(0o755)
                  found[name] = str(target)
          missing = sorted(set(wanted) - set(found))
          if missing:
              raise SystemExit(f'validation runner stages missing: {missing}')
          for name, target in sorted(found.items()):
              print(f'extracted {name}: {target}')
          PY
          bash "${RUNNER_TEMP}/reconstruct.sh"
          bash "${RUNNER_TEMP}/fixture.sh"

      - name: Derive safe fixture penetration from model contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          validator = Path('scripts/run_reachy_collision_hard_stop_validation.py')
          text = validator.read_text(encoding='utf-8')

          helper_start = text.find('def add_probe_geom')
          helper_end = text.find('\ndef ', helper_start + 1)
          if helper_start < 0 or helper_end < 0:
              raise SystemExit('add_probe_geom function boundaries missing')
          helper = text[helper_start:helper_end]
          radius_matches = re.findall(
              r'\.set\("size",\s*"([0-9.eE+\-]+)"\)',
              helper,
          )
          if len(radius_matches) != 1:
              print('--- add_probe_geom ---')
              print(helper)
              raise SystemExit(
                  f'probe radius literal count={len(radius_matches)}'
              )
          probe_radius = float(radius_matches[0])
          if not (probe_radius > 0.0):
              raise SystemExit(f'invalid probe radius: {probe_radius}')

          function_start = text.find('def internal_contact_fixture')
          function_end = text.find('\ndef external_contact_fixture', function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit('internal contact fixture function boundaries missing')
          block = text[function_start:function_end]
          old = '    direction = [0.012, 0.0, 0.0]\n'
          if block.count(old) != 1:
              print('--- internal_contact_fixture ---')
              print(block)
              raise SystemExit(
                  f'fixture direction marker count={block.count(old)}'
              )
          derived = (
              '    contract_tree = ET.parse(model_path)\n'
              '    penetration_nodes = [\n'
              '        node\n'
              '        for node in contract_tree.getroot().findall("./custom/numeric")\n'
              '        if "penetration" in (node.get("name") or "").lower()\n'
              '    ]\n'
              '    if len(penetration_nodes) != 1:\n'
              '        raise CollisionValidationError(\n'
              '            "generated model must expose exactly one penetration limit"\n'
              '        )\n'
              '    penetration_data = penetration_nodes[0].get("data")\n'
              '    if penetration_data is None:\n'
              '        raise CollisionValidationError(\n'
              '            "generated model penetration limit has no data"\n'
              '        )\n'
              '    maximum_penetration = parse_vector(penetration_data, 1)[0]\n'
              f'    probe_radius = {probe_radius!r}\n'
              '    target_penetration = maximum_penetration / 16.0\n'
              '    centre_separation = 2.0 * probe_radius - target_penetration\n'
              '    if not (\n'
              '        0.0 < target_penetration < maximum_penetration\n'
              '        and 0.0 < centre_separation < 2.0 * probe_radius\n'
              '    ):\n'
              '        raise CollisionValidationError(\n'
              '            "derived internal fixture penetration is invalid"\n'
              '        )\n'
              '    direction = [centre_separation, 0.0, 0.0]\n'
          )
          block = block.replace(old, derived, 1)
          text = text[:function_start] + block + text[function_end:]
          validator.write_text(text, encoding='utf-8', newline='\n')

          tests = Path('scripts/tests/test_generate_reachy_collision_model.py')
          test_text = tests.read_text(encoding='utf-8')
          class_name = 'class CollisionInternalPenetrationRegressionTests'
          if class_name in test_text:
              raise SystemExit(
                  'internal penetration regression already exists unexpectedly'
              )
          regression = r'''

          class CollisionInternalPenetrationRegressionTests(unittest.TestCase):
              def test_fixture_penetration_is_derived_below_model_limit(self):
                  source = Path(
                      "scripts/run_reachy_collision_hard_stop_validation.py"
                  ).read_text(encoding="utf-8")
                  self.assertIn(
                      "target_penetration = maximum_penetration / 16.0",
                      source,
                  )
                  self.assertIn(
                      "centre_separation = 2.0 * probe_radius - target_penetration",
                      source,
                  )
                  self.assertNotIn("direction = [0.012, 0.0, 0.0]", source)
          '''
          tests.write_text(test_text + regression, encoding='utf-8', newline='\n')
          print(
              'Derived fixture contract: '
              f'probe_radius={probe_radius} m, '
              'target_penetration=maximum_penetration/16'
          )
          PY
          git diff --check
          python3 -m py_compile scripts/run_reachy_collision_hard_stop_validation.py

      - name: Validate schema and native ABI
        shell: bash
        run: bash "${RUNNER_TEMP}/validate-abi.sh"

      - name: Validate real MuJoCo contacts and hard stops
        shell: bash
        run: bash "${RUNNER_TEMP}/validate-mujoco.sh"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rma065-penetration-runner-evidence
          path: |
            ${{ runner.temp }}/rma065-reports
            ${{ runner.temp }}/rma065-enhanced/RMA065_COLLISION_METADATA.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream build
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            CMakeLists.txt \
            docs/architecture/COLLISION_HARD_STOP_BASELINE.md \
            models/reachy-mini/collision-hard-stop-baseline.json \
            native/reachy_sim \
            scripts/audit_reachy_collision_model.py \
            scripts/build_rma065_android.sh \
            scripts/generate_reachy_collision_model.py \
            scripts/run_reachy_collision_hard_stop_validation.py \
            scripts/run_rma065_android.sh \
            scripts/tests/test_generate_reachy_collision_model.py

          mapfile -t staged < <(git diff --cached --name-only)
          if [[ "${#staged[@]}" -eq 0 ]]; then
            echo 'No RMA-065 implementation changes were staged' >&2
            exit 1
          fi
          for path in "${staged[@]}"; do
            case "${path}" in
              CMakeLists.txt|\
              docs/architecture/COLLISION_HARD_STOP_BASELINE.md|\
              models/reachy-mini/collision-hard-stop-baseline.json|\
              native/reachy_sim/*|\
              scripts/audit_reachy_collision_model.py|\
              scripts/build_rma065_android.sh|\
              scripts/generate_reachy_collision_model.py|\
              scripts/run_reachy_collision_hard_stop_validation.py|\
              scripts/run_rma065_android.sh|\
              scripts/tests/test_generate_reachy_collision_model.py)
                ;;
              *)
                echo "Unexpected staged path: ${path}" >&2
                exit 1
                ;;
            esac
          done

          git commit -m 'RMA-065: integrate collision and hard-stop baseline [skip ci]'
          git push origin HEAD:master

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Penetration Runner',
              description: passed
                ? 'Schema, ABI, contacts, hard stops, and source commit passed'
                : 'RMA-065 penetration validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

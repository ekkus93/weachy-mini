name: RMA-065 Recover V4 Payload

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-recover-v4.yml'

permissions:
  statuses: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 V4 Recovery',
              description: 'Locating the damaged v4 payload member',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v4

      - name: Recover and fingerprint every readable member
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/rma065-fixed-v4.tar.gz"
          raw_tar="${RUNNER_TEMP}/rma065-fixed-v4.tar"
          recovered="${RUNNER_TEMP}/rma065-fixed-v4"

          cat .github/rma065-fixed-v4.part* | base64 --decode > "${archive}"
          printf '%s  %s\n' \
            'b11e6c22ae306937e53fb712870f96bf8194edab37001b6f868258b5c172d6fe' \
            "${archive}" | sha256sum --check --strict

          set +e
          gzip -dc "${archive}" > "${raw_tar}"
          gzip_rc=$?
          tar -tf "${raw_tar}" > "${RUNNER_TEMP}/manifest.txt"
          list_rc=$?
          mkdir -p "${recovered}"
          tar -xf "${raw_tar}" -C "${recovered}"
          extract_rc=$?
          set -e

          echo "gzip_rc=${gzip_rc} list_rc=${list_rc} extract_rc=${extract_rc}"
          echo '--- manifest ---'
          cat "${RUNNER_TEMP}/manifest.txt"
          echo '--- recovered files ---'
          find "${recovered}" -type f -printf '%s %p\n' | sort
          echo '--- hashes ---'
          find "${recovered}" -type f -print0 | sort -z | xargs -0 -r sha256sum

          for relative in \
            models/reachy-mini/collision-hard-stop-baseline.json \
            scripts/generate_reachy_collision_model.py \
            scripts/run_reachy_collision_hard_stop_validation.py; do
            path="${recovered}/${relative}"
            echo "--- ${relative} tail ---"
            if [[ -f "${path}" ]]; then
              tail -c 256 "${path}" | od -An -tx1c
            else
              echo MISSING
            fi
          done

          echo '--- syntax results ---'
          set +e
          python3 -m json.tool \
            "${recovered}/models/reachy-mini/collision-hard-stop-baseline.json" >/dev/null
          echo "json_rc=$?"
          python3 -m py_compile \
            "${recovered}/scripts/generate_reachy_collision_model.py"
          echo "generator_rc=$?"
          python3 -m py_compile \
            "${recovered}/scripts/run_reachy_collision_hard_stop_validation.py"
          echo "validation_rc=$?"
          set -e

          # This diagnostic remains fail-closed until every recovered member is pinned.
          exit 1

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'RMA-065 V4 Recovery',
              description: 'Diagnostic completed; recovered files are not yet trusted',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

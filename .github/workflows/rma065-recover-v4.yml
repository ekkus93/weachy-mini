name: RMA-065 Recover V4 Payload

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-recover-v4.yml'

permissions:
  statuses: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 V4 Recovery',
              description: 'Comparing damaged validator with pre-v4 state',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v4

      - name: Compare pre-v4 and recovered v4 validator
        shell: bash
        run: |
          set -euo pipefail
          original="${RUNNER_TEMP}/rma065-original.tar.gz"
          v2="${RUNNER_TEMP}/rma065-fixed-v2.tar.gz"
          v3="${RUNNER_TEMP}/rma065-fixed-v3.tar.gz"
          pre_v4="${RUNNER_TEMP}/rma065-pre-v4"
          v4_archive="${RUNNER_TEMP}/rma065-fixed-v4.tar.gz"
          v4_tar="${RUNNER_TEMP}/rma065-fixed-v4.tar"
          v4_dir="${RUNNER_TEMP}/rma065-fixed-v4"

          cat .github/rma065-payload.part* | base64 --decode > "${original}"
          printf '%s  %s\n' \
            '133b4959d137607b1640c24cd12b6ef99b00f8c3e851d2a406d6495364deda0c' \
            "${original}" | sha256sum --check --strict
          mkdir -p "${pre_v4}"
          tar -xzf "${original}" -C "${pre_v4}"

          cat .github/rma065-fixed-v2.part* | base64 --decode > "${v2}"
          printf '%s  %s\n' \
            '7aaaab376547a99a0a82dcc504cf777f54dfde3605da3ada8349009387ebd847' \
            "${v2}" | sha256sum --check --strict
          tar -xzf "${v2}" -C "${pre_v4}"

          cat .github/rma065-fixed-v3.part* | base64 --decode > "${v3}"
          printf '%s  %s\n' \
            '577e1945859a9f4d0e3b35b8a740a73121b0ec0fb4eb6a3c83ce2e16ea09489d' \
            "${v3}" | sha256sum --check --strict
          tar -xzf "${v3}" -C "${pre_v4}"

          cat .github/rma065-fixed-v4.part* | base64 --decode > "${v4_archive}"
          printf '%s  %s\n' \
            'b11e6c22ae306937e53fb712870f96bf8194edab37001b6f868258b5c172d6fe' \
            "${v4_archive}" | sha256sum --check --strict
          set +e
          gzip -dc "${v4_archive}" > "${v4_tar}"
          gzip_rc=$?
          mkdir -p "${v4_dir}"
          tar -xf "${v4_tar}" -C "${v4_dir}"
          extract_rc=$?
          set -e
          echo "gzip_rc=${gzip_rc} extract_rc=${extract_rc}"

          PRE="${pre_v4}/scripts/run_reachy_collision_hard_stop_validation.py" \
          V4="${v4_dir}/scripts/run_reachy_collision_hard_stop_validation.py" \
          python3 - <<'PY'
          import difflib
          import os
          from pathlib import Path

          pre = Path(os.environ['PRE']).read_bytes()
          v4 = Path(os.environ['V4']).read_bytes()
          print(f'pre_v4_size={len(pre)} recovered_v4_size={len(v4)}')
          first_mismatch = next((i for i, (a, b) in enumerate(zip(pre, v4)) if a != b), None)
          print(f'first_mismatch={first_mismatch}')
          nulls = [i for i, byte in enumerate(v4) if byte == 0]
          print(f'null_count={len(nulls)} first_null={nulls[0] if nulls else None} last_null={nulls[-1] if nulls else None}')

          pre_text = pre.decode('utf-8')
          v4_text = v4.replace(b'\x00', b'<NUL>').decode('utf-8', errors='replace')
          diff = list(difflib.unified_diff(
              pre_text.splitlines(),
              v4_text.splitlines(),
              fromfile='pre-v4-validator.py',
              tofile='recovered-v4-validator.py',
              n=5,
              lineterm='',
          ))
          print(f'diff_lines={len(diff)}')
          for line in diff[:1200]:
              print(line)
          if len(diff) > 1200:
              print(f'... truncated {len(diff) - 1200} diff lines ...')
          PY

          exit 1

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'RMA-065 V4 Recovery',
              description: 'Pre-v4 comparison captured; damaged code remains blocked',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

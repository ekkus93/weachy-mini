name: RMA-065 Update Fixed Checksum

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-update-fixed-checksum.yml'

permissions:
  contents: write
  statuses: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Update Fixed Checksum',
              description: 'Updating verified fixed-bundle checksum',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update integration checksum and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rma065-integrate.yml')
          text = path.read_text(encoding='utf-8')
          old = 'ddb5d1bd9f9344578fad124f35f3e6dc3c40f008c585d28ab8a9bd3b392e25b7'
          new = '7aaaab376547a99a0a82dcc504cf777f54dfde3605da3ada8349009387ebd847'
          if text.count(old) != 1:
              raise SystemExit(f'old checksum count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/rma065-update-fixed-checksum.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rma065-integrate.yml
          git commit -m 'RMA-065: validate pinned MJCF segment hierarchy'
          git push origin HEAD:master
      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Update Fixed Checksum',
              description: passed ? 'Fixed-bundle checksum updated' : 'Checksum update failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

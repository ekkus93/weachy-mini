name: RMA-065 Use Clean V4 Members

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-use-clean-v4-members.yml'

permissions:
  contents: write
  statuses: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Clean V4 Patch',
              description: 'Replacing corrupt archive use with pinned clean members',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch integration reconstruction fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rma065-integrate.yml')
          text = path.read_text(encoding='utf-8')

          variable = '          fixed_v4="${RUNNER_TEMP}/rma065-fixed-v4.tar.gz"\n'
          variable_replacement = variable + (
              '          fixed_v4_tar="${RUNNER_TEMP}/rma065-fixed-v4.tar"\n'
              '          fixed_v4_dir="${RUNNER_TEMP}/rma065-fixed-v4"\n'
          )
          if text.count(variable) != 1:
              raise SystemExit(f'fixed_v4 variable marker count={text.count(variable)}')
          text = text.replace(variable, variable_replacement, 1)

          start_marker = (
              "          printf '%s  %s\\n' \\\n"
              "            '1ea5069e0897e9d2ccc504b2bd709a128a0dc98de0b0e5321c828c711597f98f' \\\n"
          )
          end_marker = '            "${fixed_v4}" | sha256sum --check --strict\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('v4 verification start marker missing')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('v4 verification end marker missing')
          end += len(end_marker)
          recovery = '''          cat .github/rma065-fixed-v4.part* | base64 --decode > "${fixed_v4}"
          printf '%s  %s\n' \
            'b11e6c22ae306937e53fb712870f96bf8194edab37001b6f868258b5c172d6fe' \
            "${fixed_v4}" | sha256sum --check --strict

          set +e
          gzip -dc "${fixed_v4}" > "${fixed_v4_tar}"
          gzip_rc=$?
          tar -tf "${fixed_v4_tar}" > "${RUNNER_TEMP}/rma065-v4-manifest.txt"
          list_rc=$?
          mkdir -p "${fixed_v4_dir}"
          tar -xf "${fixed_v4_tar}" -C "${fixed_v4_dir}"
          extract_rc=$?
          set -e
          if [[ "${gzip_rc}" -ne 1 || "${list_rc}" -ne 2 || "${extract_rc}" -ne 2 ]]; then
            echo "Unexpected damaged-v4 recovery status: gzip=${gzip_rc} list=${list_rc} extract=${extract_rc}" >&2
            exit 1
          fi
          mapfile -t v4_manifest < "${RUNNER_TEMP}/rma065-v4-manifest.txt"
          v4_expected=(
            'models/reachy-mini/collision-hard-stop-baseline.json'
            'scripts/generate_reachy_collision_model.py'
            'scripts/run_reachy_collision_hard_stop_validation.py'
          )
          if [[ "${#v4_manifest[@]}" -ne "${#v4_expected[@]}" ]]; then
            printf 'Unexpected v4 manifest:\n%s\n' "${v4_manifest[*]}" >&2
            exit 1
          fi
          for i in "${!v4_expected[@]}"; do
            [[ "${v4_manifest[$i]}" == "${v4_expected[$i]}" ]] || {
              echo "V4 manifest mismatch at ${i}: ${v4_manifest[$i]}" >&2
              exit 1
            }
          done
          printf '%s  %s\n' \
            'c91f882d6fb29223550539eef3e6447f9d33bda1ca837643bdae24fc3c0527a4' \
            "${fixed_v4_dir}/models/reachy-mini/collision-hard-stop-baseline.json" \
            '213acae65012f185b526256a6a86b9d5da3687225a53791e0875b3987633e280' \
            "${fixed_v4_dir}/scripts/generate_reachy_collision_model.py" | \
            sha256sum --check --strict
          python3 -m json.tool \
            "${fixed_v4_dir}/models/reachy-mini/collision-hard-stop-baseline.json" >/dev/null
          python3 -m py_compile \
            "${fixed_v4_dir}/scripts/generate_reachy_collision_model.py"
          if python3 -m py_compile \
            "${fixed_v4_dir}/scripts/run_reachy_collision_hard_stop_validation.py"; then
            echo 'Damaged validator unexpectedly compiled; recovery assumptions changed' >&2
            exit 1
          fi
'''
          text = text[:start] + recovery + text[end:]

          extraction = '          tar -xzf "${fixed_v4}" -C .\n'
          clean_install = '''          install -D -m 0644 \
            "${fixed_v4_dir}/models/reachy-mini/collision-hard-stop-baseline.json" \
            models/reachy-mini/collision-hard-stop-baseline.json
          install -D -m 0755 \
            "${fixed_v4_dir}/scripts/generate_reachy_collision_model.py" \
            scripts/generate_reachy_collision_model.py
'''
          if text.count(extraction) != 1:
              raise SystemExit(f'v4 extraction marker count={text.count(extraction)}')
          text = text.replace(extraction, clean_install, 1)

          audit_marker = '''            --check
          python3 scripts/audit_reachy_collision_model.py \
'''
          exclusion_gate = '''            --check
          PROFILE=models/reachy-mini/collision-hard-stop-baseline.json \
          MODEL="${enhanced}/reachy_mini.xml" \
          python3 - <<'PYEXCLUDES'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          profile = json.loads(Path(os.environ['PROFILE']).read_text(encoding='utf-8'))
          exclusions = profile.get('collision_excludes')
          if not isinstance(exclusions, list) or not exclusions:
              raise SystemExit('collision_excludes must be a non-empty list')
          expected = []
          for index, entry in enumerate(exclusions):
              if not isinstance(entry, dict):
                  raise SystemExit(f'collision_excludes[{index}] is not an object')
              body1 = entry.get('body1')
              body2 = entry.get('body2')
              if not isinstance(body1, str) or not body1 or not isinstance(body2, str) or not body2:
                  raise SystemExit(f'collision_excludes[{index}] has invalid bodies')
              if body1 == body2:
                  raise SystemExit(f'collision_excludes[{index}] is a self pair')
              expected.append(frozenset((body1, body2)))
          if len(set(expected)) != len(expected):
              raise SystemExit('collision_excludes contains duplicate unordered pairs')

          root = ET.parse(os.environ['MODEL']).getroot()
          body_names = {body.get('name') for body in root.findall('.//body') if body.get('name')}
          missing = sorted({body for pair in expected for body in pair if body not in body_names})
          if missing:
              raise SystemExit(f'collision excludes reference missing bodies: {missing}')
          contact = root.find('contact')
          actual = [] if contact is None else [
              frozenset((item.get('body1'), item.get('body2')))
              for item in contact.findall('exclude')
          ]
          if len(actual) != len(expected) or set(actual) != set(expected):
              raise SystemExit(
                  f'generated collision excludes mismatch: expected={len(expected)} actual={len(actual)}'
              )
          print(f'RMA-065 topology exclusions verified: {len(actual)}')
          PYEXCLUDES
          python3 scripts/audit_reachy_collision_model.py \
'''
          if text.count(audit_marker) != 1:
              raise SystemExit(f'audit insertion marker count={text.count(audit_marker)}')
          text = text.replace(audit_marker, exclusion_gate, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          rm .github/workflows/rma065-recover-v4.yml
          rm .github/workflows/rma065-use-clean-v4-members.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RMA-065: recover clean v4 members and reject corrupt validator'
          git push origin HEAD:master

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Clean V4 Patch',
              description: passed
                ? 'Clean members pinned; full integration triggered'
                : 'Clean-member integration patch failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

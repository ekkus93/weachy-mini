# Trigger after registration.
name: RMA-065 V4 Hash Probe

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-v4-hash-probe.yml'
      - '.github/rma065-fixed-v4.part*'

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 V4 Hash Probe',
              description: 'Measuring committed v4 transport bytes',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/checkout@v4
      - name: Report hashes
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/rma065-fixed-v4.part*
          sha256sum .github/rma065-fixed-v4.part*
          cat .github/rma065-fixed-v4.part* | base64 --decode > /tmp/rma065-fixed-v4.tar.gz
          wc -c /tmp/rma065-fixed-v4.tar.gz
          sha256sum /tmp/rma065-fixed-v4.tar.gz
          tar -tzf /tmp/rma065-fixed-v4.tar.gz
      - if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 V4 Hash Probe',
              description: passed ? 'Committed v4 bytes measured' : 'V4 transport is not decodable',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

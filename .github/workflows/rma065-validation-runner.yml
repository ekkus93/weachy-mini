name: RMA-065 Validation Runner

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma065-validation-runner.yml'

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Validation Runner',
              description: 'Reconstruction, ABI, contact, and hard-stop gates are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check out pinned Reachy model
        uses: actions/checkout@v4
        with:
          repository: pollen-robotics/reachy_mini
          ref: a739a6e461eb6d722901f1cfc225265ffc85c28d
          path: upstream/reachy-mini
          fetch-depth: 1
          lfs: true
          persist-credentials: false
          sparse-checkout: |
            src/reachy_mini/descriptions/reachy_mini/mjcf
            LICENSE
          sparse-checkout-cone-mode: false

      - name: Reconstruct verified implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/rma065-clean-integration.yml').read_text(
                  encoding='utf-8'
              )
          )
          steps = workflow['jobs']['integrate']['steps']
          wanted = {
              'Reconstruct only verified implementation members': 'reconstruct.sh',
              'Validate schema and native ABI': 'validate-abi.sh',
              'Validate real MuJoCo contacts and hard stops': 'validate-mujoco.sh',
          }
          found = {}
          for step in steps:
              name = step.get('name')
              if name in wanted:
                  run = step.get('run')
                  if not isinstance(run, str) or not run.strip():
                      raise SystemExit(f'workflow step has no shell body: {name}')
                  target = Path(os.environ['RUNNER_TEMP']) / wanted[name]
                  target.write_text(run, encoding='utf-8', newline='\n')
                  target.chmod(0o755)
                  found[name] = str(target)
          missing = sorted(set(wanted) - set(found))
          if missing:
              raise SystemExit(f'clean integration workflow steps missing: {missing}')
          for name, target in sorted(found.items()):
              print(f'extracted {name}: {target}')
          PY
          bash "${RUNNER_TEMP}/reconstruct.sh"

      - name: Make internal probe contact deterministic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          validator = Path('scripts/run_reachy_collision_hard_stop_validation.py')
          text = validator.read_text(encoding='utf-8')
          function_start = text.find("def internal_contact_fixture")
          function_end = text.find("\ndef external_contact_fixture", function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit("internal contact fixture function boundaries missing")
          block = text[function_start:function_end]
          old = (
              '    direction = [0.012, 0.0, 0.0]\n'
              '    arm_point = [arm_origin[index] - 0.5 * direction[index] for index in range(3)]\n'
              '    shell_point = [arm_origin[index] + 0.5 * direction[index] for index in range(3)]\n'
              '    arm_local = local_from_world(data, arm_id, arm_point)\n'
              '    shell_local = local_from_world(data, shell_id, shell_point)\n'
          )
          new = (
              '    contact_point = arm_origin\n'
              '    arm_local = local_from_world(data, arm_id, contact_point)\n'
              '    shell_local = local_from_world(data, shell_id, contact_point)\n'
          )
          if block.count(old) != 1:
              print("--- internal contact fixture block ---")
              print(block)
              raise SystemExit(
                  f'internal fixture separation block count={block.count(old)}'
              )
          block = block.replace(old, new, 1)
          text = text[:function_start] + block + text[function_end:]
          validator.write_text(text, encoding='utf-8', newline='\n')

          tests = Path('scripts/tests/test_generate_reachy_collision_model.py')
          test_text = tests.read_text(encoding='utf-8')
          class_name = 'class CollisionInternalFixtureRegressionTests'
          if class_name in test_text:
              raise SystemExit('internal fixture regression already exists unexpectedly')
          regression = r'''

          class CollisionInternalFixtureRegressionTests(unittest.TestCase):
              def test_internal_fixture_uses_same_world_contact_point(self):
                  source = Path(
                      "scripts/run_reachy_collision_hard_stop_validation.py"
                  ).read_text(encoding="utf-8")
                  self.assertIn("contact_point = arm_origin", source)
                  self.assertIn(
                      "arm_local = local_from_world(data, arm_id, contact_point)",
                      source,
                  )
                  self.assertIn(
                      "shell_local = local_from_world(data, shell_id, contact_point)",
                      source,
                  )
                  self.assertNotIn("direction = [0.012, 0.0, 0.0]", source)
          '''
          tests.write_text(test_text + regression, encoding='utf-8', newline='\n')
          PY
          git diff --check
          python3 -m py_compile scripts/run_reachy_collision_hard_stop_validation.py

      - name: Validate schema and native ABI
        shell: bash
        run: bash "${RUNNER_TEMP}/validate-abi.sh"

      - name: Validate real MuJoCo contacts and hard stops
        shell: bash
        run: bash "${RUNNER_TEMP}/validate-mujoco.sh"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rma065-validation-runner-evidence
          path: |
            ${{ runner.temp }}/rma065-reports
            ${{ runner.temp }}/rma065-enhanced/RMA065_COLLISION_METADATA.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream build
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            CMakeLists.txt \
            docs/architecture/COLLISION_HARD_STOP_BASELINE.md \
            models/reachy-mini/collision-hard-stop-baseline.json \
            native/reachy_sim \
            scripts/audit_reachy_collision_model.py \
            scripts/build_rma065_android.sh \
            scripts/generate_reachy_collision_model.py \
            scripts/run_reachy_collision_hard_stop_validation.py \
            scripts/run_rma065_android.sh \
            scripts/tests/test_generate_reachy_collision_model.py

          mapfile -t staged < <(git diff --cached --name-only)
          if [[ "${#staged[@]}" -eq 0 ]]; then
            echo 'No RMA-065 implementation changes were staged' >&2
            exit 1
          fi
          for path in "${staged[@]}"; do
            case "${path}" in
              CMakeLists.txt|\
              docs/architecture/COLLISION_HARD_STOP_BASELINE.md|\
              models/reachy-mini/collision-hard-stop-baseline.json|\
              native/reachy_sim/*|\
              scripts/audit_reachy_collision_model.py|\
              scripts/build_rma065_android.sh|\
              scripts/generate_reachy_collision_model.py|\
              scripts/run_reachy_collision_hard_stop_validation.py|\
              scripts/run_rma065_android.sh|\
              scripts/tests/test_generate_reachy_collision_model.py)
                ;;
              *)
                echo "Unexpected staged path: ${path}" >&2
                exit 1
                ;;
            esac
          done

          git commit -m 'RMA-065: integrate collision and hard-stop baseline [skip ci]'
          git push origin HEAD:master

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Validation Runner',
              description: passed
                ? 'Schema, ABI, contacts, hard stops, and source commit passed'
                : 'RMA-065 validation runner failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

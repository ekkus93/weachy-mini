name: RMA-065 Wire Fixed Bundle

on:
  push:
    branches: [master]
    paths:
      - '.github/rma065-wire-fixed-trigger'

permissions:
  contents: write
  statuses: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'RMA-065 Wire Fixed Bundle',
              description: 'Wiring deterministic kinematic segment fix',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch integration workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rma065-integrate.yml')
          text = path.read_text(encoding='utf-8')
          start = "          python3 - <<'PYGENERATOR'\n"
          end = "          PYGENERATOR\n"
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit(
                  f'generator patch block markers start={text.count(start)} end={text.count(end)}'
              )
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          replacement = '''          fixed_archive="${RUNNER_TEMP}/rma065-fixed-bundle.tar.gz"
          base64 --decode .github/rma065-fixed-bundle.b64 > "${fixed_archive}"
          printf '%s  %s\\n' \\
            'ddb5d1bd9f9344578fad124f35f3e6dc3c40f008c585d28ab8a9bd3b392e25b7' \\
            "${fixed_archive}" | sha256sum --check --strict
          tar -xzf "${fixed_archive}" -C .
'''
          text = before + replacement + after
          cleanup = "          git rm .github/rma065-payload.part*\n"
          cleanup_replacement = '''          git rm .github/rma065-payload.part*
          git rm .github/rma065-fixed-bundle.b64
          git rm .github/rma065-debug-trigger
          git rm .github/workflows/rma065-debug-source.yml
'''
          if text.count(cleanup) != 1:
              raise SystemExit(f'cleanup marker count={text.count(cleanup)}')
          text = text.replace(cleanup, cleanup_replacement, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git rm .github/rma065-wire-fixed-trigger
          git rm .github/workflows/rma065-wire-fixed-bundle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rma065-integrate.yml
          git commit -m 'RMA-065: wire kinematic segment correction'
          git push origin HEAD:master
      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'RMA-065 Wire Fixed Bundle',
              description: passed ? 'Deterministic fix wired' : 'Wiring failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

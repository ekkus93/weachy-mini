name: RMA-070 and RMA-071 Transport Diagnostic

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma07071-transport-diagnostic.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '{"state":"pending","context":"RMA-070/RMA-071 Transport","description":"Transport checksum diagnostic is running","target_url":"%s/%s/actions/runs/%s"}\n' \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" \
            > "${RUNNER_TEMP}/status.json"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json" >/dev/null
      - uses: actions/checkout@v6
      - name: Print transport hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .github/rma07071-payload.part*
          cat .github/rma07071-payload.part* | base64 --decode > "${RUNNER_TEMP}/payload.tar.gz"
          sha256sum "${RUNNER_TEMP}/payload.tar.gz"
      - name: Publish success status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '{"state":"success","context":"RMA-070/RMA-071 Transport","description":"Transport checksum diagnostic completed","target_url":"%s/%s/actions/runs/%s"}\n' \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" \
            > "${RUNNER_TEMP}/status.json"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json" >/dev/null

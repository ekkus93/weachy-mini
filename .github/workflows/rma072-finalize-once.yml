name: RMA-072 Finalize Evidence Once

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma072-finalize-once.yml'
      - 'scripts/finalize_rma072_evidence_once.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Finalize evidence documents
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize_rma072_evidence_once.py
          git diff --check
      - name: Commit clean final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RMA-072: record accepted experiment runner evidence'
          git push origin HEAD:master

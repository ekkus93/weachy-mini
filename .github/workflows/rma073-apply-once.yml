name: RMA-073 Apply Once

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma073-bootstrap-status.json"
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "RMA-073 Bootstrap",
              "description": "One-shot implementation and validation is running",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma073-bootstrap-status.json" >/dev/null
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply RMA-073 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_rma073_once.py
          python3 scripts/apply_rma073_part2_once.py
          python3 scripts/apply_rma073_part3_once.py
          git diff --check
      - name: Validate implementation before commit
        shell: bash
        run: |
          set -euo pipefail
          openssl version
          python3 -m compileall -q scripts
          python3 -m unittest discover \
            -s scripts/tests \
            -p 'test_calibration_*.py' \
            -v
          rm -rf build/rma073
          mkdir -p build/rma073
          python3 scripts/generate_rma073_synthetic_data.py \
            --output-dir build/rma073 \
            --summary-output build/rma073/generation-summary.json
          python3 scripts/validate_calibration_dataset.py \
            --input build/rma073/training.json \
            --summary-output build/rma073/training-validation.json
          python3 scripts/validate_calibration_dataset.py \
            --input build/rma073/heldout.json \
            --summary-output build/rma073/heldout-validation.json
          python3 scripts/fit_calibration_profile.py \
            --plan build/rma073/fit-plan.json \
            --dataset-root build/rma073 \
            --private-key calibration/fixtures/keys/rma073-test-ed25519-private.pem \
            --public-key calibration/fixtures/keys/rma073-test-ed25519-public.pem \
            --public-key-id rma073-test-key-v1 \
            --created-utc '2026-07-31T21:03:00Z' \
            --output build/rma073/profile.json \
            --verification-output build/rma073/profile-verification.json
          python3 scripts/verify_calibration_profile.py \
            --profile build/rma073/profile.json \
            --public-key calibration/fixtures/keys/rma073-test-ed25519-public.pem \
            --expected-compatibility calibration/fitting/rma073-compatibility.json \
            --summary-output build/rma073/independent-verification.json
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RMA-073: add parameter fitting and held-out validation'
          git push origin HEAD:master
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma073-bootstrap-status.json"
          import json, os
          passed = os.environ['JOB_STATUS'] == 'success'
          print(json.dumps({
              "state": "success" if passed else "failure",
              "context": "RMA-073 Bootstrap",
              "description": "One-shot implementation passed" if passed else "One-shot implementation failed",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma073-bootstrap-status.json" >/dev/null

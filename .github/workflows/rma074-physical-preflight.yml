name: RMA-074 Physical Calibration Preflight

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma074-physical-preflight.yml'
      - 'scripts/probe_reachy_physical_unit.py'
      - 'scripts/tests/test_rma074_physical_preflight.py'
      - 'docs/architecture/PHYSICAL_CALIBRATION_AND_PROFILE_APPROVAL.md'
      - 'docs/validation/RMA_074_PHYSICAL_CALIBRATION_VALIDATION_2026-07-31.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rma074-physical-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate read-only probe contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish contract pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma074-status.json"
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "RMA-074 Physical Calibration",
              "description": "Read-only probe contract validation is running",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma074-status.json" >/dev/null
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile and test preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts/probe_reachy_physical_unit.py
          python3 -m unittest scripts/tests/test_rma074_physical_preflight.py -v

  physical-preflight:
    name: Discover physical Reachy Mini without motion
    needs: contract
    runs-on:
      - self-hosted
      - linux
      - x64
      - weachy-mini-android-device
    timeout-minutes: 10
    steps:
      - name: Publish pending commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma074-status.json"
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "RMA-074 Physical Calibration",
              "description": "Read-only physical Reachy Mini discovery is running",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma074-status.json" >/dev/null

      - uses: actions/checkout@v6

      - name: Run read-only physical-unit probe
        shell: bash
        env:
          REACHY_MINI_HOST: ${{ vars.REACHY_MINI_HOST }}
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/rma074-physical-preflight"
          mkdir -p "${report_dir}"
          args=()
          if [[ -n "${REACHY_MINI_HOST:-}" ]]; then
            args+=(--host "${REACHY_MINI_HOST}")
          fi
          python3 scripts/probe_reachy_physical_unit.py \
            "${args[@]}" \
            --output "${report_dir}/physical-preflight.json" \
            --observation-seconds 2 \
            --sample-hz 10
          sha256sum "${report_dir}/physical-preflight.json" \
            > "${report_dir}/SHA256SUMS"

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rma074-physical-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/rma074-physical-preflight
          if-no-files-found: error
          retention-days: 30

      - name: Publish final commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma074-status.json"
          import json, os
          passed = os.environ["JOB_STATUS"] == "success"
          print(json.dumps({
              "state": "success" if passed else "failure",
              "context": "RMA-074 Physical Calibration",
              "description": "Physical unit is ready for authorized capture" if passed else "No admissible physical unit was discovered",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma074-status.json" >/dev/null

name: RMA-080 Application State Architecture

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma080-application-state.yml'
      - 'Assets/ReachyMini/Runtime/Core/Application/**'
      - 'Assets/ReachyMini/Runtime/Application/**'
      - 'managed/ReachyMini.Application.Tests/**'
      - 'managed/ReachyMini.Core/**'
      - 'docs/architecture/APPLICATION_STATE_ARCHITECTURE.md'
      - 'docs/validation/RMA_080_APPLICATION_STATE_ARCHITECTURE_VALIDATION_2026-07-31.md'
      - 'docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rma080-application-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-contract:
    name: Managed service graph and lifecycle contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma080-status.json"
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "RMA-080 Application State",
              "description": "Managed application contract is running",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma080-status.json" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reject Unity dependencies in shared application core
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings 'UnityEngine' \
              Assets/ReachyMini/Runtime/Core/Application; then
            printf '%s\n' 'Shared application core must not reference UnityEngine.' >&2
            exit 1
          fi
      - name: Compile shared core and run RMA-080 contract tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore \
            managed/ReachyMini.Application.Tests/ReachyMini.Application.Tests.csproj
          dotnet run \
            --project managed/ReachyMini.Application.Tests/ReachyMini.Application.Tests.csproj \
            --configuration Release \
            --no-restore
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma080-status.json"
          import json, os
          passed = os.environ["JOB_STATUS"] == "success"
          print(json.dumps({
              "state": "success" if passed else "failure",
              "context": "RMA-080 Application State",
              "description": "Application state contract passed" if passed else "Application state contract failed",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma080-status.json" >/dev/null

name: RMA-090 Apply Integration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma090-apply-integration.yml'
      - 'scripts/apply_rma090_integration.py'
      - 'scripts/apply_rma090_integration_v2.py'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: rma090-apply-integration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma090-integration-status.json"
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "RMA-090 Integration",
              "description": "Camera integration patch is running",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma090-integration-status.json" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic integration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_rma090_integration_v2.py
          git diff --check
      - name: Commit integrated application boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/ReachyMini/Runtime/Core/Application/ReachyCameraCapabilities.cs \
            Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraDiscovery.cs \
            Assets/ReachyMini/Runtime/Application/ReachyMainScreen.cs \
            Assets/ReachyMini/Runtime/Application/ReachyMainScreenBootstrap.cs \
            Assets/ReachyMini/Runtime/Application/ReachySettingsApplicationCompositionProvider.cs \
            Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/src/main/java/com/ekkus93/weachy/camera/ReachyCameraDiscoveryBridge.java
          if git diff --cached --quiet; then
            printf '%s\n' 'RMA-090 source integration was already applied.'
            exit 0
          fi
          git commit -m 'RMA-090: harden camera capability contracts'
          git push origin HEAD:master
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma090-integration-status.json"
          import json, os
          passed = os.environ['JOB_STATUS'] == 'success'
          print(json.dumps({
              "state": "success" if passed else "failure",
              "context": "RMA-090 Integration",
              "description": "Camera integration patch passed" if passed else "Camera integration patch failed",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma090-integration-status.json" >/dev/null

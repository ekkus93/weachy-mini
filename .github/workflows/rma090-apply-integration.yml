name: RMA-090 Finalize Evidence

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma090-apply-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rma090-finalize-evidence
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record RMA-090 completion and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          todo_path = Path('docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md')
          todo = todo_path.read_text(encoding='utf-8')
          old = '''## RMA-090 — Implement camera permissions and capability discovery

          - [ ] Request camera permission only when needed.
          - [ ] Enumerate front/rear camera availability and characteristics.
          - [ ] Report supported analysis resolutions and orientations.
          - [ ] Record camera intrinsics when available; define calibration fallback when unavailable.
          - [ ] Handle permission denial, permanent denial, revocation, and camera-in-use errors.
          '''
          new = '''## RMA-090 — Implement camera permissions and capability discovery

          **Status:** Complete (2026-08-03)

          - [x] Request camera permission only when needed.
          - [x] Enumerate front/rear camera availability and characteristics.
          - [x] Report supported analysis resolutions and orientations.
          - [x] Record camera intrinsics when available; define calibration fallback when unavailable.
          - [x] Handle permission denial, permanent denial, revocation, and camera-in-use errors.

          **Completion evidence**

          - `ReachyAndroidCameraDiscovery` keeps startup at `NotRequested`, requests
            access only from an explicit camera action, persists prior grant history,
            and publishes denied, permanently denied, revoked, unsupported, faulted,
            and camera-availability states without fabricating frame readiness.
          - The Android Camera2 bridge enumerates lens facing, sensor orientation,
            hardware level, YUV analysis sizes, active-array geometry, platform
            intrinsics when present, and a documented uncalibrated fallback when
            calibration metadata is absent.
          - Settings and the main application shell expose permission, inventory,
            availability, calibration provenance, and actionable unavailable states
            while preserving the fixed presentation camera. Frame acquisition remains
            intentionally unavailable until RMA-091.
          - Hosted run `30874543837`, job `91883241667`, passed the permanent managed
            permission, inventory, error-state, and integration-policy contracts on
            exact implementation commit
            `8ce02564bed817ed215478180ee1c4468def8baa`.
          - Self-hosted run `30874543829`, job `91883242040`, passed Unity tests,
            ARM64 API-26 IL2CPP build and verification, installed LG-H872 physical-
            device camera acceptance, lifecycle acceptance, authoritative-rendering
            acceptance, and all evidence uploads on that same commit.
          - The physical device proved startup without a permission request,
            `NotRequested -> Granted -> Revoked` persistence, three available cameras
            (two rear and one front), valid orientations and YUV analysis sizes, and
            explicit calibration fallback because that device did not expose usable
            platform intrinsics.
          - Detailed design and evidence are in
            `docs/architecture/ANDROID_CAMERA_CAPABILITY_DISCOVERY.md` and
            `docs/validation/RMA_090_CAMERA_DISCOVERY_VALIDATION_2026-08-03.md`.
          '''
          if old not in todo:
              raise SystemExit('RMA-090 unchecked roadmap block was not found exactly.')
          todo_path.write_text(todo.replace(old, new, 1), encoding='utf-8')

          report_path = Path(
              'docs/validation/RMA_090_CAMERA_DISCOVERY_VALIDATION_2026-08-03.md'
          )
          report_path.write_text('''# RMA-090 Android Camera Discovery Validation — 2026-08-03

          ## Result

          RMA-090 is complete. Android camera permission and capability discovery are
          implemented without starting frame acquisition or weakening the fixed Unity
          presentation-camera boundary.

          ## Validated implementation

          - Exact implementation commit:
            `8ce02564bed817ed215478180ee1c4468def8baa`
          - Hosted workflow: `RMA-090 Camera Discovery`
            - run `30874543837`
            - job `91883241667`
            - conclusion: success
          - Self-hosted workflow: `Local Unity Android Validation`
            - run `30874543829`
            - job `91883242040`
            - runner: `kawa`
            - conclusion: success

          ## Contract validation

          The hosted gate passed managed warnings-as-errors tests and permanent static
          integration checks covering:

          - permission starts at `NotRequested` and is requested only by an explicit
            camera action;
          - granted, denied, permanently denied, revoked, unsupported, and faulted
            transitions;
          - front/rear inventory, Camera2 characteristics, availability, orientations,
            and analysis resolutions;
          - platform-intrinsics provenance and explicit calibration fallback;
          - settings/application-shell truthfulness and fixed-camera invariants;
          - no claim that device-camera frames flow before RMA-091.

          ## Physical-device validation

          The installed ARM64/API-26 APK was exercised on:

          - serial: `LGH87250967ab9`
          - manufacturer: LGE
          - model: LG-H872
          - Android API: 26
          - ABI: `arm64-v8a`

          The acceptance sequence proved:

          1. After clearing app data and revoking CAMERA, startup remained
             `NotRequested`, exposed no inventory, and displayed no permission dialog.
          2. After externally granting CAMERA and relaunching, discovery reached
             `Granted` and reported three available cameras: two rear and one front.
          3. Camera IDs `0` and `2` reported rear facing, 90-degree sensor orientation,
             level-3 hardware, and 28 YUV analysis sizes up to `4160x3120`.
          4. Camera ID `1` reported front facing, 270-degree sensor orientation,
             limited hardware, and 20 YUV analysis sizes up to `2560x1920`.
          5. The LG device did not expose usable lens-intrinsic calibration. Every
             camera therefore reported `CalibrationFallbackRequired` with the
             documented, explicitly uncalibrated checkerboard/pinhole fallback.
          6. After revoking CAMERA and relaunching, persisted grant history produced
             `Revoked`, removed the inventory, and disabled camera selection.

          The same run also passed the existing RMA-022 lifecycle acceptance and
          authoritative-rendering acceptance, then uploaded the verified APK.

          ## Evidence artifacts

          - Camera device report: artifact `8879158536`
            - digest `sha256:4c7de802d90cd84214e535247ec8a8bfedb0d9d924c8277eb0490a59cb9eec5c`
          - Unity test results: artifact `8879118727`
            - digest `sha256:7c076595348f49827a14df5eee53b0f40bbaa4cb11e5450fb1b5f6aa431ed584`
          - Lifecycle device report: artifact `8879175025`
            - digest `sha256:daad857c2dbdd61d185efb4409ebc0f04a5eb8e86566501006ce5b6af8b294b0`
          - Authoritative-rendering report: artifact `8879187403`
            - digest `sha256:8d8c4bb3108647fbfc5648a47e888e694dd8ceeed162d3c103ecfe62d580705b`
          - Verified device APK: artifact `8879219465`
            - digest `sha256:82676328c8cd538825758b311fd47c637c447a2ba0819093b65d70a2ab21ba67`

          ## Boundary retained for RMA-091

          RMA-090 discovers capabilities only. `ReachyDiscoveredCameraApplicationService`
          remains degraded and truthful because no CameraX preview/ImageAnalysis stream
          has been bound and no frame is delivered to Unity. RMA-091 is the next camera
          milestone.
          ''', encoding='utf-8')
          PY

          git rm \
            .github/workflows/rma090-apply-integration.yml \
            scripts/apply_rma090_integration.py \
            scripts/apply_rma090_integration_v2.py
          git diff --check

      - name: Commit final RMA-090 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md \
            docs/validation/RMA_090_CAMERA_DISCOVERY_VALIDATION_2026-08-03.md
          git commit -m 'RMA-090: record validated completion'
          git push origin HEAD:master

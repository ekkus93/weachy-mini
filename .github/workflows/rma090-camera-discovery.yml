name: RMA-090 Camera Discovery

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma090-camera-discovery.yml'
      - 'Assets/ReachyMini/Runtime/Core/Application/ReachyCameraCapabilities.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraDiscovery.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyDiscoveredCameraApplicationService.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyMainScreen.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyMainScreenBootstrap.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachySettingsApplicationCompositionProvider.cs'
      - 'Assets/ReachyMini/Tests/Editor/ReachyAndroidCameraDiscoveryTests.cs'
      - 'Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/**'
      - 'managed/ReachyMini.Camera.Tests/**'
      - 'scripts/run_rma090_camera_discovery_acceptance_android.sh'
      - 'docs/architecture/ANDROID_CAMERA_CAPABILITY_DISCOVERY.md'
      - 'docs/validation/RMA_090_CAMERA_CAPABILITY_DISCOVERY_VALIDATION_2026-08-03.md'
      - 'docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rma090-camera-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Permission, inventory, and truthfulness contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma090-status.json"
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "RMA-090 Camera Discovery",
              "description": "Camera discovery contract is running",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma090-status.json" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run managed camera capability contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj
          dotnet run \
            --project managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj \
            --configuration Release \
            --no-restore
      - name: Verify Android and Unity integration policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          core = Path('Assets/ReachyMini/Runtime/Core/Application/ReachyCameraCapabilities.cs').read_text(encoding='utf-8')
          bridge = Path('Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraDiscovery.cs').read_text(encoding='utf-8')
          service = Path('Assets/ReachyMini/Runtime/Application/ReachyDiscoveredCameraApplicationService.cs').read_text(encoding='utf-8')
          screen = Path('Assets/ReachyMini/Runtime/Application/ReachyMainScreen.cs').read_text(encoding='utf-8')
          bootstrap = Path('Assets/ReachyMini/Runtime/Application/ReachyMainScreenBootstrap.cs').read_text(encoding='utf-8')
          composition = Path('Assets/ReachyMini/Runtime/Application/ReachySettingsApplicationCompositionProvider.cs').read_text(encoding='utf-8')
          java = Path('Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/src/main/java/com/ekkus93/weachy/camera/ReachyCameraDiscoveryBridge.java').read_text(encoding='utf-8')
          manifest_path = Path('Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/AndroidManifest.xml')
          manifest = ET.parse(manifest_path).getroot()
          android = '{http://schemas.android.com/apk/res/android}'

          permissions = {
              node.attrib.get(android + 'name')
              for node in manifest.findall('uses-permission')
          }
          if 'android.permission.CAMERA' not in permissions:
              raise SystemExit('Camera permission is not declared.')
          feature = manifest.find('uses-feature')
          if feature is None or feature.attrib.get(android + 'name') != 'android.hardware.camera.any':
              raise SystemExit('Optional camera feature declaration is missing.')
          if feature.attrib.get(android + 'required') != 'false':
              raise SystemExit('Camera hardware must remain optional for installation.')

          required_core = [
              'ReachyCameraPermissionState',
              'PermanentlyDenied',
              'Revoked',
              'ReachyCameraAvailabilityState',
              'InUseOrUnavailable',
              'ReachyCameraResolution',
              'ReachyCameraIntrinsics',
              'CalibrationFallbackRequired',
              'sensorOrientationDegrees',
          ]
          for token in required_core:
              if token not in core:
                  raise SystemExit(f'Missing camera capability contract: {token}')

          required_java = [
              'CameraManager.AvailabilityCallback',
              'SCALER_STREAM_CONFIGURATION_MAP',
              'ImageFormat.YUV_420_888',
              'SENSOR_ORIENTATION',
              'LENS_INTRINSIC_CALIBRATION',
              'SENSOR_INFO_ACTIVE_ARRAY_SIZE',
              'camera_in_use',
              'camera_disabled',
              'camera_disconnected',
              'openApplicationSettings',
          ]
          for token in required_java:
              if token not in java:
                  raise SystemExit(f'Missing Android discovery behavior: {token}')
          for forbidden in ['openCamera(', 'ImageReader.newInstance(', 'Preview.Builder', 'ImageAnalysis.Builder']:
              if forbidden in java:
                  raise SystemExit(f'RMA-090 must not acquire frames: {forbidden}')

          request_method = re.search(
              r'public void RequestAccessOrRefresh\(\).*?\n        \}',
              bridge,
              re.S,
          )
          if request_method is None or 'RequestCameraPermission' not in request_method.group(0):
              raise SystemExit('User-triggered camera permission path is missing.')
          awake_method = re.search(r'private void Awake\(\).*?\n        \}', bridge, re.S)
          if awake_method is None:
              raise SystemExit('Camera discovery Awake path is missing.')
          if 'RequestCameraPermission' in awake_method.group(0) or 'RequestAccessOrRefresh' in awake_method.group(0):
              raise SystemExit('Camera permission is requested during startup.')
          if 'PlayerPrefs' not in bridge or 'EverGrantedKey' not in bridge:
              raise SystemExit('Revocation history is not persisted across process death.')
          if 'Frame acquisition remains unavailable until RMA-091' not in service:
              raise SystemExit('Camera service makes a premature frame-acquisition claim.')
          if 'ReachyAndroidCameraDiscovery' not in bootstrap or 'cameraDiscovery.State' not in composition:
              raise SystemExit('Camera discovery is not part of the production application composition.')
          if 'RMA-091' not in screen or 'CameraCapabilitySnapshot' not in screen:
              raise SystemExit('Camera UI does not expose discovery state truthfully.')

          print('RMA-090 camera discovery static contract passed.')
          PY
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma090-status.json"
          import json, os
          passed = os.environ['JOB_STATUS'] == 'success'
          print(json.dumps({
              "state": "success" if passed else "failure",
              "context": "RMA-090 Camera Discovery",
              "description": "Camera discovery contract passed" if passed else "Camera discovery contract failed",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma090-status.json" >/dev/null

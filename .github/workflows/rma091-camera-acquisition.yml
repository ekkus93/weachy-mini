name: RMA-091 CameraX Acquisition

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma091-camera-acquisition.yml'
      - 'Assets/ReachyMini/Runtime/Core/Application/ReachyCameraCapabilities.cs'
      - 'Assets/ReachyMini/Runtime/Core/Application/ReachyCameraAcquisition.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraDiscovery.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraAcquisition.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraTextureBridge.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidJavaCameraTextureFrameLease.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidUiThreadCameraAcquisitionPlatform.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyCameraAcquisitionBootstrap.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyCameraTextureEvidence.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyCameraYuvReferenceConverter.cs'
      - 'Assets/ReachyMini/Runtime/Resources/ReachyCameraYuv420ToRgb.shader'
      - 'Assets/ReachyMini/Tests/Editor/ReachyAndroidCameraAcquisitionTests.cs'
      - 'Assets/ReachyMini/Tests/Editor/ReachyCameraAcquisitionOwnershipTests.cs'
      - 'Assets/ReachyMini/Tests/Editor/ReachyCameraTextureBridgeTests.cs'
      - 'Assets/ReachyMini/Tests/Editor/ReachyCameraCloseBarrierTests.cs'
      - 'Assets/ReachyMini/Tests/Editor/ReachyCameraCloseBarrierTests.cs.meta'
      - 'Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/**'
      - 'managed/ReachyMini.Camera.Tests/**'
      - 'scripts/run_rma092_camera_texture_acceptance_android.sh'
      - 'third_party/inventory.json'
      - 'third_party/THIRD_PARTY_NOTICES.md'
      - 'docs/architecture/ANDROID_CAMERAX_FRAME_ACQUISITION.md'
      - 'docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md'
      - 'docs/validation/RMA_104_REPROJECTION_TEST_SUITE_VALIDATION_2026-08-05.md'
  pull_request:
    paths:
      - '.github/workflows/rma091-camera-acquisition.yml'
      - 'Assets/ReachyMini/Runtime/Core/Application/ReachyCameraCapabilities.cs'
      - 'Assets/ReachyMini/Runtime/Core/Application/ReachyCameraAcquisition.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraDiscovery.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraAcquisition.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraTextureBridge.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidJavaCameraTextureFrameLease.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidUiThreadCameraAcquisitionPlatform.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyCameraAcquisitionBootstrap.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyCameraTextureEvidence.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyCameraYuvReferenceConverter.cs'
      - 'Assets/ReachyMini/Runtime/Resources/ReachyCameraYuv420ToRgb.shader'
      - 'Assets/ReachyMini/Tests/Editor/ReachyAndroidCameraAcquisitionTests.cs'
      - 'Assets/ReachyMini/Tests/Editor/ReachyCameraAcquisitionOwnershipTests.cs'
      - 'Assets/ReachyMini/Tests/Editor/ReachyCameraTextureBridgeTests.cs'
      - 'Assets/ReachyMini/Tests/Editor/ReachyCameraCloseBarrierTests.cs'
      - 'Assets/ReachyMini/Tests/Editor/ReachyCameraCloseBarrierTests.cs.meta'
      - 'Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/**'
      - 'managed/ReachyMini.Camera.Tests/**'
      - 'scripts/run_rma092_camera_texture_acceptance_android.sh'
      - 'third_party/inventory.json'
      - 'third_party/THIRD_PARTY_NOTICES.md'
      - 'docs/architecture/ANDROID_CAMERAX_FRAME_ACQUISITION.md'
      - 'docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md'
      - 'docs/validation/RMA_104_REPROJECTION_TEST_SUITE_VALIDATION_2026-08-05.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rma091-camera-acquisition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Lifecycle, metadata, ownership, and backpressure contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run managed camera contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj
          dotnet run \
            --project managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj \
            --configuration Release \
            --no-restore
      - name: Verify CameraX acquisition and texture ownership policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          core = (root / 'Assets/ReachyMini/Runtime/Core/Application/ReachyCameraAcquisition.cs').read_text(encoding='utf-8')
          unity = (root / 'Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraAcquisition.cs').read_text(encoding='utf-8')
          texture_unity = (root / 'Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraTextureBridge.cs').read_text(encoding='utf-8')
          lease_unity = (root / 'Assets/ReachyMini/Runtime/Application/ReachyAndroidJavaCameraTextureFrameLease.cs').read_text(encoding='utf-8')
          texture_evidence = (root / 'Assets/ReachyMini/Runtime/Application/ReachyCameraTextureEvidence.cs').read_text(encoding='utf-8')
          reference = (root / 'Assets/ReachyMini/Runtime/Application/ReachyCameraYuvReferenceConverter.cs').read_text(encoding='utf-8')
          bootstrap = (root / 'Assets/ReachyMini/Runtime/Application/ReachyCameraAcquisitionBootstrap.cs').read_text(encoding='utf-8')
          shader = (root / 'Assets/ReachyMini/Runtime/Resources/ReachyCameraYuv420ToRgb.shader').read_text(encoding='utf-8')
          acceptance_script = (root / 'scripts/run_rma092_camera_texture_acceptance_android.sh').read_text(encoding='utf-8')
          java_dir = root / 'Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/src/main/java/com/ekkus93/weachy/camera'
          java = (java_dir / 'ReachyCameraFrameBridge.java').read_text(encoding='utf-8')
          texture_java = (java_dir / 'ReachyCameraTextureFrameBridge.java').read_text(encoding='utf-8')
          gradle = (root / 'Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/build.gradle').read_text(encoding='utf-8')
          tests = (root / 'Assets/ReachyMini/Tests/Editor/ReachyAndroidCameraAcquisitionTests.cs').read_text(encoding='utf-8')
          texture_tests = (root / 'Assets/ReachyMini/Tests/Editor/ReachyCameraTextureBridgeTests.cs').read_text(encoding='utf-8')
          close_barrier_tests = (root / 'Assets/ReachyMini/Tests/Editor/ReachyCameraCloseBarrierTests.cs').read_text(encoding='utf-8')
          inventory = json.loads((root / 'third_party/inventory.json').read_text(encoding='utf-8'))

          for token in [
              "cameraxVersion = '1.6.1'",
              'androidx.camera:camera-core',
              'androidx.camera:camera-camera2',
              'androidx.camera:camera-lifecycle',
          ]:
              if token not in gradle:
                  raise SystemExit(f'Missing pinned CameraX dependency: {token}')

          for token in [
              'ProcessCameraProvider',
              'Preview.Builder',
              'ImageAnalysis.Builder',
              'bindToLifecycle',
              'ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST',
              'ImageAnalysis.OUTPUT_IMAGE_FORMAT_YUV_420_888',
              'Camera2CameraInfo.from(cameraInfo).getCameraId()',
              'getTimestamp()',
              'getRotationDegrees()',
              'getCropRect()',
              'SENSOR_ORIENTATION',
              'LENS_INTRINSIC_CALIBRATION',
              'uncalibrated_pinhole_estimate',
              'analysis_yuv_gpu_texture_bridge',
              'ReachyCameraTextureFrameBridge.publish(',
              'LifecycleRegistry',
              'shutdownNow()',
          ]:
              if token not in java:
                  raise SystemExit(f'Missing CameraX acquisition behavior: {token}')
          if 'getPlanes(' in java:
              raise SystemExit('The lifecycle analyzer must delegate plane access to the detached texture bridge.')
          if 'OUTPUT_IMAGE_FORMAT_RGBA_8888' in java or 'OUTPUT_IMAGE_FORMAT_RGBA_8888' in texture_java:
              raise SystemExit('CameraX must retain YUV without implicit RGBA conversion.')
          if java.count('imageProxy.close();') != 1:
              raise SystemExit('ImageProxy must have one explicit close site.')
          if 'imageProxy.close();' in texture_java:
              raise SystemExit('The detached texture bridge must never own or close ImageProxy.')
          analyzer = re.search(r'private static void analyzeFrame\(.*?\n    \}', java, re.S)
          if analyzer is None:
              raise SystemExit('CameraX analyzer implementation is missing.')
          analyzer_body = analyzer.group(0)
          if 'finally {' not in analyzer_body or 'imageProxy.close();' not in analyzer_body:
              raise SystemExit('ImageProxy close must remain in the analyzer finally block.')
          if '++generation' not in java or 'expectedGeneration != generation' not in java:
              raise SystemExit('Async CameraX callbacks are not session-invalidated.')

          for token in [
              '"Stopping".equals(state)',
              'beginGracefulStopLocked()',
              'handleStoppingCameraStateLocked',
              'CameraState.Type.CLOSED',
              'completeGracefulStopLocked()',
              'camera_stop_failed',
          ]:
              if token not in java:
                  raise SystemExit(
                      f'Missing CameraX close-barrier behavior: {token}'
                  )

          for token in [
              'private static final int SLOT_COUNT = 3',
              'ByteBuffer.allocateDirect',
              'imageProxy.getPlanes()',
              'plane.getRowStride()',
              'plane.getPixelStride()',
              'state == LEASED',
              'acquireLatest(',
              'releasedFrameCount',
              'imageProxyRetained',
              'planeBufferRetained',
          ]:
              if token not in texture_java:
                  raise SystemExit(f'Missing detached texture ownership behavior: {token}')
          if texture_java.count('imageProxy.getPlanes()') != 1:
              raise SystemExit('Texture plane access must have one explicit site.')
          if 'imageProxyRetained", false' not in texture_java or 'planeBufferRetained", false' not in texture_java:
              raise SystemExit('Texture diagnostics must state that CameraX-owned buffers are not retained.')

          for token in [
              'ReachyCameraAcquisitionState',
              'ReachyCameraFrameMetadata',
              'TimestampNanoseconds',
              'SensorOrientationDegrees',
              'RotationDegrees',
              'ReachyCameraFrameCrop',
              'ReachyCameraPixelFormat',
              'ReachyCameraFrameIntrinsics',
              'StaleFrameCount',
              'PublishFrame',
          ]:
              if token not in core:
                  raise SystemExit(f'Missing managed frame contract: {token}')

          for token in [
              'PollIntervalSeconds = 0.05f',
              'StartPreferred',
              'StopPlatformForSwitch',
              'OnApplicationPause',
              'MarkPermissionRevoked',
              'camera_frame_contract_failed',
              'AcquireLatestTextureFrame',
              'ReachyCameraFrameMetadata',
          ]:
              if token not in unity:
                  raise SystemExit(f'Missing Unity acquisition behavior: {token}')
          if 'AndroidJavaProxy' in unity:
              raise SystemExit('Analyzer-thread callbacks must not enter Unity through AndroidJavaProxy.')

          for token in [
              'LoadRawTextureData(source, length)',
              'TextureFormat.R8',
              'Graphics.Blit',
              'descriptor.TimestampNanoseconds',
              'FrameMatchesActiveSession',
              'using (lease)',
              'ReachyCameraTextureBridgeState.Ready',
          ]:
              if token not in texture_unity:
                  raise SystemExit(f'Missing Unity GPU texture behavior: {token}')
          if 'GetRawTextureData' in texture_unity or 'ReadPixels' in texture_unity:
              raise SystemExit('Production texture upload must not perform Unity CPU readback.')
          for token in [
              'AndroidJNI.GetDirectBufferAddress',
              'lease?.Call("close")',
              'AtomicBoolean',
          ]:
              target = lease_unity if token != 'AtomicBoolean' else texture_java
              if token not in target:
                  raise SystemExit(f'Missing direct-buffer lease behavior: {token}')

          for token in [
              'Hidden/ReachyMini/CameraYuv420ToRgb',
              '_RotationQuarterTurns',
              '_MirrorX',
              '_ColorStandard',
              '_ColorRange',
              '1.5748',
              '1.402',
          ]:
              if token not in shader:
                  raise SystemExit(f'Missing YUV shader behavior: {token}')
          if '#if UNITY_INCLUDE_TESTS || DEVELOPMENT_BUILD' not in reference:
              raise SystemExit('CPU reference converter must remain test/development-only.')
          for token in [
              'OutputMappingAppliesRotationAndFrontMirror',
              'Bt601LimitedReferenceConvertsBlackWhiteAndRed',
              'Bt709LimitedReferenceConvertsRed',
              'PackedReferenceConversionRejectsPlaneLengthDrift',
          ]:
              if token not in texture_tests:
                  raise SystemExit(f'Missing RMA-092 reference test: {token}')

          for token in [
              'ReachyCameraTextureEvidence',
              'GetOrCreateTextureBridge(acquisition)',
              'InstallAcceptanceEvidenceIfRequested(',
              'yield return null',
          ]:
              if token not in bootstrap:
                  raise SystemExit(f'Missing camera texture bootstrap behavior: {token}')

          for token in [
              'reachy_rma092_acceptance',
              'rma092-rear.png',
              'rma092-rear-rotated.png',
              'rma092-front.png',
              'ReadPixels',
              'timestampCorrespondence',
              'mirrorContractValid',
              'capturesNonUniform',
          ]:
              if token not in texture_evidence:
                  raise SystemExit(f'Missing acceptance-only RMA-092 evidence behavior: {token}')
          for token in [
              '--ez reachy_rma092_acceptance true',
              'rear_capture_written',
              'rotated_capture_written',
              'front_capture_written',
              'timestamp_correspondence',
              'stale_frame_count',
              'SHA256SUMS',
          ]:
              if token not in acceptance_script:
                  raise SystemExit(f'Missing physical RMA-092 acceptance behavior: {token}')

          for token in [
              'RapidStartStopAndFrontRearSwitchUseDistinctSessions',
              'PauseResumeAndPermissionRevocationRemainVisible',
              'DuplicatePollAndStaleMetadataDoNotReplaceLatestFrame',
              'UnavailableCameraFailsClosedWithoutStartingPlatform',
          ]:
              if token not in tests:
                  raise SystemExit(f'Missing RMA-091 lifecycle test: {token}')

          for token in [
              'ExplicitStopRemainsStoppingUntilClosedSnapshot',
              'CameraSwitchStartsOnlyAfterClosedSnapshot',
              'ReachyCameraAcquisitionState.Stopping',
              'platform.CompleteStop()',
              '"CLOSED"',
          ]:
              if token not in close_barrier_tests:
                  raise SystemExit(
                      f'Missing CameraX close-barrier regression: {token}'
                  )

          camerax = next(
              (entry for entry in inventory['entries'] if entry.get('id') == 'androidx-camerax'),
              None,
          )
          if camerax is None:
              raise SystemExit('CameraX is absent from the third-party inventory.')
          if '1.6.1' not in str(camerax.get('source_revision')):
              raise SystemExit('CameraX inventory revision is not pinned to 1.6.1.')
          if camerax.get('status') != 'packaged_dependency':
              raise SystemExit('CameraX inventory does not identify a packaged dependency.')

          print('RMA-091 ownership and RMA-092 texture boundary static contract passed.')
          PY

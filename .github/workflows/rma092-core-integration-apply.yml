name: RMA-092 Core Integration Apply

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma092-core-integration-apply.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: rma092-core-integration-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply bounded RMA-092 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/status.json"
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "RMA-092 Core Integration Apply",
              "description": "Applying bounded CameraX texture integration",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json" >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact integration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_rma092_core_integration.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraTextureBridge.cs')
          text = path.read_text(encoding='utf-8')
          old = 'DestroyObject('
          if old not in text:
              raise SystemExit('Expected Unity object-destruction helper was not found.')
          path.write_text(text.replace(old, 'DestroyUnityObject('), encoding='utf-8')
          PY
          git diff --check
          bash -n scripts/*.sh
          changed="$(git diff --name-only | sort)"
          expected="$(cat <<'EOF'
Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/src/main/java/com/ekkus93/weachy/camera/ReachyCameraFrameBridge.java
Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraAcquisition.cs
Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraTextureBridge.cs
Assets/ReachyMini/Runtime/Application/ReachyAndroidUiThreadCameraAcquisitionPlatform.cs
Assets/ReachyMini/Runtime/Application/ReachyCameraAcquisitionBootstrap.cs
Assets/ReachyMini/Tests/Editor/ReachyAndroidCameraAcquisitionTests.cs
EOF
)"
          if [[ "${changed}" != "${expected}" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "${changed}" >&2
            exit 1
          fi

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/src/main/java/com/ekkus93/weachy/camera/ReachyCameraFrameBridge.java \
            Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraAcquisition.cs \
            Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraTextureBridge.cs \
            Assets/ReachyMini/Runtime/Application/ReachyAndroidUiThreadCameraAcquisitionPlatform.cs \
            Assets/ReachyMini/Runtime/Application/ReachyCameraAcquisitionBootstrap.cs \
            Assets/ReachyMini/Tests/Editor/ReachyAndroidCameraAcquisitionTests.cs
          git commit -m 'RMA-092: integrate CameraX YUV texture leases'
          git push origin HEAD:master

      - name: Publish success status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/status.json"
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "RMA-092 Core Integration Apply",
              "description": "CameraX texture integration committed",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json" >/dev/null

      - name: Publish failure status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/status.json"
          import json, os
          print(json.dumps({
              "state": "failure",
              "context": "RMA-092 Core Integration Apply",
              "description": "CameraX texture integration apply failed",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json" >/dev/null

name: RMA-092 Remove Obsolete Integration Scaffolding

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma092-core-integration-apply.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove completed RMA-092 integration scaffolding
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete apply workflow and patch script
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/rma092-core-integration-apply.yml
          test -f scripts/apply_rma092_core_integration.py
          rm -- \
            .github/workflows/rma092-core-integration-apply.yml \
            scripts/apply_rma092_core_integration.py
          git diff --check

      - name: Commit bounded cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/rma092-core-integration-apply.yml \
            scripts/apply_rma092_core_integration.py
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' \
            .github/workflows/rma092-core-integration-apply.yml \
            scripts/apply_rma092_core_integration.py)"
          test "${changed}" = "${expected}"
          git commit -m "RMA-092: remove obsolete integration scaffolding"
          git push origin HEAD:master

name: RMA-092 ShellCheck Cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma092-shellcheck-cleanup.yml

permissions:
  contents: write

jobs:
  fix:
    name: Replace remote wildcard with explicit find
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded shell fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_rma092_camera_texture_acceptance_android.sh")
          text = path.read_text(encoding="utf-8")
          old = '''        "${REMOTE_FILES_DIR}"/${STAGE_MARKER_GLOB} \\
                  >/dev/null 2>&1 || true
          '''
          new = '''        >/dev/null 2>&1 || true
              "${ADB[@]}" shell \\
                  "find '${REMOTE_FILES_DIR}' -maxdepth 1 -type f -name '${STAGE_MARKER_GLOB}' -delete" \\
                  >/dev/null 2>&1 || true
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f"Expected one remote stage-marker wildcard block; found {text.count(old)}"
              )
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          bash -n scripts/run_rma092_camera_texture_acceptance_android.sh
          shellcheck scripts/run_rma092_camera_texture_acceptance_android.sh

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/rma092-shellcheck-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/rma092-shellcheck-cleanup.yml \
            scripts/run_rma092_camera_texture_acceptance_android.sh
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/rma092-shellcheck-cleanup.yml"
          test "${changed[1]}" = "scripts/run_rma092_camera_texture_acceptance_android.sh"
          git diff --cached --check
          git commit -m "RMA-092: make stage cleanup ShellCheck-safe"
          git push origin HEAD:master

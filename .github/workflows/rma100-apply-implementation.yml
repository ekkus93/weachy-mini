name: RMA-100 Apply Implementation

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma100-apply-implementation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/rma100-payload/part-* > "${RUNNER_TEMP}/payload.b64"
          base64 --decode "${RUNNER_TEMP}/payload.b64" > "${RUNNER_TEMP}/payload.tar.gz"
          printf '%s  %s\n' '1002e7f99e3e5e6ceb1c6fd4e8fac9c4213430d1f18577c7d74025f36bf95ae5' "${RUNNER_TEMP}/payload.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/payload.tar.gz" --directory "${GITHUB_WORKSPACE}"
          rm --force .github/workflows/rma100-apply-implementation.yml
          rm --recursive --force .github/rma100-payload
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'RMA-100: define camera coordinate calibration contract'
          git push origin HEAD:master

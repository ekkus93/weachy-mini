name: RMA-100 Camera Calibration Contract

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma100-camera-calibration.yml'
      - 'Assets/ReachyMini/Runtime/Core/Application/ReachyCameraReprojectionCalibration.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyCameraCalibrationPersistence.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachySettingsPersistence.cs'
      - 'Assets/ReachyMini/Runtime/Rendering/ReachyCameraCalibrationUnityAdapter.cs'
      - 'Assets/ReachyMini/Tests/Editor/ReachyCameraReprojectionCalibrationTests.cs'
      - 'managed/ReachyMini.Camera.Tests/Program.cs'
      - 'managed/ReachyMini.Camera.Tests/Rma100CameraCalibrationContracts.cs'
      - 'docs/architecture/CAMERA_REPROJECTION_COORDINATE_SYSTEMS.md'
      - 'docs/validation/RMA_100_CAMERA_CALIBRATION_VALIDATION_2026-08-04.md'
      - 'docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rma100-camera-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Coordinate, calibration, and persistence contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma100-status.json"
          import json
          import os
          print(json.dumps({
              "state": "pending",
              "context": "RMA-100 Camera Calibration",
              "description": "Coordinate and calibration contracts are running",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma100-status.json" >/dev/null

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run managed camera calibration contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj
          dotnet run \
            --project managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj \
            --configuration Release \
            --no-restore

      - name: Verify RMA-100 integration and truthfulness policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = {
              'core': Path('Assets/ReachyMini/Runtime/Core/Application/ReachyCameraReprojectionCalibration.cs').read_text(encoding='utf-8'),
              'persistence': Path('Assets/ReachyMini/Runtime/Application/ReachyCameraCalibrationPersistence.cs').read_text(encoding='utf-8'),
              'settings': Path('Assets/ReachyMini/Runtime/Application/ReachySettingsPersistence.cs').read_text(encoding='utf-8'),
              'adapter': Path('Assets/ReachyMini/Runtime/Rendering/ReachyCameraCalibrationUnityAdapter.cs').read_text(encoding='utf-8'),
              'program': Path('managed/ReachyMini.Camera.Tests/Program.cs').read_text(encoding='utf-8'),
              'managed': Path('managed/ReachyMini.Camera.Tests/Rma100CameraCalibrationContracts.cs').read_text(encoding='utf-8'),
              'unity': Path('Assets/ReachyMini/Tests/Editor/ReachyCameraReprojectionCalibrationTests.cs').read_text(encoding='utf-8'),
              'doc': Path('docs/architecture/CAMERA_REPROJECTION_COORDINATE_SYSTEMS.md').read_text(encoding='utf-8'),
          }
          required = {
              'core': [
                  'ReachyCameraCoordinateContract', 'AndroidPixelAxes',
                  'PhoneOpticalAxes', 'ReachyOpticalAxes',
                  'UnityWorldFromMujocoWorld', 'OpticalFromMujocoCamera',
                  'ReachyCameraImageNormalization', 'NormalizedFromSourcePixels',
                  'ReachyCameraIntrinsicMatrix', 'ReachyCameraCalibrationProfile',
                  'ReachyCameraCalibrationSelectionStatus', 'ExactCalibrated',
                  'ExactUncalibratedEstimate', 'CameraMismatch',
                  'ImageSizeMismatch', 'ModelMismatch',
                  'BuildNeutralHomography',
                  'ReachyCameraReprojectionMode.RotationOnly',
              ],
              'persistence': [
                  'reachy-camera-calibration-v1.json', 'SchemaVersion = 1',
                  'QuarantineInvalidFile',
                  'calibration was silently substituted',
                  'ReachyCameraCalibrationPersistenceStore',
              ],
              'settings': [
                  'ReachyCameraCalibrationPersistenceStore',
                  'CameraCalibrations', 'CalibrationPersistencePath',
                  'PublishCombinedHealth',
              ],
              'adapter': [
                  'ReachyCoordinateConverter.ToUnityRotation',
                  'ToCoreRotation', 'ToUnityMatrix',
                  'ReachyCameraCoordinateContract',
              ],
              'program': ['Rma100CameraCalibrationContracts.Run();'],
              'managed': [
                  'CoordinateBasesRemainExplicit',
                  'ImageNormalizationMatchesRma092Order',
                  'MirroringIsNotPhysicalOrientation',
                  'PositiveOpticalYawMovesTheViewRight',
                  'SelectionRequiresAnExactProfile',
                  'InvalidCalibrationFailsClosed',
              ],
              'unity': [
                  'MujocoUnityBasisMatchesProductionCoordinateConverter',
                  'UnityQuaternionConversionMatchesCoreRotation',
                  'UnityMatrixConversionPreservesHomographyElements',
              ],
              'doc': [
                  'Android image pixels', 'Phone optical frame',
                  'Reachy optical frame', 'Unity world frame',
                  'MuJoCo world frame', 'H = K_reachy',
                  'Mirroring is never represented as a physical rotation',
                  'rotation-only',
              ],
          }
          for name, tokens in required.items():
              for token in tokens:
                  if token not in files[name]:
                      raise SystemExit(
                          f'Missing RMA-100 {name} contract token: {token}')

          if 'ModuleInitializer' in files['managed']:
              raise SystemExit(
                  'RMA-100 hosted tests must use the explicit program entry point.')

          for path in [
              Path('.github/workflows/rma100-apply-implementation.yml'),
              Path('.github/workflows/rma100-explicit-test-entry.yml'),
              Path('.github/rma100-payload'),
          ]:
              if path.exists():
                  raise SystemExit(
                      f'Temporary RMA-100 staging artifact remains: {path}')

          print('RMA-100 camera calibration static contract passed.')
          PY

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/rma100-status.json"
          import json
          import os
          passed = os.environ['JOB_STATUS'] == 'success'
          print(json.dumps({
              "state": "success" if passed else "failure",
              "context": "RMA-100 Camera Calibration",
              "description": "Coordinate and calibration contracts passed" if passed else "Coordinate and calibration contracts failed",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/rma100-status.json" >/dev/null

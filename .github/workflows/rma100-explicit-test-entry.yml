name: RMA-100 Explicit Test Entry

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma100-explicit-test-entry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Harden and run RMA-100 hosted contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          program_path = Path('managed/ReachyMini.Camera.Tests/Program.cs')
          program = program_path.read_text(encoding='utf-8')
          program_anchor = '            Console.WriteLine("RMA-090/RMA-091 camera contracts passed.");'
          program_replacement = (
              '            Rma100CameraCalibrationContracts.Run();\n'
              '            Console.WriteLine("RMA-090/RMA-091/RMA-100 camera contracts passed.");'
          )
          if program_anchor not in program:
              raise SystemExit('Program.cs entry-point anchor was not found.')
          program_path.write_text(
              program.replace(program_anchor, program_replacement, 1),
              encoding='utf-8',
          )

          contracts_path = Path(
              'managed/ReachyMini.Camera.Tests/Rma100CameraCalibrationContracts.cs')
          contracts = contracts_path.read_text(encoding='utf-8')
          compiler_using = 'using System.Runtime.CompilerServices;\n'
          if compiler_using not in contracts:
              raise SystemExit('Module-initializer using directive was not found.')
          contracts = contracts.replace(compiler_using, '', 1)
          module_marker = '        [ModuleInitializer]\n        internal static void Run()'
          if module_marker not in contracts:
              raise SystemExit('RMA-100 module-initializer anchor was not found.')
          contracts_path.write_text(
              contracts.replace(
                  module_marker,
                  '        internal static void Run()',
                  1,
              ),
              encoding='utf-8',
          )

          core_path = Path(
              'Assets/ReachyMini/Runtime/Core/Application/'
              'ReachyCameraReprojectionCalibration.cs')
          core = core_path.read_text(encoding='utf-8')
          assignment_anchor = (
              '            NeutralReachyFromPhoneRotation = '
              'neutralReachyFromPhoneRotation;\n'
              '        }'
          )
          assignment_replacement = (
              '            NeutralReachyFromPhoneRotation = '
              'neutralReachyFromPhoneRotation;\n'
              '            ReprojectionMode = '
              'ReachyCameraReprojectionMode.RotationOnly;\n'
              '        }'
          )
          if assignment_anchor not in core:
              raise SystemExit('Reprojection-mode constructor anchor was not found.')
          core = core.replace(assignment_anchor, assignment_replacement, 1)
          property_anchor = (
              '        public ReachyCameraReprojectionMode ReprojectionMode =>\n'
              '            ReachyCameraReprojectionMode.RotationOnly;'
          )
          if property_anchor not in core:
              raise SystemExit('Reprojection-mode property anchor was not found.')
          core_path.write_text(
              core.replace(
                  property_anchor,
                  '        public ReachyCameraReprojectionMode ReprojectionMode { get; }',
                  1,
              ),
              encoding='utf-8',
          )
          PY
          git diff --check
          dotnet restore managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj
          dotnet run \
            --project managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj \
            --configuration Release \
            --no-restore
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/ReachyMini/Runtime/Core/Application/ReachyCameraReprojectionCalibration.cs \
            managed/ReachyMini.Camera.Tests/Program.cs \
            managed/ReachyMini.Camera.Tests/Rma100CameraCalibrationContracts.cs
          git commit -m 'RMA-100: harden hosted calibration contracts'
          git push origin HEAD:master

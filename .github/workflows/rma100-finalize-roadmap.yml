name: RMA-100 Finalize Roadmap

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma100-finalize-roadmap.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record RMA-100 completion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md')
          text = path.read_text(encoding='utf-8')
          start_marker = '## RMA-100 — Define coordinate systems and calibration\n'
          end_marker = '\n## RMA-101 — Compute relative rotation from MuJoCo state\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = base64.b64decode('').decode('utf-8')
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          rm --force .github/workflows/rma100-finalize-roadmap.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'RMA-100: record roadmap completion evidence'
          git push origin HEAD:master

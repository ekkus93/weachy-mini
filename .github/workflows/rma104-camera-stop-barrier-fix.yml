name: Apply RMA-104 CameraX Stop Barrier Repair

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma104-camera-stop-barrier-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rma104_camera_stop_barrier_patch.py
          git diff --check

      - name: Commit repair directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/src/main/java/com/ekkus93/weachy/camera/ReachyCameraFrameBridge.java \
            Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraAcquisition.cs \
            scripts/run_rma092_camera_texture_acceptance_android.sh
          git commit -m 'RMA-104 wait for CameraX device closure before restart'
          git push origin HEAD:master

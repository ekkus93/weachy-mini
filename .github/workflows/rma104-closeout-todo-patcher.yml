name: RMA-104 Closeout TODO Patcher

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma104-closeout-todo-patcher.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rma104-closeout-todo-patcher
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authoritative RMA-104 closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rma104_closeout_todo_patch.py
          rm .github/workflows/rma104-closeout-todo-patcher.yml
          test ! -e scripts/rma104_closeout_todo_patch.py
          test ! -e .github/workflows/rma104-closeout-todo-patcher.yml
          grep -F '**Status:** Complete (2026-08-05)' docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md >/dev/null
          git diff --check

      - name: Commit self-removing closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          git add -u scripts/rma104_closeout_todo_patch.py
          git add -u .github/workflows/rma104-closeout-todo-patcher.yml
          git diff --cached --check
          git commit -m 'docs: close RMA-104 TODO'
          git push origin HEAD:master

name: RMA-104 Harden RMA-091 Gate

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma104-harden-rma091-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rma104-harden-rma091-gate
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate hardened RMA-091 workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rma104_harden_rma091_gate.py
          mkdir -p "${RUNNER_TEMP}/rma104-rma091-gate"
          cp .github/workflows/rma091-camera-acquisition.yml \
            "${RUNNER_TEMP}/rma104-rma091-gate/rma091-camera-acquisition.yml"
          grep -F 'ExplicitStopRemainsStoppingUntilClosedSnapshot' \
            "${RUNNER_TEMP}/rma104-rma091-gate/rma091-camera-acquisition.yml" >/dev/null
          grep -F 'RMA_104_REPROJECTION_TEST_SUITE_VALIDATION_2026-08-05.md' \
            "${RUNNER_TEMP}/rma104-rma091-gate/rma091-camera-acquisition.yml" >/dev/null
          git diff --check

      - name: Upload hardened workflow
        uses: actions/upload-artifact@v4
        with:
          name: rma104-rma091-gate-patch-${{ github.sha }}
          path: ${{ runner.temp }}/rma104-rma091-gate/rma091-camera-acquisition.yml
          if-no-files-found: error
          retention-days: 1

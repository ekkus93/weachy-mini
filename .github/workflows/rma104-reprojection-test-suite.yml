name: RMA-104 Reprojection Test Suite

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma104-reprojection-test-suite.yml'
      - 'Assets/ReachyMini/Runtime/Core/Application/ReachyCameraHomographyWarp.cs'
      - 'Assets/ReachyMini/Runtime/Core/Application/ReachyCameraValidCoverage.cs'
      - 'Assets/ReachyMini/Runtime/Rendering/ReachyCameraHomographyWarpRenderer.cs'
      - 'Assets/ReachyMini/Runtime/Rendering/ReachyCameraHomographyWarpPipeline.cs'
      - 'Assets/ReachyMini/Runtime/Rendering/ReachyVisionFrameRoutingPolicy.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidCameraAcquisition*.cs'
      - 'Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/src/main/java/com/ekkus93/weachy/camera/ReachyCameraFrameBridge.java'
      - 'Assets/ReachyMini/Tests/Editor/ReachyCameraReprojection*.cs'
      - 'Assets/ReachyMini/Tests/Editor/ReachyCameraCloseBarrierTests.cs'
      - 'managed/ReachyMini.Camera.Tests/Rma104*.cs'
      - 'scripts/run_rma092_camera_texture_acceptance_android.sh'
      - 'docs/architecture/REPROJECTION_TEST_SUITE.md'
      - 'docs/validation/RMA_104_REPROJECTION_TEST_SUITE_VALIDATION_2026-08-05.md'
      - 'docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rma104-reprojection-test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Reprojection, coverage, routing, and close-barrier contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/status.json"
          import json
          import os
          print(json.dumps({
              "state": "pending",
              "context": "RMA-104 Reprojection Test Suite",
              "description": "RMA-104 contracts are running",
              "target_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json" >/dev/null

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run managed camera contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj
          dotnet run \
            --project managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj \
            --configuration Release \
            --no-restore

      - name: Verify RMA-104 source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          files = {
              'homography': root / 'Assets/ReachyMini/Runtime/Core/Application/ReachyCameraHomographyWarp.cs',
              'coverage': root / 'Assets/ReachyMini/Runtime/Core/Application/ReachyCameraValidCoverage.cs',
              'routing': root / 'Assets/ReachyMini/Runtime/Rendering/ReachyVisionFrameRoutingPolicy.cs',
              'renderer': root / 'Assets/ReachyMini/Runtime/Rendering/ReachyCameraHomographyWarpRenderer.cs',
              'pipeline': root / 'Assets/ReachyMini/Runtime/Rendering/ReachyCameraHomographyWarpPipeline.cs',
              'close_tests': root / 'Assets/ReachyMini/Tests/Editor/ReachyCameraCloseBarrierTests.cs',
              'acceptance': root / 'scripts/run_rma092_camera_texture_acceptance_android.sh',
              'architecture': root / 'docs/architecture/REPROJECTION_TEST_SUITE.md',
              'validation': root / 'docs/validation/RMA_104_REPROJECTION_TEST_SUITE_VALIDATION_2026-08-05.md',
          }
          text = {name: path.read_text(encoding='utf-8') for name, path in files.items()}
          text['reprojection'] = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in sorted((root / 'Assets/ReachyMini/Tests/Editor').glob('ReachyCameraReprojection*.cs'))
          )
          text['managed'] = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in sorted((root / 'managed/ReachyMini.Camera.Tests').glob('Rma104*.cs'))
          )
          # ReachyAndroidCameraAcquisition.cs was split (docs/LARGE_FILE_REFACTOR_TODO_3.md,
          # file #7) into an anchor plus partial-class/type files sharing the same
          # filename prefix. Concatenate every piece so this contract check keeps
          # covering the same source, regardless of which file each token now lives in.
          text['acquisition'] = ''.join(
              path.read_text(encoding='utf-8')
              for path in sorted(
                  (root / 'Assets/ReachyMini/Runtime/Application').glob(
                      'ReachyAndroidCameraAcquisition*.cs'
                  )
              )
          )
          # ReachyCameraFrameBridge.java was split (docs/LARGE_FILE_REFACTOR_TODO.md, file
          # #7) into several top-level ReachyCameraFrame*/ReachyFrame* helper classes.
          # Concatenate every piece so this contract check keeps covering the same source,
          # regardless of which file each token now lives in. Excludes
          # ReachyCameraTextureFrameBridge.java, ReachyCameraDiscoveryBridge.java, and
          # ReachyMlKitTrackingBridge.java, which are unrelated bridges in the same package.
          java_dir = root / 'Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/src/main/java/com/ekkus93/weachy/camera'
          bridge_split_files = [
              'ReachyCameraFrameBridge.java',
              'ReachyCameraFrameBinder.java',
              'ReachyCameraFrameLifecycleController.java',
              'ReachyCameraFrameAnalyzer.java',
              'ReachyCameraDescriptor.java',
              'ReachyFrameIntrinsics.java',
              'ReachyFrameSnapshot.java',
              'ReachyDiscardingPreviewSurfaceProvider.java',
              'ReachyCameraLifecycleOwner.java',
              'ReachyCameraFrameThreadFactory.java',
              'ReachyCameraErrorUtil.java',
          ]
          text['java'] = ''.join(
              (java_dir / name).read_text(encoding='utf-8')
              for name in bridge_split_files
              if (java_dir / name).is_file()
          )

          required = {
              'homography': ['NumericalCanonicalizationTolerance', 'CanonicalizeNumericalNoise'],
              'coverage': ['QuantizeForShader', 'ShaderDepthEpsilon'],
              'routing': ['ReachyVisionFramePurpose', 'ExplicitRawDebug', 'CanCreateVisualObservations'],
              'reprojection': [
                  'IdentityTransformGoldenImageMatchesCpuReference',
                  'SyntheticYawPitchRollMatchDoublePrecisionCpuReference',
                  'CameraIntrinsicScalingMatchesCpuReference',
                  'FrontCameraMirroringMatchesCpuReference',
                  'PortraitLandscapeNormalizationMatchesCpuReference',
                  'InvalidMaskBoundaryClearsPriorFramePixels',
                  'ActualMujocoHeadRotationDrivesTheWarp',
                  'VisionConsumersUseTransformedFrameUnlessRawDebugIsExplicit',
                  'QuantizeForShader',
                  'ReadPixels(',
              ],
              'managed': [
                  'IdentityAndAxisRotationsAreDeterministic',
                  'IdentityHomographyIsCanonicalAndFullyValid',
                  'CoverageMatchesQuantizedShaderPayload',
                  '[ModuleInitializer]',
              ],
              'java': [
                  'beginGracefulStopLocked',
                  'handleStoppingCameraStateLocked',
                  'completeGracefulStopLocked',
                  'CameraState.Type.CLOSED',
                  'camera_close_failed',
              ],
              'acquisition': ['pendingStartAfterStop', 'restartAfterClose'],
              'close_tests': [
                  'ExplicitStopRemainsStoppingUntilClosedSnapshot',
                  'CameraSwitchStartsOnlyAfterClosedSnapshot',
                  'CLOSED',
              ],
              'acceptance': [
                  'report.get("current_state") == "Stopped"',
                  '"CLOSED" in str(report.get("message", ""))',
                  'stale_frame_count',
              ],
              'architecture': [
                  'Shader precision and exact coverage',
                  'CameraX stop barrier',
                  'previous-frame color is never accepted',
                  'rotation_only',
                  'ExplicitRawDebug',
              ],
              'validation': [
                  'Accepted implementation SHA',
                  '125/125',
                  'camera_fatal_error',
                  'CLOSED',
              ],
          }
          for category, tokens in required.items():
              for token in tokens:
                  if token not in text[category]:
                      raise SystemExit(f'Missing RMA-104 {category} token: {token}')

          runtime = '\n'.join((text['renderer'], text['pipeline'], text['routing']))
          for token in ('ReadPixels(', 'GetPixels(', 'GetPixels32(', 'AsyncGPUReadback', '|| true'):
              if token in runtime:
                  raise SystemExit('RMA-104 runtime contains forbidden fallback/readback: ' + token)
          stop_body = text['acquisition'].split('public void StopAcquisition()', 1)[1].split('public void RefreshNow()', 1)[0]
          if 'state.MarkStopped' in stop_body:
              raise SystemExit('StopAcquisition must not fabricate Stopped before CameraX CLOSED.')
          print('RMA-104 source contracts passed.')
          PY

          if git ls-files | grep -E '^managed/[^/]+/(bin|obj)/'; then
            echo 'Generated managed build output is tracked.' >&2
            exit 1
          fi
          git diff --check

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/status.json"
          import json
          import os
          passed = os.environ['JOB_STATUS'] == 'success'
          print(json.dumps({
              "state": "success" if passed else "failure",
              "context": "RMA-104 Reprojection Test Suite",
              "description": "RMA-104 contracts passed" if passed else "RMA-104 contracts failed",
              "target_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json" >/dev/null

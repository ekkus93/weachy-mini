name: RMA-110 Closeout Applicator

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma110-closeout-applicator.yml'

permissions:
  contents: write

concurrency:
  group: rma110-closeout-applicator
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply RMA-110 closeout patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rma110_closeout_patch.py
          git diff --check
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          git add docs/validation/RMA_110_VISION_PROVIDER_CONTRACTS_VALIDATION_2026-08-05.md
          git add scripts/rma110_closeout_patch.py
          git commit -m 'docs: close RMA-110 implementation evidence'
          git push origin HEAD:master

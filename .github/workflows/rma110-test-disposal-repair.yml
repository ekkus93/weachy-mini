name: RMA-110 Test Disposal Repair

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma110-test-disposal-repair.yml'

permissions:
  contents: write

concurrency:
  group: rma110-test-disposal-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply and validate async test entry point and ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rma110_test_disposal_patch.py
          dotnet restore managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj
          timeout --signal=TERM --kill-after=15s 120s \
            dotnet run \
              --project managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj \
              --configuration Release \
              --no-restore
          git diff --check
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add managed/ReachyMini.Camera.Tests/Program.cs
          git add managed/ReachyMini.Camera.Tests/Rma110VisionProviderContracts.cs
          git add scripts/rma110_test_disposal_patch.py
          git add scripts/rma110_test_progress_patch.py
          git commit -m 'RMA-110: make async tests and ownership deterministic'
          git push origin HEAD:master

# Tenth bounded run removes the synchronous async module-initializer bootstrap.

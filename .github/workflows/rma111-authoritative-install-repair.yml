name: RMA-111 Authoritative Install Repair
# One-use retry after resolving the applicator repository root.

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma111-authoritative-install-repair.yml

permissions:
  contents: write

concurrency:
  group: rma111-authoritative-install-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply fail-closed authoritative install repair
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/rma111_authoritative_install_repair.py.gz.b64 \
            | gzip --decompress \
            > "${RUNNER_TEMP}/rma111_authoritative_install_repair.py"
          python3 "${RUNNER_TEMP}/rma111_authoritative_install_repair.py"
          bash -n scripts/run_unity_authoritative_rendering_acceptance_android_impl.sh
          bash -n scripts/run_unity_authoritative_rendering_acceptance_android.sh
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            managed/ReachyMini.Camera.Tests/Rma111AndroidBridgeSourceContracts.cs
            scripts/run_unity_authoritative_rendering_acceptance_android.sh
            scripts/run_unity_authoritative_rendering_acceptance_android_impl.sh
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected repair scope.\nExpected: %s\nActual: %s\n' \
              "${expected[*]}" "${changed[*]}" >&2
            exit 1
          fi

      - name: Commit repair to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add \
            managed/ReachyMini.Camera.Tests/Rma111AndroidBridgeSourceContracts.cs \
            scripts/run_unity_authoritative_rendering_acceptance_android.sh \
            scripts/run_unity_authoritative_rendering_acceptance_android_impl.sh
          git commit -m 'fix: preserve authoritative install timeout evidence'
          git push origin HEAD:master

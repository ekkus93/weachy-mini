name: RMA-111 Completion Metadata

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma111-completion-metadata.yml

permissions:
  contents: write

concurrency:
  group: rma111-completion-metadata
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply RMA-111 completion metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rma111_completion_metadata.py
          git diff --check
          grep -F '**Status:** Complete (2026-08-05)' \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md >/dev/null
          grep -F "docs/validation/RMA_111_LIGHTWEIGHT_TRACKING_VALIDATION_2026-08-05.md" \
            .github/workflows/rma090-camera-discovery.yml >/dev/null

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/rma090-camera-discovery.yml
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected completion-metadata scope.\nExpected: %s\nActual: %s\n' \
              "${expected[*]}" "${changed[*]}" >&2
            exit 1
          fi

      - name: Commit completion metadata to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add \
            .github/workflows/rma090-camera-discovery.yml \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          git commit -m 'docs: complete RMA-111 milestone metadata'
          git push origin HEAD:master

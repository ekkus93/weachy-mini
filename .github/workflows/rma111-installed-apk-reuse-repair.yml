name: RMA-111 Installed APK Reuse Repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma111-installed-apk-reuse-repair.yml

permissions:
  contents: write

concurrency:
  group: rma111-installed-apk-reuse-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact installed-APK reuse repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rma111_installed_apk_reuse_repair.py
          bash -n scripts/run_unity_authoritative_rendering_acceptance_android_impl.sh
          git diff --check

          implementation=scripts/run_unity_authoritative_rendering_acceptance_android_impl.sh
          grep -F 'reuse_exact_installed_apk' "${implementation}" >/dev/null
          grep -F 'installed_apk_matches_candidate=true' "${implementation}" >/dev/null
          grep -F 'install -r -g "${APK_PATH}"' "${implementation}" >/dev/null
          if grep -F '"${ADB[@]}" uninstall "${PACKAGE_NAME}"' "${implementation}" >/dev/null; then
            printf '%s\n' 'Destructive authoritative uninstall remained after repair.' >&2
            exit 1
          fi

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            managed/ReachyMini.Camera.Tests/Rma111AndroidBridgeSourceContracts.cs
            scripts/run_unity_authoritative_rendering_acceptance_android_impl.sh
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected repair scope.\nExpected: %s\nActual: %s\n' \
              "${expected[*]}" "${changed[*]}" >&2
            exit 1
          fi

      - name: Commit repair to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add \
            managed/ReachyMini.Camera.Tests/Rma111AndroidBridgeSourceContracts.cs \
            scripts/run_unity_authoritative_rendering_acceptance_android_impl.sh
          git commit -m 'fix: reuse exact authoritative device APK'
          git push origin HEAD:master

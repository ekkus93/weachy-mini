name: One-use RMA-111 invalid-region repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma111-invalid-region-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply fail-closed invalid-region repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rma111_invalid_region_repair.py

      - name: Run managed RMA contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet run \
            --project managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj \
            --configuration Release

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=(
            Assets/ReachyMini/Runtime/Application/ReachyRma111TrackingAcceptance.cs
            managed/ReachyMini.Camera.Tests/Rma111AndroidBridgeSourceContracts.cs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected invalid-region repair diff.\nChanged:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi

      - name: Commit and push source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/ReachyMini/Runtime/Application/ReachyRma111TrackingAcceptance.cs \
            managed/ReachyMini.Camera.Tests/Rma111AndroidBridgeSourceContracts.cs
          git diff --cached --check
          git commit -m 'RMA-111: make physical invalid-mask check deterministic'
          git push origin HEAD:master

name: One-use RMA-111 ML Kit start repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma111-mlkit-start-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply fail-closed RMA-111 repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path(
              "Assets/ReachyMini/Tests/Editor/ReachyLightweightTrackingTests.cs")
          test_text = test_path.read_text(encoding="utf-8")
          old_validity = '''            RenderTexture validitySource = CreateSourceTexture(
                          "RMA-111 source validity",
                          new[]
                          {
                              Color.white,
                              Color.white,
                              Color.white,
                              Color.white,
                          });'''
          new_validity = '''            RenderTexture validitySource = CreateSourceTexture(
                          "RMA-111 source validity",
                          new[]
                          {
                              new Color32(255, 255, 255, 255),
                              new Color32(255, 255, 255, 255),
                              new Color32(255, 255, 255, 255),
                              new Color32(255, 255, 255, 255),
                          });'''
          if test_text.count(old_validity) != 1:
              raise SystemExit("Expected exactly one RMA-111 validity texture block")
          test_path.write_text(
              test_text.replace(old_validity, new_validity, 1),
              encoding="utf-8")

          java_path = Path(
              "Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/src/main/java/"
              "com/ekkus93/weachy/camera/ReachyMlKitTrackingBridge.java")
          java = java_path.read_text(encoding="utf-8")
          old_start = '''        InputImage image = InputImage.fromBitmap(bitmap, 0);
                  Task<List<Face>> faceTask = faceDetector.process(image);
                  Task<SegmentationMask> personTask = personSegmenter.process(image);
                  faceTask
                          .addOnSuccessListener(faces -> completeFaces(state, faces))
                          .addOnFailureListener(error -> failPart(state, "face_detection_failed", error));
                  personTask
                          .addOnSuccessListener(mask -> completePerson(state, mask))
                          .addOnFailureListener(error -> failPart(state, "person_segmentation_failed", error));'''
          new_start = '''        InputImage image = InputImage.fromBitmap(bitmap, 0);
                  Task<List<Face>> faceTask;
                  try {
                      faceTask = faceDetector.process(image);
                  } catch (Exception error) {
                      failImmediately(state, "face_detection_start_failed", error);
                      return;
                  }
                  faceTask
                          .addOnSuccessListener(faces -> completeFaces(state, faces))
                          .addOnFailureListener(error -> failPart(state, "face_detection_failed", error));

                  Task<SegmentationMask> personTask;
                  try {
                      personTask = personSegmenter.process(image);
                  } catch (Exception error) {
                      failPart(state, "person_segmentation_start_failed", error);
                      return;
                  }
                  personTask
                          .addOnSuccessListener(mask -> completePerson(state, mask))
                          .addOnFailureListener(error -> failPart(state, "person_segmentation_failed", error));'''
          if java.count(old_start) != 1:
              raise SystemExit("Expected exactly one ML Kit task start block")
          java = java.replace(old_start, new_start, 1)

          marker = '''    private void failPart(RequestState state, String code, Exception error) {
                  synchronized (lock) {'''
          helper = '''    private void failImmediately(
                  RequestState state,
                  String code,
                  Exception error) {
              synchronized (lock) {
                  if (!isCurrent(state)) {
                      return;
                  }
                  activeRequest = null;
                  try {
                      if (!state.cancelled && !closed) {
                          state.callback.onFailure(
                                  state.requestId,
                                  code,
                                  safeMessage(error));
                      }
                  } finally {
                      state.bitmap.recycle();
                  }
              }
          }

          private void failPart(RequestState state, String code, Exception error) {
                  synchronized (lock) {'''
          if java.count(marker) != 1:
              raise SystemExit("Expected exactly one failPart insertion point")
          java = java.replace(marker, helper, 1)
          java_path.write_text(java, encoding="utf-8")

          contracts_path = Path(
              "managed/ReachyMini.Camera.Tests/"
              "Rma111AndroidBridgeSourceContracts.cs")
          if contracts_path.exists():
              raise SystemExit(f"Permanent contract already exists: {contracts_path}")
          contracts_path.write_text('''#nullable enable

using System;
using System.IO;

namespace ReachyMini.Camera.Tests
{
    internal static class Rma111AndroidBridgeSourceContracts
    {
        private const string RelativeBridgePath =
            "Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/" +
            "src/main/java/com/ekkus93/weachy/camera/" +
            "ReachyMlKitTrackingBridge.java";

        internal static void Run()
        {
            string repositoryRoot = FindRepositoryRoot();
            string sourcePath = Path.Combine(
                repositoryRoot,
                RelativeBridgePath.Replace('/', Path.DirectorySeparatorChar));
            string source = File.ReadAllText(sourcePath);

            int faceStart = RequireAfter(
                source,
                "faceTask = faceDetector.process(image);",
                0,
                "face task start");
            int faceListeners = RequireAfter(
                source,
                "faceTask\n                .addOnSuccessListener",
                faceStart,
                "face listener attachment");
            int personStart = RequireAfter(
                source,
                "personTask = personSegmenter.process(image);",
                faceListeners,
                "person task start");
            _ = RequireAfter(
                source,
                "personTask\n                .addOnSuccessListener",
                personStart,
                "person listener attachment");

            RequireText(
                source,
                "failImmediately(state, \"face_detection_start_failed\", error);",
                "face synchronous-start failure cleanup");
            RequireText(
                source,
                "failPart(state, \"person_segmentation_start_failed\", error);",
                "person synchronous-start failure drain");
            RequireText(
                source,
                "private void failImmediately(",
                "immediate failure cleanup helper");
            RequireText(
                source,
                "activeRequest = null;",
                "active request release");
            RequireText(
                source,
                "state.bitmap.recycle();",
                "bitmap release");
        }

        private static string FindRepositoryRoot()
        {
            DirectoryInfo? current =
                new DirectoryInfo(Directory.GetCurrentDirectory());
            while (current != null)
            {
                string projectVersion = Path.Combine(
                    current.FullName,
                    "ProjectSettings",
                    "ProjectVersion.txt");
                string bridge = Path.Combine(
                    current.FullName,
                    RelativeBridgePath.Replace(
                        '/',
                        Path.DirectorySeparatorChar));
                if (File.Exists(projectVersion) && File.Exists(bridge))
                {
                    return current.FullName;
                }
                current = current.Parent;
            }
            throw new InvalidOperationException(
                "Could not locate the repository root for the RMA-111 Android bridge source contract.");
        }

        private static int RequireAfter(
            string source,
            string expected,
            int startIndex,
            string contract)
        {
            int index = source.IndexOf(
                expected,
                startIndex,
                StringComparison.Ordinal);
            if (index < 0)
            {
                throw new InvalidOperationException(
                    $"Managed RMA-111 source contract failed: {contract}.");
            }
            return index;
        }

        private static void RequireText(
            string source,
            string expected,
            string contract)
        {
            if (!source.Contains(expected, StringComparison.Ordinal))
            {
                throw new InvalidOperationException(
                    $"Managed RMA-111 source contract failed: {contract}.");
            }
        }
    }
}
''', encoding="utf-8")

          managed_path = Path(
              "managed/ReachyMini.Camera.Tests/"
              "Rma111LightweightTrackingContracts.cs")
          managed = managed_path.read_text(encoding="utf-8")
          old_call = '''            TrackingPixelsRequireExactColorAndValidityLengths();
                      StableIdsSurviveMotionAndProviderIdDrift();'''
          new_call = '''            TrackingPixelsRequireExactColorAndValidityLengths();
                      Rma111AndroidBridgeSourceContracts.Run();
                      StableIdsSurviveMotionAndProviderIdDrift();'''
          if managed.count(old_call) != 1:
              raise SystemExit("Expected exactly one RMA-111 contract call site")
          managed_path.write_text(
              managed.replace(old_call, new_call, 1),
              encoding="utf-8")

          workflow_path = Path(
              ".github/workflows/rma111-mlkit-start-repair.yml")
          if not workflow_path.is_file():
              raise SystemExit("One-use repair workflow is missing from checkout")
          workflow_path.unlink()
          PY

      - name: Verify exact repair shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test = Path(
              "Assets/ReachyMini/Tests/Editor/ReachyLightweightTrackingTests.cs"
          ).read_text(encoding="utf-8")
          block_start = test.index('"RMA-111 source validity"')
          block_end = test.index('});', block_start)
          block = test[block_start:block_end]
          if block.count("new Color32(255, 255, 255, 255)") != 4:
              raise SystemExit("Validity test does not contain four Color32 pixels")
          if "Color.white" in block:
              raise SystemExit("Color[] inference remains in the validity test")

          java = Path(
              "Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/src/main/java/"
              "com/ekkus93/weachy/camera/ReachyMlKitTrackingBridge.java"
          ).read_text(encoding="utf-8")
          required_once = [
              'failImmediately(state, "face_detection_start_failed", error);',
              'failPart(state, "person_segmentation_start_failed", error);',
              'private void failImmediately(',
          ]
          for expected in required_once:
              count = java.count(expected)
              if count != 1:
                  raise SystemExit(
                      f"Expected one {expected!r} in bridge, found {count}")
          face_start = java.index("faceTask = faceDetector.process(image);")
          face_listeners = java.index(
              "faceTask\n                .addOnSuccessListener",
              face_start)
          person_start = java.index(
              "personTask = personSegmenter.process(image);",
              face_listeners)
          person_listeners = java.index(
              "personTask\n                .addOnSuccessListener",
              person_start)
          if not face_start < face_listeners < person_start < person_listeners:
              raise SystemExit("ML Kit task/listener ordering contract is broken")

          contracts = Path(
              "managed/ReachyMini.Camera.Tests/"
              "Rma111AndroidBridgeSourceContracts.cs")
          if not contracts.is_file():
              raise SystemExit("Permanent Android bridge source contract is missing")
          if Path(
              ".github/workflows/rma111-mlkit-start-repair.yml").exists():
              raise SystemExit("One-use repair workflow was not removed")
          PY

      - name: Run managed RMA contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet run \
            --project managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj \
            --configuration Release

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'RMA-111: harden ML Kit task startup'
          git push origin HEAD:master

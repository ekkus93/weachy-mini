name: One-use RMA-111 ML Kit start repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma111-mlkit-start-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply fail-closed RMA-111 repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rma111_mlkit_start_repair.py

      - name: Run managed RMA contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet run \
            --project managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj \
            --configuration Release

      - name: Verify scoped repository diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=(
            .github/rma111_mlkit_start_repair.py
            .github/workflows/rma111-mlkit-start-repair.yml
            Assets/Plugins/Android/ReachyCameraDiscovery.androidlib/src/main/java/com/ekkus93/weachy/camera/ReachyMlKitTrackingBridge.java
            Assets/ReachyMini/Tests/Editor/ReachyLightweightTrackingTests.cs
            managed/ReachyMini.Camera.Tests/Rma111AndroidBridgeSourceContracts.cs
            managed/ReachyMini.Camera.Tests/Rma111LightweightTrackingContracts.cs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected RMA-111 repair diff.\nChanged:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'RMA-111: harden ML Kit task startup'
          git push origin HEAD:master

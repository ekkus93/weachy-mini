name: One-use RMA-111 namespace repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma111-namespace-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply fail-closed namespace repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime_files = [
              Path("Assets/ReachyMini/Runtime/Application/ReachyAndroidMlKitTrackingBackend.cs"),
              Path("Assets/ReachyMini/Runtime/Application/ReachyRma111Fixture.generated.cs"),
              Path("Assets/ReachyMini/Runtime/Application/ReachyRma111TrackingAcceptance.cs"),
              Path("Assets/ReachyMini/Runtime/Application/ReachyUnityTrackingFrameResources.cs"),
          ]
          old_namespace = "namespace ReachyMini.Application"
          new_namespace = "namespace ReachyMini.AppState"
          for path in runtime_files:
              text = path.read_text(encoding="utf-8")
              count = text.count(old_namespace)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one {old_namespace!r}, found {count}")
              path.write_text(
                  text.replace(old_namespace, new_namespace, 1),
                  encoding="utf-8")

          test_path = Path(
              "Assets/ReachyMini/Tests/Editor/ReachyLightweightTrackingTests.cs")
          test_text = test_path.read_text(encoding="utf-8")
          old_using = "using ReachyMini.Application;"
          new_using = "using ReachyMini.AppState;"
          count = test_text.count(old_using)
          if count != 1:
              raise SystemExit(
                  f"{test_path}: expected exactly one {old_using!r}, found {count}")
          test_path.write_text(
              test_text.replace(old_using, new_using, 1),
              encoding="utf-8")

          backend_path = runtime_files[0]
          backend = backend_path.read_text(encoding="utf-8")
          old_field = "        private bool disposed;"
          new_field = (
              "#if UNITY_ANDROID && !UNITY_EDITOR\n"
              "        private bool disposed;\n"
              "#endif")
          count = backend.count(old_field)
          if count != 1:
              raise SystemExit(
                  f"{backend_path}: expected exactly one disposed field, found {count}")
          backend = backend.replace(old_field, new_field, 1)

          old_editor_dispose = "#else\n            disposed = true;\n#endif"
          count = backend.count(old_editor_dispose)
          if count != 1:
              raise SystemExit(
                  f"{backend_path}: expected exactly one editor dispose branch, found {count}")
          backend = backend.replace(old_editor_dispose, "#endif", 1)
          backend_path.write_text(backend, encoding="utf-8")

          workflow_path = Path(
              ".github/workflows/rma111-namespace-repair.yml")
          if not workflow_path.is_file():
              raise SystemExit("One-use repair workflow is missing from its checkout")
          workflow_path.unlink()
          PY

      - name: Verify scoped source contracts
        shell: bash
        run: |
          set -euo pipefail
          runtime_files=(
            Assets/ReachyMini/Runtime/Application/ReachyAndroidMlKitTrackingBackend.cs
            Assets/ReachyMini/Runtime/Application/ReachyRma111Fixture.generated.cs
            Assets/ReachyMini/Runtime/Application/ReachyRma111TrackingAcceptance.cs
            Assets/ReachyMini/Runtime/Application/ReachyUnityTrackingFrameResources.cs
          )
          if grep -F --line-number 'namespace ReachyMini.Application' "${runtime_files[@]}"; then
            echo 'Legacy collision-producing namespace remains.' >&2
            exit 1
          fi
          for path in "${runtime_files[@]}"; do
            count="$(grep -F -c 'namespace ReachyMini.AppState' "${path}")"
            if [[ "${count}" != 1 ]]; then
              printf '%s has %s ReachyMini.AppState namespace declarations.\n' \
                "${path}" "${count}" >&2
              exit 1
            fi
          done
          grep -F -q 'using ReachyMini.AppState;' \
            Assets/ReachyMini/Tests/Editor/ReachyLightweightTrackingTests.cs
          if grep -F -q 'using ReachyMini.Application;' \
            Assets/ReachyMini/Tests/Editor/ReachyLightweightTrackingTests.cs; then
            echo 'Editor test still imports the collision-producing namespace.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          backend = Path(
              "Assets/ReachyMini/Runtime/Application/ReachyAndroidMlKitTrackingBackend.cs"
          ).read_text(encoding="utf-8")
          required = (
              "#if UNITY_ANDROID && !UNITY_EDITOR\n"
              "        private bool disposed;\n"
              "#endif")
          if backend.count(required) != 1:
              raise SystemExit("Android-only disposed field guard is not exact")
          if "#else\n            disposed = true;\n#endif" in backend:
              raise SystemExit("Dead non-Android disposed assignment remains")
          PY

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/ReachyMini/Runtime/Application/ReachyAndroidMlKitTrackingBackend.cs \
            Assets/ReachyMini/Runtime/Application/ReachyRma111Fixture.generated.cs \
            Assets/ReachyMini/Runtime/Application/ReachyRma111TrackingAcceptance.cs \
            Assets/ReachyMini/Runtime/Application/ReachyUnityTrackingFrameResources.cs \
            Assets/ReachyMini/Tests/Editor/ReachyLightweightTrackingTests.cs \
            .github/workflows/rma111-namespace-repair.yml
          git diff --cached --check
          git commit -m 'RMA-111: fix Unity application namespace collision'
          git push origin HEAD:master

name: RMA-111 Package Absence Repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma111-package-absence-repair.yml

permissions:
  contents: write

concurrency:
  group: rma111-package-absence-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply fail-closed Android 8 absence repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rma111_package_absence_repair.py
          bash -n scripts/run_unity_authoritative_rendering_acceptance_android_impl.sh
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            managed/ReachyMini.Camera.Tests/Rma111AndroidBridgeSourceContracts.cs
            scripts/run_unity_authoritative_rendering_acceptance_android_impl.sh
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected repair scope.\nExpected: %s\nActual: %s\n' \
              "${expected[*]}" "${changed[*]}" >&2
            exit 1
          fi

      - name: Commit repair to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add \
            managed/ReachyMini.Camera.Tests/Rma111AndroidBridgeSourceContracts.cs \
            scripts/run_unity_authoritative_rendering_acceptance_android_impl.sh
          git commit -m 'fix: accept verified Android 8 package absence'
          git push origin HEAD:master

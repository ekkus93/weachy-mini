name: RMA-111 Source Retry

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma111-source-retry.yml'

permissions:
  contents: write

concurrency:
  group: rma111-source-applicator
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify, repair, validate, and commit RMA-111 source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rma111_retry_wrapper.py

# Attempt 5 keeps all analyzers enabled and fixes test ownership/usage.

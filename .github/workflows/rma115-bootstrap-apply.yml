name: RMA-115 Bootstrap Apply

on:
  push:
    branches:
      - agent/rma115-bootstrap
    paths:
      - ".github/rma115-bootstrap/**"
      - ".github/workflows/rma115-bootstrap-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rma115-bootstrap-apply
  cancel-in-progress: false

jobs:
  apply-validated-archive:
    name: Decode, validate, test, and commit RMA-115
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact bootstrap commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Decode and safely extract candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import io
          import pathlib
          import tarfile

          root = pathlib.Path.cwd().resolve()
          bootstrap = root / ".github" / "rma115-bootstrap"
          parts = sorted(bootstrap.glob("part-*"))
          expected = [bootstrap / f"part-{index:02d}" for index in range(len(parts))]
          if not parts or parts != expected:
              raise SystemExit("bootstrap parts are missing, duplicated, or non-contiguous")

          encoded = "".join(part.read_text(encoding="utf-8") for part in parts)
          try:
              payload = base64.b64decode("".join(encoded.split()), validate=True)
          except Exception as exc:
              raise SystemExit(f"bootstrap payload is not valid base64: {exc}") from exc

          if len(payload) > 8 * 1024 * 1024:
              raise SystemExit("bootstrap archive exceeds the 8 MiB safety limit")

          allowed_exact = {
              "docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md",
          }
          allowed_prefixes = (
              "Assets/ReachyMini/Runtime/Core/Perception/",
              "managed/ReachyMini.CloudVlm.Tests/",
              "managed/ReachyMini.OpenAiVlm.Tests/",
              "docs/architecture/",
              "docs/validation/",
              ".github/workflows/rma115-",
          )

          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("bootstrap archive is empty")
              seen = set()
              total_size = 0
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  normalized = str(path)
                  if path.is_absolute() or ".." in path.parts or normalized in seen:
                      raise SystemExit(f"unsafe or duplicate archive path: {member.name}")
                  seen.add(normalized)
                  if member.isdir():
                      continue
                  if not member.isfile():
                      raise SystemExit(f"archive contains a non-regular entry: {member.name}")
                  if normalized not in allowed_exact and not normalized.startswith(allowed_prefixes):
                      raise SystemExit(f"archive path is outside the RMA-115 allow-list: {member.name}")
                  if member.size > 2 * 1024 * 1024:
                      raise SystemExit(f"archive member exceeds 2 MiB: {member.name}")
                  total_size += member.size
              if total_size > 8 * 1024 * 1024:
                  raise SystemExit("expanded RMA-115 files exceed 8 MiB")
              print("Validated archive members:")
              for member in members:
                  print(member.name)
              archive.extractall(root)
          PY

      - name: Verify extracted scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            { git diff --name-only; git ls-files --others --exclude-standard; } |
              sort -u
          )
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              Assets/ReachyMini/Runtime/Core/Perception/*|managed/ReachyMini.CloudVlm.Tests/*|managed/ReachyMini.OpenAiVlm.Tests/*|docs/architecture/*|docs/validation/*|docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md|.github/workflows/rma115-*|.github/rma115-bootstrap/*)
                ;;
              *)
                echo "Unexpected extracted path: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Build managed core with warnings as errors
        run: >-
          dotnet build
          managed/ReachyMini.Core/ReachyMini.Core.csproj
          --configuration Release
          --warnaserror

      - name: Run extracted RMA-115 contract project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(
            find managed -mindepth 2 -maxdepth 2 -type f \
              \( -path '*/ReachyMini.CloudVlm.Tests/*.csproj' -o \
                 -path '*/ReachyMini.OpenAiVlm.Tests/*.csproj' \) |
              sort
          )
          if [[ ${#projects[@]} -ne 1 ]]; then
            printf 'Expected exactly one RMA-115 test project, found %s\n' "${#projects[@]}" >&2
            printf '%s\n' "${projects[@]}" >&2
            exit 1
          fi
          dotnet run --project "${projects[0]}" --configuration Release

      - name: Validate permanent workflow and documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflows = sorted(Path('.github/workflows').glob('rma115-*.yml'))
          workflows = [path for path in workflows if path.name != 'rma115-bootstrap-apply.yml']
          if len(workflows) != 1:
              raise SystemExit(f"expected exactly one permanent RMA-115 workflow, found {len(workflows)}")
          text = workflows[0].read_text(encoding='utf-8')
          required = (
              'dotnet build',
              'dotnet run',
              'RMA-115',
              'upload-artifact@v4',
              'github.sha',
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f"permanent RMA-115 workflow is missing {token!r}")

          todo = Path('docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md').read_text(encoding='utf-8')
          section = todo.split('## RMA-115', 1)[1].split('\n---\n', 1)[0]
          if '**Status:** Complete' not in section:
              raise SystemExit('RMA-115 TODO status was not completed')
          if section.count('- [x]') < 8:
              raise SystemExit('RMA-115 TODO acceptance checklist is incomplete')

          sources = list(Path('Assets/ReachyMini/Runtime/Core/Perception').glob('*VisionLanguage*.cs'))
          candidate = '\n'.join(path.read_text(encoding='utf-8') for path in sources)
          for forbidden in ('Process.Start', 'WebRequest.Create', 'AutomaticProviderFallbackEnabled => true'):
              if forbidden in candidate:
                  raise SystemExit(f'forbidden fallback surface found: {forbidden}')
          if not re.search(r'Responses|ChatCompletions|Chat Completions', candidate):
              raise SystemExit('endpoint-style adapter contract is missing')
          PY

      - name: Remove bootstrap-only files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/rma115-bootstrap
          rm -f .github/workflows/rma115-bootstrap-apply.yml

      - name: Commit validated RMA-115 source to disposable branch
        shell: bash
        env:
          TARGET_BRANCH: agent/rma115-bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated RMA-115 changes were produced." >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -E '^\.github/rma115-bootstrap/|^\.github/workflows/rma115-bootstrap-apply\.yml$'; then
            echo "Bootstrap-only files remain staged." >&2
            exit 1
          fi
          git commit -m "feat: implement RMA-115 cloud VLM adapters"
          git push origin "HEAD:${TARGET_BRANCH}"

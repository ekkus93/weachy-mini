name: RMA-115 Bootstrap Diagnose

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/rma115-bootstrap/**"
      - ".github/workflows/rma115-bootstrap-diagnose.yml"

permissions:
  contents: read

jobs:
  inspect-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Inspect recoverable tar stream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import io
          import pathlib
          import tarfile
          import zlib

          parts = sorted(pathlib.Path('.github/rma115-bootstrap').glob('part-*'))
          encoded = ''.join(path.read_text(encoding='utf-8') for path in parts)
          payload = base64.b64decode(''.join(encoded.split()), validate=True)
          print(f'parts={len(parts)} compressed_bytes={len(payload)}')
          decompressor = zlib.decompressobj(16 + zlib.MAX_WBITS)
          recovered = decompressor.decompress(payload)
          recovered += decompressor.flush()
          print(f'recovered_tar_bytes={len(recovered)} gzip_eof={decompressor.eof}')
          stream = io.BytesIO(recovered)
          complete = []
          while stream.tell() + 512 <= len(recovered):
              header = recovered[stream.tell():stream.tell() + 512]
              if header == b'\0' * 512:
                  print('tar_zero_block_reached=true')
                  break
              try:
                  with tarfile.open(fileobj=stream, mode='r|') as archive:
                      for member in archive:
                          print(f'member={member.name} size={member.size} type={member.type!r}')
                          if member.isfile():
                              handle = archive.extractfile(member)
                              if handle is None:
                                  raise SystemExit(f'cannot read {member.name}')
                              data = handle.read()
                              print(f'  recovered={len(data)} complete={len(data) == member.size}')
                              if len(data) == member.size:
                                  complete.append(member.name)
                      break
              except (tarfile.ReadError, EOFError) as exc:
                  print(f'tar_stream_error={type(exc).__name__}: {exc}')
                  break
          print('complete_members:')
          for name in complete:
              print(name)
          if decompressor.eof:
              raise SystemExit('unexpectedly complete archive; apply workflow should have succeeded')
          PY

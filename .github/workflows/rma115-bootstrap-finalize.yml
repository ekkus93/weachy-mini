name: RMA-115 Bootstrap Finalize

on:
  push:
    branches:
      - agent/rma115-bootstrap
    paths:
      - ".github/rma115-bootstrap/finalize.py"
      - ".github/rma115-bootstrap/test-tail.gz.b64"
      - ".github/workflows/rma115-bootstrap-finalize.yml"
  pull_request:
    branches:
      - master
    paths:
      - ".github/rma115-bootstrap/finalize.py"
      - ".github/rma115-bootstrap/test-tail.gz.b64"
      - ".github/workflows/rma115-bootstrap-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rma115-bootstrap-finalize
  cancel-in-progress: true

jobs:
  finalize-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Reconstruct managed contract suite
        run: python3 .github/rma115-bootstrap/finalize.py prepare

      - name: Build managed core with warnings as errors
        run: dotnet build managed/ReachyMini.Core/ReachyMini.Core.csproj --configuration Release --warnaserror

      - name: Run all RMA-115 contracts
        run: dotnet run --project managed/ReachyMini.RemoteVlm.Tests/ReachyMini.RemoteVlm.Tests.csproj --configuration Release

      - name: Record candidate validation
        run: python3 .github/rma115-bootstrap/finalize.py record

      - name: Commit validated non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/ReachyMini/Runtime/Core/Perception/ReachyOpenAiVisionLanguageAdapters.cs \
            managed/ReachyMini.RemoteVlm.Tests/Program.cs \
            managed/ReachyMini.RemoteVlm.Tests/README.md \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md \
            docs/validation/RMA_115_OPENAI_COMPATIBLE_VLM_ADAPTERS_VALIDATION_2026-08-06.md
          git add -f managed/ReachyMini.RemoteVlm.Tests/ReachyMini.RemoteVlm.Tests.csproj
          git commit -m "feat: complete RMA-115 managed contracts"
          git push origin HEAD:agent/rma115-bootstrap

name: RMA-115 Bootstrap Recover

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/rma115-bootstrap/**"
      - ".github/workflows/rma115-bootstrap-recover.yml"

permissions:
  contents: read

jobs:
  recover-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Recover complete members and test prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import pathlib
          import zlib

          root = pathlib.Path.cwd().resolve()
          output = root / 'artifacts' / 'rma115-recovery'
          output.mkdir(parents=True, exist_ok=True)
          parts = sorted((root / '.github' / 'rma115-bootstrap').glob('part-*'))
          encoded = ''.join(path.read_text(encoding='utf-8') for path in parts)
          payload = base64.b64decode(''.join(encoded.split()), validate=True)
          decompressor = zlib.decompressobj(16 + zlib.MAX_WBITS)
          tar_bytes = decompressor.decompress(payload) + decompressor.flush()

          allowed = {
              '.github/workflows/rma115-openai-vlm-adapters.yml',
              'Assets/ReachyMini/Runtime/Core/Perception/ReachyOpenAiVisionLanguageAdapters.cs',
              'Assets/ReachyMini/Runtime/Core/Perception/ReachyOpenAiVisionLanguageAdapters.cs.meta',
              'docs/architecture/OPENAI_COMPATIBLE_VLM_ADAPTERS.md',
          }
          partial_name = 'managed/ReachyMini.RemoteVlm.Tests/Program.cs'
          complete = []
          partial_bytes = 0
          offset = 0
          while offset + 512 <= len(tar_bytes):
              header = tar_bytes[offset:offset + 512]
              if header == b'\0' * 512:
                  break
              name = header[0:100].split(b'\0', 1)[0].decode('utf-8')
              size = int((header[124:136].split(b'\0', 1)[0].strip() or b'0'), 8)
              data_start = offset + 512
              data = tar_bytes[data_start:min(data_start + size, len(tar_bytes))]
              destination = output / pathlib.PurePosixPath(name)
              if len(data) == size and name in allowed:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  complete.append(name)
              elif name == partial_name:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  partial_bytes = len(data)
                  break
              elif len(data) != size:
                  break
              offset = data_start + ((size + 511) // 512) * 512

          expected = [
              '.github/workflows/rma115-openai-vlm-adapters.yml',
              'Assets/ReachyMini/Runtime/Core/Perception/ReachyOpenAiVisionLanguageAdapters.cs',
              'Assets/ReachyMini/Runtime/Core/Perception/ReachyOpenAiVisionLanguageAdapters.cs.meta',
              'docs/architecture/OPENAI_COMPATIBLE_VLM_ADAPTERS.md',
          ]
          if complete != expected or partial_bytes == 0:
              raise SystemExit(
                  f'unexpected recovery: complete={complete!r}, partial={partial_bytes}')
          report = '\n'.join([
              f'compressed_bytes={len(payload)}',
              f'recovered_tar_bytes={len(tar_bytes)}',
              f'gzip_eof={decompressor.eof}',
              f'partial_program_bytes={partial_bytes}',
              *[f'complete={name}' for name in complete],
              '',
          ])
          (output / 'report.txt').write_text(report, encoding='utf-8')
          print(report)
          PY
      - name: Upload recovered candidate
        uses: actions/upload-artifact@v4
        with:
          name: rma115-interrupted-candidate-${{ github.event.pull_request.head.sha }}
          path: artifacts/rma115-recovery
          if-no-files-found: error
          retention-days: 7

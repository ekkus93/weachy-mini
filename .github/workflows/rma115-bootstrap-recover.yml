name: RMA-115 Bootstrap Recover

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/rma115-bootstrap/**"
      - ".github/workflows/rma115-bootstrap-recover.yml"

permissions:
  contents: write

jobs:
  recover-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Recover source, documentation, and test prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import pathlib
          import zlib

          root = pathlib.Path.cwd().resolve()
          parts = sorted((root / '.github' / 'rma115-bootstrap').glob('part-*'))
          encoded = ''.join(path.read_text(encoding='utf-8') for path in parts)
          payload = base64.b64decode(''.join(encoded.split()), validate=True)
          decompressor = zlib.decompressobj(16 + zlib.MAX_WBITS)
          tar_bytes = decompressor.decompress(payload) + decompressor.flush()

          wanted_complete = {
              'Assets/ReachyMini/Runtime/Core/Perception/ReachyOpenAiVisionLanguageAdapters.cs',
              'Assets/ReachyMini/Runtime/Core/Perception/ReachyOpenAiVisionLanguageAdapters.cs.meta',
              'docs/architecture/OPENAI_COMPATIBLE_VLM_ADAPTERS.md',
          }
          partial_name = 'managed/ReachyMini.RemoteVlm.Tests/Program.cs'
          complete = []
          partial_bytes = 0
          offset = 0
          while offset + 512 <= len(tar_bytes):
              header = tar_bytes[offset:offset + 512]
              if header == b'\0' * 512:
                  break
              name = header[0:100].split(b'\0', 1)[0].decode('utf-8')
              size = int((header[124:136].split(b'\0', 1)[0].strip() or b'0'), 8)
              data_start = offset + 512
              data = tar_bytes[data_start:min(data_start + size, len(tar_bytes))]
              if len(data) == size and name in wanted_complete:
                  destination = root / pathlib.PurePosixPath(name)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  complete.append(name)
              elif name == partial_name:
                  destination = root / pathlib.PurePosixPath(name)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  partial_bytes = len(data)
                  break
              elif len(data) != size:
                  break
              offset = data_start + ((size + 511) // 512) * 512

          if set(complete) != wanted_complete or partial_bytes != 48048:
              raise SystemExit(
                  f'unexpected recovery: complete={complete!r}, partial={partial_bytes}')
          source = (root / 'Assets/ReachyMini/Runtime/Core/Perception/ReachyOpenAiVisionLanguageAdapters.cs').read_text(encoding='utf-8')
          if source.count('RemoteVlmImageFormat format,') != 1:
              raise SystemExit('recovered adapter has an invalid format parameter declaration')
          print(f'recovered exact adapter, docs, metadata, and {partial_bytes}-byte test prefix')
          PY
      - name: Commit recovered non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/ReachyMini/Runtime/Core/Perception/ReachyOpenAiVisionLanguageAdapters.cs \
            Assets/ReachyMini/Runtime/Core/Perception/ReachyOpenAiVisionLanguageAdapters.cs.meta \
            docs/architecture/OPENAI_COMPATIBLE_VLM_ADAPTERS.md \
            managed/ReachyMini.RemoteVlm.Tests/Program.cs
          git commit -m "chore: recover interrupted RMA-115 source"
          git push origin HEAD:agent/rma115-bootstrap

name: RMA-121 Android on-device ASR

on:
  push:
    branches:
      - master
    paths:
      - 'Assets/ReachyMini/Runtime/Core/Speech/**'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidOnDeviceAsrPlatform.cs'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidOnDeviceAsrPlatform.cs.meta'
      - 'Assets/Plugins/Android/ReachyOnDeviceAsr.androidlib/**'
      - 'android-plugin/**'
      - 'managed/ReachyMini.AndroidOnDeviceAsr.Tests/**'
      - 'docs/architecture/ANDROID_ON_DEVICE_ASR.md'
      - 'docs/validation/RMA_121_ANDROID_ON_DEVICE_ASR_VALIDATION_2026-08-07.md'
      - 'docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md'
      - '.github/workflows/rma121-android-on-device-asr.yml'
  pull_request:
    paths:
      - 'Assets/ReachyMini/Runtime/Core/Speech/**'
      - 'Assets/ReachyMini/Runtime/Application/ReachyAndroidOnDeviceAsrPlatform.cs'
      - 'Assets/Plugins/Android/ReachyOnDeviceAsr.androidlib/**'
      - 'android-plugin/**'
      - 'managed/ReachyMini.AndroidOnDeviceAsr.Tests/**'
      - '.github/workflows/rma121-android-on-device-asr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Validate RMA-121 contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build managed core with warnings as errors
        run: dotnet build managed/ReachyMini.Core/ReachyMini.Core.csproj --configuration Release --warnaserror
      - name: Run deterministic Android on-device ASR contracts
        run: dotnet run --project managed/ReachyMini.AndroidOnDeviceAsr.Tests/ReachyMini.AndroidOnDeviceAsr.Tests.csproj --configuration Release

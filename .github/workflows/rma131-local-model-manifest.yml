name: RMA-131 local model manifest

on:
  push:
    branches:
      - master
    paths:
      - 'Assets/ReachyMini/Runtime/Core/LocalModels/**'
      - 'managed/ReachyMini.LocalModelManifest.Tests/**'
      - 'models/manifests/local-llm-manifest.schema.json'
      - 'models/manifests/examples/rma131-synthetic-experimental.local-llm.json'
      - 'models/manifests/README.md'
      - 'scripts/validate_local_llm_manifest.py'
      - 'scripts/tests/test_rma131_local_model_manifest.py'
      - 'docs/architecture/LOCAL_LLM_MODEL_MANIFEST.md'
      - 'docs/validation/RMA_131_LOCAL_MODEL_MANIFEST_VALIDATION_2026-08-07.md'
      - 'docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md'
      - '.github/workflows/rma131-local-model-manifest.yml'
  pull_request:
    paths:
      - 'Assets/ReachyMini/Runtime/Core/LocalModels/**'
      - 'managed/ReachyMini.LocalModelManifest.Tests/**'
      - 'models/manifests/local-llm-manifest.schema.json'
      - 'models/manifests/examples/rma131-synthetic-experimental.local-llm.json'
      - 'models/manifests/README.md'
      - 'scripts/validate_local_llm_manifest.py'
      - 'scripts/tests/test_rma131_local_model_manifest.py'
      - 'docs/architecture/LOCAL_LLM_MODEL_MANIFEST.md'
      - 'docs/validation/RMA_131_LOCAL_MODEL_MANIFEST_VALIDATION_2026-08-07.md'
      - 'docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md'
      - '.github/workflows/rma131-local-model-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rma131-local-model-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate RMA-131 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "RMA-131 Local Model Manifest",
              description: "Local model manifest validation is running"
            });

      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build managed core with warnings as errors
        run: >-
          dotnet build
          managed/ReachyMini.Core/ReachyMini.Core.csproj
          --configuration Release
          --warnaserror

      - name: Run managed local-model manifest contracts
        run: >-
          dotnet run
          --project managed/ReachyMini.LocalModelManifest.Tests/ReachyMini.LocalModelManifest.Tests.csproj
          --configuration Release

      - name: Run deterministic JSON-manifest contracts
        run: python3 scripts/tests/test_rma131_local_model_manifest.py

      - name: Validate committed synthetic manifest without network
        run: >-
          python3 scripts/validate_local_llm_manifest.py
          models/manifests/examples/rma131-synthetic-experimental.local-llm.json

      - name: Parse manifest schema and fixture
        run: |
          python3 -m json.tool models/manifests/local-llm-manifest.schema.json > /dev/null
          python3 -m json.tool \
            models/manifests/examples/rma131-synthetic-experimental.local-llm.json \
            > /dev/null

      - name: Create exact-SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/rma131-local-model-manifest"
          mkdir -p "$OUT"
          sha256sum \
            Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalModelManifest.cs \
            managed/ReachyMini.LocalModelManifest.Tests/Program.cs \
            managed/ReachyMini.LocalModelManifest.Tests/ReachyMini.LocalModelManifest.Tests.csproj \
            models/manifests/local-llm-manifest.schema.json \
            models/manifests/examples/rma131-synthetic-experimental.local-llm.json \
            scripts/validate_local_llm_manifest.py \
            scripts/tests/test_rma131_local_model_manifest.py \
            docs/architecture/LOCAL_LLM_MODEL_MANIFEST.md \
            docs/validation/RMA_131_LOCAL_MODEL_MANIFEST_VALIDATION_2026-08-07.md \
            > "$OUT/source-sha256.txt"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "status": "passed",
              "commit_sha": os.environ["GITHUB_SHA"],
              "rma": "RMA-131",
              "schema_version": 1,
              "runtime_id": "reachy_llama",
              "runtime_abi_version": 1,
              "android_abis": ["arm64-v8a"],
              "minimum_android_api_floor": 26,
              "managed_contract_groups": 7,
              "json_contract_groups": 7,
              "synthetic_fixture_only": True,
              "real_model_selected": False,
              "model_payload_bundled": False,
              "automatic_download_or_install": False,
              "network_required_for_local_inference": False,
              "catalog_default_or_fallback_model": False,
              "candidate_ids_hard_coded_in_settings_ui": False,
          }
          Path("artifacts/rma131-local-model-manifest/report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload RMA-131 evidence
        uses: actions/upload-artifact@v4
        with:
          name: rma131-local-model-manifest-${{ github.sha }}
          path: artifacts/rma131-local-model-manifest
          if-no-files-found: error
          retention-days: 30

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? "success" : "failure",
              context: "RMA-131 Local Model Manifest",
              description: succeeded
                ? "Local model manifest contracts passed"
                : "Local model manifest contracts failed"
            });

name: RMA-132 orphan cleanup hardening

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma132-orphan-cleanup-fix.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Harden staging orphan cleanup and test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          decode = lambda value: base64.b64decode(value).decode("utf-8")

          manager_path = Path("Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalModelPackageManager.cs")
          manager = manager_path.read_text(encoding="utf-8")
          old_call = decode("ICAgICAgICAgICAgICAgIGludCBzdGFnaW5nUmVtb3ZlZCA9IFJlbW92ZVVua25vd25IYXNoRGlyZWN0b3JpZXMoCiAgICAgICAgICAgICAgICAgICAgc3RhZ2luZ1Jvb3QsCiAgICAgICAgICAgICAgICAgICAgZXhwZWN0ZWRTdGFnaW5nUm9vdHMsCiAgICAgICAgICAgICAgICAgICAgY2FuY2VsbGF0aW9uVG9rZW4pOwo=")
          new_call = decode("ICAgICAgICAgICAgICAgIGludCBzdGFnaW5nUmVtb3ZlZCA9IFJlbW92ZVN0YWdpbmdPcnBoYW5zKAogICAgICAgICAgICAgICAgICAgIHN0YWdpbmdSb290LAogICAgICAgICAgICAgICAgICAgIGV4cGVjdGVkU3RhZ2luZ1Jvb3RzLAogICAgICAgICAgICAgICAgICAgIGNhbmNlbGxhdGlvblRva2VuKTsK")
          if manager.count(old_call) != 1:
              raise SystemExit("staging cleanup call anchor drifted")
          manager = manager.replace(old_call, new_call)
          start = manager.index("        private int RemoveUnknownHashDirectories(\n")
          end = manager.index("        private int RemoveInstalledOrphans(\n", start)
          new_function = decode("")
          manager = manager[:start] + new_function + manager[end:]
          manager_path.write_text(manager, encoding="utf-8")

          test_path = Path("managed/ReachyMini.LocalModelPackages.Tests/Program.cs")
          test = test_path.read_text(encoding="utf-8")
          anchor = decode("")
          replacement = decode("")
          if test.count(anchor) != 1:
              raise SystemExit("cleanup test setup anchor drifted")
          test = test.replace(anchor, replacement)
          old_asserts = decode("")
          new_asserts = decode("")
          if test.count(old_asserts) != 1:
              raise SystemExit("cleanup test assertion anchor drifted")
          test_path.write_text(test.replace(old_asserts, new_asserts), encoding="utf-8")
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = $'Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalModelPackageManager.cs\nmanaged/ReachyMini.LocalModelPackages.Tests/Program.cs'

      - name: Commit cleanup hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalModelPackageManager.cs \
            managed/ReachyMini.LocalModelPackages.Tests/Program.cs
          git diff --cached --quiet && { echo "expected cleanup hardening produced no diff" >&2; exit 1; }
          git commit -m "RMA-132: harden staging orphan cleanup"
          git push origin HEAD:master

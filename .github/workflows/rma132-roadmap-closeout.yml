name: RMA-132 roadmap closeout

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma132-roadmap-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Replace exact RMA-132 roadmap block
        shell: bash
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_B64']).decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit('RMA-132 roadmap block drifted; refusing broad rewrite')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md"

      - name: Commit exact roadmap closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          git diff --cached --quiet && { echo "expected roadmap closeout produced no diff" >&2; exit 1; }
          git commit -m "RMA-132: close roadmap task"
          git push origin HEAD:master

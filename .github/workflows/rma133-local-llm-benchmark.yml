name: RMA-133 local LLM benchmark

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rma133-local-llm-benchmark.yml'
      - 'benchmarks/rma133/**'
      - 'native/llama_runtime/benchmark/**'
      - 'native/llama_runtime/include/reachy_llama.h'
      - 'native/llama_runtime/src/**'
      - 'native/llama_runtime/tests/**'
      - 'native/llama_runtime/CMakeLists.txt'
      - 'scripts/build_llama_android.sh'
      - 'scripts/build_rma133_android_benchmark_v6.sh'
      - 'scripts/run_rma130_hosted_gate.sh'
      - 'scripts/run_rma133_device_benchmark_v6.*'
      - 'scripts/score_rma133_benchmark*.py'
      - 'scripts/tests/test_rma130_llama_runtime.py'
      - 'scripts/tests/test_rma133_*.py'
      - 'third_party/llama-cpp-source.lock.json'
      - 'toolchain.lock.json'
      - 'docs/architecture/LLAMA_CPP_ANDROID_RUNTIME*.md'
      - 'docs/architecture/RMA_133_LOCAL_LLM_BENCHMARK*.md'
      - 'docs/validation/RMA_133_CANDIDATE_SET_V*.md'
  pull_request:
    paths:
      - '.github/workflows/rma133-local-llm-benchmark.yml'
      - 'benchmarks/rma133/**'
      - 'native/llama_runtime/**'
      - 'scripts/build_llama_android.sh'
      - 'scripts/build_rma133_android_benchmark_v6.sh'
      - 'scripts/run_rma130_hosted_gate.sh'
      - 'scripts/run_rma133_device_benchmark_v6.*'
      - 'scripts/score_rma133_benchmark*.py'
      - 'scripts/tests/test_rma130_llama_runtime.py'
      - 'scripts/tests/test_rma133_*.py'
      - 'third_party/llama-cpp-source.lock.json'
      - 'toolchain.lock.json'
      - 'docs/architecture/LLAMA_CPP_ANDROID_RUNTIME*.md'
      - 'docs/architecture/RMA_133_LOCAL_LLM_BENCHMARK*.md'
      - 'docs/validation/RMA_133_CANDIDATE_SET_V*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rma133-local-llm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate V1-V6 benchmark contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate historical and V6 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            scripts.tests.test_rma133_benchmark_contract \
            scripts.tests.test_rma133_candidate_set_v2 \
            scripts.tests.test_rma133_candidate_set_v3 \
            scripts.tests.test_rma133_candidate_set_v4 \
            scripts.tests.test_rma133_candidate_set_v5 \
            scripts.tests.test_rma133_device_runner_loop \
            scripts.tests.test_rma133_constrained_v6
          python3 -m compileall -q scripts
          python3 scripts/score_rma133_benchmark.py validate \
            --config benchmarks/rma133/candidates-v5.json
          python3 scripts/score_rma133_benchmark_v6.py validate \
            --config benchmarks/rma133/candidates-v6.json \
            --cases benchmarks/rma133/behavior_cases-v2.tsv
          bash -n scripts/build_rma133_android_benchmark_v6.sh
          bash -n scripts/run_rma133_device_benchmark_v6.sh
          clang -std=c17 -fsyntax-only \
            -Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion -Wshadow -Werror \
            -Inative/llama_runtime/include \
            native/llama_runtime/benchmark/rma133_benchmark_v6.c

  native-abi2:
    name: Validate ABI-2 constrained runtime
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read exact llama.cpp pin
        id: pins
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          lock = json.loads(Path('third_party/llama-cpp-source.lock.json').read_text())
          repo = urlparse(lock['repository']).path.removesuffix('.git').strip('/')
          if repo.count('/') != 1:
              raise SystemExit('invalid pinned llama.cpp repository')
          print(f'repository={repo}')
          print(f'commit={lock["commit"]}')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.repository }}
          ref: ${{ steps.pins.outputs.commit }}
          path: upstream/llama.cpp
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Verify pin and static ABI contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_source_checkout.py \
            --source upstream/llama.cpp \
            --lock third_party/llama-cpp-source.lock.json
          python3 -m unittest -v scripts.tests.test_rma130_llama_runtime
      - name: Build and run native ABI-2 contracts
        shell: bash
        env:
          LLAMA_CPP_SOURCE_DIR: ${{ github.workspace }}/upstream/llama.cpp
          RMA130_HOST_BUILD_DIR: ${{ github.workspace }}/build/rma133-abi2-host
        run: |
          set -euo pipefail
          bash scripts/run_rma130_hosted_gate.sh
          cmake --build "$RMA130_HOST_BUILD_DIR" --target reachy_llama_constraint_contract_tests --parallel
          ctest --test-dir "$RMA130_HOST_BUILD_DIR" --output-on-failure -R '^reachy_llama_constraint_contracts$'
      - name: Run sanitizer ABI-2 contracts
        shell: bash
        env:
          LLAMA_CPP_SOURCE_DIR: ${{ github.workspace }}/upstream/llama.cpp
          REACHY_ENABLE_SANITIZERS: 'ON'
          RMA130_HOST_BUILD_DIR: ${{ github.workspace }}/build/rma133-abi2-host-sanitized
        run: |
          set -euo pipefail
          bash scripts/run_rma130_hosted_gate.sh
          cmake --build "$RMA130_HOST_BUILD_DIR" --target reachy_llama_constraint_contract_tests --parallel
          ctest --test-dir "$RMA130_HOST_BUILD_DIR" --output-on-failure -R '^reachy_llama_constraint_contracts$'

  device-benchmark:
    name: Benchmark V6 candidates on physical Android device
    if: github.event_name != 'pull_request'
    needs: [contract, native-abi2]
    runs-on: [self-hosted, linux, x64, weachy-mini-android-device]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read exact llama.cpp and Android pins
        id: pins
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          llama = json.loads(Path('third_party/llama-cpp-source.lock.json').read_text())
          android = json.loads(Path('toolchain.lock.json').read_text())['android']
          repo = urlparse(llama['repository']).path.removesuffix('.git').strip('/')
          if repo.count('/') != 1:
              raise SystemExit('invalid pinned llama.cpp repository')
          print(f'repository={repo}')
          print(f'commit={llama["commit"]}')
          print(f'ndk={android["ndk"]}')
          print(f'cmake={android["cmake"]}')
          print(f'min_sdk={android["native_feasibility_min_sdk"]}')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.repository }}
          ref: ${{ steps.pins.outputs.commit }}
          path: upstream/llama.cpp
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Resolve pinned Android toolchain
        shell: bash
        env:
          PINNED_NDK: ${{ steps.pins.outputs.ndk }}
          PINNED_CMAKE: ${{ steps.pins.outputs.cmake }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-${HOME}/Android/Sdk}}"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$sdkmanager" ]] || sdkmanager="$(command -v sdkmanager || true)"
          [[ -n "$sdkmanager" && -x "$sdkmanager" ]] || { echo 'sdkmanager unavailable' >&2; exit 1; }
          if [[ ! -f "${sdk_root}/ndk/${PINNED_NDK}/source.properties" || ! -x "${sdk_root}/cmake/${PINNED_CMAKE}/bin/cmake" ]]; then
            "$sdkmanager" --install "ndk;${PINNED_NDK}" "cmake;${PINNED_CMAKE}"
          fi
          {
            echo "ANDROID_SDK_ROOT=${sdk_root}"
            echo "ANDROID_HOME=${sdk_root}"
            echo "ANDROID_NDK_HOME=${sdk_root}/ndk/${PINNED_NDK}"
            echo "ANDROID_NDK_ROOT=${sdk_root}/ndk/${PINNED_NDK}"
          } >> "$GITHUB_ENV"
          echo "${sdk_root}/cmake/${PINNED_CMAKE}/bin" >> "$GITHUB_PATH"
      - name: Verify source and build ABI-2 Android binaries
        shell: bash
        env:
          LLAMA_CPP_SOURCE_DIR: ${{ github.workspace }}/upstream/llama.cpp
          LLAMA_ANDROID_PLATFORM: android-${{ steps.pins.outputs.min_sdk }}
          LLAMA_ANDROID_BUILD_DIR: ${{ github.workspace }}/build/rma133/llama-build
          LLAMA_ANDROID_OUTPUT_DIR: ${{ github.workspace }}/build/rma133/runtime
          RMA133_RUNTIME_DIR: ${{ github.workspace }}/build/rma133/runtime
          RMA133_BENCHMARK_OUTPUT_DIR: ${{ github.workspace }}/build/rma133/benchmark
        run: |
          set -euo pipefail
          python3 scripts/verify_source_checkout.py --source upstream/llama.cpp --lock third_party/llama-cpp-source.lock.json
          bash scripts/build_llama_android.sh
          bash scripts/build_rma133_android_benchmark_v6.sh
      - name: Benchmark candidate-set V6 and select only if gates pass
        shell: bash
        env:
          RMA133_CONFIG: ${{ github.workspace }}/benchmarks/rma133/candidates-v6.json
          RMA133_CASES: ${{ github.workspace }}/benchmarks/rma133/behavior_cases-v2.tsv
          RMA133_SYSTEM_PROMPT: ${{ github.workspace }}/benchmarks/rma133/system_prompt-v4.txt
          RMA133_GRAMMAR: ${{ github.workspace }}/benchmarks/rma133/behavior-output-v1.gbnf
          RMA133_RUNTIME_DIR: ${{ github.workspace }}/build/rma133/runtime
          RMA133_BENCHMARK_OUTPUT_DIR: ${{ github.workspace }}/build/rma133/benchmark
          RMA133_RESULTS_DIR: ${{ github.workspace }}/build/rma133/results
        run: bash scripts/run_rma133_device_benchmark_v6.sh
      - name: Upload RMA-133 V6 physical benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rma133-local-llm-benchmark-v6-${{ github.sha }}
          path: |
            benchmarks/rma133/candidates-v5.json
            benchmarks/rma133/candidates-v6.json
            benchmarks/rma133/behavior_cases-v2.tsv
            benchmarks/rma133/behavior-output-v1.gbnf
            benchmarks/rma133/system_prompt-v4.txt
            docs/validation/RMA_133_CANDIDATE_SET_V5_VALIDATION_2026-08-08.md
            build/rma133/runtime/LLAMA_BUILD_INFO.txt
            build/rma133/runtime/libreachy_llama.dynamic.txt
            build/rma133/runtime/libreachy_llama.exports.txt
            build/rma133/benchmark/rma133_benchmark_v6.dynamic.txt
            build/rma133/benchmark/rma133_benchmark_v6.sha256
            build/rma133/results
          if-no-files-found: warn
          retention-days: 30

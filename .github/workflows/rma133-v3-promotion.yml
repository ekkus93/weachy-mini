name: RMA-133 candidate-set v3 promotion

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma133-v3-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact master
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare and validate v3
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temporary_rma133_v3_promotion.py
          python -m pip install --disable-pip-version-check ruff==0.12.0
          ruff check \
            scripts/score_rma133_benchmark.py \
            scripts/tests/test_rma133_benchmark_contract.py \
            scripts/tests/test_rma133_candidate_set_v2.py \
            scripts/tests/test_rma133_candidate_set_v3.py \
            scripts/tests/test_rma133_device_runner_loop.py
          ruff format --check --diff \
            scripts/score_rma133_benchmark.py \
            scripts/tests/test_rma133_benchmark_contract.py \
            scripts/tests/test_rma133_candidate_set_v2.py \
            scripts/tests/test_rma133_candidate_set_v3.py \
            scripts/tests/test_rma133_device_runner_loop.py
          python3 -m unittest -v \
            scripts.tests.test_rma133_benchmark_contract \
            scripts.tests.test_rma133_candidate_set_v2 \
            scripts.tests.test_rma133_candidate_set_v3 \
            scripts.tests.test_rma133_device_runner_loop
          python3 scripts/score_rma133_benchmark.py validate \
            --config benchmarks/rma133/candidates-v3.json
          python3 -m compileall -q scripts
          bash -n scripts/build_rma133_android_benchmark.sh
          bash -n scripts/run_rma133_device_benchmark.sh
          clang \
            -std=c17 \
            -fsyntax-only \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Werror \
            -Inative/llama_runtime/include \
            native/llama_runtime/benchmark/rma133_benchmark.c
          git diff --check

      - name: Commit atomic v3 promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/rma133-local-llm-benchmark.yml \
            benchmarks/rma133/candidates-v3.json \
            scripts/tests/test_rma133_candidate_set_v3.py \
            docs/validation/RMA_133_CANDIDATE_SET_V2_VALIDATION_2026-08-07.md
          git diff --cached --exit-code --quiet && {
            printf '%s\n' 'RMA-133 v3 promotion produced no source changes.' >&2
            exit 1
          }
          git commit -m 'RMA-133: start candidate-set v3 benchmark'
          git push origin HEAD:master

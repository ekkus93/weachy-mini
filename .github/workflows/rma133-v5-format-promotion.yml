name: RMA-133 canonical v5 promotion

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma133-v5-format-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact master
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate, format, and validate v5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/rma133-v5-promotion.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start_marker = "          python3 - <<'PY'"
          end_marker = '          PY'
          try:
              start = lines.index(start_marker) + 1
              end = lines.index(end_marker, start)
          except ValueError as exc:
              raise SystemExit('could not extract the v5 generator from the validated helper') from exc
          body_lines = lines[start:end]
          prefix = '          '
          if any(line and not line.startswith(prefix) for line in body_lines):
              raise SystemExit('v5 generator indentation is not canonical')
          body = '\n'.join(line[len(prefix):] if line else '' for line in body_lines) + '\n'
          namespace = {'__name__': '__rma133_v5_generator__'}
          exec(compile(body, str(workflow), 'exec'), namespace)
          PY

          python -m pip install --disable-pip-version-check ruff==0.12.0
          ruff format \
            scripts/score_rma133_benchmark.py \
            scripts/tests/test_rma133_candidate_set_v5.py
          ruff check \
            scripts/score_rma133_benchmark.py \
            scripts/tests/test_rma133_benchmark_contract.py \
            scripts/tests/test_rma133_candidate_set_v2.py \
            scripts/tests/test_rma133_candidate_set_v3.py \
            scripts/tests/test_rma133_candidate_set_v4.py \
            scripts/tests/test_rma133_candidate_set_v5.py \
            scripts/tests/test_rma133_device_runner_loop.py
          ruff format --check --diff \
            scripts/score_rma133_benchmark.py \
            scripts/tests/test_rma133_benchmark_contract.py \
            scripts/tests/test_rma133_candidate_set_v2.py \
            scripts/tests/test_rma133_candidate_set_v3.py \
            scripts/tests/test_rma133_candidate_set_v4.py \
            scripts/tests/test_rma133_candidate_set_v5.py \
            scripts/tests/test_rma133_device_runner_loop.py
          python3 -m unittest -v \
            scripts.tests.test_rma133_benchmark_contract \
            scripts.tests.test_rma133_candidate_set_v2 \
            scripts.tests.test_rma133_candidate_set_v3 \
            scripts.tests.test_rma133_candidate_set_v4 \
            scripts.tests.test_rma133_candidate_set_v5 \
            scripts.tests.test_rma133_device_runner_loop
          python3 scripts/score_rma133_benchmark.py validate --config benchmarks/rma133/candidates-v5.json
          python3 -m compileall -q scripts
          git diff --check

      - name: Commit validated relaxed-size experiment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            benchmarks/rma133/candidates-v5.json \
            scripts/score_rma133_benchmark.py \
            scripts/tests/test_rma133_candidate_set_v5.py \
            docs/architecture/RMA_133_LOCAL_LLM_BENCHMARK.md \
            docs/validation/RMA_133_CANDIDATE_SET_V4_VALIDATION_2026-08-07.md \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          git diff --cached --exit-code --quiet && {
            printf '%s\n' 'RMA-133 v5 promotion produced no source changes.' >&2
            exit 1
          }
          git commit -m 'RMA-133: relax local model size constraint'
          git push origin HEAD:master

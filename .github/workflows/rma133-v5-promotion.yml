name: RMA-133 relaxed-size v5 promotion

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma133-v5-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact master
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare relaxed-size candidate set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          from pathlib import Path

          root = Path('.')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          scorer = root / 'scripts/score_rma133_benchmark.py'
          replace_once(
              scorer,
              '"""Score and select RMA-133 sub-1B benchmark candidates from device evidence."""',
              '"""Score and select RMA-133 local-model benchmark candidates from device evidence."""',
          )
          replace_once(
              scorer,
              '    benchmark_id = config.get("benchmark_id")\n'
              '    if benchmark_id != "rma133-initial-sub1b-v1":\n'
              '        raise ValueError("RMA-133 benchmark_id changed from the frozen v1 contract")\n',
              '    benchmark_id = config.get("benchmark_id")\n'
              '    allowed_benchmark_ids = {\n'
              '        "rma133-initial-sub1b-v1",\n'
              '        "rma133-initial-local-model-v2",\n'
              '    }\n'
              '    if benchmark_id not in allowed_benchmark_ids:\n'
              '        raise ValueError("RMA-133 benchmark_id is not an accepted frozen contract lineage")\n'
              '    relaxed_size_contract = benchmark_id == "rma133-initial-local-model-v2"\n',
          )
          replace_once(
              scorer,
              '    has_qwen = False\n'
              '    has_alternative = False\n'
              '    quantizations: set[str] = set()\n',
              '    has_qwen = False\n'
              '    has_sub1b_alternative = False\n'
              '    has_relaxed_alternative = False\n'
              '    quantizations: set[str] = set()\n',
          )
          replace_once(
              scorer,
              '        model_class = candidate.get("model_class")\n'
              '        has_qwen = has_qwen or model_class == "qwen3-0.6b-class"\n'
              '        has_alternative = has_alternative or model_class == "alternative-sub1b"\n'
              '        license_id = candidate.get("license_id")\n',
              '        model_class = candidate.get("model_class")\n'
              '        allowed_model_classes = {\n'
              '            "qwen3-0.6b-class",\n'
              '            "alternative-sub1b",\n'
              '            "alternative-local",\n'
              '        }\n'
              '        if model_class not in allowed_model_classes:\n'
              '            raise ValueError(f"candidate {candidate_id} has an unknown model class")\n'
              '        if relaxed_size_contract and model_class == "alternative-sub1b":\n'
              '            raise ValueError("relaxed-size contract cannot label an alternative as sub-1B")\n'
              '        if not relaxed_size_contract and model_class == "alternative-local":\n'
              '            raise ValueError("sub-1B contract cannot include a relaxed-size alternative")\n'
              '        has_qwen = has_qwen or model_class == "qwen3-0.6b-class"\n'
              '        has_sub1b_alternative = (\n'
              '            has_sub1b_alternative or model_class == "alternative-sub1b"\n'
              '        )\n'
              '        has_relaxed_alternative = (\n'
              '            has_relaxed_alternative or model_class == "alternative-local"\n'
              '        )\n'
              '        license_id = candidate.get("license_id")\n',
          )
          replace_once(
              scorer,
              '    if not has_qwen or not has_alternative:\n'
              '        raise ValueError("RMA-133 candidate set must include Qwen3-0.6B-class and an alternative")\n'
              '    if len(quantizations) != 1:\n',
              '    if not has_qwen:\n'
              '        raise ValueError("RMA-133 candidate set must retain the Qwen3-0.6B control")\n'
              '    if relaxed_size_contract:\n'
              '        if not has_relaxed_alternative:\n'
              '            raise ValueError("RMA-133 relaxed-size contract requires a larger local alternative")\n'
              '    elif not has_sub1b_alternative:\n'
              '        raise ValueError("RMA-133 sub-1B contract requires a sub-1B alternative")\n'
              '    if len(quantizations) != 1:\n',
          )

          v4 = json.loads((root / 'benchmarks/rma133/candidates-v4.json').read_text(encoding='utf-8'))
          qwen3 = next(
              candidate
              for candidate in v4['candidates']
              if candidate['candidate_id'] == 'qwen3-0.6b-q4-k-m'
          )
          v5 = {
              'schema_version': 1,
              'benchmark_id': 'rma133-initial-local-model-v2',
              'experiment_id': 'rma133-candidate-set-v5',
              'system_prompt_contract': v4['system_prompt_contract'],
              'model_size_policy': {
                  'constraint': 'up-to-2B-class',
                  'relaxed_from': 'sub-1B',
                  'reason': (
                      'Candidate-set v4 showed adequate Android memory, speed, and thermal headroom '
                      'but no sub-1B candidate met the frozen schema and semantic-quality gates.'
                  ),
              },
              'license_policy': v4['license_policy'],
              'runtime_profile': v4['runtime_profile'],
              'selection_policy': v4['selection_policy'],
              'candidates': [
                  qwen3,
                  {
                      'candidate_id': 'qwen2.5-coder-1.5b-instruct-q4-k-m',
                      'model_id': 'qwen2.5-coder-1.5b-instruct',
                      'display_name': 'Qwen2.5 Coder 1.5B Instruct Q4_K_M',
                      'model_class': 'alternative-local',
                      'source_uri': 'https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF',
                      'source_revision': '2ab9f8f42af02fc212effaef7c4850c885e965f4',
                      'license_id': 'Apache-2.0',
                      'artifact': {
                          'filename': 'qwen2.5-coder-1.5b-instruct-q4_k_m.gguf',
                          'url': (
                              'https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/'
                              'resolve/2ab9f8f42af02fc212effaef7c4850c885e965f4/'
                              'qwen2.5-coder-1.5b-instruct-q4_k_m.gguf'
                          ),
                          'file_size_bytes': 1117320768,
                          'sha256': 'cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046',
                          'quantization': 'Q4_K_M',
                      },
                      'user_prompt_suffix': '',
                      'prompt_suffix_reason': (
                          'No model-specific suffix is used; the embedded GGUF chat template and '
                          'cryptographically pinned v4 system prompt define the structured-output request.'
                      ),
                  },
              ],
          }
          (root / 'benchmarks/rma133/candidates-v5.json').write_text(
              json.dumps(v5, indent=2) + '\n', encoding='utf-8'
          )

          test_b64 = ''
          doc_b64 = ''
          (root / 'scripts/tests/test_rma133_candidate_set_v5.py').write_bytes(
              base64.b64decode(test_b64)
          )
          (root / 'docs/validation/RMA_133_CANDIDATE_SET_V4_VALIDATION_2026-08-07.md').write_bytes(
              base64.b64decode(doc_b64)
          )

          architecture = root / 'docs/architecture/RMA_133_LOCAL_LLM_BENCHMARK.md'
          architecture_text = architecture.read_text(encoding='utf-8')
          marker = '## Candidate-size policy relaxation (2026-08-08)'
          if marker not in architecture_text:
              architecture_text += (
                  '\n\n## Candidate-size policy relaxation (2026-08-08)\n\n'
                  'Candidate sets v1 through v4 evaluated the original sub-1B scope. V4 improved '
                  'Qwen2.5-Coder-0.5B-Instruct to 75% strict schema reliability and 62.5/100 semantic '
                  'quality while remaining well inside the memory, decode-rate, and thermal envelopes. '
                  'Because it still failed the frozen 100% schema and 85/100 semantic gates, RMA-133 '
                  'now permits an up-to-2B-class follow-up candidate.\n\n'
                  'This is a size-scope change only. Candidate-set v5 keeps the v4 system prompt bytes, '
                  '12 behavior cases, Q4_K_M quantization, runtime profile, Apache-2.0 license policy, '
                  'scorer, thresholds, ranking, raw byte evidence, no-repair rule, and fail-closed '
                  'selector unchanged. The new benchmark lineage ID is `rma133-initial-local-model-v2`; '
                  'historical `rma133-initial-sub1b-v1` configs remain valid and immutable.\n'
              )
              architecture.write_text(architecture_text, encoding='utf-8')

          roadmap = root / 'docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md'
          roadmap_text = roadmap.read_text(encoding='utf-8')
          old_title = '## RMA-133 — Benchmark and select initial sub-1B model'
          new_title = '## RMA-133 — Benchmark and select initial local model'
          if roadmap_text.count(old_title) != 1:
              raise SystemExit('RMA-133 roadmap title did not match exactly once')
          roadmap_text = roadmap_text.replace(old_title, new_title, 1)
          old_item = '- [ ] Evaluate Qwen3-0.6B-class and at least one alternative under the selected license constraints.'
          new_item = (
              '- [ ] Evaluate Qwen3-0.6B-class and alternatives under the selected license constraints; '
              'after documented sub-1B rejection evidence, permit an up-to-2B-class candidate without '
              'weakening quality or safety gates.'
          )
          if roadmap_text.count(old_item) != 1:
              raise SystemExit('RMA-133 roadmap scope item did not match exactly once')
          roadmap.write_text(roadmap_text.replace(old_item, new_item, 1), encoding='utf-8')
          PY

          python -m pip install --disable-pip-version-check ruff==0.12.0
          ruff check \
            scripts/score_rma133_benchmark.py \
            scripts/tests/test_rma133_benchmark_contract.py \
            scripts/tests/test_rma133_candidate_set_v2.py \
            scripts/tests/test_rma133_candidate_set_v3.py \
            scripts/tests/test_rma133_candidate_set_v4.py \
            scripts/tests/test_rma133_candidate_set_v5.py \
            scripts/tests/test_rma133_device_runner_loop.py
          ruff format --check --diff \
            scripts/score_rma133_benchmark.py \
            scripts/tests/test_rma133_benchmark_contract.py \
            scripts/tests/test_rma133_candidate_set_v2.py \
            scripts/tests/test_rma133_candidate_set_v3.py \
            scripts/tests/test_rma133_candidate_set_v4.py \
            scripts/tests/test_rma133_candidate_set_v5.py \
            scripts/tests/test_rma133_device_runner_loop.py
          python3 -m unittest -v \
            scripts.tests.test_rma133_benchmark_contract \
            scripts.tests.test_rma133_candidate_set_v2 \
            scripts.tests.test_rma133_candidate_set_v3 \
            scripts.tests.test_rma133_candidate_set_v4 \
            scripts.tests.test_rma133_candidate_set_v5 \
            scripts.tests.test_rma133_device_runner_loop
          python3 scripts/score_rma133_benchmark.py validate --config benchmarks/rma133/candidates-v5.json
          python3 -m compileall -q scripts
          git diff --check

      - name: Commit validated relaxed-size experiment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            benchmarks/rma133/candidates-v5.json \
            scripts/score_rma133_benchmark.py \
            scripts/tests/test_rma133_candidate_set_v5.py \
            docs/architecture/RMA_133_LOCAL_LLM_BENCHMARK.md \
            docs/validation/RMA_133_CANDIDATE_SET_V4_VALIDATION_2026-08-07.md \
            docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md
          git diff --cached --exit-code --quiet && {
            printf '%s\n' 'RMA-133 v5 promotion produced no source changes.' >&2
            exit 1
          }
          git commit -m 'RMA-133: relax local model size constraint'
          git push origin HEAD:master

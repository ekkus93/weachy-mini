name: RMA-133 V6 closure staging

on:
  push:
    branches:
      - rma133-v6-closure-stage
    paths:
      - '.github/workflows/rma133-v6-closure-stage.yml'

permissions:
  contents: write

concurrency:
  group: rma133-v6-closure-stage
  cancel-in-progress: true

jobs:
  transform-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rma133-v6-closure-stage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Normalize exact active-ABI messages for transformer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_local_llm_manifest.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'runtime.abi_version: schema version 1 requires ABI 1':
                  'runtime.abi_version: schema version 1 requires ABI 2',
              'device_compatibility.reachy_llama_abi_version: must equal ABI 1':
                  'device_compatibility.reachy_llama_abi_version: must equal ABI 2',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one active-ABI message: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply closure transformation
        run: python3 scripts/rma133_closure_stage.py
      - name: Validate manifest and managed contracts before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m json.tool models/manifests/local-llm-manifest.schema.json >/dev/null
          python3 -m json.tool models/manifests/examples/rma131-synthetic-experimental.local-llm.json >/dev/null
          python3 -m json.tool models/manifests/qwen3-0.6b-q4-k-m.local-llm.json >/dev/null
          python3 scripts/validate_local_llm_manifest.py models/manifests/examples/rma131-synthetic-experimental.local-llm.json
          python3 scripts/validate_local_llm_manifest.py models/manifests/qwen3-0.6b-q4-k-m.local-llm.json
          python3 scripts/tests/test_rma131_local_model_manifest.py
          dotnet build managed/ReachyMini.Core/ReachyMini.Core.csproj --configuration Release --warnaserror
          dotnet run --project managed/ReachyMini.LocalModelManifest.Tests/ReachyMini.LocalModelManifest.Tests.csproj --configuration Release
      - name: Commit validated non-workflow closure changes
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/rma131-local-model-manifest.yml
          rm scripts/rma133_closure_stage.py
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'no closure changes produced' >&2; exit 1; }
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'runner commit unexpectedly contains workflow changes' >&2
            exit 1
          fi
          git commit -m 'RMA-133: close V6 model selection'
          git push origin HEAD:rma133-v6-closure-stage

name: RMA-133 V6 staging formatter

on:
  push:
    branches:
      - rma133-v6-staging
    paths:
      - '.github/workflows/rma133-v6-staging-format.yml'
      - 'native/llama_runtime/src/reachy_llama.cpp'
      - 'scripts/run_rma133_device_benchmark_v6.py'
      - 'scripts/score_rma133_benchmark_v6.py'
      - 'scripts/tests/test_rma130_llama_runtime.py'
      - 'scripts/tests/test_rma133_constrained_v6.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rma133-v6-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact formatting and narrow historical diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.12.0
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/llama_runtime/src/reachy_llama.cpp")
          text = path.read_text(encoding="utf-8")
          marker = '#pragma GCC diagnostic ignored "-Wswitch"'
          needle = (
              "#define reachy_llama_generation_start ReachyLegacyGenerationStartInternal\n"
              '#include "reachy_llama_abi1_base.inc"\n'
              "#undef reachy_llama_generation_start\n"
          )
          replacement = "\n".join(
              [
                  "#define reachy_llama_generation_start ReachyLegacyGenerationStartInternal",
                  "#if defined(__GNUC__) || defined(__clang__)",
                  "#pragma GCC diagnostic push",
                  '#pragma GCC diagnostic ignored "-Wswitch"',
                  "#endif",
                  '#include "reachy_llama_abi1_base.inc"',
                  "#if defined(__GNUC__) || defined(__clang__)",
                  "#pragma GCC diagnostic pop",
                  "#endif",
                  "#undef reachy_llama_generation_start",
                  "",
              ]
          )
          if marker not in text:
              if text.count(needle) != 1:
                  raise SystemExit("historical include anchor missing or ambiguous")
              text = text.replace(needle, replacement)
              path.write_text(text, encoding="utf-8")
          elif text.count(marker) != 1:
              raise SystemExit("historical switch diagnostic boundary is ambiguous")
          PY
          files=(
            scripts/run_rma133_device_benchmark_v6.py
            scripts/score_rma133_benchmark_v6.py
            scripts/tests/test_rma130_llama_runtime.py
            scripts/tests/test_rma133_constrained_v6.py
          )
          ruff format "${files[@]}"
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          python3 -m compileall -q "${files[@]}"
          test "$(grep -c '#pragma GCC diagnostic ignored "-Wswitch"' native/llama_runtime/src/reachy_llama.cpp)" -eq 1
      - name: Commit formatter output to staging only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            native/llama_runtime/src/reachy_llama.cpp \
            scripts/run_rma133_device_benchmark_v6.py \
            scripts/score_rma133_benchmark_v6.py \
            scripts/tests/test_rma130_llama_runtime.py \
            scripts/tests/test_rma133_constrained_v6.py
          if git diff --cached --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git commit -m 'RMA-133: format V6 implementation'
          git push origin HEAD:rma133-v6-staging

name: RMA-134 staging coexistence profile

on:
  push:
    branches: [rma134-local-llm-provider-v2]
    paths:
      - '.github/workflows/rma134-stage-coexistence-profile.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rma134-local-llm-provider-v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0

      - name: Apply explicit two-thread product coexistence profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('Assets/ReachyMini/Runtime/Core/Language/ReachyLocalLlmRuntimeContracts.cs')
          runtime = runtime_path.read_text(encoding='utf-8')
          selected_block = '''        public static LocalLlmExecutionProfile CreateRma133SelectedProfile()
        {
            return new LocalLlmExecutionProfile(
                contextTokens: 2048U,
                batchTokens: 256U,
                microBatchTokens: 64U,
                maximumGeneratedTokens: 128U,
                threads: 4,
                batchThreads: 4,
                temperature: 0.0F,
                minimumProbability: 0.0F,
                seed: 133U,
                streamQueueCapacity: 64U);
        }
'''
          coexistence_block = selected_block + '''
        public static LocalLlmExecutionProfile CreateInitialProductCoexistenceProfile()
        {
            return new LocalLlmExecutionProfile(
                contextTokens: 2048U,
                batchTokens: 256U,
                microBatchTokens: 64U,
                maximumGeneratedTokens: 128U,
                threads: 2,
                batchThreads: 2,
                temperature: 0.0F,
                minimumProbability: 0.0F,
                seed: 133U,
                streamQueueCapacity: 64U);
        }
'''
          if runtime.count(selected_block) != 1:
              raise SystemExit(f'expected one exact V6 profile block, found {runtime.count(selected_block)}')
          if 'CreateInitialProductCoexistenceProfile' in runtime:
              raise SystemExit('product coexistence profile already exists unexpectedly')
          runtime_path.write_text(runtime.replace(selected_block, coexistence_block), encoding='utf-8')

          selected_path = Path('Assets/ReachyMini/Runtime/Core/Language/Rma133SelectedLocalLlmProfile.cs')
          selected = selected_path.read_text(encoding='utf-8')
          old_call = 'LocalLlmExecutionProfile.CreateRma133SelectedProfile(),'
          new_call = 'LocalLlmExecutionProfile.CreateInitialProductCoexistenceProfile(),'
          if selected.count(old_call) != 1:
              raise SystemExit(f'expected one product profile call, found {selected.count(old_call)}')
          selected_path.write_text(selected.replace(old_call, new_call), encoding='utf-8')

          acceptance_path = Path('Assets/ReachyMini/Runtime/Application/ReachyRma134LocalLlmAcceptance.cs')
          acceptance = acceptance_path.read_text(encoding='utf-8')
          old_success_call = '''                approved.Sha256,
                provider.Descriptor.RequiresNetwork,
                first.DeltaCount,
'''
          new_success_call = '''                approved.Sha256,
                provider.Descriptor.RequiresNetwork,
                configuration.ExecutionProfile.Threads,
                configuration.ExecutionProfile.BatchThreads,
                first.DeltaCount,
'''
          if acceptance.count(old_success_call) != 1:
              raise SystemExit('could not find unique success report call insertion point')
          acceptance = acceptance.replace(old_success_call, new_success_call)

          old_fields = '''            public bool provider_requires_network;
            public bool constrained_only;
            public int first_delta_count;
'''
          new_fields = '''            public bool provider_requires_network;
            public bool constrained_only;
            public int execution_threads;
            public int execution_batch_threads;
            public int first_delta_count;
'''
          if acceptance.count(old_fields) != 1:
              raise SystemExit('could not find unique report field insertion point')
          acceptance = acceptance.replace(old_fields, new_fields)

          old_signature = '''                string modelSha256,
                bool providerRequiresNetwork,
                int firstDeltaCount,
'''
          new_signature = '''                string modelSha256,
                bool providerRequiresNetwork,
                int executionThreads,
                int executionBatchThreads,
                int firstDeltaCount,
'''
          if acceptance.count(old_signature) != 1:
              raise SystemExit('could not find unique report signature insertion point')
          acceptance = acceptance.replace(old_signature, new_signature)

          old_initializer = '''                    provider_requires_network = providerRequiresNetwork,
                    constrained_only = true,
                    first_delta_count = firstDeltaCount,
'''
          new_initializer = '''                    provider_requires_network = providerRequiresNetwork,
                    constrained_only = true,
                    execution_threads = executionThreads,
                    execution_batch_threads = executionBatchThreads,
                    first_delta_count = firstDeltaCount,
'''
          if acceptance.count(old_initializer) != 1:
              raise SystemExit('could not find unique report initializer insertion point')
          acceptance_path.write_text(acceptance.replace(old_initializer, new_initializer), encoding='utf-8')

          shell_path = Path('scripts/run_rma134_local_llm_acceptance_android.sh')
          shell = shell_path.read_text(encoding='utf-8')
          shell_anchor = '''if report.get("provider_requires_network") is not False:
    raise SystemExit(f"RMA-134 provider unexpectedly requires network: {report}")
'''
          shell_insert = shell_anchor + '''if int(report.get("execution_threads", 0)) != 2:
    raise SystemExit(f"RMA-134 product execution thread count mismatch: {report}")
if int(report.get("execution_batch_threads", 0)) != 2:
    raise SystemExit(f"RMA-134 product batch-thread count mismatch: {report}")
'''
          if shell.count(shell_anchor) != 1:
              raise SystemExit('could not find unique shell report validator insertion point')
          shell_path.write_text(shell.replace(shell_anchor, shell_insert), encoding='utf-8')

          tests_path = Path('managed/ReachyMini.LocalLlm.Tests/Program.cs')
          tests = tests_path.read_text(encoding='utf-8')
          list_anchor = '''            ("strict parser accepts frozen shape", ParserAcceptsFrozenShapeAsync),
'''
          list_insert = '''            ("product coexistence profile preserves V6 except CPU allocation", ProductCoexistenceProfileAsync),
''' + list_anchor
          if tests.count(list_anchor) != 1:
              raise SystemExit('could not find unique managed test-list insertion point')
          tests = tests.replace(list_anchor, list_insert)

          method_anchor = '''    private static Task ParserAcceptsFrozenShapeAsync()
    {
'''
          method = '''    private static Task ProductCoexistenceProfileAsync()
    {
        LocalLlmExecutionProfile selected =
            LocalLlmExecutionProfile.CreateRma133SelectedProfile();
        LocalLlmExecutionProfile product =
            LocalLlmExecutionProfile.CreateInitialProductCoexistenceProfile();

        Require(selected.Threads == 4 && selected.BatchThreads == 4,
            "historical V6 thread profile changed");
        Require(product.Threads == 2 && product.BatchThreads == 2,
            "initial product coexistence profile is not 2/2");
        Require(product.ContextTokens == selected.ContextTokens,
            "product context changed from V6");
        Require(product.BatchTokens == selected.BatchTokens,
            "product batch changed from V6");
        Require(product.MicroBatchTokens == selected.MicroBatchTokens,
            "product micro-batch changed from V6");
        Require(product.MaximumGeneratedTokens == selected.MaximumGeneratedTokens,
            "product output limit changed from V6");
        Require(product.Temperature == selected.Temperature,
            "product temperature changed from V6");
        Require(product.MinimumProbability == selected.MinimumProbability,
            "product minimum probability changed from V6");
        Require(product.Seed == selected.Seed,
            "product seed changed from V6");
        Require(product.StreamQueueCapacity == selected.StreamQueueCapacity,
            "product native queue capacity changed from V6");
        return Task.CompletedTask;
    }

'''
          if tests.count(method_anchor) != 1:
              raise SystemExit('could not find unique managed method insertion point')
          if 'ProductCoexistenceProfileAsync()' in tests:
              raise SystemExit('product coexistence managed test already exists unexpectedly')
          tests_path.write_text(tests.replace(method_anchor, method + method_anchor), encoding='utf-8')

          py_path = Path('scripts/tests/test_rma134_local_llm_provider.py')
          py = py_path.read_text(encoding='utf-8')
          old_method = '''    def test_selected_profile_is_exact_v6_profile(self) -> None:
        source = (LANGUAGE_DIR / "ReachyLocalLlmRuntimeContracts.cs").read_text(encoding="utf-8")
        expected = (
            "contextTokens: 2048U",
            "batchTokens: 256U",
            "microBatchTokens: 64U",
            "maximumGeneratedTokens: 128U",
            "threads: 4",
            "batchThreads: 4",
            "temperature: 0.0F",
            "minimumProbability: 0.0F",
            "seed: 133U",
            "streamQueueCapacity: 64U",
        )
        for token in expected:
            self.assertIn(token, source)
'''
          new_method = '''    def test_v6_profile_is_preserved_and_product_profile_is_conservative(self) -> None:
        source = (LANGUAGE_DIR / "ReachyLocalLlmRuntimeContracts.cs").read_text(encoding="utf-8")
        selected = (LANGUAGE_DIR / "Rma133SelectedLocalLlmProfile.cs").read_text(encoding="utf-8")
        self.assertIn("CreateRma133SelectedProfile", source)
        self.assertIn("threads: 4", source)
        self.assertIn("batchThreads: 4", source)
        self.assertIn("CreateInitialProductCoexistenceProfile", source)
        self.assertIn("threads: 2", source)
        self.assertIn("batchThreads: 2", source)
        self.assertIn(
            "LocalLlmExecutionProfile.CreateInitialProductCoexistenceProfile()",
            selected,
        )
        self.assertIn("RecommendedThreads = 4", selected)
'''
          if py.count(old_method) != 1:
              raise SystemExit('could not find exact static V6 profile test')
          py_path.write_text(py.replace(old_method, new_method), encoding='utf-8')

          doc_path = Path('docs/architecture/LOCAL_LLM_PROVIDER.md')
          doc = doc_path.read_text(encoding='utf-8')
          old_doc = '''RMA-133 selected `qwen3-0.6b` / Q4_K_M. The product profile initially mirrors the successful physical V6 profile:

- context: 2,048 tokens;
- batch: 256 tokens;
- micro-batch: 64 tokens;
- maximum generated output: 128 tokens;
- generation threads: 4;
- batch threads: 4;
- temperature: 0;
- min-p: 0;
- seed: 133;
- native stream queue capacity: 64.
'''
          new_doc = '''RMA-133 selected `qwen3-0.6b` / Q4_K_M. `CreateRma133SelectedProfile()` remains the exact historical physical V6 profile, including four generation and four batch threads.

RMA-134 physical coexistence evidence showed that running that 4/4 profile beside the authoritative 500 Hz simulation oversubscribed this representative phone: source SHA `3c34552d920cc7b582d024ca8d551c01a5b7afce`, run `31277029898`, job `93152248396`, artifact `9027432804` streamed 34 generated tokens before the explicit five-minute timeout, with 495 prompt tokens, 93.78-second TTFT, and 206.22 seconds of decode time. The native worker was progressing; there was no polling stall, retry, fallback, or provider switch.

The initial **product coexistence** profile therefore preserves every V6 generation parameter except CPU allocation:

- context: 2,048 tokens;
- batch: 256 tokens;
- micro-batch: 64 tokens;
- maximum generated output: 128 tokens;
- generation threads: **2**;
- batch threads: **2**;
- temperature: 0;
- min-p: 0;
- seed: 133;
- native stream queue capacity: 64.

Physics remains unchanged at its authoritative 0.002-second timestep. RMA-134 does not reduce simulation fidelity to accommodate inference. RMA-135 owns dynamic thermal/resource governance and may later reduce or suspend LLM work based on device state; it does not need to rediscover the 4-thread coexistence failure.
'''
          if doc.count(old_doc) != 1:
              raise SystemExit('could not find exact architecture profile section')
          doc_path.write_text(doc.replace(old_doc, new_doc), encoding='utf-8')
          PY

          ruff format scripts/tests/test_rma134_local_llm_provider.py

      - name: Validate coexistence profile contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore managed/ReachyMini.Core/ReachyMini.Core.csproj
          dotnet build managed/ReachyMini.Core/ReachyMini.Core.csproj --configuration Release --no-restore
          dotnet restore managed/ReachyMini.LocalLlm.Tests/ReachyMini.LocalLlm.Tests.csproj
          dotnet run --project managed/ReachyMini.LocalLlm.Tests/ReachyMini.LocalLlm.Tests.csproj --configuration Release --no-restore
          python3 -m unittest -v scripts.tests.test_rma134_local_llm_provider
          ruff check scripts
          ruff format --check scripts
          python3 -m compileall -q scripts
          bash -n scripts/run_rma134_local_llm_acceptance_android.sh
          git diff --check

      - name: Commit coexistence profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/ReachyMini/Runtime/Application/ReachyRma134LocalLlmAcceptance.cs \
            Assets/ReachyMini/Runtime/Core/Language/ReachyLocalLlmRuntimeContracts.cs \
            Assets/ReachyMini/Runtime/Core/Language/Rma133SelectedLocalLlmProfile.cs \
            docs/architecture/LOCAL_LLM_PROVIDER.md \
            managed/ReachyMini.LocalLlm.Tests/Program.cs \
            scripts/run_rma134_local_llm_acceptance_android.sh \
            scripts/tests/test_rma134_local_llm_provider.py
          git diff --cached --check
          git commit -m 'RMA-134: reserve CPU capacity for authoritative simulation'
          git push origin HEAD:rma134-local-llm-provider-v2

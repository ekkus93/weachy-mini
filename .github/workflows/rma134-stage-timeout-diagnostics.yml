name: RMA-134 staging timeout diagnostics

on:
  push:
    branches: [rma134-local-llm-provider-v2]
    paths:
      - '.github/workflows/rma134-stage-timeout-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rma134-local-llm-provider-v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0

      - name: Patch timeout diagnostics
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/if "TimeoutReportsNativeProgressAsync" in tests:/if "private static async Task TimeoutReportsNativeProgressAsync()" in tests:/' scripts/.rma134_timeout_diagnostics_patch.py
          python3 scripts/.rma134_timeout_diagnostics_patch.py
          ruff format scripts/tests/test_rma134_local_llm_provider.py

      - name: Validate source changes
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore managed/ReachyMini.Core/ReachyMini.Core.csproj
          dotnet build managed/ReachyMini.Core/ReachyMini.Core.csproj --configuration Release --no-restore
          dotnet restore managed/ReachyMini.LocalLlm.Tests/ReachyMini.LocalLlm.Tests.csproj
          dotnet run --project managed/ReachyMini.LocalLlm.Tests/ReachyMini.LocalLlm.Tests.csproj --configuration Release --no-restore
          python3 -m unittest -v scripts.tests.test_rma134_local_llm_provider
          ruff check scripts
          ruff format --check scripts
          python3 -m compileall -q scripts
          git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/ReachyMini/Runtime/Application/ReachyRma134LocalLlmAcceptance.cs
          git add Assets/ReachyMini/Runtime/Core/Language/ReachyLocalLlmProvider.cs
          git add managed/ReachyMini.LocalLlm.Tests/Program.cs
          git add scripts/tests/test_rma134_local_llm_provider.py
          git diff --cached --check
          git commit -m 'RMA-134: expose timeout progress diagnostics'
          git push origin HEAD:rma134-local-llm-provider-v2

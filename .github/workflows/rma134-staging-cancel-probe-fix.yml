name: RMA-134 staging cancellation probe fix

on:
  push:
    branches: [rma134-local-llm-provider-stage]
    paths:
      - '.github/workflows/rma134-staging-cancel-probe-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rma134-local-llm-provider-stage
      - name: Make native cancellation probe deterministic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          acceptance = Path('Assets/ReachyMini/Runtime/Application/ReachyRma134LocalLlmAcceptance.cs')
          text = acceptance.read_text(encoding='utf-8')
          old = '''            using var cancellation = new CancellationTokenSource();\n            int deltas = 0;\n            LocalLlmEvent? terminal = null;\n            await foreach (LocalLlmEvent item in provider.GenerateAsync(\n                new LocalLlmRequest(\n                    "rma134-cancel",\n                    "Give me a short friendly greeting.",\n                    GenerationTimeout),\n                cancellation.Token))\n            {\n                if (item.Kind == LocalLlmEventKind.OutputDelta)\n                {\n                    ++deltas;\n                    cancellation.Cancel();\n                    continue;\n                }\n                terminal = item;\n            }\n            if (deltas <= 0 || terminal == null ||\n                terminal.Kind != LocalLlmEventKind.Cancelled ||\n                terminal.Failure != LocalLlmFailure.Cancelled)\n            {\n                throw new InvalidOperationException(\n                    "Local LLM cancellation did not produce a streamed delta followed by explicit cancellation.");\n            }\n            return new GenerationObservation(deltas, string.Empty);'''
          new = '''            using var cancellation = new CancellationTokenSource(\n                TimeSpan.FromSeconds(2.0));\n            int deltas = 0;\n            LocalLlmEvent? terminal = null;\n            await foreach (LocalLlmEvent item in provider.GenerateAsync(\n                new LocalLlmRequest(\n                    "rma134-cancel",\n                    "Give me a short friendly greeting.",\n                    GenerationTimeout),\n                cancellation.Token))\n            {\n                if (item.Kind == LocalLlmEventKind.OutputDelta)\n                {\n                    ++deltas;\n                    continue;\n                }\n                terminal = item;\n            }\n            if (terminal == null ||\n                terminal.Kind != LocalLlmEventKind.Cancelled ||\n                terminal.Failure != LocalLlmFailure.Cancelled)\n            {\n                throw new InvalidOperationException(\n                    "Local LLM cancellation did not produce an explicit Cancelled terminal event.");\n            }\n            return new GenerationObservation(deltas, string.Empty);'''
          if old not in text:
              raise SystemExit('Missing RMA-134 physical cancellation probe contract.')
          acceptance.write_text(text.replace(old, new, 1), encoding='utf-8')

          runner = Path('scripts/run_rma134_local_llm_acceptance_android.sh')
          text = runner.read_text(encoding='utf-8')
          old = '''if int(report.get("cancellation_delta_count", 0)) <= 0:\n    raise SystemExit(f"RMA-134 cancellation was not exercised after streaming: {report}")\n'''
          if old not in text:
              raise SystemExit('Missing RMA-134 cancellation-delta runner assertion.')
          runner.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          bash -n scripts/run_rma134_local_llm_acceptance_android.sh
          git diff --check
      - name: Commit physical-test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add \
            Assets/ReachyMini/Runtime/Application/ReachyRma134LocalLlmAcceptance.cs \
            scripts/run_rma134_local_llm_acceptance_android.sh
          git commit -m 'RMA-134: make physical cancellation probe deterministic'
          git push origin HEAD:rma134-local-llm-provider-stage

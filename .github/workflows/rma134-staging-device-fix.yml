name: RMA-134 staging device fix

on:
  push:
    branches: [rma134-local-llm-provider-stage]
    paths:
      - '.github/workflows/rma134-staging-device-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rma134-local-llm-provider-stage
      - name: Apply deterministic device integration fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          acceptance = Path('Assets/ReachyMini/Runtime/Application/ReachyRma134LocalLlmAcceptance.cs')
          text = acceptance.read_text(encoding='utf-8')
          text = text.replace('.ConfigureAwait(false)', '')
          acceptance.write_text(text, encoding='utf-8')

          stage = Path('scripts/stage_reachy_unity_android_runtime.sh')
          text = stage.read_text(encoding='utf-8')
          old = '''MJB_PATH="${RESOURCE_DIR}/reachy_mini_mjb.bytes"\nMANIFEST_PATH="${RESOURCE_DIR}/runtime_manifest_json.bytes"\n"${VENV_DIR}/bin/python" "${SCRIPT_DIR}/compile_reachy_runtime_mjb.py"'''
          new = '''MJB_PATH="${RESOURCE_DIR}/reachy_mini_mjb.bytes"\nMANIFEST_PATH="${RESOURCE_DIR}/runtime_manifest_json.bytes"\nSELECTED_LLM_MANIFEST_PATH="${RESOURCE_DIR}/rma133_selected_local_llm_manifest_json.bytes"\ncp "${ROOT_DIR}/models/manifests/qwen3-0.6b-q4-k-m.local-llm.json" \\\n    "${SELECTED_LLM_MANIFEST_PATH}"\n"${VENV_DIR}/bin/python" "${SCRIPT_DIR}/compile_reachy_runtime_mjb.py"'''
          if old not in text:
              raise SystemExit('Could not find Unity runtime resource staging insertion point.')
          text = text.replace(old, new, 1)
          old = '''    "${PLUGIN_DIR}/libreachy_llama.so" \\\n    "${MJB_PATH}" \\\n    "${MANIFEST_PATH}"; do'''
          new = '''    "${PLUGIN_DIR}/libreachy_llama.so" \\\n    "${MJB_PATH}" \\\n    "${MANIFEST_PATH}" \\\n    "${SELECTED_LLM_MANIFEST_PATH}"; do'''
          if old not in text:
              raise SystemExit('Could not find Unity runtime required-file list.')
          stage.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          bash -n scripts/stage_reachy_unity_android_runtime.sh
          bash -n scripts/run_rma134_local_llm_acceptance_android.sh
          git diff --check
      - name: Commit source-only integration fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add \
            Assets/ReachyMini/Runtime/Application/ReachyRma134LocalLlmAcceptance.cs \
            scripts/stage_reachy_unity_android_runtime.sh
          git commit -m 'RMA-134: integrate physical acceptance assets'
          git push origin HEAD:rma134-local-llm-provider-stage

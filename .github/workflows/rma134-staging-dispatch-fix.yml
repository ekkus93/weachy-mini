name: RMA-134 staging dispatch fix

on:
  push:
    branches: [rma134-local-llm-provider-stage]
    paths:
      - '.github/workflows/rma134-staging-dispatch-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rma134-local-llm-provider-stage
      - name: Allow explicit physical revalidation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/rma134-local-llm-provider.yml')
          text = path.read_text(encoding='utf-8')
          old = "    if: github.event_name == 'push' && github.ref == 'refs/heads/master'"
          new = "    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'"
          if old not in text:
              raise SystemExit('Missing RMA-134 physical job condition.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit workflow condition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add .github/workflows/rma134-local-llm-provider.yml
          git commit -m 'RMA-134: allow explicit physical revalidation'
          git push origin HEAD:rma134-local-llm-provider-stage

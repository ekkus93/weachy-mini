name: RMA-134 staging recovery contract fix

on:
  push:
    branches: [rma134-local-llm-provider-stage]
    paths:
      - '.github/workflows/rma134-staging-recovery-contract-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rma134-local-llm-provider-stage
      - name: Enforce explicit fault recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          provider = Path('Assets/ReachyMini/Runtime/Core/Language/ReachyLocalLlmProvider.cs')
          text = provider.read_text(encoding='utf-8')
          old = 'using System.Collections.Generic;\nusing System.Runtime.CompilerServices;'
          new = 'using System.Collections.Generic;\nusing System.Diagnostics;\nusing System.Runtime.CompilerServices;'
          if old not in text:
              raise SystemExit('Missing provider using insertion point.')
          text = text.replace(old, new, 1)

          old = '''                if (activeOperation != null)\n                {\n                    return LocalLlmOperationResult.Failed(\n                        LocalLlmFailure.Busy,\n                        "The model cannot be loaded or reloaded during active generation.");\n                }\n                if (!reload && modelSession != null && state == LocalLlmProviderState.Ready)'''
          new = '''                if (activeOperation != null)\n                {\n                    return LocalLlmOperationResult.Failed(\n                        LocalLlmFailure.Busy,\n                        "The model cannot be loaded or reloaded during active generation.");\n                }\n                if (!reload && state == LocalLlmProviderState.Faulted)\n                {\n                    return LocalLlmOperationResult.Failed(\n                        LocalLlmFailure.RuntimeFailure,\n                        "The local LLM provider is faulted; explicit ReloadAsync is required.");\n                }\n                if (!reload && modelSession != null && state == LocalLlmProviderState.Ready)'''
          if old not in text:
              raise SystemExit('Missing provider load recovery insertion point.')
          text = text.replace(old, new, 1)

          old = '''            DateTime deadline = DateTime.UtcNow + CancellationDrainTimeout;\n            try\n            {\n                while (DateTime.UtcNow < deadline)'''
          new = '''            var stopwatch = Stopwatch.StartNew();\n            try\n            {\n                while (stopwatch.Elapsed < CancellationDrainTimeout)'''
          if old not in text:
              raise SystemExit('Missing wall-clock cancellation drain contract.')
          provider.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('managed/ReachyMini.LocalLlm.Tests/Program.cs')
          text = tests.read_text(encoding='utf-8')
          old = '''        List<LocalLlmEvent> blocked = await GenerateAsync(context.Provider, "blocked", "No automatic retry")\n            .ConfigureAwait(false);\n        Require(blocked.Count == 1 && blocked[0].Failure == LocalLlmFailure.RuntimeFailure, "fault silently retried");\n        Require(context.Runtime.LoadCount == 1, "fault triggered an automatic model reload");\n\n        LocalLlmOperationResult reload = await context.Provider.ReloadAsync(CancellationToken.None)'''
          new = '''        List<LocalLlmEvent> blocked = await GenerateAsync(context.Provider, "blocked", "No automatic retry")\n            .ConfigureAwait(false);\n        Require(blocked.Count == 1 && blocked[0].Failure == LocalLlmFailure.RuntimeFailure, "fault silently retried");\n        Require(context.Runtime.LoadCount == 1, "fault triggered an automatic model reload");\n\n        LocalLlmOperationResult ordinaryLoad = await context.Provider.LoadAsync(\n                CancellationToken.None)\n            .ConfigureAwait(false);\n        Require(\n            !ordinaryLoad.Succeeded && ordinaryLoad.Failure == LocalLlmFailure.RuntimeFailure,\n            "ordinary LoadAsync recovered a retained runtime fault");\n        Require(context.Runtime.LoadCount == 1, "ordinary LoadAsync reloaded a faulted provider");\n\n        LocalLlmOperationResult reload = await context.Provider.ReloadAsync(CancellationToken.None)'''
          if old not in text:
              raise SystemExit('Missing runtime fault regression insertion point.')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit recovery contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add \
            Assets/ReachyMini/Runtime/Core/Language/ReachyLocalLlmProvider.cs \
            managed/ReachyMini.LocalLlm.Tests/Program.cs
          git commit -m 'RMA-134: require explicit reload after runtime fault'
          git push origin HEAD:rma134-local-llm-provider-stage

name: RMA-134 staging test fix2

on:
  push:
    branches: [rma134-local-llm-provider-stage]
    paths:
      - '.github/workflows/rma134-staging-test-fix2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rma134-local-llm-provider-stage
      - name: Apply final analyzer fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('managed/ReachyMini.LocalLlm.Tests/Program.cs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('IReadOnlyList<LocalLlmChatMessage> messages = context.Runtime.Session.LastMessages;',
               'LocalLlmChatMessage[] messages = context.Runtime.Session.LastMessages;'),
              ('Require(messages.Count == 4,', 'Require(messages.Length == 4,'),
              ('Require(context.Runtime.Session.LastMessages.Count == 2,',
               'Require(context.Runtime.Session.LastMessages.Length == 2,'),
              ('''            if (generation == null)\n            {\n                throw new ArgumentNullException(nameof(generation));\n            }\n            generationFactories.Enqueue(() => generation);''',
               '''            ArgumentNullException.ThrowIfNull(generation);\n            generationFactories.Enqueue(() => generation);'''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected analyzer contract: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit source-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add managed/ReachyMini.LocalLlm.Tests/Program.cs
          git commit -m 'RMA-134: finish test analyzer cleanup'
          git push origin HEAD:rma134-local-llm-provider-stage

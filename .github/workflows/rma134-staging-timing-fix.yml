name: RMA-134 staging timing fix

on:
  push:
    branches: [rma134-local-llm-provider-stage]
    paths:
      - '.github/workflows/rma134-staging-timing-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rma134-local-llm-provider-stage
      - name: Add timing evidence surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('Assets/ReachyMini/Runtime/Rendering/ReachyProductionAuthoritativeRuntime.cs')
          text = runtime.read_text(encoding='utf-8')
          old = '''        public ReachyPresentationBody[] GetCanonicalBodies()\n        {'''
          new = '''        public bool TryGetLatestWorkerTiming(\n            out ReachySimulationTimingSnapshot timing)\n        {\n            if (worker != null && worker.TryGetLatestSnapshot(\n                out ReachyPublishedSimulationSnapshot snapshot))\n            {\n                timing = snapshot.Timing;\n                return true;\n            }\n            timing = default;\n            return false;\n        }\n\n        public ReachyPresentationBody[] GetCanonicalBodies()\n        {'''
          if old not in text:
              raise SystemExit('Could not locate runtime timing insertion point.')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')

          acceptance = Path('Assets/ReachyMini/Runtime/Application/ReachyRma134LocalLlmAcceptance.cs')
          text = acceptance.read_text(encoding='utf-8')
          old = 'using ReachyMini.Rendering;\n'
          new = 'using ReachyMini.Rendering;\nusing ReachyMini.Simulation;\n'
          if old not in text:
              raise SystemExit('Could not locate acceptance simulation using insertion point.')
          text = text.replace(old, new, 1)

          old = '''            ulong simulationStepsBefore = simulation.WorkerStepCount;\n            if (simulation.Status != ReachyProductionRuntimeStatus.Running ||\n                simulationStepsBefore == 0UL)'''
          new = '''            ulong simulationStepsBefore = simulation.WorkerStepCount;\n            if (!simulation.TryGetLatestWorkerTiming(\n                    out ReachySimulationTimingSnapshot timingBefore))\n            {\n                throw new InvalidOperationException(\n                    "Authoritative simulation timing was unavailable before local LLM inference.");\n            }\n            if (simulation.Status != ReachyProductionRuntimeStatus.Running ||\n                simulationStepsBefore == 0UL)'''
          if old not in text:
              raise SystemExit('Could not locate pre-inference timing point.')
          text = text.replace(old, new, 1)

          old = '''            ulong simulationStepsAfter = simulation.WorkerStepCount;\n            if (simulation.Status != ReachyProductionRuntimeStatus.Running)'''
          new = '''            ulong simulationStepsAfter = simulation.WorkerStepCount;\n            if (!simulation.TryGetLatestWorkerTiming(\n                    out ReachySimulationTimingSnapshot timingAfter))\n            {\n                throw new InvalidOperationException(\n                    "Authoritative simulation timing was unavailable after local LLM inference.");\n            }\n            if (simulation.Status != ReachyProductionRuntimeStatus.Running)'''
          if old not in text:
              raise SystemExit('Could not locate post-inference timing point.')
          text = text.replace(old, new, 1)

          old = '''            if (simulationStepsAfter <= simulationStepsBefore)\n            {\n                throw new InvalidOperationException(\n                    "Authoritative simulation made no progress while local LLM inference was active.");\n            }'''
          new = '''            if (simulationStepsAfter <= simulationStepsBefore)\n            {\n                throw new InvalidOperationException(\n                    "Authoritative simulation made no progress while local LLM inference was active.");\n            }\n            if (timingAfter.SolverWarningCount != timingBefore.SolverWarningCount)\n            {\n                throw new InvalidOperationException(\n                    "Authoritative simulation accumulated a solver warning during local LLM inference.");\n            }'''
          if old not in text:
              raise SystemExit('Could not locate simulation progress gate.')
          text = text.replace(old, new, 1)

          old = '''                simulationStepsBefore,\n                simulationStepsAfter,\n                stopwatch.Elapsed.TotalSeconds);'''
          new = '''                simulationStepsBefore,\n                simulationStepsAfter,\n                timingBefore,\n                timingAfter,\n                stopwatch.Elapsed.TotalSeconds);'''
          if old not in text:
              raise SystemExit('Could not locate report timing call.')
          text = text.replace(old, new, 1)

          old = '''            public ulong simulation_step_delta;\n            public bool simulation_remained_running;\n            public double acceptance_elapsed_seconds;'''
          new = '''            public ulong simulation_step_delta;\n            public bool simulation_remained_running;\n            public ulong simulation_deadline_misses_before;\n            public ulong simulation_deadline_misses_after;\n            public ulong simulation_deadline_miss_delta;\n            public ulong simulation_solver_warnings_before;\n            public ulong simulation_solver_warnings_after;\n            public double simulation_accumulated_lag_before_seconds;\n            public double simulation_accumulated_lag_after_seconds;\n            public double simulation_accumulated_lag_delta_seconds;\n            public double simulation_maximum_step_duration_seconds;\n            public double acceptance_elapsed_seconds;'''
          if old not in text:
              raise SystemExit('Could not locate report timing fields.')
          text = text.replace(old, new, 1)

          old = '''                ulong simulationStepsBefore,\n                ulong simulationStepsAfter,\n                double elapsedSeconds)'''
          new = '''                ulong simulationStepsBefore,\n                ulong simulationStepsAfter,\n                ReachySimulationTimingSnapshot timingBefore,\n                ReachySimulationTimingSnapshot timingAfter,\n                double elapsedSeconds)'''
          if old not in text:
              raise SystemExit('Could not locate report success signature.')
          text = text.replace(old, new, 1)

          old = '''                    simulation_step_delta = simulationStepsAfter - simulationStepsBefore,\n                    simulation_remained_running = true,\n                    acceptance_elapsed_seconds = elapsedSeconds,'''
          new = '''                    simulation_step_delta = simulationStepsAfter - simulationStepsBefore,\n                    simulation_remained_running = true,\n                    simulation_deadline_misses_before = timingBefore.DeadlineMissCount,\n                    simulation_deadline_misses_after = timingAfter.DeadlineMissCount,\n                    simulation_deadline_miss_delta =\n                        timingAfter.DeadlineMissCount - timingBefore.DeadlineMissCount,\n                    simulation_solver_warnings_before = timingBefore.SolverWarningCount,\n                    simulation_solver_warnings_after = timingAfter.SolverWarningCount,\n                    simulation_accumulated_lag_before_seconds =\n                        timingBefore.AccumulatedLagSeconds,\n                    simulation_accumulated_lag_after_seconds =\n                        timingAfter.AccumulatedLagSeconds,\n                    simulation_accumulated_lag_delta_seconds =\n                        timingAfter.AccumulatedLagSeconds - timingBefore.AccumulatedLagSeconds,\n                    simulation_maximum_step_duration_seconds =\n                        timingAfter.MaximumStepDurationSeconds,\n                    acceptance_elapsed_seconds = elapsedSeconds,'''
          if old not in text:
              raise SystemExit('Could not locate report timing assignments.')
          acceptance.write_text(text.replace(old, new, 1), encoding='utf-8')

          runner = Path('scripts/run_rma134_local_llm_acceptance_android.sh')
          text = runner.read_text(encoding='utf-8')
          old = '''if int(report.get("simulation_step_delta", 0)) <= 0:\n    raise SystemExit(f"RMA-134 simulation step delta is invalid: {report}")'''
          new = '''if int(report.get("simulation_step_delta", 0)) <= 0:\n    raise SystemExit(f"RMA-134 simulation step delta is invalid: {report}")\nif int(report.get("simulation_solver_warnings_after", -1)) != int(\n    report.get("simulation_solver_warnings_before", -2)\n):\n    raise SystemExit(f"RMA-134 simulation solver warnings changed: {report}")\nif float(report.get("simulation_accumulated_lag_delta_seconds", -1.0)) < 0.0:\n    raise SystemExit(f"RMA-134 simulation lag evidence is invalid: {report}")'''
          if old not in text:
              raise SystemExit('Could not locate runner timing validation point.')
          runner.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          bash -n scripts/run_rma134_local_llm_acceptance_android.sh
          git diff --check
      - name: Commit timing evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add \
            Assets/ReachyMini/Runtime/Application/ReachyRma134LocalLlmAcceptance.cs \
            Assets/ReachyMini/Runtime/Rendering/ReachyProductionAuthoritativeRuntime.cs \
            scripts/run_rma134_local_llm_acceptance_android.sh
          git commit -m 'RMA-134: record simulation timing during inference'
          git push origin HEAD:rma134-local-llm-provider-stage

name: RMA-134 staging token count fix

on:
  push:
    branches: [rma134-local-llm-provider-stage]
    paths:
      - '.github/workflows/rma134-staging-token-count-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rma134-local-llm-provider-stage
      - name: Align managed preflight with native tokenization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Assets/ReachyMini/Runtime/Interop/ReachyLlamaNativeRuntime.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            int status = NativeReachyLlama.Tokenize(\n                activeModel,\n                text.Pointer,\n                0U,\n                1U,'''
          new = '''            int status = NativeReachyLlama.Tokenize(\n                activeModel,\n                text.Pointer,\n                1U,\n                1U,'''
          if old not in text:
              raise SystemExit('Missing managed token-count preflight contract.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit source-only alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add Assets/ReachyMini/Runtime/Interop/ReachyLlamaNativeRuntime.cs
          git commit -m 'RMA-134: align context token preflight'
          git push origin HEAD:rma134-local-llm-provider-stage

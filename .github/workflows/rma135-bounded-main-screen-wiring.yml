name: RMA-135 bounded main-screen wiring

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma135-bounded-main-screen-wiring.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0
      - name: Apply bounded main-screen governor wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Assets/ReachyMini/Runtime/Application/ReachyProductionApplicationCompositionProvider.cs')
          text = path.read_text(encoding='utf-8')

          def replace(old: str, new: str, count: int = 1) -> None:
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count} matches, found {actual}: {old[:100]!r}')
              text = text.replace(old, new, count)

          replace(
              '''        private readonly ReachyMainScreen screen;\n        private readonly IReachyApplicationService[] dependencies;\n        private readonly ReachyMainScreenStateStore stateStore =\n            new ReachyMainScreenStateStore();\n''',
              '''        private readonly ReachyMainScreen screen;\n        private readonly IReachyApplicationService[] dependencies;\n        private readonly IReachyProviderGovernorDiagnosticsSource? providerGovernorDiagnostics;\n        private readonly ReachyMainScreenStateStore stateStore =\n            new ReachyMainScreenStateStore();\n        private bool governorOwnsInteractionState;\n''')

          replace(
              '''            this.screen = screen ?? throw new ArgumentNullException(nameof(screen));\n            dependencies = new IReachyApplicationService[]\n            {\n                simulation ?? throw new ArgumentNullException(nameof(simulation)),\n                camera ?? throw new ArgumentNullException(nameof(camera)),\n                audio ?? throw new ArgumentNullException(nameof(audio)),\n                provider ?? throw new ArgumentNullException(nameof(provider)),\n                perception ?? throw new ArgumentNullException(nameof(perception)),\n                behavior ?? throw new ArgumentNullException(nameof(behavior)),\n                persistence ?? throw new ArgumentNullException(nameof(persistence)),\n            };\n''',
              '''            this.screen = screen ?? throw new ArgumentNullException(nameof(screen));\n            IReachyProviderService resolvedProvider = provider ??\n                throw new ArgumentNullException(nameof(provider));\n            providerGovernorDiagnostics =\n                resolvedProvider as IReachyProviderGovernorDiagnosticsSource;\n            dependencies = new IReachyApplicationService[]\n            {\n                simulation ?? throw new ArgumentNullException(nameof(simulation)),\n                camera ?? throw new ArgumentNullException(nameof(camera)),\n                audio ?? throw new ArgumentNullException(nameof(audio)),\n                resolvedProvider,\n                perception ?? throw new ArgumentNullException(nameof(perception)),\n                behavior ?? throw new ArgumentNullException(nameof(behavior)),\n                persistence ?? throw new ArgumentNullException(nameof(persistence)),\n            };\n''')

          replace(
              '''            stateStore.SetInteraction(\n                ReachyInteractionState.Idle,\n                "Robot view is ready. Voice, providers, perception, and behavior are not configured.");\n            screen.Bind(stateStore, BuildDiagnostics);\n''',
              '''            stateStore.SetInteraction(\n                ReachyInteractionState.Idle,\n                "Robot view is ready. Voice, providers, perception, and behavior are not configured.");\n            ApplyProviderGovernorDiagnostics();\n            screen.Bind(stateStore, BuildDiagnostics);\n''')

          replace(
              '''        private void OnDependencyHealthChanged(\n            object? sender,\n            ReachyServiceHealthChangedEventArgs eventArgs)\n        {\n            if (eventArgs.Health.Criticality == ReachyServiceCriticality.Required &&\n''',
              '''        private void OnDependencyHealthChanged(\n            object? sender,\n            ReachyServiceHealthChangedEventArgs eventArgs)\n        {\n            if (eventArgs.Health.Kind == ReachyServiceKind.Provider &&\n                providerGovernorDiagnostics != null)\n            {\n                ApplyProviderGovernorDiagnostics();\n            }\n\n            if (eventArgs.Health.Criticality == ReachyServiceCriticality.Required &&\n''')

          replace(
              '''        private string BuildDiagnostics()\n        {\n            var lines = new List<string>(dependencies.Length + 1)\n''',
              '''        private void ApplyProviderGovernorDiagnostics()\n        {\n            if (providerGovernorDiagnostics == null)\n            {\n                return;\n            }\n\n            ReachyMainScreenSnapshot current = stateStore.Current;\n            ReachyProviderGovernorMainScreenProjection projection =\n                ReachyProviderGovernorMainScreenProjection.Create(\n                    providerGovernorDiagnostics.GovernorDiagnostics,\n                    current.InteractionState,\n                    governorOwnsInteractionState);\n            stateStore.SetCapabilities(\n                current.ActiveCamera,\n                current.CameraSelectionAvailable,\n                projection.ActiveProvider,\n                projection.ProviderLocation,\n                current.MicrophoneAvailable);\n            if (projection.OverrideInteraction)\n            {\n                stateStore.SetInteraction(\n                    projection.InteractionState,\n                    projection.Detail);\n            }\n            governorOwnsInteractionState = projection.GovernorOwnsInteractionState;\n        }\n\n        private string BuildDiagnostics()\n        {\n            var lines = new List<string>(dependencies.Length + 2)\n''')

          replace(
              '''            for (int index = 0; index < dependencies.Length; ++index)\n            {\n                ReachyServiceHealth health = dependencies[index].Health;\n                lines.Add(\n                    $"{health.Kind}: {health.State} — {health.Message}");\n            }\n            return string.Join("\\n", lines);\n''',
              '''            for (int index = 0; index < dependencies.Length; ++index)\n            {\n                ReachyServiceHealth health = dependencies[index].Health;\n                lines.Add(\n                    $"{health.Kind}: {health.State} — {health.Message}");\n            }\n            if (providerGovernorDiagnostics != null)\n            {\n                lines.Add(providerGovernorDiagnostics.GovernorDiagnostics.DiagnosticLine);\n            }\n            return string.Join("\\n", lines);\n''')

          path.write_text(text, encoding='utf-8')

          test = Path('scripts/tests/test_rma135_main_screen_governor_wiring.py')
          test.write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nSOURCE = ROOT / "Assets/ReachyMini/Runtime/Application/ReachyProductionApplicationCompositionProvider.cs"\n\n\ndef require(text: str, needle: str, label: str) -> None:\n    if needle not in text:\n        raise AssertionError(f"missing {label}: {needle}")\n\n\ndef main() -> None:\n    text = SOURCE.read_text(encoding="utf-8")\n    require(text, "IReachyProviderGovernorDiagnosticsSource?", "optional provider diagnostics source")\n    require(text, "eventArgs.Health.Kind == ReachyServiceKind.Provider", "existing health path")\n    require(text, "ReachyProviderGovernorMainScreenProjection.Create", "tested UI projection")\n    require(text, "projection.OverrideInteraction", "explicit interaction ownership")\n    require(text, "providerGovernorDiagnostics.GovernorDiagnostics.DiagnosticLine", "diagnostics output")\n    unavailable_start = text.index("internal sealed class ReachyUnavailableProviderApplicationService")\n    unavailable_end = text.index("internal sealed class ReachyUnavailablePerceptionApplicationService")\n    unavailable = text[unavailable_start:unavailable_end]\n    if "IReachyProviderGovernorDiagnosticsSource" in unavailable:\n        raise AssertionError("unavailable provider must not masquerade as a live governor source")\n    for forbidden in ("LocalLlmGenerationRequest", "LocalLlmChatMessage", "ResponseJson"):\n        if forbidden in text:\n            raise AssertionError(f"main-screen governor diagnostics must not access {forbidden}")\n    print("RMA-135 main-screen governor wiring contracts passed.")\n\n\nif __name__ == "__main__":\n    main()\n''', encoding='utf-8')
          PY
          ruff format scripts/tests/test_rma135_main_screen_governor_wiring.py
          mapfile -t changed < <(git diff --name-only)
          expected=(
            Assets/ReachyMini/Runtime/Application/ReachyProductionApplicationCompositionProvider.cs
            scripts/tests/test_rma135_main_screen_governor_wiring.py
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git diff --check
      - name: Run bounded contract gates
        shell: bash
        run: |
          set -euo pipefail
          dotnet build managed/ReachyMini.Core/ReachyMini.Core.csproj --configuration Release --warnaserror
          dotnet run --project managed/ReachyMini.ResourceGovernor.Diagnostics.Tests/ReachyMini.ResourceGovernor.Diagnostics.Tests.csproj --configuration Release
          python3 scripts/tests/test_rma135_main_screen_governor_wiring.py
          ruff check scripts
          ruff format --check scripts
      - name: Commit bounded wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/ReachyMini/Runtime/Application/ReachyProductionApplicationCompositionProvider.cs \
            scripts/tests/test_rma135_main_screen_governor_wiring.py
          git commit -m "RMA-135: wire governor diagnostics into main screen"
          git push origin HEAD:master

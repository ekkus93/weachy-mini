name: RMA-135 bounded OOM patch v2

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma135-bounded-oom-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0
      - name: Execute corrected bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('.github/workflows/rma135-bounded-oom-patch.yml')
          source = source_path.read_text(encoding='utf-8')
          corrections = {
              'throw new OutOfMemoryException("synthetic start OOM");':
                  'throw (Exception)Activator.CreateInstance(typeof(OutOfMemoryException), "synthetic start OOM")!;',
              'throw new OutOfMemoryException("synthetic poll OOM");':
                  'throw (Exception)Activator.CreateInstance(typeof(OutOfMemoryException), "synthetic poll OOM")!;',
          }
          for old, new in corrections.items():
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one workflow patch marker: {old}')
              source = source.replace(old, new)

          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = block.splitlines()
          if not lines or any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('bounded patch Python indentation changed unexpectedly')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          exec(compile(script, '<rma135-bounded-oom-patch>', 'exec'), {'__name__': '__main__'})
          PY

          ruff format scripts/tests/test_rma135_resource_governor.py
          mapfile -t changed < <(git diff --name-only)
          expected=(
            Assets/ReachyMini/Runtime/Core/LocalModels/LocalLlmGovernedGenerationCoordinator.cs
            Assets/ReachyMini/Runtime/Core/LocalModels/LocalLlmResourceGovernor.cs
            Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalLlmContracts.cs
            Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalLlmProvider.cs
            managed/ReachyMini.LocalLlm.Tests/Program.cs
            managed/ReachyMini.ResourceGovernor.Integration.Tests/Program.cs
            managed/ReachyMini.ResourceGovernor.Tests/Program.cs
            scripts/tests/test_rma135_resource_governor.py
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git diff --check

      - name: Run exact managed and static gates
        shell: bash
        run: |
          set -euo pipefail
          dotnet build managed/ReachyMini.Core/ReachyMini.Core.csproj --configuration Release --warnaserror
          dotnet run --project managed/ReachyMini.LocalLlm.Tests/ReachyMini.LocalLlm.Tests.csproj --configuration Release
          dotnet run --project managed/ReachyMini.ResourceGovernor.Tests/ReachyMini.ResourceGovernor.Tests.csproj --configuration Release
          dotnet run --project managed/ReachyMini.ResourceGovernor.Integration.Tests/ReachyMini.ResourceGovernor.Integration.Tests.csproj --configuration Release
          python3 scripts/tests/test_rma135_resource_governor.py
          ruff check scripts
          ruff format --check scripts

      - name: Commit bounded product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/ReachyMini/Runtime/Core/LocalModels/LocalLlmGovernedGenerationCoordinator.cs \
            Assets/ReachyMini/Runtime/Core/LocalModels/LocalLlmResourceGovernor.cs \
            Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalLlmContracts.cs \
            Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalLlmProvider.cs \
            managed/ReachyMini.LocalLlm.Tests/Program.cs \
            managed/ReachyMini.ResourceGovernor.Integration.Tests/Program.cs \
            managed/ReachyMini.ResourceGovernor.Tests/Program.cs \
            scripts/tests/test_rma135_resource_governor.py
          git commit -m "RMA-135: latch local LLM resource exhaustion"
          git push origin HEAD:master

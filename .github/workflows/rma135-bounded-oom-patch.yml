name: RMA-135 bounded OOM patch

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma135-bounded-oom-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0
      - name: Apply exact OOM classification and latch patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = root / path
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          contracts = 'Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalLlmContracts.cs'
          provider = 'Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalLlmProvider.cs'
          governor = 'Assets/ReachyMini/Runtime/Core/LocalModels/LocalLlmResourceGovernor.cs'
          coordinator = 'Assets/ReachyMini/Runtime/Core/LocalModels/LocalLlmGovernedGenerationCoordinator.cs'
          provider_tests = 'managed/ReachyMini.LocalLlm.Tests/Program.cs'
          governor_tests = 'managed/ReachyMini.ResourceGovernor.Tests/Program.cs'
          integration_tests = 'managed/ReachyMini.ResourceGovernor.Integration.Tests/Program.cs'
          static_tests = 'scripts/tests/test_rma135_resource_governor.py'

          replace(
              contracts,
              '        Disposed = 11,\n    }\n\n    public enum LocalLlmChatRole',
              '        Disposed = 11,\n        ResourceExhausted = 12,\n    }\n\n    public enum LocalLlmChatRole')

          replace(
              governor,
              '        private LocalLlmGovernorMode currentMode = LocalLlmGovernorMode.Nominal;\n        private int recoverySamples;\n\n        public LocalLlmGovernorMode CurrentMode => currentMode;\n',
              '        private LocalLlmGovernorMode currentMode = LocalLlmGovernorMode.Nominal;\n        private int recoverySamples;\n        private bool outOfMemoryLatched;\n\n        public LocalLlmGovernorMode CurrentMode => currentMode;\n        public bool OutOfMemoryLatched => outOfMemoryLatched;\n')
          replace(
              governor,
              '            LocalLlmGovernorMode appliedMode = ApplyHysteresis(\n                requestedMode,\n                ref reasons);\n',
              '            LocalLlmGovernorMode appliedMode;\n            if (outOfMemoryLatched && requestedMode != LocalLlmGovernorMode.Nominal)\n            {\n                reasons |= LocalLlmGovernorReason.RecentOutOfMemory;\n                currentMode = LocalLlmGovernorMode.Suspended;\n                recoverySamples = 0;\n                appliedMode = LocalLlmGovernorMode.Suspended;\n            }\n            else\n            {\n                appliedMode = ApplyHysteresis(requestedMode, ref reasons);\n                if (outOfMemoryLatched)\n                {\n                    if (appliedMode == LocalLlmGovernorMode.Suspended)\n                    {\n                        reasons |= LocalLlmGovernorReason.RecentOutOfMemory;\n                    }\n                    else\n                    {\n                        outOfMemoryLatched = false;\n                    }\n                }\n            }\n')
          replace(
              governor,
              '        public void Reset()\n        {\n            currentMode = LocalLlmGovernorMode.Nominal;\n            recoverySamples = 0;\n        }\n',
              '        public void RecordOutOfMemory()\n        {\n            currentMode = LocalLlmGovernorMode.Suspended;\n            recoverySamples = 0;\n            outOfMemoryLatched = true;\n        }\n\n        public void Reset()\n        {\n            currentMode = LocalLlmGovernorMode.Nominal;\n            recoverySamples = 0;\n            outOfMemoryLatched = false;\n        }\n')

          replace(
              coordinator,
              '        Busy = 4,\n    }\n',
              '        Busy = 4,\n        ResourceExhausted = 5,\n    }\n')
          replace(
              coordinator,
              '                LocalLlmGenerationResult providerResult =\n                    await generationTask.ConfigureAwait(false);\n                if (resourceCancellationIssued)\n',
              '                LocalLlmGenerationResult providerResult =\n                    await generationTask.ConfigureAwait(false);\n                if (providerResult.Status == LocalLlmGenerationStatus.ResourceExhausted)\n                {\n                    governor.RecordOutOfMemory();\n                    LocalLlmGovernorDecision exhausted = BuildOutOfMemoryDecision(CurrentDecision);\n                    PublishDecision(exhausted);\n                    return Result(\n                        LocalLlmGovernedGenerationStatus.ResourceExhausted,\n                        exhausted,\n                        providerResult,\n                        "Local LLM inference exhausted memory; the governor is latched suspended until three consecutive nominal observations.");\n                }\n                if (resourceCancellationIssued)\n')
          replace(
              coordinator,
              '        private static string? TryCancel(CancellationTokenSource cancellation)\n',
              '        private static LocalLlmGovernorDecision BuildOutOfMemoryDecision(\n            LocalLlmGovernorDecision? previous)\n        {\n            LocalLlmDeviceProfile deviceProfile = previous?.DeviceProfile ??\n                LocalLlmDeviceProfile.Select(0L, 0);\n            LocalLlmGovernorReason reasons =\n                (previous?.Reasons ?? LocalLlmGovernorReason.None) |\n                LocalLlmGovernorReason.RecentOutOfMemory;\n            return new LocalLlmGovernorDecision(\n                LocalLlmGovernorMode.Suspended,\n                reasons,\n                deviceProfile,\n                null,\n                "Local LLM governor mode=Suspended; recent local inference out-of-memory is latched; explicit recovery is required after healthy observations.");\n        }\n\n        private static string? TryCancel(CancellationTokenSource cancellation)\n')

          replace(
              provider,
              '            catch (Exception exception)\n            {\n                MarkFaulted();\n                return Result(\n                    LocalLlmGenerationStatus.RuntimeFailure,\n                    request.RequestId,\n                    epoch,\n                    "Unexpected local LLM generation failure: " + exception.Message,\n                    ReachyLlamaNativeContract.StatusInternalError);\n            }\n',
              '            catch (OutOfMemoryException exception)\n            {\n                MarkFaulted();\n                return ResourceExhausted(\n                    request.RequestId,\n                    epoch,\n                    "Local LLM generation exhausted memory before a safe terminal result: " +\n                        exception.Message);\n            }\n            catch (Exception exception)\n            {\n                MarkFaulted();\n                return Result(\n                    LocalLlmGenerationStatus.RuntimeFailure,\n                    request.RequestId,\n                    epoch,\n                    "Unexpected local LLM generation failure: " + exception.Message,\n                    ReachyLlamaNativeContract.StatusInternalError);\n            }\n')

          for label in (
              'Local LLM chat-template application threw: ',
              'Local LLM token preflight threw: ',
              'Local LLM constrained start threw: ',
          ):
              old = f'''            catch (Exception exception)\n            {{\n                return RuntimeFailure(\n                    request.RequestId,\n                    epoch,\n                    ReachyLlamaNativeContract.StatusInternalError,\n                    "{label}" + exception.Message);\n            }}\n'''
              new = f'''            catch (OutOfMemoryException)\n            {{\n                throw;\n            }}\n            catch (Exception exception)\n            {{\n                return RuntimeFailure(\n                    request.RequestId,\n                    epoch,\n                    ReachyLlamaNativeContract.StatusInternalError,\n                    "{label}" + exception.Message);\n            }}\n'''
              replace(provider, old, new)

          replace(
              provider,
              '                            catch (Exception exception)\n                            {\n                                consumerFailure = true;\n                                consumerFailureDetail = exception.Message;\n                            }\n',
              '                            catch (OutOfMemoryException)\n                            {\n                                throw;\n                            }\n                            catch (Exception exception)\n                            {\n                                consumerFailure = true;\n                                consumerFailureDetail = exception.Message;\n                            }\n')

          replace(
              provider,
              '            catch (Exception exception)\n            {\n                bool cleaned = generationReleased;\n                if (!generationReleased)\n                {\n                    cleaned = terminal == null\n                        ? await CancelDrainReleaseAsync(\n                            generationHandle).ConfigureAwait(false)\n                        : SafeRelease(generationHandle).Succeeded;\n                }\n                if (!cleaned)\n                {\n                    MarkFaulted();\n                }\n                return RuntimeFailure(\n                    request.RequestId,\n                    epoch,\n                    ReachyLlamaNativeContract.StatusInternalError,\n                    "Unexpected local LLM post-start failure: " + exception.Message);\n            }\n',
              '            catch (OutOfMemoryException exception)\n            {\n                bool cleaned = generationReleased;\n                if (!generationReleased)\n                {\n                    try\n                    {\n                        cleaned = terminal == null\n                            ? await CancelDrainReleaseAsync(\n                                generationHandle).ConfigureAwait(false)\n                            : SafeRelease(generationHandle).Succeeded;\n                    }\n                    catch (Exception)\n                    {\n                        cleaned = false;\n                    }\n                }\n                MarkFaulted();\n                return ResourceExhausted(\n                    request.RequestId,\n                    epoch,\n                    cleaned\n                        ? "Local LLM generation exhausted memory; the generation handle was cleaned and the provider was faulted pending explicit recovery: " + exception.Message\n                        : "Local LLM generation exhausted memory and cleanup could not be proven complete; the provider was faulted: " + exception.Message);\n            }\n            catch (Exception exception)\n            {\n                bool cleaned = generationReleased;\n                if (!generationReleased)\n                {\n                    cleaned = terminal == null\n                        ? await CancelDrainReleaseAsync(\n                            generationHandle).ConfigureAwait(false)\n                        : SafeRelease(generationHandle).Succeeded;\n                }\n                if (!cleaned)\n                {\n                    MarkFaulted();\n                }\n                return RuntimeFailure(\n                    request.RequestId,\n                    epoch,\n                    ReachyLlamaNativeContract.StatusInternalError,\n                    "Unexpected local LLM post-start failure: " + exception.Message);\n            }\n')

          for prefix in (
              'Local LLM poll threw: ',
              'Local LLM cancel threw: ',
              'Local LLM metrics collection threw: ',
              'Local LLM generation release threw: ',
          ):
              marker = f'            catch (Exception exception)\n            {{\n'
              text = Path(provider).read_text(encoding='utf-8')
              idx = text.find(prefix)
              if idx < 0:
                  raise SystemExit(f'missing provider marker {prefix}')
              catch_idx = text.rfind(marker, 0, idx)
              if catch_idx < 0:
                  raise SystemExit(f'missing catch before {prefix}')
              insertion = '            catch (OutOfMemoryException)\n            {\n                throw;\n            }\n'
              text = text[:catch_idx] + insertion + text[catch_idx:]
              Path(provider).write_text(text, encoding='utf-8')

          replace(
              provider,
              '            catch (Exception exception)\n            {\n                return Result(\n                    LocalLlmGenerationStatus.ConsumerFailure,\n                    baseResult.RequestId,\n',
              '            catch (OutOfMemoryException)\n            {\n                throw;\n            }\n            catch (Exception exception)\n            {\n                return Result(\n                    LocalLlmGenerationStatus.ConsumerFailure,\n                    baseResult.RequestId,\n')
          replace(
              provider,
              '        private static LocalLlmGenerationResult RuntimeFailure(\n',
              '        private static LocalLlmGenerationResult ResourceExhausted(\n            string requestId,\n            ulong epoch,\n            string detail)\n        {\n            return Result(\n                LocalLlmGenerationStatus.ResourceExhausted,\n                requestId,\n                epoch,\n                detail.Length == 0\n                    ? "The local LLM exhausted available memory."\n                    : detail,\n                ReachyLlamaNativeContract.StatusInternalError);\n        }\n\n        private static LocalLlmGenerationResult RuntimeFailure(\n')

          replace(
              provider_tests,
              '        await TestMetricsExceptionStillReleasesAsync().ConfigureAwait(false);\n        await TestReloadRecoveryAndDisposeAsync().ConfigureAwait(false);\n        Console.WriteLine("RMA-134 local LLM managed contracts passed (17 groups).");\n',
              '        await TestMetricsExceptionStillReleasesAsync().ConfigureAwait(false);\n        await TestOutOfMemoryBeforeNativeHandleAsync().ConfigureAwait(false);\n        await TestOutOfMemoryAfterNativeStartAsync().ConfigureAwait(false);\n        await TestOutOfMemoryCleanupFailureFaultsAsync().ConfigureAwait(false);\n        await TestReloadRecoveryAndDisposeAsync().ConfigureAwait(false);\n        Console.WriteLine("RMA-134 local LLM managed contracts passed (20 groups).");\n')
          replace(
              provider_tests,
              '    private static async Task TestReloadRecoveryAndDisposeAsync()\n',
              '''    private static async Task TestOutOfMemoryBeforeNativeHandleAsync()\n    {\n        using FakeRuntime runtime = new FakeRuntime { ThrowOutOfMemoryOnStart = true };\n        await using LocalLlmProvider provider = await CreateProviderAsync(runtime).ConfigureAwait(false);\n        LocalLlmGenerationResult result = await provider.GenerateAsync(\n            Request("req-oom-start", "Allocate."), new CollectingSink(), CancellationToken.None)\n            .ConfigureAwait(false);\n        Require(result.Status == LocalLlmGenerationStatus.ResourceExhausted,\n            "Pre-handle OOM was not classified as resource exhaustion.");\n        Require(provider.State == LocalLlmProviderState.Faulted,\n            "Pre-handle OOM did not fault the provider for explicit recovery.");\n        Require(runtime.StartCount == 1 && runtime.ReleaseCount == 0,\n            "Pre-handle OOM fabricated or leaked a known generation handle.");\n    }\n\n    private static async Task TestOutOfMemoryAfterNativeStartAsync()\n    {\n        using FakeRuntime runtime = new FakeRuntime { ThrowOutOfMemoryOnNextPoll = true };\n        await using LocalLlmProvider provider = await CreateProviderAsync(runtime).ConfigureAwait(false);\n        LocalLlmGenerationResult result = await provider.GenerateAsync(\n            Request("req-oom-poll", "Allocate."), new CollectingSink(), CancellationToken.None)\n            .ConfigureAwait(false);\n        Require(result.Status == LocalLlmGenerationStatus.ResourceExhausted,\n            "Post-start OOM was not classified as resource exhaustion.");\n        Require(provider.State == LocalLlmProviderState.Faulted,\n            "Post-start OOM did not fault the provider for explicit recovery.");\n        Require(runtime.CancelCount == 1 && runtime.ReleaseCount == 1,\n            "Post-start OOM did not cancel/drain/release the generation exactly once.");\n    }\n\n    private static async Task TestOutOfMemoryCleanupFailureFaultsAsync()\n    {\n        using FakeRuntime runtime = new FakeRuntime\n        {\n            ThrowOutOfMemoryOnNextPoll = true,\n            CancelStatus = 7,\n        };\n        await using LocalLlmProvider provider = await CreateProviderAsync(runtime).ConfigureAwait(false);\n        LocalLlmGenerationResult result = await provider.GenerateAsync(\n            Request("req-oom-cleanup", "Allocate."), new CollectingSink(), CancellationToken.None)\n            .ConfigureAwait(false);\n        Require(result.Status == LocalLlmGenerationStatus.ResourceExhausted,\n            "OOM cleanup failure lost the resource-exhausted classification.");\n        Require(provider.State == LocalLlmProviderState.Faulted,\n            "OOM cleanup failure did not leave the provider faulted.");\n        Require(runtime.CancelCount == 1 && runtime.ReleaseCount == 0,\n            "OOM cleanup failure silently released or retried uncertain native state.");\n    }\n\n    private static async Task TestReloadRecoveryAndDisposeAsync()\n''')
          replace(
              provider_tests,
              '        internal bool ThrowOnNextPoll { get; set; }\n        internal bool ThrowOnMetrics { get; set; }\n',
              '        internal bool ThrowOnNextPoll { get; set; }\n        internal bool ThrowOutOfMemoryOnStart { get; set; }\n        internal bool ThrowOutOfMemoryOnNextPoll { get; set; }\n        internal bool ThrowOnMetrics { get; set; }\n')
          replace(
              provider_tests,
              '            ++StartCount;\n            LastGrammar = grammar;\n',
              '            ++StartCount;\n            if (ThrowOutOfMemoryOnStart)\n            {\n                ThrowOutOfMemoryOnStart = false;\n                throw new OutOfMemoryException("synthetic start OOM");\n            }\n            LastGrammar = grammar;\n')
          replace(
              provider_tests,
              '            if (ThrowOnNextPoll)\n            {\n                ThrowOnNextPoll = false;\n                throw new InvalidOperationException("synthetic poll threw");\n            }\n',
              '            if (ThrowOutOfMemoryOnNextPoll)\n            {\n                ThrowOutOfMemoryOnNextPoll = false;\n                throw new OutOfMemoryException("synthetic poll OOM");\n            }\n            if (ThrowOnNextPoll)\n            {\n                ThrowOnNextPoll = false;\n                throw new InvalidOperationException("synthetic poll threw");\n            }\n')

          replace(
              governor_tests,
              '            Run("recent OOM suspended", () =>\n',
              '            Run("latched OOM recovery", LatchedOomRecovery);\n            Run("recent OOM suspended", () =>\n')
          replace(
              governor_tests,
              '        private static void BehaviorControlsPreserved()\n',
              '''        private static void LatchedOomRecovery()\n        {\n            var governor = new LocalLlmResourceGovernor();\n            governor.RecordOutOfMemory();\n            if (!governor.OutOfMemoryLatched)\n            {\n                throw new InvalidOperationException("OOM latch did not engage.");\n            }\n            LocalLlmResourceSnapshot healthy = Snapshot(\n                12, 8, 0.5, 8, LocalLlmThermalStatus.None, LocalLlmPhysicsBudgetState.Healthy);\n            LocalLlmGovernorDecision first = governor.Evaluate(Baseline(), healthy);\n            Equal(LocalLlmGovernorMode.Suspended, first.Mode);\n            Reason(first, LocalLlmGovernorReason.RecentOutOfMemory);\n            Equal(LocalLlmGovernorMode.Suspended, governor.Evaluate(Baseline(), healthy).Mode);\n            Equal(LocalLlmGovernorMode.Nominal, governor.Evaluate(Baseline(), healthy).Mode);\n            if (governor.OutOfMemoryLatched)\n            {\n                throw new InvalidOperationException("OOM latch did not clear after three nominal observations.");\n            }\n        }\n\n        private static void BehaviorControlsPreserved()\n''')

          replace(
              integration_tests,
              '            Run("coordinator rejects hidden queue", () =>\n                CoordinatorRejectsHiddenQueue().GetAwaiter().GetResult());\n',
              '            Run("coordinator rejects hidden queue", () =>\n                CoordinatorRejectsHiddenQueue().GetAwaiter().GetResult());\n            Run("provider OOM latches governor", () =>\n                ProviderOomLatchesGovernor().GetAwaiter().GetResult());\n')
          replace(
              integration_tests,
              '        private static async Task CoordinatorRejectsHiddenQueue()\n',
              '''        private static async Task ProviderOomLatchesGovernor()\n        {\n            var governor = new LocalLlmResourceGovernor();\n            var executor = new FakeExecutor(Baseline(), (request, sink, token) =>\n                Task.FromResult(Generation(LocalLlmGenerationStatus.ResourceExhausted, request.RequestId)));\n            var coordinator = new LocalLlmGovernedGenerationCoordinator(\n                executor,\n                Baseline(),\n                governor,\n                new RepeatingResourceSignals(Snapshot(LocalLlmThermalStatus.None)),\n                new RepeatingPhysicsBudgetSource(LocalLlmPhysicsBudgetState.Healthy),\n                TimeSpan.FromMilliseconds(25));\n            LocalLlmGovernedGenerationResult result = await coordinator.GenerateAsync(\n                Request("oom-latch"), new NullSink(), CancellationToken.None);\n            Equal(LocalLlmGovernedGenerationStatus.ResourceExhausted, result.Status);\n            Equal(1, executor.InvocationCount);\n            if (!governor.OutOfMemoryLatched)\n            {\n                throw new InvalidOperationException("Coordinator did not latch provider OOM.");\n            }\n            Equal(LocalLlmGovernorMode.Suspended, coordinator.EvaluateCurrentBudget().Mode);\n            Equal(LocalLlmGovernorMode.Suspended, coordinator.EvaluateCurrentBudget().Mode);\n            Equal(LocalLlmGovernorMode.Nominal, coordinator.EvaluateCurrentBudget().Mode);\n            Equal(1, executor.InvocationCount);\n        }\n\n        private static async Task CoordinatorRejectsHiddenQueue()\n''')

          replace(
              static_tests,
              '    require(core, "RecentOutOfMemory", "OOM signal")\n',
              '    require(core, "RecentOutOfMemory", "OOM signal")\n    require(core, "RecordOutOfMemory", "explicit OOM latch")\n    require(core, "OutOfMemoryLatched", "OOM latch diagnostics")\n')
          replace(
              static_tests,
              '    require(coordinator, "ResourceCancelledDuringGeneration", "active resource cancellation")\n',
              '    require(coordinator, "ResourceCancelledDuringGeneration", "active resource cancellation")\n    require(coordinator, "ResourceExhausted", "typed OOM propagation")\n')
          PY

          ruff format scripts/tests/test_rma135_resource_governor.py
          mapfile -t changed < <(git diff --name-only)
          expected=(
            Assets/ReachyMini/Runtime/Core/LocalModels/LocalLlmGovernedGenerationCoordinator.cs
            Assets/ReachyMini/Runtime/Core/LocalModels/LocalLlmResourceGovernor.cs
            Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalLlmContracts.cs
            Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalLlmProvider.cs
            managed/ReachyMini.LocalLlm.Tests/Program.cs
            managed/ReachyMini.ResourceGovernor.Integration.Tests/Program.cs
            managed/ReachyMini.ResourceGovernor.Tests/Program.cs
            scripts/tests/test_rma135_resource_governor.py
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git diff --check

      - name: Run exact managed and static gates
        shell: bash
        run: |
          set -euo pipefail
          dotnet build managed/ReachyMini.Core/ReachyMini.Core.csproj --configuration Release --warnaserror
          dotnet run --project managed/ReachyMini.LocalLlm.Tests/ReachyMini.LocalLlm.Tests.csproj --configuration Release
          dotnet run --project managed/ReachyMini.ResourceGovernor.Tests/ReachyMini.ResourceGovernor.Tests.csproj --configuration Release
          dotnet run --project managed/ReachyMini.ResourceGovernor.Integration.Tests/ReachyMini.ResourceGovernor.Integration.Tests.csproj --configuration Release
          python3 scripts/tests/test_rma135_resource_governor.py
          ruff check scripts
          ruff format --check scripts

      - name: Commit bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/ReachyMini/Runtime/Core/LocalModels/LocalLlmGovernedGenerationCoordinator.cs \
            Assets/ReachyMini/Runtime/Core/LocalModels/LocalLlmResourceGovernor.cs \
            Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalLlmContracts.cs \
            Assets/ReachyMini/Runtime/Core/LocalModels/ReachyLocalLlmProvider.cs \
            managed/ReachyMini.LocalLlm.Tests/Program.cs \
            managed/ReachyMini.ResourceGovernor.Integration.Tests/Program.cs \
            managed/ReachyMini.ResourceGovernor.Tests/Program.cs \
            scripts/tests/test_rma135_resource_governor.py
          git commit -m "RMA-135: latch local LLM resource exhaustion"
          git push origin HEAD:master

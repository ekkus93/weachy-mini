name: RMA-135 bounded production-worker acceptance v2

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma135-bounded-production-worker-acceptance-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0
      - name: Execute corrected bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/rma135-bounded-production-worker-acceptance.yml').read_text(
              encoding='utf-8'
          )
          old = '''          contract = contract.replace(\n              '    require(\\n        text,\\n        "ReachySimAuthoritativeStateReader",\\n        "production authoritative state reader",\\n    )\\n',\n              '',\n              1,\n          )\n'''
          new = '''          contract = contract.replace(\n              '    require(text, "ReachySimAuthoritativeStateReader", "production authoritative state reader")\\n',\n              '',\n              1,\n          )\n'''
          if source.count(old) != 1:
              raise SystemExit('could not locate obsolete reader-contract transformation')
          source = source.replace(old, new, 1)

          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = block.splitlines()
          if not lines or any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('bounded patch Python indentation changed unexpectedly')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          exec(compile(script, '<rma135-production-worker-patch>', 'exec'), {'__name__': '__main__'})
          PY

          ruff format scripts/tests/test_rma135_android_acceptance_contracts.py
          python3 scripts/tests/test_rma135_android_acceptance_contracts.py
          bash -n scripts/run_rma135_resource_governor_acceptance_android.sh
          dotnet build managed/ReachyMini.Core/ReachyMini.Core.csproj --configuration Release --warnaserror
          dotnet run --project managed/ReachyMini.ResourceGovernor.Tests/ReachyMini.ResourceGovernor.Tests.csproj --configuration Release
          dotnet run --project managed/ReachyMini.ResourceGovernor.Integration.Tests/ReachyMini.ResourceGovernor.Integration.Tests.csproj --configuration Release
          ruff check scripts
          ruff format --check scripts
          git diff --check
          git add -N Assets/ReachyMini/Runtime/Simulation/IReachySimulationTimingSource.cs
          mapfile -t changed < <(git diff --name-only)
          expected=(
            Assets/ReachyMini/Runtime/Simulation/IReachySimulationTimingSource.cs
            Assets/ReachyMini/Runtime/Simulation/ReachySimulationWorker.cs
            Assets/ReachyMini/Runtime/Rendering/ReachyProductionAuthoritativeRuntime.cs
            Assets/ReachyMini/Runtime/Core/Application/ReachySimulationLocalLlmPhysicsBudgetSource.cs
            Assets/ReachyMini/Runtime/Application/ReachyRma135ResourceGovernorAcceptance.cs
            scripts/run_rma135_resource_governor_acceptance_android.sh
            scripts/tests/test_rma135_android_acceptance_contracts.py
            .github/workflows/rma135-resource-thermal-governor.yml
            .github/workflows/rma135-resource-governor-android.yml
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Commit bounded production-worker patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/ReachyMini/Runtime/Simulation/IReachySimulationTimingSource.cs \
            Assets/ReachyMini/Runtime/Simulation/ReachySimulationWorker.cs \
            Assets/ReachyMini/Runtime/Rendering/ReachyProductionAuthoritativeRuntime.cs \
            Assets/ReachyMini/Runtime/Core/Application/ReachySimulationLocalLlmPhysicsBudgetSource.cs \
            Assets/ReachyMini/Runtime/Application/ReachyRma135ResourceGovernorAcceptance.cs \
            scripts/run_rma135_resource_governor_acceptance_android.sh \
            scripts/tests/test_rma135_android_acceptance_contracts.py \
            .github/workflows/rma135-resource-thermal-governor.yml \
            .github/workflows/rma135-resource-governor-android.yml
          git commit -m "RMA-135: validate the live production physics worker"
          git push origin HEAD:master

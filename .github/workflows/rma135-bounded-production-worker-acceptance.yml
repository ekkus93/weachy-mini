name: RMA-135 bounded production-worker acceptance

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma135-bounded-production-worker-acceptance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0
      - name: Apply bounded production-worker patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          interface_path = root / 'Assets/ReachyMini/Runtime/Simulation/IReachySimulationTimingSource.cs'
          interface_path.write_text('''#nullable enable\n\nnamespace ReachyMini.Simulation\n{\n    public interface IReachySimulationTimingSource\n    {\n        ReachySimulationRunState SimulationRunState { get; }\n\n        bool TryGetLatestTimingSnapshot(out ReachySimulationTimingSnapshot timing);\n    }\n}\n''', encoding='utf-8')

          def patch(path: str, replacements: list[tuple[str, str, int]]) -> None:
              p = root / path
              text = p.read_text(encoding='utf-8')
              for old, new, count in replacements:
                  actual = text.count(old)
                  if actual != count:
                      raise SystemExit(
                          f'{path}: expected {count} matches, found {actual}: {old[:120]!r}'
                      )
                  text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          patch(
              'Assets/ReachyMini/Runtime/Simulation/ReachySimulationWorker.cs',
              [
                  (
                      '    public sealed class ReachySimulationWorker : IDisposable,\n'
                      '        IReachyPublishedAuthoritativeStateSource\n',
                      '    public sealed class ReachySimulationWorker : IDisposable,\n'
                      '        IReachyPublishedAuthoritativeStateSource,\n'
                      '        IReachySimulationTimingSource\n',
                      1,
                  ),
                  (
                      '        public ReachySimulationRunState State\n'
                      '        {\n',
                      '        public ReachySimulationRunState SimulationRunState => State;\n\n'
                      '        public ReachySimulationRunState State\n'
                      '        {\n',
                      1,
                  ),
                  (
                      '        public bool TryGetLatestSnapshot(\n'
                      '            out ReachyPublishedSimulationSnapshot snapshot)\n'
                      '        {\n'
                      '            return snapshotBuffer.TryRead(out snapshot);\n'
                      '        }\n',
                      '        public bool TryGetLatestSnapshot(\n'
                      '            out ReachyPublishedSimulationSnapshot snapshot)\n'
                      '        {\n'
                      '            return snapshotBuffer.TryRead(out snapshot);\n'
                      '        }\n\n'
                      '        public bool TryGetLatestTimingSnapshot(\n'
                      '            out ReachySimulationTimingSnapshot timing)\n'
                      '        {\n'
                      '            if (TryGetLatestSnapshot(out ReachyPublishedSimulationSnapshot snapshot))\n'
                      '            {\n'
                      '                timing = snapshot.Timing;\n'
                      '                return true;\n'
                      '            }\n'
                      '            timing = default;\n'
                      '            return false;\n'
                      '        }\n',
                      1,
                  ),
              ],
          )

          patch(
              'Assets/ReachyMini/Runtime/Rendering/ReachyProductionAuthoritativeRuntime.cs',
              [
                  (
                      '    public sealed class ReachyProductionAuthoritativeRuntime : MonoBehaviour\n',
                      '    public sealed class ReachyProductionAuthoritativeRuntime : MonoBehaviour,\n'
                      '        IReachySimulationTimingSource\n',
                      1,
                  ),
                  (
                      '        public ReachySimulationRunState SimulationState =>\n'
                      '            worker?.State ?? ReachySimulationRunState.Created;\n',
                      '        public ReachySimulationRunState SimulationState =>\n'
                      '            worker?.State ?? ReachySimulationRunState.Created;\n\n'
                      '        public ReachySimulationRunState SimulationRunState => SimulationState;\n\n'
                      '        public bool TryGetLatestTimingSnapshot(\n'
                      '            out ReachySimulationTimingSnapshot timing)\n'
                      '        {\n'
                      '            ReachySimulationWorker? activeWorker = worker;\n'
                      '            if (activeWorker != null &&\n'
                      '                activeWorker.TryGetLatestTimingSnapshot(out timing))\n'
                      '            {\n'
                      '                return true;\n'
                      '            }\n'
                      '            timing = default;\n'
                      '            return false;\n'
                      '        }\n',
                      1,
                  ),
              ],
          )

          patch(
              'Assets/ReachyMini/Runtime/Core/Application/ReachySimulationLocalLlmPhysicsBudgetSource.cs',
              [
                  (
                      '        private readonly ReachySimulationWorker worker;\n',
                      '        private readonly IReachySimulationTimingSource timingSource;\n',
                      1,
                  ),
                  (
                      '            ReachySimulationWorker worker,\n'
                      '            double timestepSeconds = ReachyMini.Core.ProjectMetadata.InitialPhysicsTimestepSeconds)\n'
                      '        {\n'
                      '            this.worker = worker ?? throw new ArgumentNullException(nameof(worker));\n',
                      '            IReachySimulationTimingSource timingSource,\n'
                      '            double timestepSeconds = ReachyMini.Core.ProjectMetadata.InitialPhysicsTimestepSeconds)\n'
                      '        {\n'
                      '            this.timingSource = timingSource ??\n'
                      '                throw new ArgumentNullException(nameof(timingSource));\n',
                      1,
                  ),
                  (
                      '                if (worker.State != ReachySimulationRunState.Running)\n',
                      '                if (timingSource.SimulationRunState != ReachySimulationRunState.Running)\n',
                      1,
                  ),
                  (
                      '                if (!worker.TryGetLatestSnapshot(out ReachyPublishedSimulationSnapshot snapshot))\n'
                      '                {\n'
                      '                    return LocalLlmPhysicsBudgetState.Unavailable;\n'
                      '                }\n'
                      '                return tracker.Observe(snapshot.Timing);\n',
                      '                if (!timingSource.TryGetLatestTimingSnapshot(\n'
                      '                    out ReachySimulationTimingSnapshot timing))\n'
                      '                {\n'
                      '                    return LocalLlmPhysicsBudgetState.Unavailable;\n'
                      '                }\n'
                      '                return tracker.Observe(timing);\n',
                      1,
                  ),
              ],
          )

          acceptance_path = root / 'Assets/ReachyMini/Runtime/Application/ReachyRma135ResourceGovernorAcceptance.cs'
          text = acceptance_path.read_text(encoding='utf-8')

          def accept_replace(old: str, new: str, count: int = 1) -> None:
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(
                      f'acceptance: expected {count} matches, found {actual}: {old[:120]!r}'
                  )
              text = text.replace(old, new, count)

          accept_replace('using ReachyMini.LocalModels;\n', 'using ReachyMini.LocalModels;\nusing ReachyMini.Rendering;\n')
          accept_replace(
              '        private const string SimulationModelResourcePath = "ReachyMiniRuntime/reachy_mini_mjb";\n',
              '',
          )
          accept_replace(
              '        private static readonly TimeSpan WorkerControlTimeout = TimeSpan.FromSeconds(10.0);\n',
              '',
          )
          accept_replace(
              '''            ReachySimulationWorker? worker = null;\n            LocalLlmProvider? provider = null;\n''',
              '''            LocalLlmProvider? provider = null;\n''')
          accept_replace(
              '''                WriteCheckpoint(\n                    "physics_worker_started",\n                    "Creating production-shape MuJoCo session, authoritative state reader, and ReachySimulationWorker.");\n                worker = CreateAndStartSimulationWorker();\n                var realPhysics = new ReachySimulationLocalLlmPhysicsBudgetSource(worker);\n                LocalLlmPhysicsBudgetState readyPhysics = await WaitForPhysicsBudgetAsync(realPhysics)\n                    .ConfigureAwait(true);\n                ReachyPublishedSimulationSnapshot workerBeforeAdmission =\n                    await WaitForWorkerProgressAsync(worker, 5UL).ConfigureAwait(true);\n                WriteCheckpoint(\n                    "physics_worker_ready",\n                    "state=" + readyPhysics + " steps=" +\n                    workerBeforeAdmission.Timing.TotalStepCount.ToString(CultureInfo.InvariantCulture));\n''',
              '''                WriteCheckpoint(\n                    "production_physics_runtime_started",\n                    "Locating the live ReachyProductionAuthoritativeRuntime; the acceptance will not create a second MuJoCo worker.");\n                ReachyProductionAuthoritativeRuntime productionRuntime =\n                    await WaitForProductionRuntimeAsync().ConfigureAwait(true);\n                var realPhysics = new ReachySimulationLocalLlmPhysicsBudgetSource(productionRuntime);\n                PhysicsStartupStabilization startupPhysics =\n                    await WaitForPhysicsBudgetAsync(realPhysics).ConfigureAwait(true);\n                ReachySimulationTimingSnapshot workerBeforeAdmission =\n                    await WaitForTimingProgressAsync(\n                        productionRuntime,\n                        startupPhysics.MinimumObservedStepCount).ConfigureAwait(true);\n                WriteCheckpoint(\n                    "production_physics_runtime_ready",\n                    "state=" + startupPhysics.State +\n                    " observations=" + startupPhysics.Observations.ToString(CultureInfo.InvariantCulture) +\n                    " exceeded_observations=" + startupPhysics.ExceededObservations.ToString(CultureInfo.InvariantCulture) +\n                    " steps=" + workerBeforeAdmission.TotalStepCount.ToString(CultureInfo.InvariantCulture));\n''')
          accept_replace(
              '                LocalLlmResourceSnapshot initialResources = androidSignals.Capture(readyPhysics);\n',
              '                LocalLlmResourceSnapshot initialResources = androidSignals.Capture(startupPhysics.State);\n')
          accept_replace(
              '''                ReachyPublishedSimulationSnapshot beforeInjection =\n                    await WaitForWorkerProgressAsync(\n                        worker,\n                        checked(workerBeforeAdmission.Timing.TotalStepCount + 5UL)).ConfigureAwait(true);\n''',
              '''                ReachySimulationTimingSnapshot beforeInjection =\n                    await WaitForTimingProgressAsync(\n                        productionRuntime,\n                        checked(workerBeforeAdmission.TotalStepCount + 5UL)).ConfigureAwait(true);\n''')
          accept_replace(
              '''                ReachyPublishedSimulationSnapshot afterInjection =\n                    await WaitForWorkerProgressAsync(\n                        worker,\n                        checked(beforeInjection.Timing.TotalStepCount + 5UL)).ConfigureAwait(true);\n                if (afterInjection.Timing.TotalStepCount <= beforeInjection.Timing.TotalStepCount)\n''',
              '''                ReachySimulationTimingSnapshot afterInjection =\n                    await WaitForTimingProgressAsync(\n                        productionRuntime,\n                        checked(beforeInjection.TotalStepCount + 5UL)).ConfigureAwait(true);\n                if (afterInjection.TotalStepCount <= beforeInjection.TotalStepCount)\n''')
          accept_replace(
              '                    "worker_steps_before=" + beforeInjection.Timing.TotalStepCount.ToString(\n'
              '                        CultureInfo.InvariantCulture) + " worker_steps_after=" +\n'
              '                    afterInjection.Timing.TotalStepCount.ToString(CultureInfo.InvariantCulture));\n',
              '                    "worker_steps_before=" + beforeInjection.TotalStepCount.ToString(\n'
              '                        CultureInfo.InvariantCulture) + " worker_steps_after=" +\n'
              '                    afterInjection.TotalStepCount.ToString(CultureInfo.InvariantCulture));\n')
          accept_replace(
              '''                ReachyPublishedSimulationSnapshot finalWorker =\n                    await WaitForWorkerProgressAsync(\n                        worker,\n                        checked(afterInjection.Timing.TotalStepCount + 5UL)).ConfigureAwait(true);\n''',
              '''                ReachySimulationTimingSnapshot finalWorker =\n                    await WaitForTimingProgressAsync(\n                        productionRuntime,\n                        checked(afterInjection.TotalStepCount + 5UL)).ConfigureAwait(true);\n''')
          accept_replace(
              '                    "steps=" + finalWorker.Timing.TotalStepCount.ToString(CultureInfo.InvariantCulture) +\n',
              '                    "steps=" + finalWorker.TotalStepCount.ToString(CultureInfo.InvariantCulture) +\n')
          accept_replace(
              '''                    effective_threads = effectiveProfile.Threads,\n                    effective_batch_threads = effectiveProfile.BatchThreads,\n''',
              '''                    effective_threads = effectiveProfile.Threads,\n                    effective_batch_threads = effectiveProfile.BatchThreads,\n                    startup_physics_observations = startupPhysics.Observations,\n                    startup_physics_exceeded_observations = startupPhysics.ExceededObservations,\n                    startup_physics_state = startupPhysics.State.ToString(),\n                    production_runtime_model_hash = productionRuntime.ModelHash,\n''')
          accept_replace('beforeInjection.Timing.TotalStepCount', 'beforeInjection.TotalStepCount', 1)
          accept_replace('afterInjection.Timing.TotalStepCount', 'afterInjection.TotalStepCount', 1)
          accept_replace('beforeInjection.Timing.DeadlineMissCount', 'beforeInjection.DeadlineMissCount', 1)
          accept_replace('afterInjection.Timing.DeadlineMissCount', 'afterInjection.DeadlineMissCount', 1)
          accept_replace('afterInjection.Timing.AccumulatedLagSeconds', 'afterInjection.AccumulatedLagSeconds', 1)
          accept_replace('afterInjection.Timing.LastStepDurationSeconds', 'afterInjection.LastStepDurationSeconds', 1)
          accept_replace('afterInjection.Timing.MaximumStepDurationSeconds', 'afterInjection.MaximumStepDurationSeconds', 1)
          accept_replace('finalWorker.Timing.TotalStepCount', 'finalWorker.TotalStepCount', 1)
          accept_replace('finalWorker.Timing.DeadlineMissCount', 'finalWorker.DeadlineMissCount', 1)
          accept_replace(
              '''                if (worker != null)\n                {\n                    worker.Dispose();\n                    TryWriteCheckpoint(\n                        "worker_disposed",\n                        "Authoritative simulation worker, state reader, and native session disposed by the worker owner.");\n                }\n''',
              '''                TryWriteCheckpoint(\n                    "production_physics_runtime_preserved",\n                    "RMA-135 did not own or dispose the app's authoritative simulation worker.");\n''')

          factory_start = text.index('        private static ReachySimulationWorker CreateAndStartSimulationWorker()\n')
          wait_start = text.index('        private static async Task<LocalLlmPhysicsBudgetState> WaitForPhysicsBudgetAsync(\n')
          text = text[:factory_start] + text[wait_start:]

          old_wait_start = text.index('        private static async Task<LocalLlmPhysicsBudgetState> WaitForPhysicsBudgetAsync(\n')
          validate_start = text.index('        private static void ValidateSuccessfulGeneration(\n', old_wait_start)
          replacement_methods = '''        private static async Task<ReachyProductionAuthoritativeRuntime> WaitForProductionRuntimeAsync()\n        {\n            for (int attempt = 0; attempt < 250; ++attempt)\n            {\n                ReachyProductionAuthoritativeRuntime? runtime =\n                    UnityEngine.Object.FindFirstObjectByType<ReachyProductionAuthoritativeRuntime>();\n                if (runtime != null)\n                {\n                    if (runtime.Status == ReachyProductionRuntimeStatus.Faulted)\n                    {\n                        throw new InvalidOperationException(\n                            "The production authoritative runtime faulted before RMA-135 acceptance: " +\n                            runtime.Fault);\n                    }\n                    if (runtime.Status == ReachyProductionRuntimeStatus.Running &&\n                        runtime.SimulationRunState == ReachySimulationRunState.Running)\n                    {\n                        return runtime;\n                    }\n                }\n                await Task.Delay(20).ConfigureAwait(true);\n            }\n            throw new TimeoutException(\n                "Timed out waiting for the app's production authoritative simulation runtime.");\n        }\n\n        private static async Task<PhysicsStartupStabilization> WaitForPhysicsBudgetAsync(\n            ReachySimulationLocalLlmPhysicsBudgetSource source)\n        {\n            const int requiredConsecutiveAdmissible = 3;\n            int consecutiveAdmissible = 0;\n            int exceededObservations = 0;\n            ulong minimumObservedStepCount = 5UL;\n            for (int attempt = 1; attempt <= 100; ++attempt)\n            {\n                LocalLlmPhysicsBudgetState state = source.Capture();\n                if (state == LocalLlmPhysicsBudgetState.Exceeded)\n                {\n                    ++exceededObservations;\n                    consecutiveAdmissible = 0;\n                }\n                else if (state == LocalLlmPhysicsBudgetState.Healthy ||\n                    state == LocalLlmPhysicsBudgetState.AtRisk)\n                {\n                    ++consecutiveAdmissible;\n                    if (consecutiveAdmissible >= requiredConsecutiveAdmissible)\n                    {\n                        return new PhysicsStartupStabilization(\n                            state,\n                            attempt,\n                            exceededObservations,\n                            minimumObservedStepCount);\n                    }\n                }\n                else\n                {\n                    consecutiveAdmissible = 0;\n                }\n                await Task.Delay(20).ConfigureAwait(true);\n            }\n            throw new InvalidOperationException(\n                "The app's production authoritative simulation did not provide three consecutive admissible timing observations before local LLM acceptance; exceeded_observations=" +\n                exceededObservations.ToString(CultureInfo.InvariantCulture) + ".");\n        }\n\n        private static async Task<ReachySimulationTimingSnapshot> WaitForTimingProgressAsync(\n            IReachySimulationTimingSource timingSource,\n            ulong minimumStepCount)\n        {\n            for (int attempt = 0; attempt < 250; ++attempt)\n            {\n                if (timingSource.SimulationRunState == ReachySimulationRunState.Faulted)\n                {\n                    throw new InvalidOperationException(\n                        "The production authoritative simulation worker faulted during RMA-135 acceptance.");\n                }\n                if (timingSource.TryGetLatestTimingSnapshot(\n                    out ReachySimulationTimingSnapshot timing) &&\n                    timing.TotalStepCount >= minimumStepCount)\n                {\n                    return timing;\n                }\n                await Task.Delay(20).ConfigureAwait(true);\n            }\n            throw new TimeoutException(\n                "Timed out waiting for production authoritative simulation progress to step " +\n                minimumStepCount.ToString(CultureInfo.InvariantCulture) + ".");\n        }\n\n'''
          text = text[:old_wait_start] + replacement_methods + text[validate_start:]

          report_marker = '''            public int effective_threads;\n            public int effective_batch_threads;\n'''
          if text.count(report_marker) != 1:
              raise SystemExit('acceptance report field marker changed')
          text = text.replace(
              report_marker,
              report_marker +
              '            public int startup_physics_observations;\n' +
              '            public int startup_physics_exceeded_observations;\n' +
              '            public string startup_physics_state = string.Empty;\n' +
              '            public ulong production_runtime_model_hash;\n',
              1,
          )

          class_marker = '        private sealed class FaultInjectingPhysicsBudgetSource : ILocalLlmPhysicsBudgetSource\n'
          if text.count(class_marker) != 1:
              raise SystemExit('startup result insertion marker changed')
          text = text.replace(
              class_marker,
              '''        private sealed class PhysicsStartupStabilization\n        {\n            internal PhysicsStartupStabilization(\n                LocalLlmPhysicsBudgetState state,\n                int observations,\n                int exceededObservations,\n                ulong minimumObservedStepCount)\n            {\n                State = state;\n                Observations = observations;\n                ExceededObservations = exceededObservations;\n                MinimumObservedStepCount = minimumObservedStepCount;\n            }\n\n            internal LocalLlmPhysicsBudgetState State { get; }\n            internal int Observations { get; }\n            internal int ExceededObservations { get; }\n            internal ulong MinimumObservedStepCount { get; }\n        }\n\n''' + class_marker,
              1,
          )
          acceptance_path.write_text(text, encoding='utf-8')

          static_path = root / 'scripts/tests/test_rma135_android_acceptance_contracts.py'
          contract = static_path.read_text(encoding='utf-8')
          contract = contract.replace(
              '    require(text, "ReachySimulationWorker", "production simulation worker")\n',
              '    require(text, "ReachyProductionAuthoritativeRuntime", "live production runtime")\n'
              '    require(text, "FindFirstObjectByType<ReachyProductionAuthoritativeRuntime>", "production runtime discovery")\n',
              1,
          )
          contract = contract.replace(
              '    require(\n        text,\n        "ReachySimAuthoritativeStateReader",\n        "production authoritative state reader",\n    )\n',
              '',
              1,
          )
          contract = contract.replace(
              '    require(\n        text,\n        "disposed by the worker owner",\n        "single simulation worker ownership checkpoint",\n    )\n',
              '    require(\n        text,\n        "production_physics_runtime_preserved",\n        "non-owning production simulation checkpoint",\n    )\n'
              '    require(text, "requiredConsecutiveAdmissible = 3", "startup stabilization window")\n'
              '    require(text, "startup_physics_exceeded_observations", "startup miss evidence")\n',
              1,
          )
          for old, label in (
              ('CreateAndStartSimulationWorker', 'duplicate simulation factory'),
              ('ReachySimSession.Create', 'duplicate native session creation'),
              ('worker.Dispose()', 'production worker disposal'),
          ):
              insertion = f'    forbid(text, "{old}", "{label}")\n'
              anchor = '    forbid(text, "RunPhysicsLoop", "standalone stopwatch physics loop")\n'
              contract = contract.replace(anchor, insertion + anchor, 1)
          static_path.write_text(contract, encoding='utf-8')

          runner_path = root / 'scripts/run_rma135_resource_governor_acceptance_android.sh'
          runner = runner_path.read_text(encoding='utf-8')
          marker = 'assert r["effective_threads"] <= 2 and r["effective_batch_threads"] <= 2, r\n'
          if runner.count(marker) != 1:
              raise SystemExit('runner startup assertion marker changed')
          runner = runner.replace(
              marker,
              marker +
              'assert r["startup_physics_observations"] >= 3, r\n' +
              'assert r["startup_physics_exceeded_observations"] >= 0, r\n' +
              'assert r["startup_physics_state"] in {"Healthy", "AtRisk"}, r\n' +
              'assert r["production_runtime_model_hash"] > 0, r\n',
              1,
          )
          runner_path.write_text(runner, encoding='utf-8')

          thermal_workflow = root / '.github/workflows/rma135-resource-thermal-governor.yml'
          workflow = thermal_workflow.read_text(encoding='utf-8')
          workflow = workflow.replace(
              "      - 'Assets/ReachyMini/Runtime/Simulation/ReachySimulationWorker.cs'\n",
              "      - 'Assets/ReachyMini/Runtime/Simulation/ReachySimulationWorker.cs'\n"
              "      - 'Assets/ReachyMini/Runtime/Simulation/IReachySimulationTimingSource.cs'\n"
              "      - 'Assets/ReachyMini/Runtime/Rendering/ReachyProductionAuthoritativeRuntime.cs'\n",
          )
          hash_marker = '            Assets/ReachyMini/Runtime/Simulation/ReachySimulationWorker.cs \\\n'
          if workflow.count(hash_marker) != 1:
              raise SystemExit('RMA-135 hash marker changed')
          workflow = workflow.replace(
              hash_marker,
              hash_marker +
              '            Assets/ReachyMini/Runtime/Simulation/IReachySimulationTimingSource.cs \\\n'
              '            Assets/ReachyMini/Runtime/Rendering/ReachyProductionAuthoritativeRuntime.cs \\\n',
              1,
          )
          thermal_workflow.write_text(workflow, encoding='utf-8')

          physical_workflow = root / '.github/workflows/rma135-resource-governor-android.yml'
          physical = physical_workflow.read_text(encoding='utf-8')
          old_regex = '(Assets/ReachyMini/Runtime/Simulation/ReachySimulationWorker\\.cs)'
          new_regex = '(Assets/ReachyMini/Runtime/Simulation/(ReachySimulationWorker|IReachySimulationTimingSource)\\.cs)|(Assets/ReachyMini/Runtime/Rendering/ReachyProductionAuthoritativeRuntime\\.cs)'
          if physical.count(old_regex) != 1:
              raise SystemExit('physical scope simulation regex changed')
          physical = physical.replace(old_regex, new_regex, 1)
          physical_workflow.write_text(physical, encoding='utf-8')
          PY

          ruff format scripts/tests/test_rma135_android_acceptance_contracts.py
          python3 scripts/tests/test_rma135_android_acceptance_contracts.py
          bash -n scripts/run_rma135_resource_governor_acceptance_android.sh
          dotnet build managed/ReachyMini.Core/ReachyMini.Core.csproj --configuration Release --warnaserror
          dotnet run --project managed/ReachyMini.ResourceGovernor.Tests/ReachyMini.ResourceGovernor.Tests.csproj --configuration Release
          dotnet run --project managed/ReachyMini.ResourceGovernor.Integration.Tests/ReachyMini.ResourceGovernor.Integration.Tests.csproj --configuration Release
          ruff check scripts
          ruff format --check scripts
          git diff --check
          git add -N Assets/ReachyMini/Runtime/Simulation/IReachySimulationTimingSource.cs
          mapfile -t changed < <(git diff --name-only)
          expected=(
            Assets/ReachyMini/Runtime/Simulation/IReachySimulationTimingSource.cs
            Assets/ReachyMini/Runtime/Simulation/ReachySimulationWorker.cs
            Assets/ReachyMini/Runtime/Rendering/ReachyProductionAuthoritativeRuntime.cs
            Assets/ReachyMini/Runtime/Core/Application/ReachySimulationLocalLlmPhysicsBudgetSource.cs
            Assets/ReachyMini/Runtime/Application/ReachyRma135ResourceGovernorAcceptance.cs
            scripts/run_rma135_resource_governor_acceptance_android.sh
            scripts/tests/test_rma135_android_acceptance_contracts.py
            .github/workflows/rma135-resource-thermal-governor.yml
            .github/workflows/rma135-resource-governor-android.yml
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Commit bounded production-worker patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/ReachyMini/Runtime/Simulation/IReachySimulationTimingSource.cs \
            Assets/ReachyMini/Runtime/Simulation/ReachySimulationWorker.cs \
            Assets/ReachyMini/Runtime/Rendering/ReachyProductionAuthoritativeRuntime.cs \
            Assets/ReachyMini/Runtime/Core/Application/ReachySimulationLocalLlmPhysicsBudgetSource.cs \
            Assets/ReachyMini/Runtime/Application/ReachyRma135ResourceGovernorAcceptance.cs \
            scripts/run_rma135_resource_governor_acceptance_android.sh \
            scripts/tests/test_rma135_android_acceptance_contracts.py \
            .github/workflows/rma135-resource-thermal-governor.yml \
            .github/workflows/rma135-resource-governor-android.yml
          git commit -m "RMA-135: validate the live production physics worker"
          git push origin HEAD:master

name: RMA-135 bounded recovery proof

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma135-bounded-recovery-proof.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0
      - name: Add exact post-OOM recovery proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('managed/ReachyMini.LocalLlm.Tests/Program.cs')
          text = path.read_text(encoding='utf-8')

          def replace(old: str, new: str, count: int = 1) -> None:
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count} matches, found {actual}: {old[:100]!r}')
              text = text.replace(old, new, count)

          replace(
              '        await TestOutOfMemoryCleanupFailureFaultsAsync().ConfigureAwait(false);\n'
              '        await TestReloadRecoveryAndDisposeAsync().ConfigureAwait(false);\n'
              '        Console.WriteLine("RMA-134 local LLM managed contracts passed (20 groups).");\n',
              '        await TestOutOfMemoryCleanupFailureFaultsAsync().ConfigureAwait(false);\n'
              '        await TestOutOfMemoryReloadRecoveryAndSecondGenerationAsync().ConfigureAwait(false);\n'
              '        await TestReloadRecoveryAndDisposeAsync().ConfigureAwait(false);\n'
              '        Console.WriteLine("RMA-134 local LLM managed contracts passed (21 groups).");\n')

          replace(
              '    private static async Task TestReloadRecoveryAndDisposeAsync()\n',
              '''    private static async Task TestOutOfMemoryReloadRecoveryAndSecondGenerationAsync()\n    {\n        using FakeRuntime runtime = new FakeRuntime { ThrowOutOfMemoryOnNextPoll = true };\n        LocalLlmProvider provider = await CreateProviderAsync(runtime).ConfigureAwait(false);\n        try\n        {\n            LocalLlmGenerationResult exhausted = await provider.GenerateAsync(\n                Request("req-oom-recover", "Allocate."), new CollectingSink(), CancellationToken.None)\n                .ConfigureAwait(false);\n            Require(exhausted.Status == LocalLlmGenerationStatus.ResourceExhausted,\n                "Recovery proof did not begin from typed resource exhaustion.");\n            Require(provider.State == LocalLlmProviderState.Faulted,\n                "OOM recovery proof did not fault the provider before explicit reload.");\n\n            LocalLlmReloadResult reload = await provider.ReloadAsync(CancellationToken.None)\n                .ConfigureAwait(false);\n            Require(reload.Status == LocalLlmReloadStatus.Reloaded,\n                "Explicit reload did not recover the provider after OOM: " + reload.Detail);\n            Require(provider.State == LocalLlmProviderState.Ready,\n                "Explicit post-OOM reload did not return the provider to Ready.");\n\n            runtime.EnqueueText(1UL, ValidIntent);\n            runtime.EnqueueCompleted(2UL);\n            LocalLlmGenerationResult recovered = await provider.GenerateAsync(\n                Request("req-after-oom-reload", "Recover."), new CollectingSink(), CancellationToken.None)\n                .ConfigureAwait(false);\n            Require(recovered.Status == LocalLlmGenerationStatus.Succeeded,\n                "Second generation after explicit OOM reload did not succeed: " + recovered.Detail);\n            Require(recovered.Intent != null,\n                "Second generation after explicit OOM reload lost the validated behavior intent.");\n            Require(runtime.StartCount == 2,\n                "OOM recovery replayed or skipped a generation unexpectedly.");\n            Require(runtime.CancelCount == 1,\n                "OOM recovery introduced an extra hidden cancellation or retry.");\n            Require(runtime.ReleaseCount == 2,\n                "OOM recovery did not release exactly the failed and recovered generation handles.");\n        }\n        finally\n        {\n            await provider.DisposeAsync().ConfigureAwait(false);\n        }\n        Require(runtime.LoadCount == 2 && runtime.UnloadCount == 2,\n            "Post-OOM recovery did not own exactly one initial and one explicitly reloaded model handle.");\n    }\n\n    private static async Task TestReloadRecoveryAndDisposeAsync()\n''')

          replace(
              '        private bool staleAfterCancelEmitted;\n        private ulong nextHandle = 1000UL;\n',
              '        private bool staleAfterCancelEmitted;\n        private bool currentGenerationCancelled;\n        private ulong nextHandle = 1000UL;\n')

          replace(
              '            ++StartCount;\n            if (ThrowOutOfMemoryOnStart)\n',
              '            ++StartCount;\n            currentGenerationCancelled = false;\n            staleAfterCancelEmitted = false;\n            if (ThrowOutOfMemoryOnStart)\n')

          replace(
              '            if (CancelCount > 0 && CancelStatus == 0)\n',
              '            if (currentGenerationCancelled && CancelStatus == 0)\n')
          replace(
              '            if (CancelCount > 0 && CancelStatus != 0 && TerminalAfterFailedCancel)\n',
              '            if (currentGenerationCancelled && CancelStatus != 0 && TerminalAfterFailedCancel)\n')
          replace(
              '            ++CancelCount;\n            return new LocalLlmRuntimeCallResult(\n',
              '            ++CancelCount;\n            currentGenerationCancelled = true;\n            return new LocalLlmRuntimeCallResult(\n')

          path.write_text(text, encoding='utf-8')
          PY

          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "managed/ReachyMini.LocalLlm.Tests/Program.cs" ]]; then
            printf 'Unexpected recovery-proof change set:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi
          git diff --check

      - name: Run exact managed and repository formatting gates
        shell: bash
        run: |
          set -euo pipefail
          dotnet build managed/ReachyMini.Core/ReachyMini.Core.csproj --configuration Release --warnaserror
          dotnet run --project managed/ReachyMini.LocalLlm.Tests/ReachyMini.LocalLlm.Tests.csproj --configuration Release
          dotnet run --project managed/ReachyMini.ResourceGovernor.Tests/ReachyMini.ResourceGovernor.Tests.csproj --configuration Release
          dotnet run --project managed/ReachyMini.ResourceGovernor.Integration.Tests/ReachyMini.ResourceGovernor.Integration.Tests.csproj --configuration Release
          ruff check scripts
          ruff format --check scripts

      - name: Commit bounded recovery proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add managed/ReachyMini.LocalLlm.Tests/Program.cs
          git commit -m "RMA-135: prove explicit post-OOM recovery"
          git push origin HEAD:master

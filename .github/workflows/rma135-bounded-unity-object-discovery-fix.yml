name: RMA-135 bounded Unity object discovery fix

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma135-bounded-unity-object-discovery-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0
      - name: Apply exact Unity discovery repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('Assets/ReachyMini/Runtime/Application/ReachyRma135ResourceGovernorAcceptance.cs'): (
                  'FindFirstObjectByType<ReachyProductionAuthoritativeRuntime>()',
                  'FindAnyObjectByType<ReachyProductionAuthoritativeRuntime>()',
              ),
              Path('scripts/tests/test_rma135_android_acceptance_contracts.py'): (
                  'FindFirstObjectByType<ReachyProductionAuthoritativeRuntime>',
                  'FindAnyObjectByType<ReachyProductionAuthoritativeRuntime>',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/tests/test_rma135_android_acceptance_contracts.py
          ruff check scripts
          ruff format --check scripts
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          expected=(
            Assets/ReachyMini/Runtime/Application/ReachyRma135ResourceGovernorAcceptance.cs
            scripts/tests/test_rma135_android_acceptance_contracts.py
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/ReachyMini/Runtime/Application/ReachyRma135ResourceGovernorAcceptance.cs \
            scripts/tests/test_rma135_android_acceptance_contracts.py
          git commit -m "RMA-135: use unordered Unity runtime discovery"
          git push origin HEAD:master

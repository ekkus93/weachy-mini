name: RMA-135 resource governor Android acceptance

on:
  workflow_run:
    workflows:
      - Local Unity Android Validation
    types:
      - completed

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: rma135-resource-governor-android-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  physical-acceptance:
    name: Validate RMA-135 on physical Android
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: [self-hosted, linux, x64, weachy-mini-android-device]
    timeout-minutes: 30

    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: "pending",
              context: "RMA-135 Resource Governor Android",
              description: "Physical resource-governor acceptance is running"
            });

      - name: Check out exact validated source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine whether RMA-135 physical inputs changed
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha }}"
          baseline=""
          mapfile -t successful_heads < <(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow rma135-resource-governor-android.yml \
              --status success \
              --limit 50 \
              --json headSha \
              --jq '.[].headSha'
          )
          for candidate in "${successful_heads[@]}"; do
            [[ -n "${candidate}" && "${candidate}" != "${SHA}" ]] || continue
            if git cat-file -e "${candidate}^{commit}" 2>/dev/null && \
               git merge-base --is-ancestor "${candidate}" "${SHA}"; then
              baseline="${candidate}"
              break
            fi
          done

          if [[ -z "${baseline}" ]]; then
            changed="$(git diff-tree --root --no-commit-id --name-only -r "${SHA}")"
            relevant=true
            scope_base=none
          else
            changed="$(git diff --name-only "${baseline}..${SHA}")"
            scope_base="${baseline}"
            if printf '%s\n' "${changed}" | grep -Eq '^((Assets/ReachyMini/Runtime/Core/LocalModels/(LocalLlmResourceGovernor|LocalLlmGovernedGenerationCoordinator|ReachyLocalLlmProvider|ReachyLocalLlmContracts)\.cs)|(Assets/ReachyMini/Runtime/Core/Application/(ReachyLocalLlmPhysicsBudgetTracker|ReachySimulationLocalLlmPhysicsBudgetSource)\.cs)|(Assets/ReachyMini/Runtime/Application/(ReachyAndroidLocalLlmResourceSignalSource|ReachyRma135ResourceGovernorAcceptance(\.[A-Za-z]+)?|Rma135Acceptance(TestDoubles|ReportModels))\.cs)|(Assets/ReachyMini/Runtime/Simulation/ReachySimulationWorker\.cs)|(Assets/ReachyMini/Runtime/Interop/(NativeReachyLlama|ReachyLlamaNativeTypes|ReachyMiniInteropAssemblyInfo|ReachySimAuthoritativeStateReader)\.cs)|(scripts/(run_rma135_resource_governor_acceptance_android\.sh|tests/test_rma135_android_acceptance_contracts\.py))|(benchmarks/rma133/(system_prompt-v4\.txt|behavior-output-v1\.gbnf|candidates-v6\.json))|(models/manifests/qwen3-0\.6b-q4-k-m\.local-llm\.json)|(docs/(RMA_135_RESOURCE_THERMAL_GOVERNOR_(SPEC|TODO)_2026-08-10\.md|validation/RMA_135_RESOURCE_THERMAL_GOVERNOR_VALIDATION_.*\.md))|(.github/workflows/rma135-(resource-thermal-governor|resource-governor-android)\.yml))'; then
              relevant=true
            else
              relevant=false
            fi
          fi

          printf 'scope_base=%s\nsource_sha=%s\n' "${scope_base}" "${SHA}" \
            > artifacts-rma135-scope.txt
          printf '%s\n' "${changed}" > artifacts-rma135-changed-files.txt
          printf 'RMA-135 physical scope base=%s relevant=%s\n' "${scope_base}" "${relevant}"
          echo "relevant=${relevant}" >> "$GITHUB_OUTPUT"
          echo "scope_base=${scope_base}" >> "$GITHUB_OUTPUT"

      - name: Pin an approved representative physical Android device
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        env:
          REACHY_PHYSICAL_DEVICE_SERIAL: ${{ vars.REACHY_PHYSICAL_DEVICE_SERIAL }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-${HOME}/Android/Sdk}}"
          adb_bin="${sdk_root}/platform-tools/adb"
          if [[ ! -x "${adb_bin}" ]]; then
            adb_bin="$(command -v adb || true)"
          fi
          [[ -n "${adb_bin}" && -x "${adb_bin}" ]] || {
            printf '%s\n' 'adb is unavailable on the physical Android runner.' >&2
            exit 1
          }

          # Approved devices and the minimum API come from the RMA-184 representative-device
          # matrix, so this gate has a single source of truth and cannot silently diverge
          # from the published support policy. Pinning one exact model and one exact API
          # meant physical acceptance could only ever run on the low-class phone, which is
          # also the only device that cannot report API-29 thermal telemetry.
          matrix_path='models/reachy-mini/android-device-matrix.json'
          mapfile -t approved_models < <(python3 -c 'import json,sys; print("\n".join(d["model"] for d in json.load(open(sys.argv[1], encoding="utf-8"))["representative_devices"]))' "${matrix_path}")
          minimum_api="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["support_policy"]["minimum_android_api"])' "${matrix_path}")"
          printf 'approved_models=%s minimum_api=%s\n' "${approved_models[*]}" "${minimum_api}"

          mapfile -t serials < <(
            "${adb_bin}" devices \
              | awk 'NR > 1 && $2 == "device" && $1 !~ /^emulator-/ {print $1}'
          )
          accepted=()
          for serial in "${serials[@]}"; do
            state="$("${adb_bin}" -s "${serial}" get-state | tr -d '\r')"
            model="$("${adb_bin}" -s "${serial}" shell getprop ro.product.model | tr -d '\r')"
            abi="$("${adb_bin}" -s "${serial}" shell getprop ro.product.cpu.abi | tr -d '\r')"
            sdk="$("${adb_bin}" -s "${serial}" shell getprop ro.build.version.sdk | tr -d '\r')"
            qemu="$("${adb_bin}" -s "${serial}" shell getprop ro.kernel.qemu | tr -d '\r')"
            printf 'physical_device=%s state=%s model=%s abi=%s sdk=%s qemu=%s\n' \
              "${serial}" "${state}" "${model}" "${abi}" "${sdk}" "${qemu}"
            model_approved=0
            for approved in "${approved_models[@]}"; do
              if [[ "${model}" == "${approved}" ]]; then
                model_approved=1
                break
              fi
            done
            if [[ "${state}" == "device" && "${model_approved}" == "1" && \
                  "${abi}" == "arm64-v8a" && "${sdk}" =~ ^[0-9]+$ && \
                  "${qemu}" != "1" ]] && (( sdk >= minimum_api )); then
              accepted+=("${serial}")
            fi
          done
          # A second phone may legitimately be attached to this host for unrelated work,
          # so allow an explicit pin. Without one the exactly-one rule still applies,
          # which is what keeps evidence from being attributed to the wrong device.
          serial_override="${REACHY_PHYSICAL_DEVICE_SERIAL:-}"
          if [[ -n "${serial_override}" ]]; then
            override_ok=0
            for candidate in "${accepted[@]}"; do
              if [[ "${candidate}" == "${serial_override}" ]]; then
                override_ok=1
                break
              fi
            done
            if (( override_ok != 1 )); then
              printf 'Pinned REACHY_PHYSICAL_DEVICE_SERIAL=%s is not an approved connected device.\n' \
                "${serial_override}" >&2
              "${adb_bin}" devices -l >&2
              exit 1
            fi
            serial="${serial_override}"
          elif (( ${#accepted[@]} != 1 )); then
            printf 'Expected exactly one approved arm64-v8a API-%s+ representative device; found %s.\n' \
              "${minimum_api}" "${#accepted[@]}" >&2
            printf 'approved models: %s\n' "${approved_models[*]}" >&2
            "${adb_bin}" devices -l >&2
            exit 1
          else
            serial="${accepted[0]}"
          fi
          "${adb_bin}" -s "${serial}" wait-for-device
          [[ "$("${adb_bin}" -s "${serial}" get-state | tr -d '\r')" == "device" ]] || {
            printf 'Pinned Android device is not ready: %s\n' "${serial}" >&2
            exit 1
          }
          printf 'REACHY_ANDROID_SERIAL=%s\n' "${serial}" >> "${GITHUB_ENV}"
          printf 'ADB_BIN=%s\n' "${adb_bin}" >> "${GITHUB_ENV}"

      - name: Download exact-SHA Unity Android artifacts
        if: steps.scope.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/rma135-source-run
          mkdir -p artifacts/rma135-source-run
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir artifacts/rma135-source-run
          mapfile -t apks < <(
            find artifacts/rma135-source-run \
              -type f -name 'weachy-mini-device-arm64-api26.apk' -print
          )
          if (( ${#apks[@]} != 1 )); then
            printf 'Expected exactly one exact-SHA ARM64/API-26 APK artifact; found %s.\n' \
              "${#apks[@]}" >&2
            find artifacts/rma135-source-run -maxdepth 4 -type f -print >&2 || true
            exit 1
          fi
          mkdir -p artifacts/android
          cp -- "${apks[0]}" artifacts/android/weachy-mini-device-arm64-api26.apk
          sha256sum artifacts/android/weachy-mini-device-arm64-api26.apk \
            > artifacts/android/weachy-mini-device-arm64-api26.apk.sha256

      - name: Run physical resource-governor acceptance
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${REACHY_ANDROID_SERIAL:?The workflow must pin REACHY_ANDROID_SERIAL before acceptance.}"
          bash scripts/run_rma135_resource_governor_acceptance_android.sh \
            artifacts/android/weachy-mini-device-arm64-api26.apk \
            artifacts/rma135-resource-governor-android

      - name: Record exact workflow provenance
        if: always() && steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/rma135-resource-governor-android
          cat > artifacts/rma135-resource-governor-android/workflow-provenance.txt <<EOF
          source_sha=${{ github.event.workflow_run.head_sha }}
          source_local_unity_run=${{ github.event.workflow_run.id }}
          source_local_unity_conclusion=${{ github.event.workflow_run.conclusion }}
          scope_base=${{ steps.scope.outputs.scope_base }}
          rma135_android_run=${{ github.run_id }}
          rma135_android_attempt=${{ github.run_attempt }}
          EOF
          cp artifacts-rma135-scope.txt \
            artifacts/rma135-resource-governor-android/scope.txt
          cp artifacts-rma135-changed-files.txt \
            artifacts/rma135-resource-governor-android/changed-files.txt

      - name: Upload RMA-135 physical evidence
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rma135-resource-governor-android-${{ github.event.workflow_run.head_sha }}
          path: artifacts/rma135-resource-governor-android
          if-no-files-found: error
          retention-days: 30

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          RELEVANT: ${{ steps.scope.outputs.relevant }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const relevant = process.env.RELEVANT === "true";
            const succeeded = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: succeeded ? "success" : "failure",
              context: "RMA-135 Resource Governor Android",
              description: relevant
                ? (succeeded
                    ? "Physical resource-governor acceptance passed"
                    : "Physical resource-governor acceptance failed")
                : "No RMA-135 physical inputs changed since the last successful device run"
            });
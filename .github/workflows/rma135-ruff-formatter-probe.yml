name: RMA-135 Ruff formatter probe

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma135-ruff-formatter-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0
      - name: Canonically format RMA-135 static contract
        run: ruff format scripts/tests/test_rma135_resource_governor.py
      - name: Upload canonical file
        uses: actions/upload-artifact@v4
        with:
          name: rma135-ruff-canonical-${{ github.sha }}
          path: scripts/tests/test_rma135_resource_governor.py
          if-no-files-found: error
          retention-days: 1

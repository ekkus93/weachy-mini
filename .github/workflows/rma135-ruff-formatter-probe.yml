name: RMA-135 Ruff formatter probe

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma135-ruff-formatter-probe.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0
      - name: Apply bounded canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          ruff format scripts
          mapfile -t changed < <(git diff --name-only -- scripts)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "scripts/tests/test_rma134_local_llm_provider.py" ]]; then
            printf 'Unexpected Ruff change set:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tests/test_rma134_local_llm_provider.py
          git commit -m "RMA-135: normalize inherited Ruff formatting"
          git push origin HEAD:master

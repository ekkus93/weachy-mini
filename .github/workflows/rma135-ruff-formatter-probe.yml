name: RMA-135 Ruff formatter probe

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma135-ruff-formatter-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0
      - name: Capture canonical Ruff diff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/rma135-ruff-probe
          ruff format scripts
          git diff -- scripts > artifacts/rma135-ruff-probe/ruff-format.patch
          git diff --name-only -- scripts > artifacts/rma135-ruff-probe/changed-files.txt
      - name: Upload canonical diff
        uses: actions/upload-artifact@v4
        with:
          name: rma135-ruff-diff-${{ github.sha }}
          path: artifacts/rma135-ruff-probe
          if-no-files-found: error
          retention-days: 1

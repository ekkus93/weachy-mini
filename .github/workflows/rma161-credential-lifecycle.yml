name: RMA-161 Credential Lifecycle

on:
  workflow_run:
    workflows:
      - Local Unity Android Validation
    types:
      - completed
    branches:
      - master

permissions:
  actions: read
  contents: read

concurrency:
  group: rma161-credential-lifecycle
  cancel-in-progress: true

jobs:
  verify-credential-lifecycle-evidence:
    name: Verify Android credential lifecycle evidence
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download exact parent physical evidence
        uses: actions/download-artifact@v4
        with:
          name: unity-authoritative-device-report-${{ github.event.workflow_run.head_sha }}
          path: parent-evidence
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Require embedded RMA-161 evidence
        shell: bash
        run: |
          set -euo pipefail
          report_dir="parent-evidence/rma161-credential-report"
          test -s "${report_dir}/prepare.json"
          test -s "${report_dir}/verify-after-lock.json"
          test -s "${report_dir}/invalidate.json"
          test -s "${report_dir}/verify-cleared.json"
          test -s "${report_dir}/installed-apk-provenance.txt"
          test -s "${report_dir}/reports.sha256"

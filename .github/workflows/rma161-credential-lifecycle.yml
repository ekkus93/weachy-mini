name: RMA-161 Credential Lifecycle

on:
  workflow_run:
    workflows:
      - Local Unity Android Validation
    types:
      - completed
    branches:
      - master

permissions:
  actions: read
  contents: read

concurrency:
  group: rma161-credential-lifecycle
  cancel-in-progress: true

jobs:
  physical-credential-lifecycle:
    name: Validate Android credential lifecycle on kawa
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - weachy-mini-android-device
    timeout-minutes: 30

    steps:
      - name: Check out exact validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: true

      - name: Download exact validated device APK
        uses: actions/download-artifact@v4
        with:
          name: local-unity-device-apk-${{ github.event.workflow_run.head_sha }}
          path: Builds/Android
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify exact validated device APK
        shell: bash
        run: |
          set -euo pipefail
          test -s Builds/Android/weachy-mini-device-arm64-api26.apk

      - name: Run RMA-161 physical credential lifecycle acceptance
        id: credential_lifecycle
        shell: bash
        env:
          RMA161_CREDENTIAL_REPORT_DIR: ${{ runner.temp }}/rma161-credential-report
        run: bash scripts/run_rma161_credential_acceptance_android.sh

      - name: Upload RMA-161 credential lifecycle evidence
        if: ${{ always() && steps.credential_lifecycle.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: rma161-credential-report-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/rma161-credential-report
          if-no-files-found: error
          retention-days: 30

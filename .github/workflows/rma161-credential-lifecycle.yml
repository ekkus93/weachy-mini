name: RMA-161 Credential Lifecycle

on:
  workflow_dispatch:
    inputs:
      validated_sha:
        description: Exact source SHA already validated by Local Unity Android Validation
        required: true
        type: string
      validated_run_id:
        description: Successful Local Unity Android Validation run ID containing the exact APK
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: rma161-credential-lifecycle
  cancel-in-progress: false

jobs:
  physical-credential-lifecycle:
    name: Validate Android credential lifecycle on kawa
    runs-on:
      - self-hosted
      - linux
      - x64
      - weachy-mini-android-device
    timeout-minutes: 30

    steps:
      - name: Check out exact validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validated_sha }}
          lfs: true

      - name: Download exact validated device APK
        uses: actions/download-artifact@v4
        with:
          name: local-unity-device-apk-${{ inputs.validated_sha }}
          path: Builds/Android
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validated_run_id }}

      - name: Verify exact validated device APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.validated_sha }}"
          test -s Builds/Android/weachy-mini-device-arm64-api26.apk

      - name: Run RMA-161 physical credential lifecycle acceptance
        id: credential_lifecycle
        shell: bash
        env:
          RMA161_CREDENTIAL_REPORT_DIR: ${{ runner.temp }}/rma161-credential-report
        run: bash scripts/run_rma161_credential_acceptance_android.sh

      - name: Require unlocked Android runner handoff
        if: ${{ always() && steps.credential_lifecycle.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t device_serials < <(
            adb devices \
              | awk 'NR > 1 && $2 == "device" && $1 !~ /^emulator-/ {print $1}'
          )
          if (( ${#device_serials[@]} != 1 )); then
            printf 'Expected exactly one connected physical Android device while restoring the RMA-161 runner; found %s.\n' \
              "${#device_serials[@]}" >&2
            adb devices -l >&2
            exit 1
          fi

          serial="${device_serials[0]}"
          adb -s "${serial}" shell svc power stayon true >/dev/null 2>&1 || true
          adb -s "${serial}" shell input keyevent 224 >/dev/null 2>&1 || true

          keyguard_state() {
            adb -s "${serial}" shell dumpsys activity activities 2>/dev/null \
              | tr -d '\r' \
              | awk '
                  /KeyguardController:/ { in_keyguard = 1; next }
                  in_keyguard && /mKeyguardShowing=/ {
                    sub(/^[[:space:]]+/, "")
                    showing = $0
                    next
                  }
                  in_keyguard && /mOccluded=/ {
                    sub(/^[[:space:]]+/, "")
                    occluded = $0
                    exit
                  }
                  END {
                    if (showing != "") print showing
                    if (occluded != "") print occluded
                  }
                '
          }

          deadline=$(( $(date +%s) + 600 ))
          announced=false
          while true; do
            state="$(keyguard_state || true)"
            if [[ "${state}" != *"mKeyguardShowing=true"* \
              || "${state}" == *"mOccluded=true"* ]]; then
              printf 'Android runner handoff is ready: secure keyguard is not blocking the foreground.\n'
              exit 0
            fi

            if [[ "${announced}" == false ]]; then
              printf '%s\n' \
                'RMA-161 intentionally exercised the real secure keyguard. Manually unlock kawa now; the closeout will not release the runner while the PIN/pattern/password screen is blocking it.'
              announced=true
            fi

            if (( $(date +%s) >= deadline )); then
              printf 'RMA-161 runner handoff failed: secure keyguard remained blocking for 10 minutes. Last state: %s\n' \
                "${state}" >&2
              printf '%s\n' \
                'No credential was entered or bypassed. Manually unlock kawa before any routine physical-validation workflow is rerun.' >&2
              exit 1
            fi

            adb -s "${serial}" shell input keyevent 224 >/dev/null 2>&1 || true
            sleep 5
          done

      - name: Upload RMA-161 credential lifecycle evidence
        if: ${{ always() && steps.credential_lifecycle.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: rma161-credential-report-${{ inputs.validated_sha }}
          path: ${{ runner.temp }}/rma161-credential-report
          if-no-files-found: error
          retention-days: 30

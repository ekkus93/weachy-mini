name: RMA-161 Credential Lifecycle

on:
  workflow_dispatch:
    inputs:
      validated_sha:
        description: Exact source SHA already validated by Local Unity Android Validation
        required: true
        type: string
      validated_run_id:
        description: Successful Local Unity Android Validation run ID containing the exact APK
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: rma161-credential-lifecycle
  cancel-in-progress: false

jobs:
  physical-credential-lifecycle:
    name: Validate Android credential lifecycle on kawa
    runs-on:
      - self-hosted
      - linux
      - x64
      - weachy-mini-android-device
    timeout-minutes: 30

    steps:
      - name: Check out exact validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validated_sha }}
          lfs: true

      - name: Download exact validated device APK
        uses: actions/download-artifact@v4
        with:
          name: local-unity-device-apk-${{ inputs.validated_sha }}
          path: Builds/Android
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validated_run_id }}

      - name: Verify exact validated device APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.validated_sha }}"
          test -s Builds/Android/weachy-mini-device-arm64-api26.apk

      - name: Run RMA-161 physical credential lifecycle acceptance
        id: credential_lifecycle
        shell: bash
        env:
          RMA161_CREDENTIAL_REPORT_DIR: ${{ runner.temp }}/rma161-credential-report
        run: bash scripts/run_rma161_credential_acceptance_android.sh

      - name: Upload RMA-161 credential lifecycle evidence
        if: ${{ always() && steps.credential_lifecycle.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: rma161-credential-report-${{ inputs.validated_sha }}
          path: ${{ runner.temp }}/rma161-credential-report
          if-no-files-found: error
          retention-days: 30

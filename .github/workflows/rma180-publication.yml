# RMA-180 is published on master. This workflow now acts only as a closure guard.
name: RMA-180 performance harness publication

on:
  push:
    branches:
      - rma-180-publication
    paths:
      - .github/workflows/rma180-publication.yml

permissions:
  contents: read

jobs:
  verify-published:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          path: target

      - name: Verify RMA-180 is already published
        shell: bash
        env:
          RMA180_PUBLISHED_COMMIT: 6e92b3bb0893c8c8f021d10379dd8659fadb5a26
        run: |
          set -euo pipefail
          git -C target merge-base --is-ancestor \
            "${RMA180_PUBLISHED_COMMIT}" \
            HEAD
          test -f \
            target/Assets/ReachyMini/Runtime/Core/Performance/ReachyPerformanceTelemetry.cs
          test -f \
            target/managed/ReachyMini.Core.Tests/Rma180PerformanceHarnessContractTests.cs
          grep -Fq \
            'Rma180PerformanceHarnessContractTests.RunAll();' \
            target/managed/ReachyMini.Core.Tests/Program.cs
          echo "RMA-180 is already published on master; no publication action is required."

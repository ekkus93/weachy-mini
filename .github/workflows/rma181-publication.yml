# Publication trigger revision 4: canonical UTF-8 base64 parts with layered checksums.
name: RMA-181 priority degradation publication

on:
  push:
    branches:
      - rma-181-publication

permissions:
  contents: write

concurrency:
  group: rma-181-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out publication payload
        uses: actions/checkout@v4
        with:
          ref: rma-181-publication
          path: publication

      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          path: target

      - name: Verify and apply exact RMA-181 patch
        shell: bash
        env:
          EXPECTED_MASTER: 6e92b3bb0893c8c8f021d10379dd8659fadb5a26
          EXPECTED_BASE64_SHA256: 808560a0cbfbb9d5b593c9cd4762b27f693525c254ee51156d0293160e997580
          EXPECTED_GZIP_SHA256: 9a5f0c2807b345dd08a7a8f9a2f13a565bbf9e4827c57494844630ca26c64633
          EXPECTED_PATCH_SHA256: c1705dbcc049a207860f8f28d1908f38345b49e9a944d0bfa3449ae61876a329
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "${EXPECTED_MASTER}"

          parts_dir="publication/tools/rma181-publication"
          base64_payload="${RUNNER_TEMP}/rma181.patch.gz.b64"
          gzip_payload="${RUNNER_TEMP}/rma181.patch.gz"
          patch_payload="${RUNNER_TEMP}/rma181.patch"

          # Every publication fragment is ordinary UTF-8/ASCII text written via
          # GitHub's contents API. Verify each fragment before concatenation so
          # a missing, reordered, normalized, or modified part fails closed.
          cat <<'SUMS' | sha256sum --check --strict
          bae3000459dc0052cad32a1d6481df48d2d4f2cba7cd995e717450d22b947453  publication/tools/rma181-publication/rma181.patch.gz.b64.part-00
          805a283abc0a1abe1d15cae217ece5551e951b945f3d9499d52e66052fe0119e  publication/tools/rma181-publication/rma181.patch.gz.b64.part-01
          1479f537f8b7a2360ebf4d3f29e5cf8cf88cb9943bab7a7792060b1acc97eb1f  publication/tools/rma181-publication/rma181.patch.gz.b64.part-02
          51f3099f0795991623153752c883e38dbca3add3ff3d15ec305c23759cb64359  publication/tools/rma181-publication/rma181.patch.gz.b64.part-03
          1db5d1b5c8eb92fff9b169ef3e390635c45d067f8129df19a5785eda5d9dddb1  publication/tools/rma181-publication/rma181.patch.gz.b64.part-04
          621394bb2dfdd35ed19ae69aa2aed468b76980de3e1a6d1bf6daa7a6ac7e01d2  publication/tools/rma181-publication/rma181.patch.gz.b64.part-05
          SUMS

          cat "${parts_dir}"/rma181.patch.gz.b64.part-* > "${base64_payload}"
          printf '%s  %s\n' \
            "${EXPECTED_BASE64_SHA256}" \
            "${base64_payload}" \
            | sha256sum --check --strict

          base64 --decode "${base64_payload}" > "${gzip_payload}"
          printf '%s  %s\n' \
            "${EXPECTED_GZIP_SHA256}" \
            "${gzip_payload}" \
            | sha256sum --check --strict
          gzip -t "${gzip_payload}"

          gzip --decompress --stdout "${gzip_payload}" > "${patch_payload}"
          printf '%s  %s\n' \
            "${EXPECTED_PATCH_SHA256}" \
            "${patch_payload}" \
            | sha256sum --check --strict

          git -C target apply --check "${patch_payload}"
          git -C target apply "${patch_payload}"
          git -C target diff --check

      - name: Run repository static gate
        shell: bash
        working-directory: target
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          bash scripts/ci.sh --static-only
          git diff --check

      - name: Run managed RMA-181 contracts
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          projects=(
            managed/ReachyMini.Core.Tests/ReachyMini.Core.Tests.csproj
            managed/ReachyMini.ResourceGovernor.Tests/ReachyMini.ResourceGovernor.Tests.csproj
            managed/ReachyMini.VlmScheduling.Tests/ReachyMini.VlmScheduling.Tests.csproj
            managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet restore "${project}"
            dotnet run \
              --project "${project}" \
              --configuration Release \
              --no-restore
          done

      - name: Commit exact validated RMA-181 integration
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RMA-181: implement priority-based degradation policy"

      - name: Fast-forward master if unchanged
        shell: bash
        working-directory: target
        env:
          EXPECTED_MASTER: 6e92b3bb0893c8c8f021d10379dd8659fadb5a26
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse origin/master)" = "${EXPECTED_MASTER}"
          git push origin HEAD:master

name: RMA-182 lifecycle hardening publication

on:
  push:
    branches:
      - rma-182-publication

permissions:
  contents: write

concurrency:
  group: rma-182-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out publication payload
        uses: actions/checkout@v4
        with:
          ref: rma-182-publication
          path: publication

      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          path: target

      - name: Verify and apply exact RMA-182 payload
        shell: bash
        env:
          EXPECTED_MASTER: a7d165d781f3492b7c9418323ba6c0bc71a1b3da
          EXPECTED_PATCH_SHA256: 166025efde270b6f6ba40edac36c50fb9cb7b8019e5873ebf67ba15e50554c5a
          EXPECTED_TRANSFORM_SHA256: 988cc211b772013716424720ebaa3014df8374de6064da9361980ffc62044761
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "${EXPECTED_MASTER}"

          cat <<'SUMS' | sha256sum --check --strict
          b8506f74a6f1842f156881f7210de6edd9c33e30063fede87b89fb7209684379  publication/tools/rma182-publication/rma182-safe.patch.part-00
          5bf1ece2d7bb692d23c1f1a2f3bc46fab159127c795696d45f5f656997acfa4f  publication/tools/rma182-publication/rma182-safe.patch.part-01
          6f4e8a0c69892376b17c99b5ae77050e74feccdd76eeeeee97d5a55dfb19cfc4  publication/tools/rma182-publication/rma182-safe.patch.part-02
          375190ee30ef6d237a003efa457835681648358844166b3c400738ad972d76b3  publication/tools/rma182-publication/rma182-safe.patch.part-03a
          a8900ae034e7fb011fde12746506264598820341711924a0237dce2679f80f2f  publication/tools/rma182-publication/rma182-safe.patch.part-03b
          bb068b0d3339d8118ded49978549e9ae55477985ec19d86a82c234153afceb35  publication/tools/rma182-publication/rma182-safe.patch.part-04
          SUMS

          printf '%s  %s\n' \
            "${EXPECTED_TRANSFORM_SHA256}" \
            publication/tools/rma182-publication/apply_remote_transforms.py \
            | sha256sum --check --strict

          patch_payload="${RUNNER_TEMP}/rma182-safe.patch"
          cat \
            publication/tools/rma182-publication/rma182-safe.patch.part-00 \
            publication/tools/rma182-publication/rma182-safe.patch.part-01 \
            publication/tools/rma182-publication/rma182-safe.patch.part-02 \
            publication/tools/rma182-publication/rma182-safe.patch.part-03a \
            publication/tools/rma182-publication/rma182-safe.patch.part-03b \
            publication/tools/rma182-publication/rma182-safe.patch.part-04 \
            > "${patch_payload}"
          printf '%s  %s\n' \
            "${EXPECTED_PATCH_SHA256}" \
            "${patch_payload}" \
            | sha256sum --check --strict

          git -C target apply --check "${patch_payload}"
          git -C target apply "${patch_payload}"
          python3 publication/tools/rma182-publication/apply_remote_transforms.py target
          git -C target diff --check

      - name: Run focused RMA-182 static contract
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          python3 scripts/tests/test_rma182_lifecycle_hardening.py
          git diff --check

      - name: Run repository static gate
        shell: bash
        working-directory: target
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          bash scripts/ci.sh --static-only
          git diff --check

      - name: Run managed RMA-182 contracts
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          projects=(
            managed/ReachyMini.Core.Tests/ReachyMini.Core.Tests.csproj
            managed/ReachyMini.Application.Tests/ReachyMini.Application.Tests.csproj
            managed/ReachyMini.SpeechAudioFocus.Tests/ReachyMini.SpeechAudioFocus.Tests.csproj
            managed/ReachyMini.VlmScheduling.Tests/ReachyMini.VlmScheduling.Tests.csproj
            managed/ReachyMini.LocalLlm.Tests/ReachyMini.LocalLlm.Tests.csproj
            managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet restore "${project}"
            dotnet run \
              --project "${project}" \
              --configuration Release \
              --no-restore
          done

      - name: Commit exact validated RMA-182 integration
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "RMA-182: harden pause resume lifecycle"

      - name: Fast-forward master if unchanged
        shell: bash
        working-directory: target
        env:
          EXPECTED_MASTER: a7d165d781f3492b7c9418323ba6c0bc71a1b3da
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse origin/master)" = "${EXPECTED_MASTER}"
          git push origin HEAD:master

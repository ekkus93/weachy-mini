name: RMA-190 Core End-to-End Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'Assets/ReachyMini/**'
      - 'scripts/run_rma190_core_end_to_end_android.sh'
      - 'scripts/tests/test_rma190_end_to_end_scenarios.py'
      - 'scripts/build_unity_android.sh'
      - 'scripts/prepare_reachy_unity_presentation.sh'
      - 'scripts/stage_reachy_unity_android_runtime.sh'
      - 'docs/RMA_190_END_TO_END_SCENARIOS_SPEC_2026-09-21.md'
      - '.github/workflows/rma190-core-end-to-end.yml'
  push:
    branches:
      - master
    paths:
      - 'Assets/ReachyMini/**'
      - 'scripts/run_rma190_core_end_to_end_android.sh'
      - 'scripts/tests/test_rma190_end_to_end_scenarios.py'
      - 'scripts/build_unity_android.sh'
      - 'scripts/prepare_reachy_unity_presentation.sh'
      - 'scripts/stage_reachy_unity_android_runtime.sh'
      - 'docs/RMA_190_END_TO_END_SCENARIOS_SPEC_2026-09-21.md'
      - '.github/workflows/rma190-core-end-to-end.yml'

permissions:
  contents: read

concurrency:
  group: rma190-core-end-to-end-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate RMA-190 source contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run RMA-190 contract tests
        run: python3 scripts/tests/test_rma190_end_to_end_scenarios.py

      - name: Check Android runner syntax
        shell: bash
        run: bash -n scripts/run_rma190_core_end_to_end_android.sh

  physical:
    name: Run RMA-190 core scenarios on Android
    needs: contracts
    if: ${{ github.event_name != 'pull_request' }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - weachy-mini-android-device
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve Unity and Android installations
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          test -n "${project_version}"

          unity_editor="${UNITY_EDITOR:-}"
          if [[ -z "${unity_editor}" ]]; then
            for candidate in               "${HOME}/Unity/Hub/Editor/${project_version}/Editor/Unity"               "${HOME}/UnityHub/Editors/${project_version}/Editor/Unity"               "${HOME}/.local/share/UnityHub/Editors/${project_version}/Editor/Unity"               "/opt/Unity/Hub/Editor/${project_version}/Editor/Unity"               "/opt/unity/editors/${project_version}/Editor/Unity"; do
              if [[ -x "${candidate}" ]]; then
                unity_editor="${candidate}"
                break
              fi
            done
          fi
          if [[ -z "${unity_editor}" || ! -x "${unity_editor}" ]]; then
            printf 'Pinned Unity editor %s was not found.\n' "${project_version}" >&2
            exit 1
          fi

          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-${HOME}/Android/Sdk}}"
          if [[ ! -x "${android_sdk_root}/platform-tools/adb" ]]; then
            printf 'Android SDK platform-tools were not found under %s.\n' "${android_sdk_root}" >&2
            exit 1
          fi

          {
            printf 'UNITY_EDITOR=%s\n' "${unity_editor}"
            printf 'ANDROID_SDK_ROOT=%s\n' "${android_sdk_root}"
            printf 'ANDROID_HOME=%s\n' "${android_sdk_root}"
          } >> "${GITHUB_ENV}"
          printf '%s\n' "${android_sdk_root}/platform-tools" >> "${GITHUB_PATH}"

      - name: Prepare generated Reachy Unity presentation
        shell: bash
        env:
          REACHY_UNITY_WORK_ROOT: ${{ runner.temp }}/reachy-unity-presentation
        run: bash scripts/prepare_reachy_unity_presentation.sh

      - name: Stage production MuJoCo runtime
        shell: bash
        env:
          REACHY_UNITY_WORK_ROOT: ${{ runner.temp }}/reachy-unity-presentation
        run: bash scripts/stage_reachy_unity_android_runtime.sh

      - name: Build ARM64 API-26 device APK
        shell: bash
        run: bash scripts/build_unity_android.sh device-feasibility

      - name: Run RMA-190 physical scenarios
        id: rma190
        shell: bash
        env:
          RMA190_CORE_REPORT_DIR: ${{ runner.temp }}/rma190-core-end-to-end-report
        run: bash scripts/run_rma190_core_end_to_end_android.sh

      - name: Upload RMA-190 evidence
        if: ${{ always() && steps.rma190.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: rma190-core-end-to-end-report-${{ github.sha }}
          path: ${{ runner.temp }}/rma190-core-end-to-end-report
          if-no-files-found: error
          retention-days: 30

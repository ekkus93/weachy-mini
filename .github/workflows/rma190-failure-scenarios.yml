name: RMA-190 deterministic failure scenarios

on:
  pull_request:
    paths:
      - '.github/workflows/rma190-failure-scenarios.yml'
      - 'Assets/ReachyMini/Runtime/Core/**'
      - 'Assets/ReachyMini/Runtime/Simulation/**'
      - 'managed/ReachyMini.Core.Tests/**'
      - 'managed/ReachyMini.Camera.Tests/**'
      - 'managed/ReachyMini.RemoteVlm.Tests/**'
      - 'managed/ReachyMini.LocalModelPackages.Tests/**'
      - 'managed/ReachyMini.ResourceGovernor.Tests/**'
      - 'scripts/tests/test_rma190_failure_scenarios.py'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rma190-failure-scenarios.yml'
      - 'Assets/ReachyMini/Runtime/Core/**'
      - 'Assets/ReachyMini/Runtime/Simulation/**'
      - 'managed/ReachyMini.Core.Tests/**'
      - 'managed/ReachyMini.Camera.Tests/**'
      - 'managed/ReachyMini.RemoteVlm.Tests/**'
      - 'managed/ReachyMini.LocalModelPackages.Tests/**'
      - 'managed/ReachyMini.ResourceGovernor.Tests/**'
      - 'scripts/tests/test_rma190_failure_scenarios.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-failure-scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build test-only native interop library
        shell: bash
        run: |
          set -euo pipefail
          cmake             -S .             -B build/rma190-managed-native             -G Ninja             -DBUILD_TESTING=ON
          cmake             --build build/rma190-managed-native             --target reachy_sim_managed_contract             --parallel

          native_library="$(find build/rma190-managed-native -type f -name 'libreachy_sim.so' -print -quit)"
          if [[ -z "${native_library}" ]]; then
            printf '%s\n' 'RMA-190 managed contract build did not produce libreachy_sim.so.' >&2
            exit 1
          fi
          printf 'REACHY_MANAGED_NATIVE_LIBRARY_DIR=%s\n'             "$(dirname "${native_library}")" >> "${GITHUB_ENV}"

      - name: Run network, malformed-response, cancellation, and solver recovery scenarios
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${REACHY_MANAGED_NATIVE_LIBRARY_DIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          export REACHY_MANAGED_NATIVE_TESTS=1
          dotnet run             --project managed/ReachyMini.Core.Tests/ReachyMini.Core.Tests.csproj             --configuration Release

      - name: Run permission denial and revocation state scenarios
        shell: bash
        run: |
          set -euo pipefail
          dotnet run             --project managed/ReachyMini.Camera.Tests/ReachyMini.Camera.Tests.csproj             --configuration Release

      - name: Run provider rate-limit and cancellation scenarios
        shell: bash
        run: |
          set -euo pipefail
          dotnet run             --project managed/ReachyMini.RemoteVlm.Tests/ReachyMini.RemoteVlm.Tests.csproj             --configuration Release

      - name: Run corrupt local-model package scenario
        shell: bash
        run: |
          set -euo pipefail
          dotnet run             --project managed/ReachyMini.LocalModelPackages.Tests/ReachyMini.LocalModelPackages.Tests.csproj             --configuration Release

      - name: Run local-model OOM containment and recovery scenario
        shell: bash
        run: |
          set -euo pipefail
          dotnet run             --project managed/ReachyMini.ResourceGovernor.Tests/ReachyMini.ResourceGovernor.Tests.csproj             --configuration Release

      - name: Verify RMA-190 failure-scenario source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_rma190_failure_scenarios.py
          python3 -m py_compile scripts/tests/test_rma190_failure_scenarios.py

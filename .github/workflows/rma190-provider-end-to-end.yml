name: RMA-190 Provider End-to-End Acceptance

on:
  push:
    branches:
      - master
    paths:
      - 'managed/ReachyMini.Core.Tests/Rma190ProviderEndToEndScenarioTests.cs'
      - 'managed/ReachyMini.Core.Tests/Rma190IndependentProviderCombinationTests.cs'
      - 'managed/ReachyMini.Core.Tests/Program.cs'
      - 'Assets/ReachyMini/Runtime/Core/Providers/**'
      - 'scripts/tests/test_rma190_vlm_transport_failure_contract.py'
      - 'docs/RMA_190_END_TO_END_SCENARIOS_SPEC_2026-09-21.md'
      - 'docs/REACHY_MINI_ANDROID_DIGITAL_TWIN_TODO.md'
      - '.github/workflows/rma190-provider-end-to-end.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rma190-provider-end-to-end-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Validate provider integration and failure scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build managed core tests with warnings as errors
        run: >-
          dotnet build
          managed/ReachyMini.Core.Tests/ReachyMini.Core.Tests.csproj
          --configuration Release
          --warnaserror

      - name: Run RMA-190 provider end-to-end harness
        run: >-
          dotnet run
          --project managed/ReachyMini.Core.Tests/ReachyMini.Core.Tests.csproj
          --configuration Release
          --no-build

      - name: Run VLM transport failure regressions
        run: python3 scripts/tests/test_rma190_vlm_transport_failure_contract.py

      - name: Create exact-SHA evidence report
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/rma190-provider-end-to-end"
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "status": "passed",
              "commit_sha": os.environ["GITHUB_SHA"],
              "rma": "RMA-190",
              "acceptance_class": "deterministic-provider-integration",
              "production_components": [
                  "ReachySettingsStateStore",
                  "ReachyProviderFallbackPolicyEngine",
                  "OpenAiResponsesLlmProvider",
                  "OpenAiChatCompletionsLlmProvider",
                  "ReachySharedHttpTransport",
                  "ReachyBehaviorIntentJsonParser",
              ],
              "external_provider_fixture": True,
              "fixture_is_not_live_cloud_evidence": True,
              "scenarios": {
                  "independent_cloud_provider_combinations": True,
                  "network_loss": True,
                  "rate_limit": True,
                  "malformed_response": True,
                  "cancellation": True,
              },
              "silent_provider_fallback": False,
              "committed_real_credentials": False,
          }
          Path(OUT := "artifacts/rma190-provider-end-to-end/report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum             managed/ReachyMini.Core.Tests/Rma190ProviderEndToEndScenarioTests.cs             managed/ReachyMini.Core.Tests/Rma190IndependentProviderCombinationTests.cs             scripts/tests/test_rma190_vlm_transport_failure_contract.py             > "$OUT/source-sha256.txt"

      - name: Upload RMA-190 provider end-to-end evidence
        uses: actions/upload-artifact@v4
        with:
          name: rma190-provider-end-to-end-${{ github.sha }}
          path: artifacts/rma190-provider-end-to-end
          if-no-files-found: error
          retention-days: 30

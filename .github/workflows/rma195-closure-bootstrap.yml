name: RMA-195 closure bootstrap

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rma195-closure-bootstrap.yml
      - tmp/rma195-closure.patch.gz.b64

permissions:
  contents: write

concurrency:
  group: rma195-closure-bootstrap-hosted-v2
  cancel-in-progress: false

jobs:
  publish-candidate:
    name: Verify and publish exact RMA-195 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bootstrap provenance and payload
        shell: bash
        env:
          SOURCE_BASE: 46b0c2b7abb55b9a9c230ae8ff9bad8f3afa639a
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${SOURCE_BASE}" HEAD
          unexpected="$(git diff --name-only "${SOURCE_BASE}" HEAD -- . \
            ':(exclude).github/workflows/rma195-closure-bootstrap.yml' \
            ':(exclude)tmp/rma195-closure.patch.gz.b64')"
          [[ -z "${unexpected}" ]] || {
            printf 'Unexpected bootstrap changes relative to source base:\n%s\n' "${unexpected}" >&2
            exit 1
          }
          expected_payload_blob="f7e86a55d1ce10571388a99efd5b5aff74c0489e"
          actual_payload_blob="$(git hash-object tmp/rma195-closure.patch.gz.b64)"
          [[ "${actual_payload_blob}" == "${expected_payload_blob}" ]] || {
            printf 'Payload blob mismatch: %s (expected %s)\n' "${actual_payload_blob}" "${expected_payload_blob}" >&2
            exit 1
          }
          base64 --decode tmp/rma195-closure.patch.gz.b64 | gzip -d > "${RUNNER_TEMP}/rma195.patch"
          echo "6cfc69da7ca46377d745dcd0e0013d7202d9597d3b94de4cb642e40bedcb922b  ${RUNNER_TEMP}/rma195.patch" | sha256sum --check -
          git apply --check "${RUNNER_TEMP}/rma195.patch"
          git apply "${RUNNER_TEMP}/rma195.patch"

      - name: Run repository static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests
          python3 -m compileall -q scripts
          bash -n scripts/run_rma195_application_composition_acceptance_android.sh
          git diff --check

      - name: Verify exact source tree and publish
        shell: bash
        env:
          SOURCE_BASE: 46b0c2b7abb55b9a9c230ae8ff9bad8f3afa639a
          EXPECTED_STRIPPED_TREE: c0085b1e6cbaa9eb3bf959df0b68d19c953685e0
        run: |
          set -euo pipefail
          git restore --source="${SOURCE_BASE}" -- .github/workflows/local-unity-android-validation.yml
          git rm tmp/rma195-closure.patch.gz.b64
          git add -A
          verification_index="${RUNNER_TEMP}/rma195-verification.index"
          cp .git/index "${verification_index}"
          GIT_INDEX_FILE="${verification_index}" git update-index --force-remove .github/workflows/rma195-closure-bootstrap.yml
          stripped_tree="$(GIT_INDEX_FILE="${verification_index}" git write-tree)"
          [[ "${stripped_tree}" == "${EXPECTED_STRIPPED_TREE}" ]] || {
            printf 'Candidate stripped source tree mismatch: %s (expected %s)\n' "${stripped_tree}" "${EXPECTED_STRIPPED_TREE}" >&2
            exit 1
          }
          git config user.name "RMA-195 closure bootstrap"
          git config user.email "noreply@github.com"
          git commit -m "RMA-195: close application composition gaps"
          git push origin HEAD:master

name: Ruff Cleanup Diagnostic

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/ruff-cleanup-diagnostic.yml

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish run link
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload="$(jq -n \
            --arg state "pending" \
            --arg context "Ruff Cleanup Diagnostic" \
            --arg description "Applying reviewed Ruff repairs" \
            --arg target_url "$STATUS_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$payload"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.12.0

      - name: Apply and validate reviewed repairs
        run: |
          set -euo pipefail
          ruff check scripts --unsafe-fixes --fix || true
          python scripts/ruff_cleanup_once.py
          ruff format scripts
          ruff check scripts
          ruff format --check --diff scripts
          python -m compileall -q scripts

      - name: Commit validated cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          rm .github/workflows/ruff-cleanup-diagnostic.yml
          rm scripts/ruff_cleanup_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts .github/workflows/ruff-cleanup-diagnostic.yml
          git diff --cached --check
          git commit -m "fix: complete Ruff cleanup"
          git push origin HEAD:master

          repaired_sha="$(git rev-parse HEAD)"
          payload="$(jq -n \
            --arg state "success" \
            --arg context "Ruff Cleanup" \
            --arg description "Ruff lint and format checks pass" \
            --arg target_url "$STATUS_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${repaired_sha}" \
            --data "$payload"

      - name: Publish failure status
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload="$(jq -n \
            --arg state "failure" \
            --arg context "Ruff Cleanup Diagnostic" \
            --arg description "Reviewed Ruff repair did not validate" \
            --arg target_url "$STATUS_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$payload"

name: Ruff Cleanup Diagnostic

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/ruff-cleanup-diagnostic.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.12.0

      - name: Diagnose remaining Ruff violations after unsafe fixes
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          ruff check scripts --unsafe-fixes --fix
          ruff format scripts

          echo "::group::Working-tree diff after Ruff unsafe fixes"
          git diff -- scripts
          echo "::endgroup::"

          echo "::group::Remaining Ruff lint violations"
          ruff check scripts
          lint_status=$?
          echo "::endgroup::"

          echo "::group::Ruff formatting validation"
          ruff format --check --diff scripts
          format_status=$?
          echo "::endgroup::"

          if [ "$lint_status" -eq 0 ] && [ "$format_status" -eq 0 ]; then
            state=success
            description="Ruff cleanup is complete after unsafe fixes"
            result=0
          else
            state=failure
            description="Manual Ruff cleanup is still required"
            result=1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$(python -c 'import json, os; print(json.dumps({"state": os.environ["STATE"], "context": "Ruff Cleanup Diagnostic", "description": os.environ["DESCRIPTION"], "target_url": os.environ["STATUS_URL"]}))' STATE="$state" DESCRIPTION="$description")"

          exit "$result"

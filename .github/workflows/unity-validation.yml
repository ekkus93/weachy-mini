name: Unity Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unity-tests:
    name: Unity edit-mode and play-mode tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Unity tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: .
          unityVersion: 6000.3.18f1
          testMode: all

      - name: Upload Unity test results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-${{ github.sha }}
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          if-no-files-found: error
          retention-days: 14

  unity-android-builds:
    name: Unity Android ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: development-apk
            build_method: ReachyMini.Editor.AndroidBuild.BuildDevelopmentApk
            artifact_path: Builds/Android/weachy-mini-development.apk
          - name: release-aab
            build_method: ReachyMini.Editor.AndroidBuild.BuildReleaseAab
            artifact_path: Builds/Android/weachy-mini-release.aab
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity Android artifact
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: 6000.3.18f1
          targetPlatform: Android
          buildMethod: ${{ matrix.build_method }}

      - name: Verify Unity Android artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ matrix.artifact_path }}"

      - name: Upload Unity Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-android-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
